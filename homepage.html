<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>鉴业的浏览器主页</title>
<style>
  :root {
    --bg: #ffffff;
    --text: #1f1f1f;
    --subtle: #666666;
    --box-bg: #f3f3f3;
    --box-border: #e0e0e0;
    --btn-bg: #1f1f1f;
    --btn-text: #ffffff;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1f1f1f;
      --text: #f3f3f3;
      --subtle: #9a9a9a;
      --box-bg: #2b2b2b;
      --box-border: #3a3a3a;
      --btn-bg: #f3f3f3;
      --btn-text: #1f1f1f;
    }
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    transition: background .3s ease, color .3s ease;
  }

  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 48px;
    user-select: none;
    min-height: 100vh;   /* 兜底 */
    min-height: 100dvh;  /* 移动端动态视口：地址栏收起/展开时也保持真正垂直居中 */
    padding: 24px 16px;  /* 小屏或键盘弹出时防止内容贴边 */
  }

  /* 时钟 */
  #clock {
    font-size: clamp(56px, 10vw, 110px);
    font-weight: 200;
    letter-spacing: 2px;
    font-variant-numeric: tabular-nums;
    line-height: 1;
    text-align: center; /* 窄屏下日期比时钟宽时，时钟仍与日期居中对齐 */
  }

  #date {
    text-align: center;
    color: var(--subtle);
    font-size: 15px;
    margin-top: 14px;
    font-weight: 300;
    letter-spacing: 1px;
  }

  /* 搜索框 */
  .search-wrap {
    width: min(620px, 86vw);
    position: relative;
  }

  .search-box {
    display: flex;
    align-items: center;
    background: var(--box-bg);
    border: 1px solid var(--box-border);
    border-radius: 999px;
    padding: 6px 8px 6px 22px;
    transition: background .3s ease, border-color .3s ease, box-shadow .2s ease;
  }

  .search-box:focus-within {
    border-color: var(--subtle);
    box-shadow: 0 4px 20px rgba(0, 0, 0, .12);
  }

  .search-box svg {
    width: 18px;
    height: 18px;
    fill: none;
    stroke: var(--subtle);
    stroke-width: 2;
    stroke-linecap: round;
    flex-shrink: 0;
  }

  /* 引擎切换按钮（原放大镜位置） */
  #engine-btn {
    border: none;
    outline: none;
    background: transparent;
    width: 34px;
    height: 34px;
    border-radius: 50%;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    margin-left: -7px;
    transition: background .2s ease;
  }

  #engine-btn:hover { background: rgba(128, 128, 128, .18); }

  /* 引擎图标位：内置引擎显示官方 logo，自定义引擎显示自填图标或默认放大镜 */
  .engine-icon {
    width: 20px;
    height: 20px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    user-select: none;
  }

  .engine-icon svg { width: 100%; height: 100%; display: block; }
  .engine-icon img { width: 100%; height: 100%; object-fit: contain; display: block; border-radius: 5px; }
  /* Bing 官方图标是竖长比例，放大一点免得显小 */
  .engine-icon svg.bing-mark { width: auto; height: 110%; }
  /* 默认放大镜图标留一点内边距，避免顶满 */
  .engine-icon svg.default-mark { width: 88%; height: 88%; }

  /* 搜索框内的图标规则会带上描边，品牌 logo 只填充不描边，这里覆盖掉 */
  #engine-btn svg { width: 20px; height: 20px; stroke: none; }
  #engine-btn svg.bing-mark { width: auto; height: 23px; }

  /* 引擎选择面板：整体纵向布局，列表区可滚动，底部“添加”常驻可见 */
  #engine-panel {
    position: absolute;
    top: calc(100% + 8px);
    left: 0;
    min-width: 232px;
    background: var(--box-bg);
    border: 1px solid var(--box-border);
    border-radius: 18px;
    overflow: hidden;
    box-shadow: 0 10px 32px rgba(0, 0, 0, .16);
    display: none;
    flex-direction: column;
    z-index: 12;
  }

  /* 下方空间不够时改为向上展开 */
  #engine-panel.up { top: auto; bottom: calc(100% + 8px); }

  .engine-list {
    overflow-x: hidden;
    overflow-y: auto;
    overscroll-behavior: contain;
    scrollbar-width: thin;
    scrollbar-color: rgba(128, 128, 128, .5) transparent;
    min-height: 0;
  }

  .engine-list::-webkit-scrollbar { width: 8px; }
  .engine-list::-webkit-scrollbar-thumb {
    background: rgba(128, 128, 128, .45);
    border-radius: 4px;
    border: 2px solid transparent;
    background-clip: content-box;
  }

  #engine-panel.show { display: flex; }

  .engine-item {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 10px 16px;
    font-size: 15px;
    cursor: pointer;
    color: var(--text);
    white-space: nowrap;
  }

  .engine-item:hover { background: var(--btn-bg); color: var(--btn-text); }
  .engine-item .check { margin-left: auto; font-size: 13px; opacity: 0; padding-left: 16px; }
  .engine-item.active .check { opacity: 1; }

  /* 自定义引擎的删除按钮
     基础状态：可见（保证任何设备都能删除）。
     仅当设备确认具备「精确指针 + 支持悬停」时，才收敛为悬停显示，
     避免 hover 能力检测不确定的设备（触屏笔记本 / 无头浏览器等）按钮消失。 */
  .engine-item .del {
    margin-left: 8px;
    width: 22px;
    height: 22px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 15px;
    line-height: 1;
    opacity: .55;
    flex-shrink: 0;
  }

  .engine-item .del:hover { opacity: 1; background: rgba(255, 90, 90, .22); }
  .engine-item.custom .check { padding-left: 8px; }

  /* 精确鼠标设备：默认隐藏，悬停或聚焦该行时显示（保持桌面清爽） */
  @media (hover: hover) and (pointer: fine) {
    .engine-item .del { display: none; }
    .engine-item.custom:hover .del,
    .engine-item.custom:focus-within .del { display: flex; }
  }

  /* 触屏设备：常显并放大热区，方便手指点按 */
  @media (hover: none), (pointer: coarse) {
    .engine-item.custom .del {
      display: flex;
      position: relative;
      width: 28px;
      height: 28px;
      font-size: 17px;
      opacity: .6;
      margin-left: 4px;
    }
    .engine-item.custom .del::after {
      content: '';
      position: absolute;
      inset: -6px;
    }
  }

  /* 面板里的“添加自定义引擎”入口（固定在面板底部，不参与列表滚动） */
  .engine-add {
    flex-shrink: 0;
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 10px 16px;
    font-size: 14px;
    cursor: pointer;
    color: var(--subtle);
    border-top: 1px solid var(--box-border);
  }

  .engine-add:hover { background: var(--btn-bg); color: var(--btn-text); }
  .engine-add .plus { font-size: 16px; width: 20px; text-align: center; }

  /* 列表仍需滚动时，底部入口上方出现渐隐，提示“下面还有引擎” */
  #engine-panel.can-scroll .engine-add {
    box-shadow: 0 -12px 14px -8px rgba(0, 0, 0, .22);
    border-top-color: transparent;
  }

  /* 自定义引擎表单（弹窗） */
  #engine-form-mask {
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, .45);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 50;
    padding: 20px;
  }

  #engine-form-mask.show { display: flex; }

  #engine-form {
    width: min(420px, 100%);
    background: var(--box-bg);
    border: 1px solid var(--box-border);
    border-radius: 18px;
    padding: 22px;
    box-shadow: 0 20px 60px rgba(0, 0, 0, .35);
    display: flex;
    flex-direction: column;
    gap: 14px;
  }

  #engine-form h3 { font-size: 17px; font-weight: 600; color: var(--text); }

  #engine-form label {
    display: flex;
    flex-direction: column;
    gap: 6px;
    font-size: 13px;
    color: var(--subtle);
  }

  #engine-form input[type="text"] {
    width: 100%;
    background: var(--bg);
    border: 1px solid var(--box-border);
    border-radius: 10px;
    padding: 9px 12px;
    font-size: 14px;
    color: var(--text);
    outline: none;
    font-family: inherit;
  }

  #engine-form input[type="text"]:focus { border-color: var(--subtle); }

  /* 字段下方的灰色说明（图标 URL 的填写提示） */
  .ef-hint {
    font-size: 12px;
    line-height: 1.5;
    color: var(--subtle);
    opacity: .85;
    margin: -8px 0 -2px;
  }

  #ef-msg { font-size: 12.5px; min-height: 16px; color: #e5484d; }
  #ef-msg.ok { color: #2f9e44; }

  .ef-actions { display: flex; justify-content: flex-end; gap: 10px; }

  .ef-actions button {
    border: 1px solid var(--box-border);
    background: transparent;
    color: var(--text);
    padding: 9px 18px;
    border-radius: 10px;
    font-size: 14px;
    cursor: pointer;
    font-family: inherit;
    transition: opacity .2s ease, background .2s ease;
  }

  .ef-actions button:hover { opacity: .85; }
  .ef-actions #ef-save { background: var(--btn-bg); color: var(--btn-text); border-color: transparent; }

  /* RTL（阿拉伯语 / 希伯来语）镜像适配 */
  html[dir="rtl"] .search-box { padding: 6px 22px 6px 8px; }
  html[dir="rtl"] #engine-btn { margin-left: 0; margin-right: -7px; }
  html[dir="rtl"] #engine-panel { left: auto; right: 0; }
  html[dir="rtl"] .engine-item .check { margin-left: 0; margin-right: auto; padding-left: 0; padding-right: 16px; }
  html[dir="rtl"] .engine-item .del { margin-left: 0; margin-right: 8px; }
  html[dir="rtl"] .ef-actions { justify-content: flex-start; }
  html[dir="rtl"] .sug-item { padding: 11px 22px; }

  #search-input {
    flex: 1;
    min-width: 0; /* 关键：允许输入框自由收缩，否则固有最小宽度会把提交按钮挤出胶囊（窄屏/手机） */
    border: none;
    outline: none;
    background: transparent;
    color: var(--text);
    font-size: 16px;
    padding: 12px 14px;
  }

  #search-input::placeholder { color: var(--subtle); }

  #search-btn {
    border: none;
    outline: none;
    background: var(--btn-bg);
    color: var(--btn-text);
    width: 38px;
    height: 38px;
    border-radius: 50%;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    transition: opacity .2s ease, background .3s ease, color .3s ease;
  }

  #search-btn:hover { opacity: .85; }

  #search-btn svg {
    width: 16px;
    height: 16px;
    stroke: currentColor;
  }

  /* 联想下拉 */
  #suggest-panel {
    position: absolute;
    top: calc(100% + 8px);
    left: 0;
    right: 0;
    background: var(--box-bg);
    border: 1px solid var(--box-border);
    border-radius: 18px;
    overflow: hidden;
    box-shadow: 0 10px 32px rgba(0, 0, 0, .16);
    display: none;
    z-index: 10;
  }

  #suggest-panel.show { display: block; }

  .sug-item {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 11px 22px;
    font-size: 15px;
    cursor: pointer;
    color: var(--text);
  }

  .sug-item svg {
    width: 15px;
    height: 15px;
    fill: none;
    stroke: var(--subtle);
    stroke-width: 2;
    stroke-linecap: round;
    flex-shrink: 0;
  }

  .sug-item.active, .sug-item:hover { background: var(--btn-bg); color: var(--btn-text); }
  .sug-item.active svg, .sug-item:hover svg { stroke: var(--btn-text); }

  .sug-item b { font-weight: 600; }
</style>
</head>
<body>

  <div>
    <div id="clock">00:00</div>
    <div id="date"></div>
  </div>

  <div class="search-wrap">
    <form class="search-box" id="search-form">
      <button id="engine-btn" type="button" title="切换搜索引擎"></button>
      <input id="search-input" type="text" placeholder="搜索网页…" autocomplete="off" autofocus>
      <button id="search-btn" type="submit" title="搜索">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <line x1="5" y1="12" x2="19" y2="12"></line>
          <polyline points="12 5 19 12 12 19"></polyline>
        </svg>
      </button>
    </form>
    <div id="suggest-panel"></div>
    <div id="engine-panel"></div>
    <!-- 自定义搜索引擎表单 -->
    <div id="engine-form-mask">
      <form id="engine-form" autocomplete="off">
        <h3 id="engine-form-title">添加自定义搜索引擎</h3>
        <label><span class="ef-label" id="ef-label-name">名称</span><input id="ef-name" type="text" maxlength="24" placeholder="例如：知乎" required></label>
        <label><span class="ef-label" id="ef-label-url">搜索网址（用 %s 代表关键词）</span><input id="ef-url" type="text" maxlength="300" placeholder="https://www.zhihu.com/search?q=%s" required></label>
        <label><span class="ef-label" id="ef-label-icon">图标 URL（可选）</span><input id="ef-icon" type="text" maxlength="400000" placeholder="https://example.com/icon.png 或 data:image/png;base64,…"></label>
        <p class="ef-hint" id="ef-hint-icon">支持图片链接或 base64 编码，留空将使用默认图标</p>
        <p id="ef-msg"></p>
        <div class="ef-actions">
          <button type="button" id="ef-cancel">取消</button>
          <button type="submit" id="ef-save">保存</button>
        </div>
      </form>
    </div>
  </div>

<script>
  /* ---------- 多语言：自动识别系统/浏览器语言 ---------- */
  const MONTHS = {
    en: ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'],
    fr: ['janv.','févr.','mars','avr.','mai','juin','juil.','août','sept.','oct.','nov.','déc.'],
    de: ['Jan.','Feb.','März','Apr.','Mai','Juni','Juli','Aug.','Sept.','Okt.','Nov.','Dez.'],

    th: ['มกราคม','กุมภาพันธ์','มีนาคม','เมษายน','พฤษภาคม','มิถุนายน','กรกฎาคม','สิงหาคม','กันยายน','ตุลาคม','พฤศจิกายน','ธันวาคม'],
    id: ['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'],
    hi: ['जनवरी','फ़रवरी','मार्च','अप्रैल','मई','जून','जुलाई','अगस्त','सितंबर','अक्टूबर','नवंबर','दिसंबर'],
    sv: ['jan.','feb.','mars','apr.','maj','juni','juli','aug.','sep.','okt.','nov.','dec.'],
    he: ['ינואר','פברואר','מרץ','אפריל','מאי','יוני','יולי','אוגוסט','ספטמבר','אוקטובר','נובמבר','דצמבר']
  };
  // 俄语月份（属格形式）；阿语月份为音译
  const MONTHS_RU = ['янв.','февр.','марта','апр.','мая','июн.','июл.','авг.','сент.','окт.','нояб.','дек.'];
  const MONTHS_AR = ['يناير','فبراير','مارس','أبريل','مايو','يونيو','يوليو','أغسطس','سبتمبر','أكتوبر','نوفمبر','ديسمبر'];

  // 通用日期构造器：dateStyle 决定「日 月 年」还是「月 日, 年」等顺序
  const fmt = (wd, m, d, y, months, dateStyle) => {
    if (dateStyle === 'ymd') return y + '年' + m + '月' + d + '日 · ' + wd;      // 中日韩
    if (dateStyle === 'dmy') return wd + ', ' + d + ' ' + months[m - 1] + ' ' + y; // 欧洲
    return wd + ', ' + months[m - 1] + ' ' + d + ', ' + y;                      // 美式
  };

  const I18N = {
    zh: {
      htmlLang: 'zh-CN',
      title: '鉴业的浏览器主页',
      weekDays: ['星期日','星期一','星期二','星期三','星期四','星期五','星期六'],
      dateFormat: (y, m, d, wd) => y + ' 年 ' + m + ' 月 ' + d + ' 日 · ' + wd,
      searchPlaceholder: '搜索网页…',
      searchWith: (n) => '用' + n + '搜索网页…',
      searchTitle: '搜索',
      engineBtnLabel: '切换搜索引擎',
      engineBtnTitle: (n) => '切换搜索引擎（当前：' + n + '）',
      btnDelete: '删除',
      addEngine: '添加自定义搜索引擎',
      formTitle: '添加自定义搜索引擎',
      fieldName: '名称',
      fieldUrl: '搜索网址（用 %s 代表关键词）',
      fieldIcon: '图标 URL（可选）',
      hintIcon: '支持图片链接或 base64 编码，留空将使用默认图标',
      btnCancel: '取消',
      btnSave: '保存',
      hintExample: '例如：知乎',
      engineNames: { bing: '必应', baidu: '百度', google: '谷歌', sogou: '搜狗', so360: '360', ddg: 'DuckDuckGo', yahoo: 'Yahoo', yandex: 'Yandex', douyin: '抖音', bilibili: 'B站' }
    },
    en: {
      htmlLang: 'en',
      title: 'Jianye\u2019s Browser Homepage',
      weekDays: ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'],
      dateFormat: (y, m, d, wd) => fmt(wd, m, d, y, MONTHS.en),
      searchPlaceholder: 'Search the web…',
      searchWith: (n) => 'Search the web with ' + n + '…',
      searchTitle: 'Search',

      btnDelete: 'Delete',

    },
    ja: {

      title: '鑑業のブラウザホームページ',
      weekDays: ['日曜日','月曜日','火曜日','水曜日','木曜日','金曜日','土曜日'],
      dateFormat: (y, m, d, wd) => y + '年' + m + '月' + d + '日 · ' + wd,
      searchPlaceholder: 'ウェブを検索…',
      searchWith: (n) => n + 'で検索…',
      searchTitle: '検索',
      engineBtnLabel: '検索エンジンを切り替え',
      engineBtnTitle: (n) => '検索エンジンを切り替え（現在：' + n + '）',
      btnDelete: '削除',
      addEngine: 'カスタム検索エンジンを追加',
      formTitle: 'カスタム検索エンジンを追加',
      fieldName: '名前',

  function normalizeLocale() {
    // 优先级：已保存偏好 > 浏览器语言列表 > 默认英文
    let saved = '';
    try { saved = localStorage.getItem('homepage.lang') || ''; } catch (err) {}
    const list = [saved, navigator.language]
      .concat(Array.isArray(navigator.languages) ? navigator.languages : [])
      .filter(Boolean);
    for (const raw of list) {
      // 取主语言子标签（避免 "zhx" 之类被误判为 "zh"）
      let l = String(raw).toLowerCase().split(/[-_]/)[0];
      if (l === 'zh') return 'zh';
      if (I18N[l]) return l;
    }
    return 'en'; // 未收录的语言回退英文
  }

  function esc(s) {
    return String(s).replace(/[&<>"']/g, c => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
    }[c]));
  }

    clockEl.textContent = pad(now.getHours()) + ':' + pad(now.getMinutes());

  }

  function engineName(id) {
    if (T.engineNames && T.engineNames[id]) return T.engineNames[id];
    const e = engines.find(x => x.id === id);
    if (!e) return id;
    return (LANG === 'zh' ? e.zh : e.en) || e.en || id;
  }

  /* ---------- 自定义搜索引擎（存 localStorage，与内置引擎合并） ---------- */
  // 自定义图标只接受 http(s) 图片链接或 base64 内联图片，
  // 其余（javascript:、data:text/html 等）一律丢弃，避免注入执行
  function safeIconSrc(v) {
    const s = String(v == null ? '' : v).trim();
    if (!s) return '';
    if (/^data:image\/[a-z0-9.+-]+;base64,[A-Za-z0-9+/=\s]+$/i.test(s)) return s.replace(/\s+/g, '');
    if (/^(https?:\/\/|\/\/)[^\s"'<>]+$/i.test(s)) return s;
    return '';
  }

  const CUSTOM_KEY = 'homepage.customEngines';
  let customEngines = [];
  try {
    const raw = localStorage.getItem(CUSTOM_KEY);
    const parsed = raw ? JSON.parse(raw) : [];
    // 必须是数组，且每项含 id/name/url；同时做类型与长度收敛，防止脏数据破坏渲染
    if (Array.isArray(parsed)) {
      customEngines = parsed
        .filter(e => e && typeof e === 'object' && e.id && e.name && e.url)
        .map(e => ({
          // id 保留原值（避免失效已保存的 currentEngine），仅限制合法字符
          id: String(e.id).replace(/[^A-Za-z0-9_]/g, '').slice(0, 60),
          name: String(e.name).slice(0, 40),
          url: String(e.url).slice(0, 500),
          icon: safeIconSrc(e.icon).slice(0, 400000)
        }))
        .filter(e => e.id) // 清洗后 id 可能为空，剔除
        // 归一化后可能存在重复 id，去重
        .filter((e, i, arr) => arr.findIndex(x => x.id === e.id) === i);
    }
  } catch (err) { customEngines = []; }

  function saveCustom() {
    try { localStorage.setItem(CUSTOM_KEY, JSON.stringify(customEngines)); } catch (err) {}
  }

  // 取网址的根域名（www.douyin.com → douyin.com），用来识别“用户以前手动加过、如今已内置”的引擎
  function rootDomain(url) {
    try {
      const host = new URL(String(url).replace('%s', 'x')).hostname.toLowerCase();
      const parts = host.split('.');
      return parts.length > 2 ? parts.slice(-2).join('.') : host;
    } catch (err) { return ''; }
  }

  const builtinDomains = engines.map(e => rootDomain(e.url)).filter(Boolean);

  // 与内置引擎同域名的自定义引擎不再重复显示（例如之前手动添加的“抖音”）
  function dupOfBuiltin(eng) {
    const d = rootDomain(eng.url);
    return !!d && builtinDomains.indexOf(d) > -1;
  }

  // 内置 + 自定义的完整列表
  function allEngines() { return engines.concat(customEngines.filter(e => !dupOfBuiltin(e))); }

  function isCustom(id) { return customEngines.some(e => e.id === id); }

  const ENGINE_KEY = 'homepage.engine';
  let currentEngine = engines[0].id; // 默认必应
  try {
    const saved = localStorage.getItem(ENGINE_KEY);
    if (saved) {
      if (allEngines().some(e => e.id === saved)) {
        currentEngine = saved;
      } else {
        // 存的是被内置引擎取代的那条自定义项 → 平滑迁移到同域名的内置引擎
        const old = customEngines.find(e => e.id === saved);
        if (old) {
          const d = rootDomain(old.url);
          const hit = engines.find(e => rootDomain(e.url) === d);
          if (hit) currentEngine = hit.id;
        }
      }
    }
  } catch (err) { /* localStorage 不可用时忽略，用默认引擎 */ }

  const engineBtn = document.getElementById('engine-btn');
  const enginePanel = document.getElementById('engine-panel');

  function currentEngineObj() {
    return allEngines().find(e => e.id === currentEngine) || engines[0];
  }

  // 当前引擎显示名：自定义引擎用自己的名称，内置走语言包
  function currentEngineLabel() {
    const eng = currentEngineObj();
    return isCustom(eng.id) ? eng.name : engineName(eng.id);
  }

  // 默认图标：通用放大镜（纯填充，深浅色都清晰），自定义引擎没填图标时使用
  const DEFAULT_ICON = '<svg class="default-mark" viewBox="0 0 24 24" aria-hidden="true"><g fill="#9a9a9a"><path fill-rule="evenodd" d="M10.7 2.4a8.3 8.3 0 1 0 0 16.6 8.3 8.3 0 0 0 0-16.6Zm0 2.9a5.4 5.4 0 1 1 0 10.8 5.4 5.4 0 0 1 0-10.8Z"/><rect x="15.9" y="16.6" width="7.2" height="3" rx="1.5" transform="rotate(45 19.5 18.1)"/></g></svg>';

  // 内置引擎用官方 logo；自定义引擎用自填的图标地址，没填就用默认图标
  function iconHTML(eng) {
    const src = ENGINE_ICONS[eng.id] ? '' : safeIconSrc(eng.icon);
    const content = ENGINE_ICONS[eng.id] || (src ? '<img src="' + esc(src) + '" alt="">' : DEFAULT_ICON);
    return '<span class="engine-icon">' + content + '</span>';
  }

  function renderEngineBtn() {
    const eng = currentEngineObj();
    // 按钮图标直接显示当前搜索引擎的 logo
    engineBtn.innerHTML = iconHTML(eng);
    engineBtn.title = T.engineBtnTitle(currentEngineLabel());
    engineBtn.setAttribute('aria-label', T.engineBtnLabel);
    input.placeholder = T.searchWith(currentEngineLabel());
  }

  // 自定义图标失效（链接 404、base64 损坏、混合内容被拦截）时退回默认图标
  // img 的 error 事件不冒泡，必须用捕获阶段监听
  document.addEventListener('error', (e) => {
    const img = e.target;
    if (!img || img.tagName !== 'IMG' || !img.parentNode) return;
    if (!img.parentNode.classList || !img.parentNode.classList.contains('engine-icon')) return;
    img.parentNode.innerHTML = DEFAULT_ICON;
  }, true);

  function closeEnginePanel() {
    enginePanel.classList.remove('show');
  }

  function renderEnginePanel() {
    const items = allEngines().map(e => {
      const custom = isCustom(e.id);
      const label = custom ? e.name : engineName(e.id);
      return '<div class="engine-item' + (e.id === currentEngine ? ' active' : '') + (custom ? ' custom' : '') + '" data-id="' + esc(e.id) + '">' +
        iconHTML(e) + '<span>' + esc(label) + '</span>' +
        (custom ? '<span class="del" data-del="' + esc(e.id) + '" title="' + esc(T.btnDelete || '删除') + '">&times;</span>' : '') +
        '<span class="check">✓</span></div>';
    }).join('');
    // 底部添加入口（固定在面板底部，不随列表滚动）
    const addLabel = T.addEngine || '添加自定义搜索引擎';
    enginePanel.innerHTML = '<div class="engine-list">' + items + '</div>' +
      '<div class="engine-add" id="engine-add"><span class="plus">+</span><span>' + esc(addLabel) + '</span></div>';

    // 默认向下展开；只有当下方连 5 项都放不下、且上方明显更宽裕时才向上翻转
    enginePanel.classList.remove('up');
    enginePanel.style.maxHeight = '';
    // 面板是相对搜索框（offsetParent）定位的，必须用它的底边算可用空间
    const anchor = enginePanel.offsetParent || engineBtn.parentElement || engineBtn;
    const ar = anchor.getBoundingClientRect();
    const below = window.innerHeight - ar.bottom - 8 - 14;   // 面板顶部 = 锚点底边 + 8，底部留 14
    const above = ar.top - 8 - 14;                            // 向上展开时的可用高度
    const MIN_DOWN = 220;              // 下方至少能露出 4~5 项 + 添加入口
    const flipUp = below < MIN_DOWN && above > below + 60;
    if (flipUp) {
      enginePanel.classList.add('up');
      enginePanel.style.maxHeight = Math.max(180, Math.min(above, 560)) + 'px';
    } else {
      enginePanel.style.maxHeight = Math.max(140, Math.min(below, 560)) + 'px';
    }

    enginePanel.classList.add('show');
    // 列表超出可见区域时：高度吸附到整行（不切半行），并给底部入口加渐隐提示
    const listEl = enginePanel.querySelector('.engine-list');
    const addEl = enginePanel.querySelector('.engine-add');
    const firstItem = listEl && listEl.firstElementChild;
    if (listEl && addEl && firstItem && !enginePanel.classList.contains('up')) {
      const ih = firstItem.getBoundingClientRect().height;
      const ah = addEl.getBoundingClientRect().height;
      const top = enginePanel.getBoundingClientRect().top;
      const room = window.innerHeight - top - 2;             // 面板最多能占多高（留 2px）
      const cur = parseFloat(enginePanel.style.maxHeight) || room;
      if (ih > 0 && listEl.scrollHeight > cur - ah + 2) {
        // 尽量把被切掉的那一行补成整行，但绝不超出可用空间
        let rows = Math.round((cur - ah) / ih);
        if (rows * ih + ah > room) rows = Math.floor((room - ah) / ih);
        if (rows >= 2) enginePanel.style.maxHeight = Math.ceil(rows * ih + ah) + 'px';
        enginePanel.classList.add('can-scroll');
      } else {
        enginePanel.classList.remove('can-scroll');
      }
    }
  }

  engineBtn.addEventListener('mousedown', (e) => e.preventDefault()); // 防止输入框失焦
  engineBtn.addEventListener('click', (e) => {
    e.stopPropagation();
    if (enginePanel.classList.contains('show')) closeEnginePanel();
    // 打开引擎面板前先收起联想面板，避免两个下拉叠在一起
    else { hideSuggest(); renderEnginePanel(); }
  });

  // 指针入口：按下只记录，抬起且没有位移才算“点选”。
  // 旧写法在 pointerdown 就选中并关面板，手机上一滑立刻关窗，列表根本滚不动。
  let pressInfo = null;
  const PRESS_SLOP = 10;   // 超过 10px 视为滑动，不当作点选

  enginePanel.addEventListener('pointerdown', (e) => {
    pressInfo = { x: e.clientX, y: e.clientY, id: e.pointerId, target: e.target, moved: false };
  });
  enginePanel.addEventListener('pointermove', (e) => {
    if (!pressInfo || e.pointerId !== pressInfo.id) return;
    if (Math.abs(e.clientX - pressInfo.x) > PRESS_SLOP ||
        Math.abs(e.clientY - pressInfo.y) > PRESS_SLOP) pressInfo.moved = true;
  });
  enginePanel.addEventListener('pointerup', (e) => {
    if (!pressInfo || e.pointerId !== pressInfo.id) return;
    const info = pressInfo;
    pressInfo = null;
    if (info.moved) return;                                  // 滑动 → 不选中
    if (longPressFired) { longPressFired = false; return; }   // 长按删除后不切换
    onPanelPress(info.target, e.pointerType);
  });
  enginePanel.addEventListener('pointercancel', () => { pressInfo = null; });

  // 触屏长按（删除按钮不易点时）也能删除
  let longPressTimer = null;
  let longPressFired = false;
  enginePanel.addEventListener('touchstart', (e) => {
    const item = e.target.closest('.engine-item.custom');
    if (!item || e.target.closest('.del')) return;
    longPressFired = false;
    longPressTimer = setTimeout(() => {
      longPressTimer = null;
      longPressFired = true;   // 标记已长按删除，抑制随后的点选切换
      deleteEngine(item.dataset.id);
    }, 600);
  }, { passive: true });
  ['touchend', 'touchmove', 'touchcancel'].forEach(ev =>
    enginePanel.addEventListener(ev, () => { clearTimeout(longPressTimer); longPressTimer = null; }, { passive: true })
  );

  // 没有 Pointer Events 的老浏览器退回 click（现代浏览器不会走到这里）
  if (!window.PointerEvent) {
    enginePanel.addEventListener('click', (e) => {
      if (longPressFired) { longPressFired = false; return; }
      onPanelPress(e.target, 'mouse');
    });
  }

  function onPanelPress(target, pointerType) {
    if (!target || !target.closest) return;
    // 删除自定义引擎
    const del = target.closest('.del');
    if (del) {
      deleteEngine(del.dataset.del);
      return;
    }
    // 打开添加表单
    if (target.closest('#engine-add')) {
      closeEnginePanel();
      openEngineForm();
      return;
    }
    const item = target.closest('.engine-item');
    if (!item) return;
    currentEngine = item.dataset.id;
    try { localStorage.setItem(ENGINE_KEY, currentEngine); } catch (err) {}
    renderEngineBtn();
    closeEnginePanel();
    // 触屏不主动聚焦输入框：否则键盘会立刻弹出（还会被随后的补发事件马上收回去，闪一下）
    if (pointerType !== 'touch') input.focus();
  }

  // 删除某个自定义引擎（若正被使用则回退默认引擎）
  function deleteEngine(id) {
    const listBefore = enginePanel.querySelector('.engine-list');
    const keepScroll = listBefore ? listBefore.scrollTop : 0;   // 重渲染会回到顶部，先记住位置
    customEngines = customEngines.filter(x => x.id !== id);
    saveCustom();
    if (currentEngine === id) {
      currentEngine = engines[0].id;
      try { localStorage.setItem(ENGINE_KEY, currentEngine); } catch (err) {}
      renderEngineBtn();
    }
    renderEnginePanel();
    const listAfter = enginePanel.querySelector('.engine-list');
    if (listAfter && keepScroll) listAfter.scrollTop = keepScroll;
  }

  /* ---------- 自定义引擎表单 ---------- */
  const formMask = document.getElementById('engine-form-mask');
  const efName = document.getElementById('ef-name');
  const efUrl = document.getElementById('ef-url');
  const efIcon = document.getElementById('ef-icon');
  const efMsg = document.getElementById('ef-msg');

  // 按当前语言填充表单文案（缺词条时回退英文）
  (function applyFormI18N() {
    const setText = (id, val) => { const el = document.getElementById(id); if (el && val) el.textContent = val; };
    setText('engine-form-title', T.formTitle || 'Add custom search engine');
    setText('ef-label-name', T.fieldName || 'Name');
    setText('ef-label-url', T.fieldUrl || 'Search URL (%s = keyword)');
    setText('ef-label-icon', T.fieldIcon || 'Icon URL (optional)');
    setText('ef-hint-icon', T.hintIcon || 'Image link or base64 data. Leave blank to use the default icon.');
    setText('ef-cancel', T.btnCancel || 'Cancel');
    setText('ef-save', T.btnSave || 'Save');
    efName.placeholder = T.hintExample || '';
  })();

  let formOpenedAt = 0;
  function openEngineForm() {
    efMsg.textContent = '';
    efMsg.classList.remove('ok');
    formMask.classList.add('show');
    formOpenedAt = Date.now();
    setTimeout(() => efName.focus(), 30);
  }

  function closeEngineForm() {
    formMask.classList.remove('show');
    document.getElementById('engine-form').reset();
    efMsg.textContent = '';
    efMsg.classList.remove('ok');
  }

  // 校验错误提示也跟随语言（缺失时用英文兜底）
  const ERRS = {
    zh: {
      name: '请填写名称',
      url: '网址需以 http:// 或 https:// 开头',
      ph: '网址里需要用 %s 表示关键词位置',
      dup: '已有同名引擎，请换个名称',
      icon: '图标地址需是 http(s) 图片链接，或 data:image/ 开头的 base64'
    },
    en: {
      name: 'Please enter a name',
      url: 'URL must start with http:// or https://',
      ph: 'The URL must contain %s for the keyword',
      dup: 'An engine with this name already exists',
      icon: 'Icon must be an http(s) image link or a data:image/ base64 string'
    }
  };
  const E = ERRS[LANG] || ERRS.en;

  document.getElementById('engine-form').addEventListener('submit', (e) => {
    e.preventDefault();
    const name = efName.value.trim();
    const url = efUrl.value.trim();
    if (!name) { efMsg.textContent = E.name; return; }
    if (!/^https?:\/\//i.test(url)) { efMsg.textContent = E.url; return; }
    if (url.indexOf('%s') < 0) { efMsg.textContent = E.ph; return; }
    // 图标可留空（用默认图标）；填了就必须是合法图片地址/base64
    const iconRaw = efIcon.value.trim();
    const icon = safeIconSrc(iconRaw);
    if (iconRaw && !icon) { efMsg.textContent = E.icon; return; }
    if (icon.length > 400000) { efMsg.textContent = E.icon; return; }
    // 名称去重：比对各语言下的所有名称（含内置引擎的多种译名）+ 已有自定义名，
    // 避免在中文界面下添加名为 "Bing" 的引擎而绕过检测
    const lower = name.toLowerCase();
    const dup = allEngines().some(x => {
      if (isCustom(x.id)) return (x.name || '').toLowerCase() === lower;
      // 内置引擎：检查它在所有语言包中的名字
      if (x.id.toLowerCase() === lower) return true;
      return Object.keys(I18N).some(lang => {
        const n = I18N[lang].engineNames && I18N[lang].engineNames[x.id];
        return n && n.toLowerCase() === lower;
      });
    });
    if (dup) { efMsg.textContent = E.dup; return; }

    const id = 'custom_' + Date.now().toString(36);
    const eng = { id: id, name: name, url: url, icon: icon };
    customEngines.push(eng);
    saveCustom();
    currentEngine = id; // 新增后直接启用
    try { localStorage.setItem(ENGINE_KEY, currentEngine); } catch (err) {}
    renderEngineBtn();
    closeEngineForm();
    input.focus();
  });

  document.getElementById('ef-cancel').addEventListener('click', closeEngineForm);
  // 触摸点按后浏览器会补发一次 mousedown；若这次补发正好落在刚弹出的遮罩上，
  // 表单会「刚打开就被关掉」——所以刚打开的头 350ms 内忽略遮罩点击。
  formMask.addEventListener('mousedown', (e) => {
    if (e.target === formMask && Date.now() - formOpenedAt > 350) closeEngineForm();
  });
  // Esc 关闭表单（表单内任何位置生效）
  formMask.addEventListener('keydown', (e) => { if (e.key === 'Escape') { e.stopPropagation(); closeEngineForm(); } });

  renderEngineBtn();

  function search(q) {
    if (!q) return;
    const eng = currentEngineObj();
    // URL 中所有 %s 都替换为关键词（replaceAll 未兼容时用 split/join 兜底）
    const kw = encodeURIComponent(q);
    const tmpl = String(eng.url || '');
    const target = tmpl.indexOf('%s') < 0 ? tmpl : tmpl.split('%s').join(kw);
    window.location.href = target;
  }

  form.addEventListener('submit', (e) => {
    e.preventDefault();
    search(input.value.trim());
  });

  /* ---------- 实时联想（JSONP，避免跨域限制） ---------- */
  let sugTimer = null;
  let sugItems = [];       // 当前联想词
  let activeIdx = -1;      // 键盘高亮索引
  let jsonpSeq = 0;        // 防止旧请求覆盖新结果
  let lastQuery = '';

  function hideSuggest() {
    // 只隐藏面板，保留 sugItems 缓存，点击搜索框时可以直接恢复显示
    panel.classList.remove('show');
    panel.innerHTML = '';
    activeIdx = -1;
  }

  function renderSuggest() {
    if (!sugItems.length) { hideSuggest(); return; }
    const q = input.value.trim();
    panel.innerHTML = sugItems.map((s, i) => {
      // 先转义再插入高亮标签，避免联想词里的 HTML 被当作标签解析（XSS）
      let html;
      const safe = esc(s);
      if (q) {
        const idx = s.toLowerCase().indexOf(q.toLowerCase());
        if (idx >= 0) {
          // 在转义后的文本上按相同位置切分（esc 不改变原有字符的相对顺序，
          // 但会改变长度，故对三段分别转义后拼接更稳妥）
          html = esc(s.slice(0, idx)) + '<b>' + esc(s.slice(idx, idx + q.length)) + '</b>' + esc(s.slice(idx + q.length));
        } else {
          html = safe;
        }
      } else {
        html = safe;
      }
      return '<div class="sug-item" data-i="' + i + '">' +
        '<svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"></circle><line x1="16.5" y1="16.5" x2="21" y2="21"></line></svg>' +
        '<span>' + html + '</span></div>';
    }).join('');
    activeIdx = -1;
    panel.classList.add('show');
  }

  function setActive(i) {
    const items = panel.querySelectorAll('.sug-item');
    items.forEach(el => el.classList.remove('active'));
    activeIdx = i;
    if (i >= 0 && i < items.length) items[i].classList.add('active');
  }

  function fetchSuggest(q) {
    const seq = ++jsonpSeq;
    const cbName = '__sugCb' + seq; // 每个请求独立回调，避免并发互相污染
    const script = document.createElement('script');
    const timer = setTimeout(() => { delete window[cbName]; script.remove(); }, 3000);
    script.src = 'https://suggestion.baidu.com/su?wd=' + encodeURIComponent(q) + '&cb=' + cbName;
    script.onload = () => { clearTimeout(timer); delete window[cbName]; script.remove(); };
    script.onerror = () => { clearTimeout(timer); delete window[cbName]; script.remove(); hideSuggest(); };
    window[cbName] = function (data) {
      if (seq !== jsonpSeq) return; // 已有更新的请求，丢弃旧响应
      if (input.value.trim() !== q) return; // 输入框内容已变化（如已删空），丢弃过期响应
      // 兼容两种返回格式：{q:"..", p:false, s:[...]}（实测格式）和 [词, [...]]（旧格式）
      let arr = [];
      if (data && Array.isArray(data.s)) {
        arr = data.s;
      } else if (Array.isArray(data) && Array.isArray(data[1])) {
        arr = data[1];
      }
      sugItems = arr.filter(x => typeof x === 'string').slice(0, 8);
      renderSuggest();
    };
    document.body.appendChild(script);
  }

  input.addEventListener('focus', () => {
    closeEnginePanel(); // 聚焦搜索框时收起引擎面板，两个下拉不同时出现
    // 点击搜索框时：有内容就恢复联想（优先用缓存，无缓存则重新请求）
    const q = input.value.trim();
    if (q) {
      if (sugItems.length) renderSuggest();
      else fetchSuggest(q);
    }
  });

  input.addEventListener('input', () => {
    closeEnginePanel(); // 开始输入时引擎面板让位给联想词
    const q = input.value.trim();
    if (!q) {
      // 清空输入：除了隐藏面板，还要作废“迟到”的联想来源，
      // 否则删空文字后，之前请求的结果回来会把面板重新弹出来（bug 修复）
      lastQuery = '';
      clearTimeout(sugTimer); // 取消还没发出的防抖请求
      jsonpSeq++;             // 作废所有在途响应
      hideSuggest();
      return;
    }
    if (q === lastQuery) { renderSuggest(); return; } // 同词重新聚焦/输入时直接恢复
    lastQuery = q;
    clearTimeout(sugTimer);
    sugTimer = setTimeout(() => fetchSuggest(q), 120); // 轻微防抖
  });

  input.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') { hideSuggest(); closeEnginePanel(); return; } // Esc 关闭所有弹层
    if (!panel.classList.contains('show')) return;
    if (e.key === 'ArrowDown') {
      e.preventDefault();
      setActive((activeIdx + 1) % sugItems.length);
    } else if (e.key === 'ArrowUp') {
      e.preventDefault();
      setActive((activeIdx - 1 + sugItems.length) % sugItems.length);
    } else if (e.key === 'Enter' && activeIdx >= 0) {
      e.preventDefault();
      search(sugItems[activeIdx]);
    }
  });

  panel.addEventListener('mousedown', (e) => {
    const item = e.target.closest('.sug-item');
    if (item) {
      e.preventDefault(); // 防止 input 失焦
      search(sugItems[+item.dataset.i]);
    }
  });

  document.addEventListener('click', (e) => {
    if (!e.target.closest('.search-wrap')) {
      hideSuggest();
      closeEnginePanel();
      return;
    }
    // 点在搜索框之类的地方（不是引擎面板/按钮本身）时，引擎面板也要收起
    if (!e.target.closest('#engine-panel') && !e.target.closest('#engine-btn')) closeEnginePanel();
  });

  // Esc 关闭浮层：不依赖焦点位置（焦点在按钮/面板/页面上都能关）
  document.addEventListener('keydown', (e) => {
    if (e.key !== 'Escape') return;
    if (formMask.classList.contains('show')) { closeEngineForm(); e.stopPropagation(); return; }
    if (enginePanel.classList.contains('show')) { closeEnginePanel(); e.stopPropagation(); return; }
    hideSuggest();
  });
</script>
</body>
</html>
