<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>鉴业的浏览器主页</title>
<style>
  :root {
    --bg: #ffffff;
    --text: #1f1f1f;
    --subtle: #666666;
    --box-bg: #f3f3f3;
    --box-border: #e0e0e0;
    --btn-bg: #1f1f1f;
    --btn-text: #ffffff;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1f1f1f;
      --text: #f3f3f3;
      --subtle: #9a9a9a;
      --box-bg: #2b2b2b;
      --box-border: #3a3a3a;
      --btn-bg: #f3f3f3;
      --btn-text: #1f1f1f;
    }
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    transition: background .3s ease, color .3s ease;
  }

  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 48px;
    user-select: none;
    min-height: 100vh;   /* 兜底 */
    min-height: 100dvh;  /* 移动端动态视口：地址栏收起/展开时也保持真正垂直居中 */
    padding: 24px 16px;  /* 小屏或键盘弹出时防止内容贴边 */
  }

  /* 时钟 */
  #clock {
    font-size: clamp(56px, 10vw, 110px);
    font-weight: 200;
    letter-spacing: 2px;
    font-variant-numeric: tabular-nums;
    line-height: 1;
    text-align: center; /* 窄屏下日期比时钟宽时，时钟仍与日期居中对齐 */
  }

  #date {
    text-align: center;
    color: var(--subtle);
    font-size: 15px;
    margin-top: 14px;
    font-weight: 300;
    letter-spacing: 1px;
  }

  /* 搜索框 */
  .search-wrap {
    width: min(620px, 86vw);
    position: relative;
  }

  .search-box {
    display: flex;
    align-items: center;
    background: var(--box-bg);
    border: 1px solid var(--box-border);
    border-radius: 999px;
    padding: 6px 8px 6px 22px;
    transition: background .3s ease, border-color .3s ease, box-shadow .2s ease;
  }

  .search-box:focus-within {
    border-color: var(--subtle);
    box-shadow: 0 4px 20px rgba(0, 0, 0, .12);
  }

  .search-box svg {
    width: 18px;
    height: 18px;
    fill: none;
    stroke: var(--subtle);
    stroke-width: 2;
    stroke-linecap: round;
    flex-shrink: 0;
  }

  /* 引擎切换按钮（原放大镜位置） */
  #engine-btn {
    border: none;
    outline: none;
    background: transparent;
    width: 34px;
    height: 34px;
    border-radius: 50%;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    margin-left: -7px;
    transition: background .2s ease;
  }

  #engine-btn:hover { background: rgba(128, 128, 128, .18); }

  .engine-badge {
    width: 20px;
    height: 20px;
    border-radius: 7px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 12px;
    font-weight: 600;
    color: #ffffff;
    line-height: 1;
    user-select: none;
  }

  /* 引擎选择面板 */
  #engine-panel {
    position: absolute;
    top: calc(100% + 8px);
    left: 0;
    min-width: 232px;
    background: var(--box-bg);
    border: 1px solid var(--box-border);
    border-radius: 18px;
    overflow: hidden;
    box-shadow: 0 10px 32px rgba(0, 0, 0, .16);
    display: none;
    z-index: 12;
  }

  #engine-panel.show { display: block; }

  .engine-item {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 10px 16px;
    font-size: 15px;
    cursor: pointer;
    color: var(--text);
    white-space: nowrap;
  }

  .engine-item:hover { background: var(--btn-bg); color: var(--btn-text); }
  .engine-item .check { margin-left: auto; font-size: 13px; opacity: 0; padding-left: 16px; }
  .engine-item.active .check { opacity: 1; }

  /* 自定义引擎的删除按钮
     基础状态：可见（保证任何设备都能删除）。
     仅当设备确认具备「精确指针 + 支持悬停」时，才收敛为悬停显示，
     避免 hover 能力检测不确定的设备（触屏笔记本 / 无头浏览器等）按钮消失。 */
  .engine-item .del {
    margin-left: 8px;
    width: 22px;
    height: 22px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 15px;
    line-height: 1;
    opacity: .55;
    flex-shrink: 0;
  }

  .engine-item .del:hover { opacity: 1; background: rgba(255, 90, 90, .22); }
  .engine-item.custom .check { padding-left: 8px; }

  /* 精确鼠标设备：默认隐藏，悬停或聚焦该行时显示（保持桌面清爽） */
  @media (hover: hover) and (pointer: fine) {
    .engine-item .del { display: none; }
    .engine-item.custom:hover .del,
    .engine-item.custom:focus-within .del { display: flex; }
  }

  /* 触屏设备：常显并放大热区，方便手指点按 */
  @media (hover: none), (pointer: coarse) {
    .engine-item.custom .del {
      display: flex;
      position: relative;
      width: 28px;
      height: 28px;
      font-size: 17px;
      opacity: .6;
      margin-left: 4px;
    }
    .engine-item.custom .del::after {
      content: '';
      position: absolute;
      inset: -6px;
    }
  }

  /* 面板里的“添加自定义引擎”入口 */
  .engine-add {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 10px 16px;
    font-size: 14px;
    cursor: pointer;
    color: var(--subtle);
    border-top: 1px solid var(--box-border);
  }

  .engine-add:hover { background: var(--btn-bg); color: var(--btn-text); }
  .engine-add .plus { font-size: 16px; width: 20px; text-align: center; }

  /* 自定义引擎表单（弹窗） */
  #engine-form-mask {
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, .45);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 50;
    padding: 20px;
  }

  #engine-form-mask.show { display: flex; }

  #engine-form {
    width: min(420px, 100%);
    background: var(--box-bg);
    border: 1px solid var(--box-border);
    border-radius: 18px;
    padding: 22px;
    box-shadow: 0 20px 60px rgba(0, 0, 0, .35);
    display: flex;
    flex-direction: column;
    gap: 14px;
  }

  #engine-form h3 { font-size: 17px; font-weight: 600; color: var(--text); }

  #engine-form label {
    display: flex;
    flex-direction: column;
    gap: 6px;
    font-size: 13px;
    color: var(--subtle);
  }

  #engine-form input[type="text"] {
    width: 100%;
    background: var(--bg);
    border: 1px solid var(--box-border);
    border-radius: 10px;
    padding: 9px 12px;
    font-size: 14px;
    color: var(--text);
    outline: none;
    font-family: inherit;
  }

  #engine-form input[type="text"]:focus { border-color: var(--subtle); }

  #engine-form input[type="color"] {
    width: 100%;
    height: 38px;
    border: 1px solid var(--box-border);
    border-radius: 10px;
    background: var(--bg);
    padding: 3px;
    cursor: pointer;
  }

  .ef-row { display: flex; gap: 12px; }
  .ef-row label { flex: 1; }

  #ef-msg { font-size: 12.5px; min-height: 16px; color: #e5484d; }
  #ef-msg.ok { color: #2f9e44; }

  .ef-actions { display: flex; justify-content: flex-end; gap: 10px; }

  .ef-actions button {
    border: 1px solid var(--box-border);
    background: transparent;
    color: var(--text);
    padding: 9px 18px;
    border-radius: 10px;
    font-size: 14px;
    cursor: pointer;
    font-family: inherit;
    transition: opacity .2s ease, background .2s ease;
  }

  .ef-actions button:hover { opacity: .85; }
  .ef-actions #ef-save { background: var(--btn-bg); color: var(--btn-text); border-color: transparent; }

  /* RTL（阿拉伯语 / 希伯来语）镜像适配 */
  html[dir="rtl"] .search-box { padding: 6px 22px 6px 8px; }
  html[dir="rtl"] #engine-btn { margin-left: 0; margin-right: -7px; }
  html[dir="rtl"] #engine-panel { left: auto; right: 0; }
  html[dir="rtl"] .engine-item .check { margin-left: 0; margin-right: auto; padding-left: 0; padding-right: 16px; }
  html[dir="rtl"] .engine-item .del { margin-left: 0; margin-right: 8px; }
  html[dir="rtl"] .ef-actions { justify-content: flex-start; }
  html[dir="rtl"] .sug-item { padding: 11px 22px; }

  #search-input {
    flex: 1;
    border: none;
    outline: none;
    background: transparent;
    color: var(--text);
    font-size: 16px;
    padding: 12px 14px;
  }

  #search-input::placeholder { color: var(--subtle); }

  #search-btn {
    border: none;
    outline: none;
    background: var(--btn-bg);
    color: var(--btn-text);
    width: 38px;
    height: 38px;
    border-radius: 50%;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    transition: opacity .2s ease, background .3s ease, color .3s ease;
  }

  #search-btn:hover { opacity: .85; }

  #search-btn svg {
    width: 16px;
    height: 16px;
    stroke: currentColor;
  }

  /* 联想下拉 */
  #suggest-panel {
    position: absolute;
    top: calc(100% + 8px);
    left: 0;
    right: 0;
    background: var(--box-bg);
    border: 1px solid var(--box-border);
    border-radius: 18px;
    overflow: hidden;
    box-shadow: 0 10px 32px rgba(0, 0, 0, .16);
    display: none;
    z-index: 10;
  }

  #suggest-panel.show { display: block; }

  .sug-item {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 11px 22px;
    font-size: 15px;
    cursor: pointer;
    color: var(--text);
  }

  .sug-item svg {
    width: 15px;
    height: 15px;
    fill: none;
    stroke: var(--subtle);
    stroke-width: 2;
    stroke-linecap: round;
    flex-shrink: 0;
  }

  .sug-item.active, .sug-item:hover { background: var(--btn-bg); color: var(--btn-text); }
  .sug-item.active svg, .sug-item:hover svg { stroke: var(--btn-text); }

  .sug-item b { font-weight: 600; }
</style>
</head>
<body>

  <div>
    <div id="clock">00:00</div>
    <div id="date"></div>
  </div>

  <div class="search-wrap">
    <form class="search-box" id="search-form">
      <button id="engine-btn" type="button" title="切换搜索引擎"></button>
      <input id="search-input" type="text" placeholder="搜索网页…" autocomplete="off" autofocus>
      <button id="search-btn" type="submit" title="搜索">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <line x1="5" y1="12" x2="19" y2="12"></line>
          <polyline points="12 5 19 12 12 19"></polyline>
        </svg>
      </button>
    </form>
    <div id="suggest-panel"></div>
    <div id="engine-panel"></div>
    <!-- 自定义搜索引擎表单 -->
    <div id="engine-form-mask">
      <form id="engine-form" autocomplete="off">
        <h3 id="engine-form-title">添加自定义搜索引擎</h3>
        <label><span class="ef-label" id="ef-label-name">名称</span><input id="ef-name" type="text" maxlength="24" placeholder="例如：知乎" required></label>
        <label><span class="ef-label" id="ef-label-url">搜索网址（用 %s 代表关键词）</span><input id="ef-url" type="text" maxlength="300" placeholder="https://www.zhihu.com/search?q=%s" required></label>
        <div class="ef-row">
          <label><span class="ef-label" id="ef-label-letter">图标字母</span><input id="ef-letter" type="text" maxlength="2" placeholder="知"></label>
          <label><span class="ef-label" id="ef-label-color">图标颜色</span><input id="ef-color" type="color" value="#5A6CF3"></label>
        </div>
        <p id="ef-msg"></p>
        <div class="ef-actions">
          <button type="button" id="ef-cancel">取消</button>
          <button type="submit" id="ef-save">保存</button>
        </div>
      </form>
    </div>
  </div>

  // 通用日期构造器：dateStyle 决定「日 月 年」还是「月 日, 年」等顺序

    if (dateStyle === 'ymd') return y + '年' + m + '月' + d + '日 · ' + wd;      // 中日韩
    if (dateStyle === 'dmy') return wd + ', ' + d + ' ' + months[m - 1] + ' ' + y; // 欧洲
    return wd + ', ' + months[m - 1] + ' ' + d + ', ' + y;                      // 美式
  };

  function normalizeLocale() {
    // 优先级：已保存偏好 > 浏览器语言列表 > 默认英文
    let saved = '';
    try { saved = localStorage.getItem('homepage.lang') || ''; } catch (err) {}
    const list = [saved, navigator.language]
      .concat(Array.isArray(navigator.languages) ? navigator.languages : [])
      .filter(Boolean);
    for (const raw of list) {
      // 取主语言子标签（避免 "zhx" 之类被误判为 "zh"）
      let l = String(raw).toLowerCase().split(/[-_]/)[0];
      if (l === 'zh') return 'zh';
      if (I18N[l]) return l;
    }
    return 'en'; // 未收录的语言回退英文
  }

  const LANG = normalizeLocale();
  const T = I18N[LANG] || I18N.en;

  /* ---------- 时钟 ---------- */
  const clockEl = document.getElementById('clock');
  const dateEl = document.getElementById('date');
  const weekDays = T.weekDays;

  function pad(n) { return String(n).padStart(2, '0'); }

  // HTML 转义：所有来自外部（百度联想词、用户自定义引擎名）的文本都须经此处理，
  // 否则 `<img onerror=...>` 之类会被注入 DOM 执行（XSS）
  function esc(s) {
    return String(s).replace(/[&<>"']/g, c => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
    }[c]));
  }

  function tick() {
    const now = new Date();
    clockEl.textContent = pad(now.getHours()) + ':' + pad(now.getMinutes());
    dateEl.textContent = T.dateFormat(now.getFullYear(), now.getMonth() + 1, now.getDate(), weekDays[now.getDay()]);
  }
  tick();
  setInterval(tick, 1000);

  /* ---------- 应用语言到静态文案 ---------- */
  document.documentElement.lang = T.htmlLang;
  document.documentElement.dir = T.dir || 'ltr'; // 阿拉伯语/希伯来语为从右到左
  document.title = T.title;

  /* ---------- 搜索 ---------- */
  const form = document.getElementById('search-form');
  const input = document.getElementById('search-input');
  const panel = document.getElementById('suggest-panel');
  input.placeholder = T.searchPlaceholder;
  document.getElementById('search-btn').setAttribute('title', T.searchTitle);

  /* ---------- 搜索引擎切换（点击搜索框左侧图标） ---------- */
  // name 从语言包取（T.engineNames），切换语言时自动跟随
  const engines = [
    { id: 'bing',   letter: 'B',  color: '#008373', url: 'https://www.bing.com/search?q=%s' },
    { id: 'baidu',  letter: '百', color: '#2932E1', url: 'https://www.baidu.com/s?wd=%s' },
    { id: 'google', letter: 'G',  color: '#4285F4', url: 'https://www.google.com/search?q=%s' },
    { id: 'sogou',  letter: '搜', color: '#FB6022', url: 'https://www.sogou.com/web?query=%s' },
    { id: 'so360',  letter: '3',  color: '#3DBB3D', url: 'https://www.so.com/s?q=%s' },
    { id: 'ddg',    letter: 'D',  color: '#DE5833', url: 'https://duckduckgo.com/?q=%s' }
  ];

  function engineName(id) {
    return (T.engineNames && T.engineNames[id]) || id;
  }

  /* ---------- 自定义搜索引擎（存 localStorage，与内置引擎合并） ---------- */
  const CUSTOM_KEY = 'homepage.customEngines';
  let customEngines = [];
  try {
    const raw = localStorage.getItem(CUSTOM_KEY);
    const parsed = raw ? JSON.parse(raw) : [];
    // 必须是数组，且每项含 id/name/url；同时做类型与长度收敛，防止脏数据破坏渲染
    if (Array.isArray(parsed)) {
      customEngines = parsed
        .filter(e => e && typeof e === 'object' && e.id && e.name && e.url)
        .map(e => ({
          // id 保留原值（避免失效已保存的 currentEngine），仅限制合法字符
          id: String(e.id).replace(/[^A-Za-z0-9_]/g, '').slice(0, 60),
          name: String(e.name).slice(0, 40),
          url: String(e.url).slice(0, 500),
          letter: e.letter ? String(e.letter).slice(0, 2) : '',
          color: /^#[0-9a-fA-F]{3,8}$/.test(e.color || '') ? e.color : '#5A6CF3'
        }))
        .filter(e => e.id) // 清洗后 id 可能为空，剔除
        // 归一化后可能存在重复 id，去重
        .filter((e, i, arr) => arr.findIndex(x => x.id === e.id) === i);
    }
  } catch (err) { customEngines = []; }

  function saveCustom() {
    try { localStorage.setItem(CUSTOM_KEY, JSON.stringify(customEngines)); } catch (err) {}
  }

  // 内置 + 自定义的完整列表
  function allEngines() { return engines.concat(customEngines); }

  function isCustom(id) { return customEngines.some(e => e.id === id); }

  const ENGINE_KEY = 'homepage.engine';
  let currentEngine = engines[0].id; // 默认必应
  try {
    const saved = localStorage.getItem(ENGINE_KEY);
    if (saved && allEngines().some(e => e.id === saved)) currentEngine = saved;
  } catch (err) { /* localStorage 不可用时忽略，用默认引擎 */ }

  const engineBtn = document.getElementById('engine-btn');
  const enginePanel = document.getElementById('engine-panel');

  function currentEngineObj() {
    return allEngines().find(e => e.id === currentEngine) || engines[0];
  }

  // 当前引擎显示名：自定义引擎用自己的名称，内置走语言包
  function currentEngineLabel() {
    const eng = currentEngineObj();
    return isCustom(eng.id) ? eng.name : engineName(eng.id);
  }

  function badgeHTML(eng) {
    // 内置引擎图标字母固定；自定义引擎可自定义字母（默认取名称首字）
    const letter = eng.letter || (eng.name ? eng.name.trim().charAt(0).toUpperCase() : '?');
    // 颜色做白名单校验，防止 style 注入
    const safeColor = /^#[0-9a-fA-F]{3,8}$/.test(eng.color || '') ? eng.color : '#5A6CF3';
    return '<span class="engine-badge" style="background:' + safeColor + '">' + esc(letter) + '</span>';
  }

  const MAG_SVG = '<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><line x1="16.5" y1="16.5" x2="21" y2="21"></line></svg>';

  function renderEngineBtn() {
    const eng = currentEngineObj();
    // 图标固定为放大镜，当前引擎由占位文字和悬停提示说明
    engineBtn.innerHTML = MAG_SVG;
    engineBtn.title = T.engineBtnTitle(currentEngineLabel());
    engineBtn.setAttribute('aria-label', T.engineBtnLabel);
    input.placeholder = T.searchWith(currentEngineLabel());
  }

  function closeEnginePanel() {
    enginePanel.classList.remove('show');
  }

  function renderEnginePanel() {
    const items = allEngines().map(e => {
      const custom = isCustom(e.id);
      const label = custom ? e.name : engineName(e.id);
      return '<div class="engine-item' + (e.id === currentEngine ? ' active' : '') + (custom ? ' custom' : '') + '" data-id="' + esc(e.id) + '">' +
        badgeHTML(e) + '<span>' + esc(label) + '</span>' +
        (custom ? '<span class="del" data-del="' + esc(e.id) + '" title="' + esc(T.btnDelete || '删除') + '">&times;</span>' : '') +
        '<span class="check">✓</span></div>';
    }).join('');
    // 底部添加入口
    const addLabel = T.addEngine || '添加自定义搜索引擎';
    enginePanel.innerHTML = items +
      '<div class="engine-add" id="engine-add"><span class="plus">+</span><span>' + esc(addLabel) + '</span></div>';
    enginePanel.classList.add('show');
  }

  engineBtn.addEventListener('mousedown', (e) => e.preventDefault()); // 防止输入框失焦
  engineBtn.addEventListener('click', (e) => {
    e.stopPropagation();
    if (enginePanel.classList.contains('show')) closeEnginePanel();
    else renderEnginePanel();
  });

  // 统一用一个指针入口，避免触摸设备上 pointerdown 与 mousedown 各触发一次（重复删除）
  // 注意：标志在一次交互结束后复位，否则会永久吞掉后续 mousedown
  let panelPrevPointerTs = 0;
  enginePanel.addEventListener('pointerdown', (e) => {
    panelPrevPointerTs = Date.now();
    onPanelPress(e);
  });
  enginePanel.addEventListener('mousedown', (e) => {
    // 与最近的 pointerdown 属同一次交互（现代浏览器会相继派发）→ 跳过，防重复
    if (Date.now() - panelPrevPointerTs < 800) return;
    onPanelPress(e);
  });

  // 触屏长按（删除按钮不易点时）也能删除
  let longPressTimer = null;
  let longPressFired = false;
  enginePanel.addEventListener('touchstart', (e) => {
    const item = e.target.closest('.engine-item.custom');
    if (!item || e.target.closest('.del')) return;
    longPressFired = false;
    longPressTimer = setTimeout(() => {
      longPressTimer = null;
      longPressFired = true;   // 标记已长按删除，抑制随后的 click 切换
      deleteEngine(item.dataset.id);
    }, 600);
  }, { passive: true });
  ['touchend', 'touchmove', 'touchcancel'].forEach(ev =>
    enginePanel.addEventListener(ev, () => { clearTimeout(longPressTimer); longPressTimer = null; }, { passive: true })
  );

  // 长按删除后，浏览器仍会补发 click —— 拦掉它，避免刚删除又去切换引擎
  enginePanel.addEventListener('click', (e) => {
    if (longPressFired) { e.preventDefault(); e.stopPropagation(); longPressFired = false; }
  }, true);

  function onPanelPress(e) {
    e.preventDefault(); // 保持输入框焦点
    // 删除自定义引擎
    const del = e.target.closest('.del');
    if (del) {
      deleteEngine(del.dataset.del);
      return;
    }
    // 打开添加表单
    if (e.target.closest('#engine-add')) {
      closeEnginePanel();
      openEngineForm();
      return;
    }
    const item = e.target.closest('.engine-item');
    if (!item) return;
    currentEngine = item.dataset.id;
    try { localStorage.setItem(ENGINE_KEY, currentEngine); } catch (err) {}
    renderEngineBtn();
    closeEnginePanel();
    input.focus();
  }

  // 删除某个自定义引擎（若正被使用则回退默认引擎）
  function deleteEngine(id) {
    customEngines = customEngines.filter(x => x.id !== id);
    saveCustom();
    if (currentEngine === id) {
      currentEngine = engines[0].id;
      try { localStorage.setItem(ENGINE_KEY, currentEngine); } catch (err) {}
      renderEngineBtn();
    }
    renderEnginePanel();
  }

  /* ---------- 自定义引擎表单 ---------- */
  const formMask = document.getElementById('engine-form-mask');
  const efName = document.getElementById('ef-name');
  const efUrl = document.getElementById('ef-url');
  const efLetter = document.getElementById('ef-letter');
  const efColor = document.getElementById('ef-color');
  const efMsg = document.getElementById('ef-msg');

  // 按当前语言填充表单文案（缺词条时回退英文）
  (function applyFormI18N() {
    const setText = (id, val) => { const el = document.getElementById(id); if (el && val) el.textContent = val; };
    setText('engine-form-title', T.formTitle || 'Add custom search engine');
    setText('ef-label-name', T.fieldName || 'Name');
    setText('ef-label-url', T.fieldUrl || 'Search URL (%s = keyword)');
    setText('ef-label-letter', T.fieldLetter || 'Icon letter');
    setText('ef-label-color', T.fieldColor || 'Icon color');
    setText('ef-cancel', T.btnCancel || 'Cancel');
    setText('ef-save', T.btnSave || 'Save');
    efName.placeholder = T.hintExample || '';
  })();

  function openEngineForm() {
    efMsg.textContent = '';
    efMsg.classList.remove('ok');
    formMask.classList.add('show');
    setTimeout(() => efName.focus(), 30);
  }

  function closeEngineForm() {
    formMask.classList.remove('show');
    document.getElementById('engine-form').reset();
    efColor.value = '#5A6CF3';
    efMsg.textContent = '';
    efMsg.classList.remove('ok');
  }

  // 校验错误提示也跟随语言（缺失时用英文兜底）
  const ERRS = {
    zh: { name: '请填写名称', url: '网址需以 http:// 或 https:// 开头', ph: '网址里需要用 %s 表示关键词位置', dup: '已有同名引擎，请换个名称' },
    en: { name: 'Please enter a name', url: 'URL must start with http:// or https://', ph: 'The URL must contain %s for the keyword', dup: 'An engine with this name already exists' }
  };
  const E = ERRS[LANG] || ERRS.en;

  document.getElementById('engine-form').addEventListener('submit', (e) => {
    e.preventDefault();
    const name = efName.value.trim();
    const url = efUrl.value.trim();
    if (!name) { efMsg.textContent = E.name; return; }
    if (!/^https?:\/\//i.test(url)) { efMsg.textContent = E.url; return; }
    if (url.indexOf('%s') < 0) { efMsg.textContent = E.ph; return; }
    // 名称去重：比对各语言下的所有名称（含内置引擎的多种译名）+ 已有自定义名，
    // 避免在中文界面下添加名为 "Bing" 的引擎而绕过检测
    const lower = name.toLowerCase();
    const dup = allEngines().some(x => {
      if (isCustom(x.id)) return (x.name || '').toLowerCase() === lower;
      // 内置引擎：检查它在所有语言包中的名字
      if (x.id.toLowerCase() === lower) return true;
      return Object.keys(I18N).some(lang => {
        const n = I18N[lang].engineNames && I18N[lang].engineNames[x.id];
        return n && n.toLowerCase() === lower;
      });
    });
    if (dup) { efMsg.textContent = E.dup; return; }

    const id = 'custom_' + Date.now().toString(36);
    const eng = { id: id, name: name, url: url, letter: efLetter.value.trim() || name.charAt(0).toUpperCase(), color: efColor.value };
    customEngines.push(eng);
    saveCustom();
    currentEngine = id; // 新增后直接启用
    try { localStorage.setItem(ENGINE_KEY, currentEngine); } catch (err) {}
    renderEngineBtn();
    closeEngineForm();
    input.focus();
  });

  document.getElementById('ef-cancel').addEventListener('click', closeEngineForm);
  formMask.addEventListener('mousedown', (e) => { if (e.target === formMask) closeEngineForm(); });
  // Esc 关闭表单（表单内任何位置生效）
  formMask.addEventListener('keydown', (e) => { if (e.key === 'Escape') { e.stopPropagation(); closeEngineForm(); } });

  renderEngineBtn();

  function search(q) {
    if (!q) return;
    const eng = currentEngineObj();
    // URL 中所有 %s 都替换为关键词（replaceAll 未兼容时用 split/join 兜底）
    const kw = encodeURIComponent(q);
    const tmpl = String(eng.url || '');
    const target = tmpl.indexOf('%s') < 0 ? tmpl : tmpl.split('%s').join(kw);
    window.location.href = target;
  }

  form.addEventListener('submit', (e) => {
    e.preventDefault();
    search(input.value.trim());
  });

  /* ---------- 实时联想（JSONP，避免跨域限制） ---------- */
  let sugTimer = null;
  let sugItems = [];       // 当前联想词
  let activeIdx = -1;      // 键盘高亮索引
  let jsonpSeq = 0;        // 防止旧请求覆盖新结果
  let lastQuery = '';

  function hideSuggest() {
    // 只隐藏面板，保留 sugItems 缓存，点击搜索框时可以直接恢复显示
    panel.classList.remove('show');
    panel.innerHTML = '';
    activeIdx = -1;
  }

  function renderSuggest() {
    if (!sugItems.length) { hideSuggest(); return; }
    const q = input.value.trim();
    panel.innerHTML = sugItems.map((s, i) => {
      // 先转义再插入高亮标签，避免联想词里的 HTML 被当作标签解析（XSS）
      let html;
      const safe = esc(s);
      if (q) {
        const idx = s.toLowerCase().indexOf(q.toLowerCase());
        if (idx >= 0) {
          // 在转义后的文本上按相同位置切分（esc 不改变原有字符的相对顺序，
          // 但会改变长度，故对三段分别转义后拼接更稳妥）
          html = esc(s.slice(0, idx)) + '<b>' + esc(s.slice(idx, idx + q.length)) + '</b>' + esc(s.slice(idx + q.length));
        } else {
          html = safe;
        }
      } else {
        html = safe;
      }
      return '<div class="sug-item" data-i="' + i + '">' +
        '<svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"></circle><line x1="16.5" y1="16.5" x2="21" y2="21"></line></svg>' +
        '<span>' + html + '</span></div>';
    }).join('');
    activeIdx = -1;
    panel.classList.add('show');
  }

  function setActive(i) {
    const items = panel.querySelectorAll('.sug-item');
    items.forEach(el => el.classList.remove('active'));
    activeIdx = i;
    if (i >= 0 && i < items.length) items[i].classList.add('active');
  }

  function fetchSuggest(q) {
    const seq = ++jsonpSeq;
    const cbName = '__sugCb' + seq; // 每个请求独立回调，避免并发互相污染
    const script = document.createElement('script');
    const timer = setTimeout(() => { delete window[cbName]; script.remove(); }, 3000);
    script.src = 'https://suggestion.baidu.com/su?wd=' + encodeURIComponent(q) + '&cb=' + cbName;
    script.onload = () => { clearTimeout(timer); delete window[cbName]; script.remove(); };
    script.onerror = () => { clearTimeout(timer); delete window[cbName]; script.remove(); hideSuggest(); };
    window[cbName] = function (data) {
      if (seq !== jsonpSeq) return; // 已有更新的请求，丢弃旧响应
      if (input.value.trim() !== q) return; // 输入框内容已变化（如已删空），丢弃过期响应
      // 兼容两种返回格式：{q:"..", p:false, s:[...]}（实测格式）和 [词, [...]]（旧格式）
      let arr = [];
      if (data && Array.isArray(data.s)) {
        arr = data.s;
      } else if (Array.isArray(data) && Array.isArray(data[1])) {
        arr = data[1];
      }
      sugItems = arr.filter(x => typeof x === 'string').slice(0, 8);
      renderSuggest();
    };
    document.body.appendChild(script);
  }

  input.addEventListener('focus', () => {
    // 点击搜索框时：有内容就恢复联想（优先用缓存，无缓存则重新请求）
    const q = input.value.trim();
    if (q) {
      if (sugItems.length) renderSuggest();
      else fetchSuggest(q);
    }
  });

  input.addEventListener('input', () => {
    const q = input.value.trim();
    if (!q) {
      // 清空输入：除了隐藏面板，还要作废“迟到”的联想来源，
      // 否则删空文字后，之前请求的结果回来会把面板重新弹出来（bug 修复）
      lastQuery = '';
      clearTimeout(sugTimer); // 取消还没发出的防抖请求
      jsonpSeq++;             // 作废所有在途响应
      hideSuggest();
      return;
    }
    if (q === lastQuery) { renderSuggest(); return; } // 同词重新聚焦/输入时直接恢复
    lastQuery = q;
    clearTimeout(sugTimer);
    sugTimer = setTimeout(() => fetchSuggest(q), 120); // 轻微防抖
  });

  input.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') { hideSuggest(); closeEnginePanel(); return; } // Esc 关闭所有弹层
    if (!panel.classList.contains('show')) return;
    if (e.key === 'ArrowDown') {
      e.preventDefault();
      setActive((activeIdx + 1) % sugItems.length);
    } else if (e.key === 'ArrowUp') {
      e.preventDefault();
      setActive((activeIdx - 1 + sugItems.length) % sugItems.length);
    } else if (e.key === 'Enter' && activeIdx >= 0) {
      e.preventDefault();
      search(sugItems[activeIdx]);
    }
  });

  panel.addEventListener('mousedown', (e) => {
    const item = e.target.closest('.sug-item');
    if (item) {
      e.preventDefault(); // 防止 input 失焦
      search(sugItems[+item.dataset.i]);
    }
  });

  document.addEventListener('click', (e) => {
    if (!e.target.closest('.search-wrap')) {
      hideSuggest();
      closeEnginePanel();
    }
  });
</script>
</body>
</html>
