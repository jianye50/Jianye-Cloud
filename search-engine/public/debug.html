<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>部署诊断</title>
<style>
  :root {
    --bg: #ffffff; --text: #1f1f1f; --subtle: #666666;
    --box-bg: #f3f3f3; --box-border: #e0e0e0;
    --ok: #1a7f37; --bad: #c62828;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1f1f1f; --text: #f3f3f3; --subtle: #9a9a9a;
      --box-bg: #2b2b2b; --box-border: #3a3a3a;
      --ok: #6ccc78; --bad: #ff8a80;
    }
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; padding: 40px 20px; }
  .wrap { max-width: 760px; margin: 0 auto; }
  h1 { font-size: 20px; font-weight: 600; margin-bottom: 6px; }
  .sub { color: var(--subtle); font-size: 13.5px; margin-bottom: 26px; }
  .row { display: flex; gap: 10px; align-items: baseline; padding: 12px 0; border-bottom: 1px solid var(--box-border); font-size: 14px; flex-wrap: wrap; }
  .row .k { width: 150px; color: var(--subtle); flex-shrink: 0; font-size: 13px; }
  .row .v { word-break: break-all; }
  .ok { color: var(--ok); font-weight: 600; }
  .bad { color: var(--bad); font-weight: 600; }
  pre { background: var(--box-bg); border: 1px solid var(--box-border); border-radius: 10px; padding: 14px; font-size: 12.5px; white-space: pre-wrap; word-break: break-all; margin-top: 18px; line-height: 1.7; }
  .tip { margin-top: 22px; font-size: 13.5px; color: var(--subtle); line-height: 1.9; }
  .tip code { background: var(--box-bg); padding: 1px 6px; border-radius: 6px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>部署诊断</h1>
  <div class="sub">检查 /api/search 后端是否就绪。部署完成后打开本页,全部「通过」即可正常搜索。</div>
  <div id="out"></div>
  <pre id="raw"></pre>
  <div class="tip">
    常见问题对照:<br>
    · <b>API 检查 = 404</b> → Functions 没部署:确认仓库根目录有 <code>functions/api/search.js</code>(与 public 平级),构建输出目录填 <code>public</code>,且不是用面板拖拽上传的。<br>
    · <b>API 检查 = 返回 HTML</b> → 路由被覆盖,<code>functions/</code> 路径不对。<br>
    · <b>网络错误</b> → 你在本地预览/file:// 打开,无后端,属正常;部署后再看本页。
  </div>
</div>
<script>
const out = document.getElementById('out');
const raw = document.getElementById('raw');
const rows = [];
function row(k, v, cls) { rows.push('<div class="row"><span class="k">' + k + '</span><span class="v ' + (cls || '') + '">' + v + '</span></div>'); }

(async () => {
  row('页面地址', location.href);
  row('协议', location.protocol, location.protocol === 'https:' ? 'ok' : 'bad');

  try {
    const res = await fetch('/api/search?q=__ping');
    const text = await res.text();
    row('API 状态码', res.status, res.ok ? 'ok' : 'bad');
    const isJson = text.trim().startsWith('{');
    row('API 返回类型', isJson ? 'JSON(正常)' : '非 JSON(异常:' + (text.trim().slice(0, 60) || '空') + '…)', isJson ? 'ok' : 'bad');
    raw.textContent = '--- /api/search?q=__ping 原始响应(前 600 字符) ---\n' + text.slice(0, 600);

    if (isJson) {
      // 再做一次真实搜索,确认上游引擎可达
      try {
        const r2 = await fetch('/api/search?q=cloudflare');
        const d2 = await r2.json();
        row('真实搜索测试', '返回 ' + (d2.results || []).length + ' 条结果,来源:' + (d2.engines || []).join(', ') || '无', (d2.results || []).length ? 'ok' : 'bad');
        raw.textContent += '\n\n--- /api/search?q=cloudflare ---\n' + JSON.stringify(d2, null, 2).slice(0, 900);
      } catch (e) {
        row('真实搜索测试', '失败:' + e, 'bad');
      }
    }
  } catch (e) {
    row('API 状态码', '网络错误(fetch 被拒绝)', 'bad');
    raw.textContent = 'error: ' + e;
  }

  out.innerHTML = rows.join('');
})();
</script>
</body>
</html>
