<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>鉴业音乐 · Jianye Cloud</title>
<link rel="icon" type="image/x-icon" href="icon.ico">
<link rel="shortcut icon" type="image/x-icon" href="icon.ico">
<link rel="apple-touch-icon" href="icon.ico">
<script>
/* 主题 / 壁纸提前落位，与主站 index.html 共用同一份 localStorage 设置，避免闪烁 */
(function(){
  var s={};
  try{ s=JSON.parse(localStorage.getItem('jy-settings')||'{}'); }catch(e){}
  var picked=false;
  try{ picked=localStorage.getItem('jy-theme-chosen')==='1'; }catch(e){}
  document.documentElement.dataset.theme=(picked&&s.theme)?s.theme:'clear';
  var DEFAULT_WP='1790351351975.jpg';   // 与主站一致：没选过背景时用默认壁纸
  var wp=(typeof s.wpImg==='string'&&s.wpImg)?s.wpImg:DEFAULT_WP;
  document.documentElement.style.setProperty('--wp-img','url("背景/'+encodeURIComponent(wp)+'")');
})();
</script>
<style>
/* ===================== 基础与主题变量（取自主站） ===================== */
:root{
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text",
          "PingFang SC", "HarmonyOS Sans SC", "Microsoft YaHei", "Segoe UI", sans-serif;
  --radius-lg: 24px;
  --radius-md: 18px;
  --scrim-overlay:linear-gradient(rgba(0,0,0,.32),rgba(0,0,0,.38));
}
html[data-theme="dark"]{
  --text-1:#ffffff;
  --text-2:rgba(242,242,245,.74);
  --text-3:rgba(235,235,240,.48);
  --card-bg:rgba(28,28,32,.56);
  --card-bg-strong:rgba(20,20,24,.76);
  --card-inner:rgba(0,0,0,.48);
  --card-inner-soft:rgba(255,255,255,.05);
  --card-border:rgba(255,255,255,.12);
  --card-border-hover:rgba(255,255,255,.28);
  --scrim:rgba(0,0,0,.62);
  --scrim-solid:rgba(14,14,17,.94);
  --shadow:0 18px 50px rgba(0,0,0,.5);
  --track:rgba(255,255,255,.14);
  --chip:rgba(255,255,255,.09);
  color-scheme:dark;
}
html[data-theme="light"]{
  --text-1:#18191c;
  --text-2:rgba(24,25,28,.68);
  --text-3:rgba(24,25,28,.45);
  --card-bg:rgba(255,255,255,.68);
  --card-bg-strong:rgba(255,255,255,.84);
  --card-inner:rgba(246,246,248,.88);
  --card-inner-soft:rgba(0,0,0,.05);
  --card-border:rgba(255,255,255,.75);
  --card-border-hover:rgba(255,255,255,.95);
  --scrim:rgba(0,0,0,.28);
  --scrim-solid:rgba(244,244,246,.94);
  --shadow:0 18px 50px rgba(0,0,0,.16);
  --track:rgba(0,0,0,.10);
  --chip:rgba(0,0,0,.06);
  color-scheme:light;
}
html[data-theme="clear"]{
  --text-1:#ffffff;
  --text-2:rgba(240,242,246,.78);
  --text-3:rgba(232,234,240,.55);
  --card-bg:transparent;
  --card-bg-strong:rgba(255,255,255,.04);
  --card-inner:rgba(255,255,255,.045);
  --card-inner-soft:rgba(255,255,255,.06);
  --card-border:rgba(255,255,255,.24);
  --card-border-hover:rgba(255,255,255,.48);
  --scrim:rgba(0,0,0,.34);
  --scrim-solid:rgba(10,10,13,.55);
  --shadow:0 18px 50px rgba(0,0,0,.26);
  --track:rgba(255,255,255,.16);
  --chip:rgba(255,255,255,.10);
  color-scheme:dark;
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  font-family:var(--font);
  color:var(--text-1);
  min-height:100vh;
  -webkit-font-smoothing:antialiased;
  overflow:hidden;
}
button{font-family:inherit;color:inherit;border:none;background:none;cursor:pointer}
img{display:block;max-width:100%}
::selection{background:rgba(77,141,255,.4)}

/* ===================== 背景（与主站一致：壁纸 + 压暗层） ===================== */
html[data-theme="dark"],html[data-theme="clear"]{background:#0a0a0c}
html[data-theme="light"]{background:#f2f2f4}
.bg{position:fixed;inset:0;z-index:-2;overflow:hidden}
.bg-wp{
  position:absolute;inset:0;
  background-image:var(--wp-img,none);
  background-size:cover;background-position:center;background-repeat:no-repeat;
  transition:opacity .5s ease;
}
.bg-wp::after{
  content:"";position:absolute;inset:0;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.82' numOctaves='4' stitchTiles='stitch'/><feColorMatrix type='saturate' values='0'/></filter><rect width='160' height='160' filter='url(%23n)' opacity='0.055'/></svg>"),var(--scrim-overlay);
  background-size:160px 160px,cover;
  background-repeat:repeat,no-repeat;
  background-position:0 0,center;
}

/* ===================== 弹窗窗口（常驻打开，承载音乐 App） ===================== */
.scrim{
  position:fixed;inset:0;z-index:80;display:flex;
  background:var(--scrim);
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  align-items:center;justify-content:center;padding:28px 18px;
}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.window{
  width:100%;max-width:720px;max-height:86vh;
  border-radius:26px;overflow:hidden;display:flex;flex-direction:column;
  background:var(--card-bg-strong);
  backdrop-filter:blur(40px) saturate(180%);
  -webkit-backdrop-filter:blur(40px) saturate(180%);
  border:1px solid var(--card-border);
  box-shadow:0 40px 100px rgba(0,0,0,.5);
  animation:winIn .32s cubic-bezier(.2,.8,.25,1);
}
@keyframes winIn{from{opacity:0;transform:translateY(18px) scale(.965)}to{opacity:1;transform:none}}
.win-hd{
  display:flex;align-items:center;gap:14px;padding:18px 22px;
  border-bottom:1px solid var(--card-border);flex:none;
}
.win-hd h3{font-size:18px;font-weight:650}
.win-hd p{font-size:12.5px;color:var(--text-2);margin-top:2px}
.win-ic{width:38px;height:38px;border-radius:12px;flex:none;display:grid;place-items:center;
  background:linear-gradient(160deg,#ff6a8e,#f02e5e);box-shadow:0 4px 13px rgba(240,46,94,.34)}
.win-ic svg{width:20px;height:20px;color:#fff}
/* 头部右侧「返回主页」外链按钮 */
.win-ext{margin-left:auto;display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 14px;
  border-radius:999px;font-size:12.5px;font-weight:600;font-family:inherit;color:var(--text-2);
  background:var(--chip);border:1px solid var(--card-border);text-decoration:none;transition:.2s}
.win-ext:hover{background:var(--card-border-hover);color:var(--text-1);border-color:var(--card-border-hover)}
.win-ext svg{width:13px;height:13px;flex:none}
.win-body{padding:22px 24px 26px;overflow-y:auto}
.win-body::-webkit-scrollbar{width:8px}
.win-body::-webkit-scrollbar-thumb{background:var(--track);border-radius:4px}

/* Toast */
.toast{
  position:fixed;left:50%;bottom:34px;transform:translateX(-50%) translateY(20px);
  background:var(--scrim-solid);color:#fff;font-size:13.5px;padding:12px 22px;
  border-radius:999px;border:1px solid var(--card-border);
  box-shadow:var(--shadow);z-index:120;opacity:0;pointer-events:none;
  transition:.3s cubic-bezier(.2,.8,.2,1);display:flex;align-items:center;gap:8px;
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.toast svg{width:16px;height:16px;color:#30d158}
html[data-theme="clear"] .toast{background:rgba(10,18,44,.32);color:#fff}

/* ===================== 鉴业音乐 · 播放器 ===================== */
/* 宽屏：左右分栏 —— 左侧歌单列表，右侧播放卡片 + 歌词（各自滚动） */
.window.music{max-width:1040px;height:min(760px,92vh)}
.window.music .win-body{display:flex;overflow:hidden;padding:16px 18px}
.mus-wrap{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:16px}
.mus-lists{min-height:0;overflow-y:auto;padding:2px 8px 4px 2px}
.mus-lists::-webkit-scrollbar{width:8px}
.mus-lists::-webkit-scrollbar-thumb{background:var(--track);border-radius:4px}
.mus-now{display:flex;flex-direction:column;gap:12px;min-height:0}

.player{
  position:sticky;top:0;z-index:6;flex:none;margin:0;padding:15px 16px 13px;border-radius:20px;
  background:linear-gradient(150deg,rgba(255,106,142,.17),rgba(240,46,94,.07));
  border:1px solid rgba(255,106,142,.28);
  backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
}
.pl-now{display:flex;align-items:center;gap:13px}
.pl-cover{width:52px;height:52px;border-radius:14px;flex:none;display:grid;place-items:center;
  position:relative;overflow:hidden;background:linear-gradient(150deg,#ff6a8e,#c01e52);
  box-shadow:0 5px 16px rgba(240,46,94,.36)}
.pl-cover img{width:100%;height:100%;object-fit:cover;display:block}
.pl-cover svg{width:23px;height:23px;color:#fff}
.pl-cover.playing::after{content:'';position:absolute;left:0;right:0;bottom:0;height:3px;
  background:rgba(255,255,255,.9);animation:plscan 2.4s linear infinite}
@keyframes plscan{0%{transform:translateX(-100%)}100%{transform:translateX(100%)}}
.pl-info{flex:1;min-width:0}
.pl-info h5{font-size:14.5px;font-weight:640;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pl-info p{font-size:11.5px;color:var(--text-3);margin-top:3px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pl-ctrls{display:flex;align-items:center;gap:3px;flex:none}
.pl-btn{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;
  color:var(--text-1);transition:.18s;flex:none}
.pl-btn:hover{background:var(--chip)}
.pl-btn:active{transform:scale(.9)}
.pl-btn svg{width:18px;height:18px}
.pl-btn.on{color:#ff6a8e}
.pl-play{width:42px;height:42px;background:linear-gradient(150deg,#ff6a8e,#f02e5e);color:#fff;
  box-shadow:0 4px 13px rgba(240,46,94,.42)}
.pl-play:hover{transform:scale(1.07);background:linear-gradient(150deg,#ff6a8e,#f02e5e)}
.pl-play svg{width:19px;height:19px}
.pl-bar-wrap{display:flex;align-items:center;gap:11px;margin-top:12px}
.pl-time{font-size:11px;color:var(--text-3);font-variant-numeric:tabular-nums;flex:none;
  min-width:82px;letter-spacing:.2px}
.pl-bar{--p:0%;height:5px;border-radius:3px;background:var(--track);flex:1;cursor:pointer;
  position:relative;touch-action:none}
.pl-bar i{display:block;height:100%;width:var(--p);border-radius:3px;
  background:linear-gradient(90deg,#ff6a8e,#f02e5e);pointer-events:none}
.pl-bar::after{content:'';position:absolute;top:50%;left:var(--p);width:11px;height:11px;
  border-radius:50%;background:#fff;box-shadow:0 1px 5px rgba(0,0,0,.45);
  transform:translate(-50%,-50%);opacity:0;transition:opacity .18s;pointer-events:none}
.pl-bar:hover::after,.pl-bar.drag::after{opacity:1}
.pl-extra{display:flex;align-items:center;gap:10px;margin-top:9px;min-height:20px}
.pl-vol{display:flex;align-items:center;gap:7px;flex:none;width:150px}
.pl-vol>svg{width:15px;height:15px;color:var(--text-3);flex:none;cursor:pointer;transition:.18s}
.pl-vol>svg:hover{color:var(--text-1)}
.pl-vol input{-webkit-appearance:none;appearance:none;flex:1;height:4px;border-radius:2px;
  background:var(--track);outline:none;cursor:pointer;margin:0}
.pl-vol input::-webkit-slider-thumb{-webkit-appearance:none;width:11px;height:11px;border-radius:50%;
  background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.45)}
.pl-vol input::-moz-range-thumb{width:11px;height:11px;border:0;border-radius:50%;background:#fff;
  box-shadow:0 1px 4px rgba(0,0,0,.45)}
.pl-vol-btn{width:22px;height:22px;flex:none;display:grid;place-items:center;color:var(--text-3);transition:.18s}
.pl-vol-btn:hover{color:var(--text-1)}
.pl-vol-btn svg{width:15px;height:15px}
.pl-line{flex:1;min-width:0;font-size:12px;color:var(--text-3);text-align:right;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transition:.2s}
.pl-line.has{color:rgba(255,106,142,.85)}

/* 歌词面板：position:relative 是歌词滚动居中的关键（offsetTop 基准），
   上下大 padding 让首尾行也能滚到正中 */
.mus-lrc{position:relative;flex:1;min-height:110px;overflow-y:auto;margin:0;padding:34% 6px;
  border-radius:16px;background:var(--card-inner);text-align:center;scroll-behavior:smooth}
.mus-lrc p{font-size:13.5px;line-height:2.05;color:var(--text-3);padding:0 10px;transition:.25s}
.mus-lrc p.on{color:#ff6a8e;font-weight:640;font-size:15px}
.mus-lrc p.tr{font-size:11.5px;line-height:1.7;opacity:.7;margin-top:-4px}
.mus-lrc::-webkit-scrollbar{width:5px}
.mus-lrc::-webkit-scrollbar-thumb{background:var(--track);border-radius:3px}
.mus-lrc-note{font-size:11px;color:var(--text-3);text-align:center;padding:2px 0 10px}

/* 播放页返回 / 下载按钮 */
.pl-dl{display:grid}
.pl-back{display:none;width:36px;height:36px;border-radius:50%;place-items:center;
  color:var(--text-1);background:var(--chip);transition:.18s}
.pl-back:active{transform:scale(.92)}
.pl-back svg{width:19px;height:19px}
.pl-btn.busy{animation:spin .8s linear infinite}

/* 手机端：单列布局，播放页做成全屏浮层（列表和播放界面分开） */
@media(max-width:759px){
  .scrim{padding:12px 10px}
  .window.music{height:94vh}
  .window.music .win-body{display:block;overflow-y:auto;padding:14px 14px 20px}
  .mus-wrap{display:flex;flex-direction:column;gap:12px}
  .mus-now{order:-1}
  .mus-now>.mus-lrc{display:none!important}
  .pl-info{cursor:pointer}
  .mus-now .pl-mode,.mus-now .pl-lrcbtn{display:none}
  .mus-wrap.fs .pl-mode,.mus-wrap.fs .pl-lrcbtn{display:grid}
  .mus-now .pl-lrcbtn{display:none!important}
  .mus-wrap.fs .pl-dl{display:none}
  .mus-tabs button em{display:none}
  .mus-now .pl-cover{width:46px;height:46px;border-radius:12px}
  .mus-now .pl-btn{width:32px;height:32px}
  .mus-now .pl-play{width:38px;height:38px}
  .mus-now .pl-now{gap:10px}
  /* 全屏播放页：同一套 DOM，用 .fs 切换成沉浸式排版 */
  .window.music:has(.mus-wrap.fs) .win-hd{display:none}
  .window.music:has(.mus-wrap.fs) .win-body{flex:1;height:auto}
  .mus-wrap.fs .mus-lists{display:none}
  .mus-wrap.fs .mus-now{position:fixed;inset:0;z-index:95;border-radius:0;gap:8px;overflow:hidden;
    background:var(--card-bg-strong);
    backdrop-filter:blur(40px) saturate(180%);-webkit-backdrop-filter:blur(40px) saturate(180%);
    padding:14px 20px calc(20px + env(safe-area-inset-bottom,0px))}
  .mus-wrap.fs .player{position:static;background:none;border:none;
    backdrop-filter:none;-webkit-backdrop-filter:none;padding:0}
  .mus-wrap.fs .pl-back{display:grid;position:absolute;top:14px;left:14px;z-index:2}
  .mus-wrap.fs .pl-now{flex-direction:column;text-align:center;gap:16px;padding-top:32px}
  .mus-wrap.fs .pl-cover{width:min(56vw,220px);height:min(56vw,220px);border-radius:28px;margin:0 auto}
  .mus-wrap.fs .pl-info{width:100%}
  .mus-wrap.fs .pl-info h5{font-size:18px}
  .mus-wrap.fs .pl-info p{font-size:12.5px}
  .mus-wrap.fs .pl-ctrls{gap:8px}
  .mus-wrap.fs .pl-btn{width:40px;height:40px}
  .mus-wrap.fs .pl-btn svg{width:21px;height:21px}
  .mus-wrap.fs .pl-play{width:56px;height:56px}
  .mus-wrap.fs .pl-play svg{width:25px;height:25px}
  .mus-wrap.fs .pl-bar-wrap{margin-top:14px}
  .mus-wrap.fs .pl-extra{display:none}
  .mus-wrap.fs .mus-lrc{display:block!important;flex:1;min-height:0;margin-top:6px}
  .mus-wrap.fs .mus-lrc p{font-size:15px;line-height:2.1}
  .mus-wrap.fs .mus-lrc p.on{font-size:17px}
}
@media(min-width:760px){
  .pl-back{display:none!important}
  .mus-now .pl-now{flex-wrap:wrap;row-gap:8px}
  .mus-now .pl-ctrls{width:100%;justify-content:center;gap:10px}
  .mus-now .pl-btn{width:32px;height:32px}
  .mus-now .pl-play{width:42px;height:42px}
}

/* 标签页 */
.mus-tabs{display:flex;gap:5px;margin-bottom:12px;padding:4px;border-radius:13px;background:var(--card-inner-soft)}
.mus-tabs button{flex:1;padding:8px 4px;border-radius:10px;font-size:13px;color:var(--text-2);
  transition:.18s;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mus-tabs button:hover{color:var(--text-1)}
.mus-tabs button.on{background:linear-gradient(150deg,#ff6a8e,#f02e5e);color:#fff;font-weight:620;
  box-shadow:0 3px 10px rgba(240,46,94,.32)}
.mus-tabs button em{font-style:normal;opacity:.72;font-size:11.5px;margin-left:3px}
@media (max-width:560px){
  .mus-tabs{gap:3px}
  .mus-tabs button{font-size:12px;padding:8px 2px}
  .mus-tabs button em{font-size:10.5px;margin-left:2px}
}

/* 在线搜索框 */
.mus-search{position:relative;display:flex;align-items:center;gap:8px;margin-bottom:12px}
.mus-search .ms-ic{position:absolute;left:13px;width:16px;height:16px;color:var(--text-3);pointer-events:none}
.mus-search input{flex:1;min-width:0;padding:11px 13px 11px 37px;border-radius:12px;
  background:var(--card-inner);border:1px solid transparent;color:var(--text-1);
  font-family:inherit;font-size:13.5px;outline:none;transition:.2s}
.mus-search input::placeholder{color:var(--text-3)}
.mus-search input:focus{border-color:rgba(255,106,142,.6);background:var(--chip)}
.mus-search .mus-go{flex:none;padding:11px 16px;border-radius:12px;font-size:13.5px;font-weight:600;
  color:#fff;background:linear-gradient(150deg,#ff6a8e,#f02e5e);transition:.18s;
  box-shadow:0 3px 10px rgba(240,46,94,.3)}
.mus-search .mus-go:hover{transform:translateY(-1px)}
.mus-search .mus-go:disabled{opacity:.55;transform:none;cursor:default}
.mus-hint{font-size:12px;color:var(--text-3);margin-top:12px;text-align:center;line-height:1.7}
.mus-err{font-size:12.5px;color:#ff6a8e;text-align:center;padding:14px 6px;line-height:1.7}

/* 酷狗歌单页 */
.kg-head{display:flex;align-items:center;gap:12px;margin-bottom:12px;padding:12px 13px;border-radius:15px;
  background:linear-gradient(150deg,rgba(255,106,142,.16),rgba(240,46,94,.07));
  border:1px solid rgba(255,106,142,.26)}
.kg-ic{width:42px;height:42px;border-radius:12px;flex:none;display:grid;place-items:center;
  background:linear-gradient(150deg,#ff6a8e,#c01e52);box-shadow:0 4px 13px rgba(240,46,94,.3)}
.kg-ic svg{width:21px;height:21px;color:#fff}
.kg-tx{flex:1;min-width:0}
.kg-tx h6{font-size:14px;font-weight:640;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kg-tx p{font-size:11.5px;color:var(--text-3);margin-top:3px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kg-all{flex:none;padding:9px 13px;border-radius:11px;font-size:12.5px;font-weight:600;color:#fff;
  background:linear-gradient(150deg,#ff6a8e,#f02e5e);box-shadow:0 3px 10px rgba(240,46,94,.32);
  transition:.18s}
.kg-all:hover{transform:translateY(-1px)}
.kg-all:disabled{opacity:.5;transform:none;cursor:default}
.kg-ref{flex:none;width:34px;height:34px;border-radius:11px;display:grid;place-items:center;
  color:var(--text-2);background:var(--card-inner-soft);transition:.18s}
.kg-ref:hover{color:var(--text-1);background:var(--chip)}
.kg-ref svg{width:15px;height:15px}
.kg-ref.spinning{color:#ff6a8e}
.kg-ref.spinning svg{animation:kgspin .9s linear infinite}
@keyframes kgspin{to{transform:rotate(360deg)}}
.kg-tx p.cloud{color:#1D9E75}
.kg-tx p.loading{color:#BA7517}
.mus-more{display:block;width:100%;margin-top:10px;padding:11px;border-radius:12px;font-size:13px;
  color:var(--text-2);background:var(--card-inner-soft);transition:.18s}
.mus-more:hover{color:var(--text-1);background:var(--chip)}

/* 目录文件清单：优先读本地服务器的目录列表；
   静态托管（Cloudflare Pages / GitHub Pages 等）没有目录列表时，回退到 GitHub API 列目录 */
const GH_REPO='jianye50/Jianye-Cloud';
const GH_BRANCH='main';
async function listDirFiles(dir,regex){
  const clean=dir.replace(/\/+$/,'');
  try{
    const base=new URL(encodeURIComponent(clean)+'/',location.href);
    const res=await fetch(base.href);
    if(res.ok){
      const html=await res.text();
      const doc=new DOMParser().parseFromString(html,'text/html');
      const urls=new Set();
      doc.querySelectorAll('a[href]').forEach(a=>{
        let h=a.getAttribute('href');
        if(!h)return;
        h=h.split('#')[0];
        if(!regex.test(h.split('?')[0]))return;
        urls.add(new URL(h,base.href).href);
      });
      if(urls.size)return Array.from(urls);
    }
  }catch(e){}
  try{
    const r=await fetch(`https://api.github.com/repos/${GH_REPO}/contents/${encodeURIComponent(clean)}?ref=${GH_BRANCH}`,
      {headers:{Accept:'application/vnd.github+json'}});
    if(!r.ok)return null;
    const arr=await r.json();
    const base=new URL(encodeURIComponent(clean)+'/',location.href);
    return arr.filter(x=>x.type==='file'&&regex.test(x.name))
      .map(x=>new URL(encodeURIComponent(x.name),base).href);
  }catch(e){ return null; }
}

/* ========================= 播放器核心 ========================= */
const SVG_PLAY='<svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5.5v13a1 1 0 0 0 1.5.87l11-6.5a1 1 0 0 0 0-1.74l-11-6.5A1 1 0 0 0 8 5.5z"/></svg>';

const SVG_VOL_ON='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6.5 9H3v6h3.5L11 19z"/><path d="M15.6 9.2a4 4 0 0 1 0 5.6"/><path d="M18.4 6.5a8 8 0 0 1 0 11"/></svg>';

const MODE_TIP=['列表循环','单曲循环','随机播放'];
const MODE_ICON=[

  '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M17 2.5l3.5 3.5L17 9.5"/><path d="M3.5 11.5v-1a4 4 0 0 1 4-4h13"/><path d="M7 21.5 3.5 18 7 14.5"/><path d="M20.5 12.5v1a4 4 0 0 1-4 4h-13"/><text x="12" y="15.4" font-size="8.5" font-family="sans-serif" font-weight="700" fill="currentColor" stroke="none" text-anchor="middle">1</text></svg>',
  '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M16 3.5h5v5"/><path d="M21 3.5 3.5 21"/><path d="M21 15.5v5h-5"/><path d="m14.5 14.5 6.5 6"/><path d="M3.5 3.5 9 9"/></svg>'
];

const gAudio=new Audio();
gAudio.preload='metadata';
let queue=[];            // 当前播放队列（本地 / 在线 / 酷狗 / 我的歌单）
let gCur=-1;             // queue 中的下标
let gMode=0;             // 0 列表循环 1 单曲循环 2 随机
let gLyric=[], gLyricIdx=-1, gLyricNote='';
let gLrcOpen=false, gLrcAuto=false, gLrcUserToggled=false;
let gFsOpen=false;       // 手机端全屏播放页
let gMutedVol=0.85;
let gFail=0;             // 连续取不到播放地址的次数

const fmtT=t=>{ if(!isFinite(t)||t<0)return '--:--'; t=Math.floor(t); return Math.floor(t/60)+':'+String(t%60).padStart(2,'0'); };
const curTrack=()=> (gCur>=0&&gCur<queue.length)?queue[gCur]:null;

/* ---------------- 在线音乐接口（GD 音乐台） ----------------
   search / url / pic / lyric 四个端点，免费公开；官方建议稳定源为 netease。
   注意：接口有频率限制（5 分钟 50 次），所以统一走 gdFetch 串行限流 + 会话内缓存。 */
const GD_API='https://music-api.gdstudio.xyz/api.php';
const GD_SRC='netease';
const gdCache=new Map();
let gdChain=Promise.resolve(), gdLastAt=0;
function gdFetch(qs){
  const run=async()=>{
    const wait=160-(Date.now()-gdLastAt);
    if(wait>0)await new Promise(r=>setTimeout(r,wait));
    gdLastAt=Date.now();
    const res=await fetch(GD_API+'?'+qs);
    if(!res.ok)throw new Error('接口返回 HTTP '+res.status);
    const j=await res.json();
    if(j&&j.detail)throw new Error(j.detail);
    return j;
  };
  gdChain=gdChain.then(run,run);
  return gdChain;
}
async function gdSearch(kw,page){
  const key='q|'+kw+'|'+(page||1);
  if(gdCache.has(key))return gdCache.get(key);
  const j=await gdFetch('types=search&source='+GD_SRC+'&name='+encodeURIComponent(kw)+'&count=20&pages='+(page||1));
  const list=Array.isArray(j)?j:[];
  gdCache.set(key,list);
  return list;
}
async function gdPic(picId){
  const key='p|'+picId;
  if(gdCache.has(key))return gdCache.get(key);
  const j=await gdFetch('types=pic&source='+GD_SRC+'&id='+encodeURIComponent(picId)+'&size=500');
  const url=(j&&j.url)||'';
  gdCache.set(key,url);
  return url;
}
async function gdUrl(id,br){
  const j=await gdFetch('types=url&source='+GD_SRC+'&id='+encodeURIComponent(id)+'&br='+(br||320));
  return (j&&j.url)||'';
}
async function gdLyric(id){
  const key='l|'+id;
  if(gdCache.has(key))return gdCache.get(key);
  let j={};
  try{ j=(await gdFetch('types=lyric&source='+GD_SRC+'&id='+encodeURIComponent(id)))||{}; }catch(e){ j={}; }
  const o={lrc:(j&&j.lyric)||'',tr:(j&&j.tlyric)||''};
  gdCache.set(key,o);
  return o;
}
/* 接口返回的一条结果 → 站内统一曲目对象 */
function normOnline(x){
  return {
    online:true,
    id:'nc:'+x.id,
    ncId:String(x.id),
    name:x.name||'(未知曲目)',
    artist:Array.isArray(x.artist)?x.artist.join(' / '):(x.artist||''),
    album:x.album||'',
    picId:x.pic_id||'',
    lyricId:String(x.lyric_id||x.id),
    cover:'',
    src:''
  };

/* ---------------- 歌词 ---------------- */
function parseLrc(txt){
  const out=[];
  if(!txt)return out;
  txt.split(/\r?\n/).forEach(line=>{
    const m=line.match(/^\[(\d{1,3}):(\d{1,2})(?:[.:](\d{1,3}))?\](.*)$/);
    if(!m)return;
    const ms=(+m[1])*60000+(+m[2])*1000+(m[3]?+String(m[3]).padEnd(3,'0').slice(0,3):0);
    const s=m[4].trim();
    if(s)out.push({t:ms,s:s,tr:''});
  });
  return out.sort((a,b)=>a.t-b.t);
}
/* 把原词与中文翻译按时间轴对齐 */
function mergeLrc(main,tr){
  const list=parseLrc(main), tlist=parseLrc(tr);
  if(list.length&&tlist.length){
    list.forEach(o=>{
      let best=null,bd=1e9;
      tlist.forEach(x=>{ const d=Math.abs(x.t-o.t); if(d<bd){bd=d;best=x;} });
      if(best&&bd<=420)o.tr=best.s;
    });
  }
  return list;
}
function setLyric(o,note){
  gLyric=mergeLrc(o&&o.lrc,o&&o.tr);
  gLyricNote=gLyric.length?note:'';
  gLyricIdx=-1;
  if(gLyric.length&&!gLrcUserToggled&&!gLrcAuto){ gLrcAuto=true; gLrcOpen=true; }
  renderLyricPanel(); updateLyricLine();
}
function clearLyric(note){
  gLyric=[]; gLyricIdx=-1; gLyricNote=note||'';
  renderLyricPanel(); updateLyricLine();
}
function lrcShown(){ return gLrcOpen||gFsOpen; }
/* 把当前行滚到面板竖直居中（.mus-lrc 有 position:relative，offsetTop 才以面板为基准） */
function centerLrc(){

    +(o.tr?'<p class="tr">'+esc(o.tr)+'</p>':'')
  ).join('')+'<div class="mus-lrc-note">'+esc(gLyricNote)+'</div>';
  centerLrc();
}
function updateLyricLine(){
  const el=$('#plLine'); if(!el)return;
  const cur=gLyricIdx>=0?gLyric[gLyricIdx]:null;

function seekLyric(ms){
  if(!gLyric.length)return;
  let i=-1;
  for(let k=0;k<gLyric.length;k++){ if(gLyric[k].t<=ms+140)i=k; else break; }
  if(i===gLyricIdx)return;
  gLyricIdx=i;
  updateLyricLine();
  const box=$('#musLrc');
  if(!box||!gLrcOpen)return;
  const old=box.querySelector('p.on'); if(old)old.classList.remove('on');
  const el=box.querySelector('p[data-li="'+i+'"]');
  if(el){ el.classList.add('on'); box.scrollTop=Math.max(0,el.offsetTop-box.clientHeight/2+el.offsetHeight/2); }

const isMobileMus=()=>window.matchMedia('(max-width:759px)').matches;
function loadLyric(t){
  clearLyric('');
  if(!t)return;
  if(t.online){
    gLyricNote='正在获取歌词…'; renderLyricPanel();
    gdLyric(t.lyricId||t.ncId).then(o=>{
      if(curTrack()!==t)return;
      if(o.lrc)setLyric(o,'网易云歌词'); else clearLyric('这首歌没有歌词');
    }).catch(()=>{ if(curTrack()===t)clearLyric('歌词获取失败，稍后再试'); });
    return;
  }
  // 本地文件没有内嵌歌词，按文件名去网易云找同名曲目匹配一份
  const key='m|'+t.name;
  if(gdCache.has(key)){
    const o=gdCache.get(key);
    if(o)setLyric(o,'网易云匹配歌词'); else clearLyric('没有匹配到歌词');
    return;
  }
  const kw=t.name.replace(/^\s*\d+\s*[.\-_、]?\s*/,'').replace(/[\[\(（][^\]\)）]*[\]\)）]/g,'').trim();
  if(!kw){ clearLyric('没有匹配到歌词'); return; }
  gLyricNote='正在匹配歌词…'; renderLyricPanel();
  gdSearch(kw,1).then(list=>{
    const clean=s=>String(s||'').toLowerCase().replace(/[\s\-_·,，.。!！?？'"]/g,'');
    const hit=list.find(x=>clean(x.name)===clean(kw))||list.find(x=>clean(x.name).indexOf(clean(kw))>=0)||list[0];
    if(!hit)throw new Error('no match');
    return gdLyric(hit.lyric_id||hit.id).then(o=>{
      if(!o.lrc)throw new Error('empty');
      gdCache.set(key,o);
      if(curTrack()!==t)return;
      setLyric(o,'网易云匹配歌词 · '+(Array.isArray(hit.artist)?hit.artist.join('/'):(hit.artist||'')));
    });
  }).catch(()=>{ gdCache.set(key,null); if(curTrack()===t)clearLyric('没有匹配到歌词'); });
}

async function playTrack(list,idx,autoplay,kind){
  if(!list||!list.length||idx<0||idx>=list.length)return;
  if(kind)gQueueKind=kind;
  queue=list.slice();
  await loadAndPlay(idx,autoplay!==false);
}
async function loadAndPlay(i,autoplay){
  if(i<0||i>=queue.length)return;
  gCur=i;
  const t=queue[i];
  if(!t)return;
  if(gRestoreTid&&t.id!==gRestoreTid){ gRestorePos=null; gRestoreTid=''; }
  highlightRows();
  const ti=$('#plTitle'); if(ti)ti.textContent=t.name+' · 解析中…';
  // 取不到播放地址时自动跳过，连续失败的次数太多就停下（避免整张列表连环请求接口）
  const fail=(msg)=>{
    gFail++;
    if(gFail>=4){ gFail=0; toast('连续几首都取不到播放地址，过一会儿再试'); syncMusicUI(); return; }
    toast(msg);
    skip(1);
  };
  // 在线歌曲的播放地址是带时间戳的签名链接，会过期，所以超过 5 分钟就重新取
  const URL_TTL=5*60*1000;
  // 酷狗歌单 / 导入的歌单只带了「歌名+歌手」，先解析出对应的网易云曲目再走在线播放
  if(t.online&&!t.ncId){
    const ok=await kgResolve(t);
    if(!ok){ fail('《'+esc(t.name)+'》在网易云没找到对应歌曲，自动跳过'); return; }
  }
  if(t.online&&(!t.src||!t.srcAt||Date.now()-t.srcAt>URL_TTL)){
    try{
      const url=await gdUrl(t.ncId,320);
      if(!url)throw new Error('empty');
      t.src=url; t.srcAt=Date.now();
    }catch(e){
      fail('《'+esc(t.name)+'》暂时取不到播放地址，自动跳过');
      return;
    }
  }
  if(!t.src){ fail('《'+esc(t.name)+'》没有可播放的地址，自动跳过'); return; }
  gFail=0;
  resolveCover(t);
  loadLyric(t);
  gAudio.src=t.src;
  gLoadedId=t.id;
  if(autoplay!==false)gAudio.play().catch(()=>toast('浏览器阻止了自动播放，再点一次'));
  syncMusicUI();
  saveMusicState();
}
function playNext(){ return skip(1); }

  if(!queue.length)return;

function skip(step){
  if(!queue.length)return;
  if(gMode===2&&queue.length>1){
    let n; do{ n=(Math.random()*queue.length)|0; }while(n===gCur);
    return loadAndPlay(n,true);
  }
  return loadAndPlay((gCur+step+queue.length)%queue.length,true);
}

/* ---------------- 我的歌单 · 导入 / 导出 ----------------
   导出的 JSON 可以再导回来（无损，带网易云 id）；TXT 是「歌名 - 歌手」一行一首，
   方便喂给别的播放器。导入时两种都认，另外也认 m3u 播放列表。 */
function qKey(name,artist){ return String(name||'').trim().toLowerCase()+'|'+String(artist||'').trim().toLowerCase(); }
function mineFileName(ext){
  const d=new Date(), p=n=>String(n).padStart(2,'0');
  return '鉴业音乐-我的歌单-'+d.getFullYear()+p(d.getMonth()+1)+p(d.getDate())+'.'+ext;
}
function saveTextFile(name,text,mime){
  try{
    const blob=new Blob([text],{type:(mime||'text/plain')+';charset=utf-8'});
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a');
    a.href=url; a.download=name;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),1500);
  }catch(e){ toast('导出失败，浏览器不允许下载'); return false; }
  return true;
}
function exportMineJson(){
  if(!myList.length){ toast('「我的歌单」还是空的，没什么可导出'); return; }
  const data={app:'鉴业音乐',type:'mylist',version:1,exportedAt:new Date().toISOString(),
    count:myList.length,
    songs:myList.map(t=>({name:t.name,artist:t.artist||'',album:t.album||'',
      ncId:t.ncId||'',picId:t.picId||'',lyricId:t.lyricId||'',cover:t.cover||''}))};
  if(saveTextFile(mineFileName('json'),JSON.stringify(data,null,2),'application/json'))
    toast('已导出 '+myList.length+' 首（JSON）');
}
function parseMineFile(fname,text){
  let raw=String(text||'').replace(/^\ufeff/,'');
  const ext=String(fname||'').split('.').pop().toLowerCase();
  const looksJson=ext==='json'||/^[\[{]/.test(raw.trim());
  if(looksJson){
    let d=null;
    try{ d=JSON.parse(raw); }catch(e){ d=null; }
    if(d){
      const arr=Array.isArray(d)?d:(Array.isArray(d.songs)?d.songs:(Array.isArray(d.list)?d.list:[]));
      return arr.map(mineNormTrack).filter(Boolean);
    }
  }
  const out=[];
  raw.split(/\r?\n/).forEach(line=>{
    let s=line.trim();
    if(!s||/^#EXTM3U$/i.test(s))return;
    if(/^#EXTINF/i.test(s)){
      const c=s.indexOf(',');
      if(c<0)return;
      s=s.slice(c+1).trim();
      if(!s)return;
    }else if(s.charAt(0)==='#')return;
    if(/\.(mp3|flac|m4a|aac|wav|ape|ogg|wma|opus|mp4|mkv)$/i.test(s)){
      s=s.replace(/\.(mp3|flac|m4a|aac|wav|ape|ogg|wma|opus|mp4|mkv)$/i,'');
      if(/[\\/]/.test(s))s=s.split(/[\\/]/).pop();
    }
    s=s.replace(/^\s*\d{1,3}\s*[.\-_、]\s*/,'').trim();
    if(!s)return;
    const parts=s.split(/\s+-\s+|\s+–\s+|\s+—\s+|\s*\|\s*|\t+/).map(x=>x.trim()).filter(Boolean);
    const t=mineNormTrack({name:parts[0],artist:parts.slice(1).join(' / ')});
    if(t)out.push(t);
  });
  return out;
}
function mineNormTrack(x){
  if(!x)return null;
  if(typeof x==='string')x={name:x};
  const name=String(x.name||x.title||x.song||x.songName||'').trim();
  if(!name)return null;
  const artist=x.artist!==undefined?x.artist:(x.singer!==undefined?x.singer:'');
  const artistStr=Array.isArray(artist)?artist.join(' / '):String(artist||'').trim();
  const ncId=x.ncId||x.ncid||x.nId||'';
  const t={online:true,id:'',ncId:'',name,artist:artistStr,
    album:String(x.album||'').trim(),cover:String(x.cover||x.pic||'')||'',src:''};
  if(ncId){
    t.ncId=String(ncId);
    t.id='nc:'+t.ncId;
    t.picId=String(x.picId||x.picId_||'');
    t.lyricId=String(x.lyricId||t.ncId);
  }else{
    t.q=true;
    t.id='q:'+qKey(name,artistStr);
  }
  return t;
}
async function mineImportFiles(files){
  const list=[...files].filter(Boolean);
  if(!list.length)return;
  let added=0, dup=0, pending=0, bad=0;
  for(const f of list){
    let txt='';
    try{ txt=await f.text(); }catch(e){ bad++; continue; }
    let songs=[];
    try{ songs=parseMineFile(f.name,txt); }catch(e){ songs=[]; }
    if(!songs.length){ bad++; continue; }
    const seen=new Set();
    songs.forEach(s=>{
      if(seen.has(s.id)){ dup++; return; }
      seen.add(s.id);
      if(myList.some(x=>x.id===s.id)){ dup++; return; }
      myList.push(s); added++;
      if(s.q)pending++;
    });
  }
  if(added){ saveMyList(); renderMusShell(true); }
  const bits=['新增 '+added+' 首'];
  if(dup)bits.push('跳过重复 '+dup+' 首');
  if(bad)bits.push(bad+' 个文件没读出内容');
  toast('导入完成：'+bits.join(' · '));
  if(pending)setTimeout(()=>toast(pending+' 首只带了歌名，播放时会自动匹配网易云'),1800);
}

/* ---------------- 酷狗歌单 ----------------
   数据来源有两层，优先云端、读不到就退回内置快照：
   ① 云端 /api/kg —— 由 Cloudflare 的边缘节点替网页去读酷狗「我喜欢的音乐」
      （酷狗接口没开放跨域，浏览器直接请求会被拦）。云端自己缓存 30 分钟。
   ② 内置 kugou-playlist.js —— 抓好的快照，云端不可用时兜底。
   酷狗只提供「歌名 + 歌手」，播放时按「歌名 歌手」去网易云搜一次，
   命中第一条后复用在线播放的那套链路（取地址 / 封面 / 歌词）。 */
let kgMeta=null, kgSongs=[], kgQ='', kgLimit=80;
let kgCloud='';      // '' 未尝试 / 'loading' 拉取中 / 'ok' 来自云端 / 'fail' 云端不可用
function kgApply(d,cloud){
  if(!d||!Array.isArray(d.songs)||!d.songs.length)return false;
  const prev=new Map(kgSongs.map(t=>[t.id,t]));
  kgMeta={name:d.name||'我的酷狗歌单',src:d.src||'酷狗音乐',
          count:d.songs.length,updated:d.updated||'',cloud:!!cloud};
  kgSongs=d.songs.map(line=>{
    const i=line.indexOf('|');
    const t=(i<0?line:line.slice(0,i)).trim();
    const a=(i<0?'':line.slice(i+1)).trim();
    const id='kg:'+t+'|'+a;
    const o=prev.get(id);
    return {online:true,kg:true,id:id,name:t,artist:a,album:(o&&o.album)||'',
            cover:(o&&o.cover)||'',src:(o&&o.src)||'',ncId:(o&&o.ncId)||'',
            picId:(o&&o.picId)||'',lyricId:(o&&o.lyricId)||'',kgFail:(o&&o.kgFail)||0};
  }).filter(t=>t.name);
  return true;
}
function kgLoad(){
  if(!kgApply(window.KUGOU_PLAYLIST,false)){ kgMeta=null; kgSongs=[]; }
}
kgLoad();
/* 刷新酷狗页渲染，但保住搜索框的焦点和光标（云端数据到达时会重绘一次） */
function kgSafeRender(){
  if(currentApp!=='music'||musTab!=='kg')return;
  const ae=document.activeElement;
  const typing=ae&&ae.id==='kgSearch';
  const pos=typing?ae.selectionStart:null;
  renderMusShell(true);
  if(typing){
    const el=document.getElementById('kgSearch');
    if(el){ el.focus(); if(pos!=null){ try{ el.setSelectionRange(pos,pos); }catch(e){} } }
  }
}
async function kgCloudRefresh(manual){
  if(kgCloud==='loading')return;
  const proto=location.protocol;
  if(proto!=='http:'&&proto!=='https:'){ kgCloud='fail'; return; }  // 直接双击 html 打开时没有接口
  kgCloud='loading';
  kgSafeRender();
  try{
    const r=await fetch('/api/kg'+(manual?'?refresh=1':''),{cache:'no-store'});
    if(!r.ok)throw new Error('HTTP '+r.status);
    const d=await r.json();
    if(!d||!d.ok||!Array.isArray(d.songs)||!d.songs.length)throw new Error((d&&d.error)||'云端返回异常');
    kgApply(d,true);
    kgCloud='ok';
    if(manual)toast('已从云端同步 '+kgSongs.length+' 首');
  }catch(e){
    kgCloud='fail';
    if(manual)toast('云端没读到（'+((e&&e.message)||'未知原因')+'），先用内置歌单');
  }
  kgSafeRender();
}

/* ---------------- 播放状态记忆 ----------------
   记住上次播放的歌、播放队列、进度、循环模式、所在标签页。
   在线曲目的播放地址是带时间戳的签名链接会过期，所以不存 src，下次播放时重新取。 */
const STATE_KEY='jy-music-state';
let gQueueKind='';        // 当前队列来源：local / online / kg / mine
let gLoadedId='';         // 当前挂进 <audio> 的曲目 id
let gRestorePos=null;     // 待恢复的播放进度（秒）
let gRestoreTid='';       // 待恢复的曲目 id
let gStateAt=0;           // 上次落盘时间
let gRestoreSt=null, gRestoreTried=false;

function saveMusicState(){
  try{
    const base={tab:musTab,mode:gMode,kgQ:kgQ,vol:gAudio.volume,at:Date.now()};
    if(!queue.length||gCur<0||gCur>=queue.length){
      localStorage.setItem(STATE_KEY,JSON.stringify(base));
      return;
    }
    const t=queue[gCur];
    base.cur=gCur;
    base.pos=Math.round(gAudio.currentTime||0);
    base.kind=gQueueKind||'local';
    base.ids=queue.map(x=>x.id);
    if(base.kind==='online')base.tracks=queue.slice(0,30);
    base.track={id:t.id,name:t.name,artist:t.artist,album:t.album||'',ncId:t.ncId||'',
                picId:t.picId||'',lyricId:t.lyricId||'',cover:t.cover||'',
                src:t.online?'':(t.src||'')};
    localStorage.setItem(STATE_KEY,JSON.stringify(base));
  }catch(e){}
}
function rebuildQueue(st){
  if(!st||!st.kind)return null;
  if(st.kind==='online')return Array.isArray(st.tracks)&&st.tracks.length?st.tracks.map(x=>Object.assign({},x)):null;
  if(!Array.isArray(st.ids)||!st.ids.length)return null;
  const pool=st.kind==='local'?songs:st.kind==='mine'?myList:st.kind==='kg'?kgSongs:null;
  if(!pool||!pool.length)return null;
  const map=new Map(pool.map(x=>[x.id,x]));
  return st.ids.map(id=>map.get(id)).filter(Boolean);
}
function restoreMusicState(){
  if(gRestoreTried&&!gRestoreSt)return;
  let st=gRestoreSt;
  if(!st){
    try{ st=JSON.parse(localStorage.getItem(STATE_KEY)||'null'); }catch(e){ st=null; }
  }
  if(!st||typeof st!=='object'){ gRestoreTried=true; return; }
  if(typeof st.mode==='number'&&st.mode>=0&&st.mode<=2)gMode=st.mode;
  if(st.tab&&['kg','local','online','mine'].indexOf(st.tab)>=0)musTab=st.tab;
  if(typeof st.kgQ==='string')kgQ=st.kgQ;
  if(!st.track||!st.kind){ gRestoreTried=true; return; }
  if(st.kind==='local'&&!songs.length&&musicStatus==='loading'){ gRestoreSt=st; return; }
  const list=rebuildQueue(st);
  if(!list||!list.length){ gRestoreSt=null; gRestoreTried=true; return; }
  let idx=list.findIndex(x=>x.id===st.track.id);
  if(idx<0)idx=Math.min(Math.max(st.cur||0,0),list.length-1);
  queue=list; gCur=idx; gQueueKind=st.kind;
  const t=queue[idx];
  ['ncId','picId','lyricId','album','cover'].forEach(k=>{ if(!t[k]&&st.track[k])t[k]=st.track[k]; });
  if(!t.artist&&st.track.artist)t.artist=st.track.artist;
  if(!t.online&&st.track.src)t.src=st.track.src;
  resolveCover(t);
  gRestorePos=st.pos>3?st.pos:null; gRestoreTid=t.id;
  gRestoreSt=null; gRestoreTried=true;
  if(!t.online&&t.src){ gAudio.src=t.src; gLoadedId=t.id; try{ gAudio.load(); }catch(e){} }
  syncMusicUI(); updateLyricLine();
}
try{ window.addEventListener('pagehide',saveMusicState); }catch(e){}
window.addEventListener('load',()=>{ try{ restoreMusicState(); }catch(e){ console.warn('restore music state failed',e); } });
window.addEventListener('load',()=>{ setTimeout(()=>{ try{ kgCloudRefresh(false); }catch(e){} },600); });

/* 解析：把一条只有「歌名+歌手」的曲目对应到网易云曲目，
   成功返回 true（结果缓存在曲目对象上，不重复请求）。失败后 10 分钟内不再重试。 */
async function kgResolve(t){
  if(!t)return false;
  if(t.ncId)return true;
  if(t.kgFail&&Date.now()-t.kgFail<10*60*1000)return false;
  try{
    const hit=await gdSearch((t.name+' '+(t.artist||'')).trim(),1);
    if(!hit||!hit.length)throw new Error('no match');
    const o=normOnline(hit[0]);
    t.ncId=o.ncId; t.picId=o.picId; t.lyricId=o.lyricId; t.album=o.album||'';
    if(!t.artist)t.artist=o.artist;
    t.kgFail=0;
    if(myList.some(x=>x.id===t.id))saveMyList();
    return true;
  }catch(e){ t.kgFail=Date.now(); return false; }
}

  return (kgMeta.cloud?'云端实时读取 · ':(kgCloud==='fail'?'云端暂时读不到，先用内置快照 · ':''))

/* 在线搜索：点封面图标时按需补全前 8 条结果，避免浪费接口配额 */
function hydrateCovers(){
  if(currentApp!=='music'||musTab!=='online'||!onlineRes.length)return;
  const rows=[].slice.call($$('#musPane .song-i[data-kind="online"]')).slice(0,8);
  let i=0;
  const step=()=>{
    if(i>=rows.length)return;
    const row=rows[i++];
    const t=onlineRes[+row.dataset.idx];
    if(!t||t.cover||!t.picId)return step();
    gdPic(t.picId).then(u=>{
      if(!u)return;
      t.cover=u;
      const ic=row.querySelector('.song-ic');
      if(ic&&!ic.querySelector('img'))ic.innerHTML='<img src="'+esc(u)+'" loading="lazy" alt="">';
      if(curTrack()&&curTrack().id===t.id)syncCover();
    }).catch(()=>{}).finally(step);
  };
  step();
}
async function doSearch(kw){
  kw=String(kw||'').trim();
  if(!kw){ toast('先输入歌名或歌手'); return; }
  if(onlineBusy)return;
  onlineQ=kw; onlineBusy=true; onlineErr='';
  renderMusShell(true);
  const inp=$('#musQ'); if(inp)inp.focus();
  try{
    const list=await gdSearch(kw,1);
    onlineRes=Array.isArray(list)?list.map(normOnline):[];
    if(!onlineRes.length)onlineErr='没有搜到「'+kw+'」，换个关键词试试';
  }catch(e){
    onlineRes=[];
    onlineErr='搜索失败：'+((e&&e.message)||'网络异常')+'。接口偶尔会限流，等几秒再试一次就好。';
  }
  onlineBusy=false;
  renderMusShell(true);
  hydrateCovers();
}

/* ---------------- 事件绑定（由 renderMusShell 在每次重绘后调用） ---------------- */
function musBind(){
  $$('.mus-tabs button').forEach(b=>b.onclick=()=>{
    if(musTab===b.dataset.mtab){
      const q=musTab==='online'?$('#musQ'):musTab==='kg'?$('#kgSearch'):$('#musicSearch');
      if(q)q.focus();
      return;
    }
    musTab=b.dataset.mtab;
    saveMusicState();
    renderMusShell(false);
    if(musTab==='online'){ const q=$('#musQ'); if(q)q.focus(); hydrateCovers(); }
  });
  const pb=$('#plPlay');  if(pb)pb.onclick=togglePlay;
  const pv=$('#plPrev');  if(pv)pv.onclick=playPrev;
  const nx=$('#plNext');  if(nx)nx.onclick=playNext;
  const md=$('#plMode');  if(md)md.onclick=()=>{ gMode=(gMode+1)%3; syncMusicUI(); saveMusicState(); toast('播放模式：'+MODE_TIP[gMode]); };
  const lr=$('#plLrc');   if(lr)lr.onclick=()=>{
    if(isMobileMus()){ setFs(!gFsOpen); return; }
    gLrcOpen=!gLrcOpen; gLrcUserToggled=true; renderLyricPanel(); updateLyricLine();
  };
  const dl=$('#plDl'); if(dl)dl.onclick=downloadCur;
  const mi=$('#mineImport');    if(mi)mi.onclick=mineImportPick;
  const mf=$('#mineFile');      if(mf)mf.onchange=()=>mineImportFiles(mf.files);
  const mj=$('#mineExport');    if(mj)mj.onclick=exportMineJson;
  const bk=$('#plCollapse'); if(bk)bk.onclick=()=>setFs(false);
  const nf=$('#musPlayer .pl-info');
  if(nf)nf.onclick=()=>{ if(isMobileMus())setFs(true); };
  const cv=$('#plCover');
  if(cv)cv.onclick=()=>{ if(isMobileMus())setFs(true); };
  const vr=$('#plVol');   if(vr)vr.oninput=()=>setVol(vr.value/100);
  const vi=$('#plVolIc'); if(vi)vi.onclick=()=>{ if(gAudio.volume>0){ gMutedVol=gAudio.volume; setVol(0); } else setVol(gMutedVol||0.85); };
  applyVolUI();

  const bar=$('#plBar');
  if(bar){
    const pos=e=>{ const r=bar.getBoundingClientRect(); return Math.min(Math.max((e.clientX-r.left)/r.width,0),1); };
    const paint=pnt=>{
      bar.style.setProperty('--p',(pnt*100)+'%');
      const pt=$('#plTime'); if(pt&&isFinite(gAudio.duration))pt.textContent=fmtT(pnt*gAudio.duration)+' / '+fmtT(gAudio.duration);
    };
    bar.addEventListener('pointerdown',e=>{
      if(!isFinite(gAudio.duration)||!gAudio.duration)return;
      bar.classList.add('drag'); try{ bar.setPointerCapture(e.pointerId); }catch(x){}
      paint(pos(e));
    });
    bar.addEventListener('pointermove',e=>{ if(bar.classList.contains('drag'))paint(pos(e)); });
    const end=e=>{
      if(!bar.classList.contains('drag'))return;
      bar.classList.remove('drag');
      if(isFinite(gAudio.duration)&&gAudio.duration){ try{ gAudio.currentTime=pos(e)*gAudio.duration; }catch(x){} }
    };
    bar.addEventListener('pointerup',end);
    bar.addEventListener('pointercancel',()=>bar.classList.remove('drag'));
  }

  const pane=$('#musPane');
  if(pane)pane.onclick=e=>{
    if(e.target.closest('#kgMore')){ kgLimit+=160; renderMusShell(true); return; }
    const act=e.target.closest('[data-act]');
    if(act){
      e.stopPropagation(); e.preventDefault();
      const row=act.closest('.song-i'); if(!row)return;
      const idx=+row.dataset.idx, kind=row.dataset.kind;
      if(kind==='mine'){
        const t=myList[idx]; if(!t)return;
        myList.splice(idx,1); saveMyList(); toast('已移出「我的歌单」');
        renderMusShell(true);
        return;
      }
      if(kind==='kg'){
        const t=kgView()[idx]; if(!t)return;
        if(myList.some(x=>x.id===t.id)){
          myList=myList.filter(x=>x.id!==t.id); saveMyList(); toast('已移出「我的歌单」');
          renderMusShell(true);
          return;
        }
        if(t.ncId){ addToMine(t); toast('已加入「我的歌单」'); renderMusShell(true); return; }
        toast('正在解析《'+t.name+'》…');
        kgResolve(t).then(ok=>{
          if(!ok){ toast('《'+t.name+'》在网易云没找到，换个版本试试'); return; }
          addToMine(t); toast('已加入「我的歌单」');
          if(musTab==='kg'&&currentApp==='music')renderMusShell(true);
        });
        return;
      }
      const t=onlineRes[idx]; if(!t)return;
      const at=myList.findIndex(x=>x.id===t.id);
      if(at>=0){ myList.splice(at,1); saveMyList(); toast('已移出「我的歌单」'); }
      else{ addToMine(t); toast('已加入「我的歌单」'); }
      renderMusShell(true);
      return;
    }
    const main=e.target.closest('.song-main');
    if(!main)return;
    const row=main.closest('.song-i'); if(!row)return;
    playRow(row.dataset.kind,+row.dataset.idx);
  };

  if(musTab==='kg'){
    const kinp=$('#kgSearch');
    if(kinp){
      kinp.oninput=()=>kgSearchApply(false);
      kinp.onkeydown=e=>{
        if(e.key==='Escape'&&kinp.value){ e.stopPropagation(); kinp.value=''; kgSearchApply(false); return; }
        if(e.key==='Enter'){ e.preventDefault(); const f=$('#kgList .song-main'); if(f)f.click(); }
      };
      const kclr=$('#kgSearchClear');
      if(kclr)kclr.onclick=()=>{ kinp.value=''; kgSearchApply(true); };
    }
    const kall=$('#kgPlayAll');
    if(kall)kall.onclick=()=>{
      const v=kgView();
      if(!v.length){ toast('没有可播放的歌曲'); return; }
      playTrack(v,0,true,'kg');
    };
    const kref=$('#kgRefresh');
    if(kref)kref.onclick=()=>kgCloudRefresh(true);
  }

  bindDlgSearch();
  const q=$('#musQ');
  if(q){
    const go=()=>doSearch(q.value);
    const gb=$('#musGo'); if(gb)gb.onclick=go;
    q.onkeydown=e=>{ if(e.key==='Enter'){ e.preventDefault(); go(); } };
  }
  renderLyricPanel();
  updateLyricLine();
  highlightRows();
}

/* ---------------- 本地歌单快捷搜索 ---------------- */
let gMusicQ='';   // 记住关键词：重渲染后（如播放状态刷新）不丢失
function hlMatch(txt,q){
  if(!q)return esc(txt);
  const i=txt.toLowerCase().indexOf(q.toLowerCase());
  if(i<0)return esc(txt);
  return esc(txt.slice(0,i))+'<mark>'+esc(txt.slice(i,i+q.length))+'</mark>'+esc(txt.slice(i+q.length));
}
function musicSearchApply(focus){
  const inp=$('#musicSearch');
  if(!inp){
    // 不在「本地歌单」页时，把快捷键落到当前页的搜索框上
    const q=musTab==='kg'?$('#kgSearch'):$('#musQ');
    if(q&&focus===true)q.focus();
    return;
  }
  if(focus)inp.focus();
  const q=inp.value.trim();
  let n=0;
  $$('#musPane .song-i[data-kind="local"]').forEach(b=>{
    const s=songs[+b.dataset.idx];if(!s)return;
    const hit=!q||s.name.toLowerCase().includes(q.toLowerCase());
    b.style.display=hit?'':'none';
    const nm=b.querySelector('.song-name');if(nm)nm.innerHTML=hlMatch(s.name,q);
    if(hit)n++;
  });
  const wrap=inp.closest('.dlg-search');if(wrap)wrap.classList.toggle('has-q',!!q);
  const c=$('#musicCount');
  if(c)c.textContent=q?(n?'匹配 '+n+' / '+songs.length+' 首 · 回车播放第一首':'没有匹配的歌曲'):('来自「音乐」文件夹 · 共 '+songs.length+' 首');
}
/* 搜索框：实时过滤 + 回车播放第一首 + Esc 清空 + 清空按钮 */
function bindDlgSearch(){
  const inp=$('#musicSearch');
  if(!inp)return;
  inp.value=gMusicQ; if(gMusicQ)musicSearchApply();
  inp.oninput=()=>{ gMusicQ=inp.value; musicSearchApply(); };
  inp.onkeydown=e=>{
    if(e.key==='Escape'){
      if(inp.value){e.stopPropagation();inp.value='';gMusicQ='';musicSearchApply();}
      return;
    }
    if(e.key==='Enter'){
      const first=[...$$('#musPane .song-i')].find(b=>b.style.display!=='none');
      if(first)first.querySelector('.song-main').click();
    }
  };
  const clr=$('#musicSearchClear');
  if(clr)clr.onclick=()=>{ inp.value='';gMusicQ='';musicSearchApply();inp.focus(); };
}
/* 快捷键：按 “/” 或 Ctrl/Cmd+K 直达搜索框；Esc 收起手机端全屏播放页 */
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'&&gFsOpen){ setFs(false); return; }
  const typing=/^(INPUT|TEXTAREA)$/.test((document.activeElement||{}).tagName||'');
  if(e.key==='/'&&!typing)e.preventDefault(),musicSearchApply(true);
  else if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k')e.preventDefault(),musicSearchApply(true);
});

/* ---------------- 扫描「音乐」文件夹 ---------------- */
async function loadMusic(){
  const urls=await listDirFiles(MUSIC_DIR,AUDIO_RE);
  if(urls){
    songs=urls.map(normLocal).sort((a,b)=>a.name.localeCompare(b.name,'zh-Hans-CN',{numeric:true}));
    musicStatus='ready';
  }else{
    musicStatus='error'; songs=[];
  }
  restoreMusicState();   // 本地文件扫完了，如果上次放的是本地歌，这时才能重建队列
  renderMusShell(true);
}

/* ---------------- 启动 ---------------- */
renderMusShell(false);
loadMusic();
</script>
