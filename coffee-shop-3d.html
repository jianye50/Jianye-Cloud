<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>鉴业的咖啡店 · 3D</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { width:100%; height:100%; overflow:hidden; font-family:"PingFang SC","Microsoft YaHei",sans-serif; background:#0a1428; }
  #app { position:fixed; inset:0; }
  canvas { display:block; }

  /* ---------- 顶部品牌 ---------- */
  #topbar {
    position:fixed; top:20px; left:50%; transform:translateX(-50%); z-index:10;
    display:flex; align-items:center; gap:10px; color:#e8eef7; pointer-events:none;
    text-shadow:0 2px 10px rgba(0,0,0,.6);
  }
  #topbar .mark {
    width:30px; height:30px; border-radius:9px; background:linear-gradient(145deg,#22705a,#153f34);
    display:flex; align-items:center; justify-content:center; font-size:15px;
    box-shadow:0 4px 14px rgba(0,0,0,.4);
  }
  #topbar .name { font-size:15px; font-weight:700; letter-spacing:1px; }
  #topbar .slogan { font-size:9px; letter-spacing:3.5px; color:#9db1c9; margin-top:2px; }

  /* ---------- 控制面板 ---------- */
  #panel {
    position:fixed; top:18px; left:18px; width:238px; z-index:10;
    background:linear-gradient(160deg, rgba(16,24,40,.92), rgba(10,16,30,.88));
    backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px);
    border:1px solid rgba(255,255,255,.09); border-radius:16px;
    color:#dfe7f2; padding:16px 16px 14px; user-select:none;
    box-shadow:0 12px 40px rgba(0,0,0,.5), inset 0 1px 0 rgba(255,255,255,.06);
  }
  #panel .brand { display:flex; align-items:center; gap:9px; }
  #panel .logo { width:34px; height:34px; border-radius:10px; background:linear-gradient(145deg,#22705a,#153f34);
    display:flex; align-items:center; justify-content:center; font-size:16px; box-shadow:0 3px 10px rgba(0,0,0,.35); }
  #panel .brand b { font-size:14px; letter-spacing:.5px; display:block; }
  #panel .brand small { color:#8298b4; font-size:9px; letter-spacing:2px; display:block; margin-top:2px; }
  #clockRow { display:flex; align-items:baseline; gap:8px; margin:12px 0 2px; }
  #clock { font-size:36px; font-weight:700; letter-spacing:1px; font-variant-numeric:tabular-nums;
    background:linear-gradient(180deg,#ffffff,#a8c0e0); -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent; }
  #clockLabel { font-size:11px; color:#8fa3bd; margin-bottom:10px; }
  .divider { height:1px; background:linear-gradient(90deg,transparent,rgba(255,255,255,.12),transparent); margin:11px 0; }
  .sec { font-size:10px; color:#7c92ad; letter-spacing:2px; margin:0 0 7px; display:flex; justify-content:space-between; }
  .sec span { color:#a9bcd4; letter-spacing:0; }
  input[type=range] { width:100%; height:4px; -webkit-appearance:none; appearance:none; border-radius:2px;
    background:linear-gradient(90deg,#3b82d6 var(--fill,50%),#243250 var(--fill,50%)); outline:none; cursor:pointer; }
  input[type=range]::-webkit-slider-thumb { -webkit-appearance:none; width:15px; height:15px; border-radius:50%;
    background:#fff; cursor:pointer; border:3px solid #3b82d6; box-shadow:0 2px 8px rgba(0,0,0,.4); transition:.15s; }
  input[type=range]::-webkit-slider-thumb:hover { transform:scale(1.15); }
  .btnrow { display:flex; gap:6px; }
  .wbtn, .vbtn {
    flex:1; padding:8px 0; text-align:center; font-size:12px;
    background:rgba(255,255,255,.05); color:#c6d3e6; border:1px solid rgba(255,255,255,.08);
    border-radius:10px; cursor:pointer; transition:.18s; position:relative; overflow:hidden;
  }
  .wbtn:hover, .vbtn:hover { background:rgba(255,255,255,.1); transform:translateY(-1px); }
  .wbtn.active { background:linear-gradient(145deg,#3273d8,#2456a8); color:#fff; border-color:rgba(120,170,255,.5);
    box-shadow:0 4px 14px rgba(50,110,220,.35); }
  .vbtn.active { background:linear-gradient(145deg,#1f6e56,#14473a); color:#fff; border-color:rgba(80,200,160,.4);
    box-shadow:0 4px 14px rgba(30,110,86,.35); }
  .switchrow { display:flex; gap:8px; margin-top:10px; }
  .toggle {
    flex:1; padding:9px 0; text-align:center; font-size:12px; border-radius:10px; cursor:pointer; font-weight:600;
    background:linear-gradient(145deg,#3273d8,#2456a8); color:#fff; border:none; transition:.18s;
    box-shadow:0 4px 14px rgba(50,110,220,.3);
  }
  .toggle:hover { filter:brightness(1.1); }
  .toggle.off { background:rgba(255,255,255,.06); color:#9db1c9; font-weight:400; box-shadow:none; border:1px solid rgba(255,255,255,.08); }
  #panel .foot { text-align:center; font-size:8px; letter-spacing:2.5px; color:#5c708c; margin-top:12px; }

  /* ---------- 左下角文案 ---------- */
  #caption { position:fixed; left:24px; bottom:24px; z-index:10; color:#e4ebf5; pointer-events:none; }
  #caption .en { font-size:9px; letter-spacing:4px; color:#7487a0; margin-bottom:7px; }
  #caption .zh { font-size:19px; font-weight:600; text-shadow:0 2px 12px rgba(0,0,0,.7); letter-spacing:1px; }
  #caption .tip { font-size:11px; color:#7d8da3; margin-top:7px; }
  #caption .tip b { color:#a9bcd4; font-weight:600; }

  #loading { position:fixed; inset:0; z-index:99; background:#0a1428; display:flex; flex-direction:column;
    align-items:center; justify-content:center; gap:16px; color:#8fa3bd; font-size:13px; letter-spacing:3px; transition:opacity .9s; }
  #loading .cup { font-size:44px; animation:steam 2s ease-in-out infinite; }
  @keyframes steam { 0%,100%{ transform:translateY(0) } 50%{ transform:translateY(-8px) } }
  @media (max-width:640px){ #panel{ width:196px; padding:12px; } #clock{font-size:28px;} #topbar .slogan{display:none;} }
</style>
</head>
<body>
<div id="app"></div>
<div id="loading"><div class="cup">☕</div><div>正在为你点亮这家小店 · · ·</div></div>

<div id="topbar">
  <div class="mark">☕</div>
  <div><div class="name">鉴业的咖啡店</div><div class="slogan">JIANYE · COFFEE · LIGHTS · LITTLE MOMENTS</div></div>
</div>

<div id="panel">
  <div class="brand">
    <div class="logo">☕</div>
    <div><b>鉴业的咖啡店</b><small>EST. 2024 · MIDNIGHT ROASTERY</small></div>
  </div>
  <div id="clockRow"><div id="clock">19:24</div></div>
  <div id="clockLabel">夜晚时分 · 一杯热咖啡</div>

  <div class="sec">时间 TIME</div>
  <input type="range" id="timeSlider" min="0" max="24" step="0.05" value="19.4">

  <div class="divider"></div>
  <div class="sec">天气 WEATHER</div>
  <div class="btnrow">
    <div class="wbtn" data-w="clear">☀️</div>
    <div class="wbtn" data-w="cloud">☁️</div>
    <div class="wbtn" data-w="rain">🌧️</div>
    <div class="wbtn" data-w="snow">❄️</div>
  </div>
  <div style="height:10px"></div>
  <div class="sec">云量 <span id="cloudVal">30%</span></div>
  <input type="range" id="cloudSlider" min="0" max="100" value="30">
  <div style="height:8px"></div>
  <div class="sec">降水强度 <span id="precipVal">50%</span></div>
  <input type="range" id="precipSlider" min="0" max="100" value="50">

  <div class="divider"></div>
  <div class="sec">视角 CAMERA</div>
  <div class="btnrow">
    <div class="vbtn active" data-v="street">街景</div>
    <div class="vbtn" data-v="inside">店内</div>
    <div class="vbtn" data-v="top">俯瞰</div>
    <div class="vbtn" data-v="low">低角</div>
  </div>
  <div class="switchrow">
    <button class="toggle off" id="autoBtn">▶ 自动巡游</button>
    <button class="toggle off" id="soundBtn">🔇 环境音</button>
  </div>
  <button class="toggle" id="timeRunBtn" style="margin-top:8px;">⏱ 时光流动：开</button>
  <div class="foot">JIANYE'S COFFEE · SLOW DOWN & STAY</div>
</div>

<div id="caption">
  <div class="en">JIANYE · MIDNIGHT ROASTERY</div>
  <div class="zh">一间深夜亮着灯的咖啡小店。</div>
  <div class="tip"><b>拖动</b> 旋转 · <b>滚轮</b> 缩放 · <b>右键</b> 平移</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/CopyShader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/LuminosityHighPassShader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/GammaCorrectionShader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/FXAAShader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/EffectComposer.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/RenderPass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/ShaderPass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/UnrealBloomPass.js"></script>
<script>
(function(){
"use strict";

/* ================= 线性色彩工具 ================= */
function C(hex){ return new THREE.Color(hex).convertSRGBToLinear(); }
const rand = (a,b)=> a + Math.random()*(b-a);
const pick = arr => arr[Math.floor(Math.random()*arr.length)];

/* ================= 基础 ================= */
const app = document.getElementById('app');
const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0x0a1428, 55, 170);

const camera = new THREE.PerspectiveCamera(48, innerWidth/innerHeight, 0.1, 500);
camera.position.set(20, 11, 27);

const renderer = new THREE.WebGLRenderer({ antialias:true, powerPreference:'high-performance' });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.12;
app.appendChild(renderer.domElement);

/* --- 后期：Bloom + Gamma + FXAA --- */
let composer = null, bloomPass = null, fxaaPass = null;
try {
  composer = new THREE.EffectComposer(renderer);
  composer.addPass(new THREE.RenderPass(scene, camera));
  bloomPass = new THREE.UnrealBloomPass(new THREE.Vector2(innerWidth, innerHeight), 0.6, 0.55, 0.82);
  composer.addPass(bloomPass);
  composer.addPass(new THREE.ShaderPass(THREE.GammaCorrectionShader));
  fxaaPass = new THREE.ShaderPass(THREE.FXAAShader);
  composer.addPass(fxaaPass);
  setFXAARes();
} catch(e){ composer = null; renderer.outputEncoding = THREE.sRGBEncoding; }
function setFXAARes(){
  if(!fxaaPass) return;
  const pr = renderer.getPixelRatio();
  fxaaPass.material.uniforms['resolution'].value.set(1/(innerWidth*pr), 1/(innerHeight*pr));
}

const controls = new THREE.OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.06;
controls.target.set(0, 3.4, 0);
controls.maxPolarAngle = Math.PI * 0.495;
controls.minDistance = 2.5;
controls.maxDistance = 95;

/* ================= 灯光 ================= */
const ambient = new THREE.AmbientLight(0xbfd4ee, 0.45); scene.add(ambient);
const hemi = new THREE.HemisphereLight(0x9fb8d8, 0x1a2a30, 0.3); scene.add(hemi);
const dirLight = new THREE.DirectionalLight(0x8fb0ff, 0.5);
dirLight.position.set(20, 30, 10);
dirLight.castShadow = true;
dirLight.shadow.mapSize.set(2048, 2048);
dirLight.shadow.camera.left = -38; dirLight.shadow.camera.right = 38;
dirLight.shadow.camera.top = 38;  dirLight.shadow.camera.bottom = -38;
dirLight.shadow.camera.far = 140;
dirLight.shadow.bias = -0.0004;
scene.add(dirLight);

/* ================= 程序化贴图 ================= */
function canvasTex(w, h, draw, rx, ry){
  const c = document.createElement('canvas'); c.width=w; c.height=h;
  draw(c.getContext('2d'), w, h);
  const t = new THREE.CanvasTexture(c);
  t.encoding = THREE.sRGBEncoding;
  t.anisotropy = 8;
  if(rx){ t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(rx, ry||rx); }
  return t;
}
// 木地板
const plankTex = canvasTex(256, 256, (ctx,w,h)=>{
  for(let y=0; y<h; y+=32){
    const shade = rand(-18, 18);
    ctx.fillStyle = `rgb(${185+shade},${138+shade},${90+shade})`;
    ctx.fillRect(0, y, w, 32);
    ctx.strokeStyle = 'rgba(90,60,35,.5)'; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(w, y); ctx.stroke();
    ctx.beginPath(); const sx = rand(0,w); ctx.moveTo(sx, y); ctx.lineTo(sx, y+32); ctx.stroke();
    for(let k=0;k<3;k++){ ctx.fillStyle='rgba(90,60,35,.25)'; ctx.fillRect(rand(0,w), y+rand(4,28), rand(4,14), 1.5); }
  }
}, 3, 3);
// 柏油路
const asphaltTex = canvasTex(256, 256, (ctx,w,h)=>{
  ctx.fillStyle = '#2b2e33'; ctx.fillRect(0,0,w,h);
  for(let i=0;i<1800;i++){
    const g = rand(30, 70);
    ctx.fillStyle = `rgba(${g},${g+3},${g+6},${rand(.15,.5)})`;
    ctx.fillRect(rand(0,w), rand(0,h), rand(1,2.5), rand(1,2.5));
  }
}, 7, 3);
// 人行道地砖
const paveTex = canvasTex(256, 256, (ctx,w,h)=>{
  ctx.fillStyle = '#a3a7a9'; ctx.fillRect(0,0,w,h);
  for(let i=0;i<500;i++){ const g=rand(140,175); ctx.fillStyle=`rgba(${g},${g},${g},.5)`; ctx.fillRect(rand(0,w),rand(0,h),2,2); }
  ctx.strokeStyle = 'rgba(80,84,88,.7)'; ctx.lineWidth = 3;
  for(let i=0;i<=4;i++){ ctx.beginPath(); ctx.moveTo(0,i*64); ctx.lineTo(w,i*64); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(i*64,0); ctx.lineTo(i*64,h); ctx.stroke(); }
}, 14, 1.4);
// 混凝土墙（邻居楼）
const concreteTex = canvasTex(256, 256, (ctx,w,h)=>{
  ctx.fillStyle = '#71767a'; ctx.fillRect(0,0,w,h);
  for(let i=0;i<900;i++){ const g=rand(95,125); ctx.fillStyle=`rgba(${g},${g},${g},.35)`; ctx.fillRect(rand(0,w),rand(0,h),rand(1,3),rand(1,3)); }
  ctx.strokeStyle='rgba(60,64,68,.4)'; ctx.lineWidth=1;
  for(let y=0;y<h;y+=42){ ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(w,y); ctx.stroke(); }
}, 3, 3);
// 砖墙
const brickTex = canvasTex(256, 256, (ctx,w,h)=>{
  ctx.fillStyle = '#6e4a3a'; ctx.fillRect(0,0,w,h);
  const bh=16, bw=42;
  for(let y=0,row=0; y<h; y+=bh, row++){
    for(let x=(row%2)*bw/2; x<w; x+=bw){
      const s=rand(-14,14);
      ctx.fillStyle=`rgb(${120+s},${78+s},${60+s})`;
      ctx.fillRect(x+2, y+2, bw-4, bh-4);
    }
  }
}, 2, 2);
// 天花板浅木
const ceilTex = canvasTex(128, 128, (ctx,w,h)=>{
  ctx.fillStyle = '#e9e0cc'; ctx.fillRect(0,0,w,h);
  for(let i=0;i<200;i++){ ctx.fillStyle='rgba(160,140,110,.15)'; ctx.fillRect(rand(0,w),rand(0,h),rand(2,10),1); }
}, 4, 3);

/* ================= 纹理招牌 ================= */
function textTexture(w, h, draw){ return canvasTex(w, h, draw); }

/* ================= 通用 mesh 工具 ================= */
function box(w,h,d,color,opts){
  opts = opts || {};
  const mat = new THREE.MeshStandardMaterial({
    color: C(color),
    roughness: opts.rough !== undefined ? opts.rough : 0.9,
    metalness: opts.metal || 0,
    emissive: opts.emissive ? C(opts.emissive) : new THREE.Color(0),
    emissiveIntensity: opts.ei !== undefined ? opts.ei : 1,
    map: opts.map || null,
    transparent: !!opts.opacity && opts.opacity < 1,
    opacity: opts.opacity || 1,
    flatShading: !!opts.flat
  });
  const m = new THREE.Mesh(new THREE.BoxGeometry(w,h,d), mat);
  m.castShadow = opts.cast !== false;
  m.receiveShadow = true;
  return m;
}
function cyl(rt,rb,h,color,seg,opts){
  opts = opts || {};
  const m = new THREE.Mesh(new THREE.CylinderGeometry(rt,rb,h,seg||16),
    new THREE.MeshStandardMaterial({ color:C(color), roughness:opts.rough!==undefined?opts.rough:0.85,
      metalness:opts.metal||0, emissive:opts.emissive?C(opts.emissive):new THREE.Color(0),
      emissiveIntensity:opts.ei||1, flatShading:!!opts.flat }));
  m.castShadow = opts.cast!==false; m.receiveShadow = true;
  return m;
}
function sphere(r,color,opts){
  opts = opts || {};
  const m = new THREE.Mesh(new THREE.SphereGeometry(r, opts.seg||18, opts.seg?opts.seg/2:12),
    new THREE.MeshStandardMaterial({ color:C(color), roughness:opts.rough!==undefined?opts.rough:0.8,
      emissive:opts.emissive?C(opts.emissive):new THREE.Color(0), emissiveIntensity:opts.ei||1, flatShading:!!opts.flat }));
  m.castShadow = opts.cast!==false; m.receiveShadow = true;
  return m;
}
function signPlane(w, h, tex, opts){
  opts = opts || {};
  return new THREE.Mesh(new THREE.PlaneGeometry(w,h),
    new THREE.MeshBasicMaterial({ map:tex, transparent:!!opts.transparent, side:THREE.DoubleSide }));
}
function glowSprite(color, size, opacity){
  const tex = canvasTex(128, 128, (ctx,w,h)=>{
    const g = ctx.createRadialGradient(w/2,h/2,2,w/2,h/2,w/2);
    g.addColorStop(0, color.replace('OP', '0.85'));
    g.addColorStop(0.4, color.replace('OP', '0.25'));
    g.addColorStop(1, color.replace('OP', '0'));
    ctx.fillStyle = g; ctx.fillRect(0,0,w,h);
  });
  const s = new THREE.Sprite(new THREE.SpriteMaterial({ map:tex, transparent:true, opacity:opacity||0.8, depthWrite:false, blending:THREE.AdditiveBlending, fog:false }));
  s.scale.set(size, size, 1);
  return s;
}

/* ================= 地面 / 道路 ================= */
const groundMat = new THREE.MeshStandardMaterial({ color:C(0x14313a), roughness:1 });
const ground = new THREE.Mesh(new THREE.PlaneGeometry(180,180), groundMat);
ground.rotation.x = -Math.PI/2; ground.position.y = -0.07; ground.receiveShadow = true;
scene.add(ground);

const sideMat = new THREE.MeshStandardMaterial({ map:paveTex, roughness:0.9 });
const sidewalk = new THREE.Mesh(new THREE.BoxGeometry(58, 0.14, 4.6), sideMat);
sidewalk.position.set(0, 0.07, 6.9); sidewalk.receiveShadow = true; sidewalk.castShadow = false; scene.add(sidewalk);
const curb = box(58, 0.16, 0.28, 0xb8bcbf, {cast:false});
curb.position.set(0, 0.08, 9.15); scene.add(curb);

const roadMat = new THREE.MeshPhongMaterial({ map:asphaltTex, shininess:10, specular:new THREE.Color(0x1c1c1c) });
const road = new THREE.Mesh(new THREE.PlaneGeometry(70, 12), roadMat);
road.rotation.x = -Math.PI/2; road.position.set(0, 0.02, 15.4); road.receiveShadow = true;
scene.add(road);

// 斑马线
for(let i=0;i<8;i++){
  const s = box(1.35, 0.045, 10.5, i%2===0 ? 0xdde1e5 : 0xcdd2d7, {cast:false, rough:.8});
  s.position.set(-7.7 + i*2.2, 0.05, 15.4);
  scene.add(s);
}
// 路缘黄虚线
for(let x=-30; x<30; x+=4.2){
  const y = box(2.1, 0.045, 0.28, 0xd9b13b, {cast:false});
  y.position.set(x, 0.05, 9.75);
  scene.add(y);
}
const manhole = cyl(0.55, 0.55, 0.03, 0x1f2328, 20, {cast:false});
manhole.position.set(6.5, 0.05, 13.6); scene.add(manhole);
const manhole2 = cyl(0.4, 0.4, 0.03, 0x262a2f, 20, {cast:false});
manhole2.position.set(-12, 0.05, 17); scene.add(manhole2);

/* ================= 咖啡店主楼 ================= */
const shop = new THREE.Group(); scene.add(shop);
const COL_FRAME = 0x1d4a3f, COL_CREAM = 0xf2ead8, COL_WOOD = 0xb98a5a, COL_DARKWOOD = 0x5d3f26;

const f1mat = new THREE.MeshStandardMaterial({ map:plankTex, roughness:0.75 });
const f1floor = new THREE.Mesh(new THREE.BoxGeometry(14, 0.16, 10), f1mat); f1floor.position.set(0, 0.08, 0); f1floor.receiveShadow = true; shop.add(f1floor);
const f2floor = new THREE.Mesh(new THREE.BoxGeometry(14, 0.16, 10), f1mat); f2floor.position.set(0, 3.95, 0); f2floor.receiveShadow = true; shop.add(f2floor);

const backWall1 = box(14, 3.2, 0.3, 0xefe6d4, {cast:false}); backWall1.position.set(0, 1.7, -4.85); shop.add(backWall1);
const backWall2 = box(14, 3.1, 0.3, 0xe9dfca, {cast:false}); backWall2.position.set(0, 5.55, -4.85); shop.add(backWall2);

function wireWithBulbs(from, to, sag, withBulbs){
  const pts = [];
  for(let i=0;i<=20;i++){
    const t = i/20;
    const p = new THREE.Vector3().lerpVectors(from, to, t);
    p.y -= Math.sin(t*Math.PI)*sag;
    pts.push(p);
  }
  const geo = new THREE.BufferGeometry().setFromPoints(pts);
  scene.add(new THREE.Line(geo, new THREE.LineBasicMaterial({ color:0x0d1216 })));
  if(withBulbs){
    const bulbMats = [];
    const cols = [0xffd9a0, 0xfff6e0];
    for(let i=2;i<20;i+=3){
      const t = i/20;
      const p = new THREE.Vector3().lerpVectors(from, to, t);
      p.y -= Math.sin(t*Math.PI)*sag + 0.12;
      const bm = new THREE.MeshStandardMaterial({ color:C(0x6a6a60), emissive:C(pick(cols)), emissiveIntensity:0 });
      const bulb = new THREE.Mesh(new THREE.SphereGeometry(0.055, 8, 8), bm);
      bulb.position.copy(p); scene.add(bulb);
      bulbMats.push(bm);
    }
    return bulbMats;
  }
  return null;
}

  this.textContent = state.timeRun ? '⏱ 时光流动：开' : '⏱ 时光流动：停';
});

let AC = null, masterGain = null, rainGainNode = null, windGainNode = null;
$('soundBtn').addEventListener('click', function(){
  state.sound = !state.sound;
  this.classList.toggle('off', !state.sound);
  this.textContent = state.sound ? '🔊 环境音' : '🔇 环境音';
  if(state.sound){
    if(!AC){
      AC = new (window.AudioContext || window.webkitAudioContext)();
      masterGain = AC.createGain(); masterGain.gain.value = 0; masterGain.connect(AC.destination);
      function noiseSource(filterFreq){
        const len = AC.sampleRate * 2;
        const buf = AC.createBuffer(1, len, AC.sampleRate);
        const d = buf.getChannelData(0);
        let last = 0;
        for(let i=0;i<len;i++){
          const white = Math.random()*2-1;
          d[i] = filterFreq > 800 ? white : (last = (last + 0.02*white) / 1.02) * 3.5;
        }
        const src = AC.createBufferSource(); src.buffer = buf; src.loop = true;
        const f = AC.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = filterFreq;
        const g = AC.createGain(); g.gain.value = 0;
        src.connect(f); f.connect(g); g.connect(masterGain);
        src.start();
        return g;
      }
      rainGainNode = noiseSource(1500);
      windGainNode = noiseSource(320);
    }
    AC.resume();
    masterGain.gain.setTargetAtTime(0.9, AC.currentTime, 0.4);
  } else if(AC){
    masterGain.gain.setTargetAtTime(0, AC.currentTime, 0.3);
  }
});

function updateTimeUI(){
  const h = Math.floor(state.time), m = Math.floor((state.time - h)*60);
  clockEl.textContent = String(h).padStart(2,'0') + ':' + String(m).padStart(2,'0');
  let label;
  if(h < 5) label = '深夜时分 · 城市安睡';
  else if(h < 7) label = '清晨时分 · 第一缕光';
  else if(h < 11) label = '上午时分 · 豆香四溢';
  else if(h < 14) label = '正午时分 · 阳光正好';
  else if(h < 17) label = '午后时分 · 来杯拿铁';
  else if(h < 19) label = '黄昏时分 · 灯火渐亮';
  else label = '夜晚时分 · 一杯热咖啡';
  clockLabel.textContent = label;
}

const groundTarget = new THREE.Color(0x14313a).convertSRGBToLinear();
function applyWeather(){
  rain.visible = state.weather === 'rain';
  snow.visible = state.weather === 'snow';
  snowPatches.visible = state.weather === 'snow';
  roofSnow.visible = state.weather === 'snow';
  puddles.visible = state.weather === 'rain';
  if(state.weather === 'rain'){
    roadMat.shininess = 160; roadMat.specular = C(0xaabbcc);
  } else {
    roadMat.shininess = 10; roadMat.specular = C(0x1c1c1c);
  }
  const defCloud = { clear:18, cloud:75, rain:96, snow:70 }[state.weather];
  state.cloud = defCloud/100;
  cloudSlider.value = defCloud;
  $('cloudVal').textContent = defCloud + '%';
  paintSlider(cloudSlider);
  groundTarget.set(state.weather==='snow' ? 0x44545c : 0x14313a).convertSRGBToLinear();
}

/* ================= 昼夜关键帧 ================= */
const skyStops = [
  { t:0,    c:0x0a1428 },
  { t:4.5,  c:0x0c1830 },
  { t:6,    c:0xc47a52 },
  { t:7.5,  c:0x9fd0e8 },
  { t:16,   c:0x9fd0e8 },
  { t:18,   c:0xd97a4e },
  { t:19.5, c:0x14243e },
  { t:24,   c:0x0a1428 }
];
const skyCol = new THREE.Color();
function skyColorAt(t){
  for(let i=0;i<skyStops.length-1;i++){
    if(t >= skyStops[i].t && t <= skyStops[i+1].t){
      const k = (t - skyStops[i].t) / (skyStops[i+1].t - skyStops[i].t);
      return skyCol.set(skyStops[i].c).convertSRGBToLinear().lerp(new THREE.Color(skyStops[i+1].c).convertSRGBToLinear(), k);
    }
  }
  return skyCol.set(0x0a1428).convertSRGBToLinear();
}

/* ================= 动画循环 ================= */
const clock3 = new THREE.Clock();
let tlTimer = 0, tlState = 0;
const tmpColor = new THREE.Color();

function animate(){
  requestAnimationFrame(animate);
  const dt = Math.min(clock3.getDelta(), 0.1);
  const et = clock3.elapsedTime;

  if(state.timeRun){
    state.time = (state.time + dt*0.18) % 24;
    timeSlider.value = state.time;
    paintSlider(timeSlider);
    updateTimeUI();
  }

  /* --- 天空 --- */
  const sky = skyColorAt(state.time);
  const nightF = state.time < 6 ? 1 : state.time < 7.5 ? (7.5-state.time)/1.5
               : state.time > 20 ? 1 : state.time > 18.5 ? (state.time-18.5)/1.5 : 0;
  const cloudy = state.weather === 'rain' ? 0.55 : state.weather === 'cloud' ? 0.3 : state.weather === 'snow' ? 0.4 : 0;
  const finalSky = sky.clone().lerp(new THREE.Color(0x2a3a4a).convertSRGBToLinear(), cloudy*0.6);
  scene.background = finalSky;
  scene.fog.color.copy(finalSky);

  starMat.opacity = Math.max(0, nightF - cloudy) * 0.85;
  starMatBig.opacity = Math.max(0, nightF - cloudy) * 0.95;
  const moonAng = ((state.time - 18) / 12) * Math.PI;
  const moonVisible = nightF > 0.05 && cloudy < 0.8;
  moon.visible = moonGlow.visible = moonVisible;
  if(moonVisible){
    moon.position.set(Math.cos(moonAng)*-75, Math.sin(moonAng)*58 + 8, -45);
    moonGlow.position.copy(moon.position);
    moonGlow.material.opacity = 0.55 * (1-cloudy);
  }
  const sunAng = ((state.time - 6) / 12) * Math.PI;
  const isDay = state.time > 5.5 && state.time < 18.5;
  sun.visible = sunGlow.visible = isDay && cloudy < 0.8;
  if(sun.visible){
    sun.position.set(Math.cos(sunAng)*-75, Math.sin(sunAng)*58 + 5, 45);
    sunGlow.position.copy(sun.position);
    sunGlow.material.opacity = 0.7 * (1-cloudy);
  }

  if(isDay){
    dirLight.position.set(Math.cos(sunAng)*-40, Math.max(8, Math.sin(sunAng)*50), 32);
    dirLight.color.setHex(state.time < 8 || state.time > 16.5 ? 0xffc890 : 0xfff2dd);
    dirLight.intensity = (1.0 - cloudy*0.7) * Math.max(0.25, Math.sin(sunAng));
    dirLight.color.convertSRGBToLinear();
  } else {
    dirLight.position.set(Math.cos(moonAng)*-40, Math.max(10, Math.sin(moonAng)*50), -22);
    dirLight.color.set(0x8fb0ff);
    dirLight.intensity = 0.45 * nightF * (1-cloudy*0.5);
  }
  ambient.intensity = 0.35 + (1-nightF)*0.4 - cloudy*0.12;
  hemi.intensity = 0.25 + (1-nightF)*0.25;

  const activeClouds = Math.round(state.cloud * clouds.length);
  clouds.forEach((c, i) => {
    c.visible = i < activeClouds;
    if(c.visible){
      c.position.x += c.userData.speed * dt * 1.6;
      if(c.position.x > 65) c.position.x = -65;
      c.children[0].material.color.copy(tmpColor.set(state.weather==='rain' ? 0x55606e : nightF>0.5 ? 0x39485f : 0xdfe6f0).convertSRGBToLinear());
    }
  });

  smokeSprites.forEach((s, i) => {
    const ph = (et*0.12 + s.userData.phase) % 1;
    s.position.y = 9.5 + ph*3.2;
    s.position.x = Math.sin(ph*4)*0.4;
    s.material.opacity = Math.sin(ph*Math.PI) * 0.28;
    s.scale.setScalar(1.4 + ph*2.2);
  });

  /* --- 灯光 --- */
  const wet = state.weather==='rain' ? 0.55 : state.weather==='snow' ? 0.45 : state.weather==='cloud' ? 0.15 : 0;
  const lightsOn = Math.min(1, Math.max(nightF, wet * (0.4 + nightF*0.6)));
  light1F.intensity = lightsOn * 1.5;
  light2F.intensity = lightsOn * 1.5;
  stripMats.forEach(m => m.emissiveIntensity = lightsOn * 1.3);
  sconceL.bulb.emissiveIntensity = sconceR.bulb.emissiveIntensity = lightsOn * 2.2;
  sconceL.glow.opacity = sconceR.glow.opacity = lightsOn * 0.7;
  hangMats.forEach(h => { h.bulb.emissiveIntensity = lightsOn * 2.4; h.glow.opacity = lightsOn * 0.65; });
  floorLampMat.emissiveIntensity = floorLampMat2.emissiveIntensity = lightsOn * 1.4;
  streetLights.forEach(s => {
    s.bulb.emissiveIntensity = lightsOn * 2;
    s.glow.opacity = lightsOn * 0.7;
    s.light.intensity = lightsOn * 1.1;
  });
  stringBulbMats.forEach(m => m.emissiveIntensity = lightsOn * 2.6);
  headlightMats.forEach(m => m.emissiveIntensity = lightsOn * 2);
  taillightMats.forEach(m => m.emissiveIntensity = 0.5 + lightsOn * 1.5);
  winMats.forEach(w => { if(w.lit) w.mat.emissiveIntensity = lightsOn * 1.1; });
  farWinMats.forEach(m => m.emissiveIntensity = lightsOn * 0.85);
  if(bloomPass) bloomPass.strength = 0.28 + lightsOn * 0.5;

  /* --- 红绿灯 --- */
  tlTimer += dt;
  if(tlTimer > (tlState===0 ? 5 : tlState===1 ? 1.5 : 3.5)){ tlTimer = 0; tlState = (tlState+1)%3; }
  tlMats.red.mat.color.set(tlState===2 ? 0xff4040 : 0x2a1414);
  tlMats.red.glow.opacity = tlState===2 ? 0.7 : 0;
  tlMats.yellow.mat.color.set(tlState===1 ? 0xffcc33 : 0x2a2414);
  tlMats.yellow.glow.opacity = tlState===1 ? 0.6 : 0;
  tlMats.green.mat.color.set(tlState===0 ? 0x40e888 : 0x142a1c);
  tlMats.green.glow.opacity = tlState===0 ? 0.7 : 0;

  /* --- 汽车 --- */
  if(!carState.active){
    carState.timer -= dt;
    if(carState.timer <= 0){
      carState.active = true;
      carState.dir = Math.random() < 0.5 ? 1 : -1;
      carGroup.rotation.y = carState.dir > 0 ? 0 : Math.PI;
      carGroup.position.set(-48*carState.dir, 0, carState.dir > 0 ? 17.6 : 13);
      carGroup.visible = true;
      carState.speed = rand(6, 9);
    }
  } else {
    carGroup.position.x += carState.dir * carState.speed * dt;
    carWheels.forEach(w => w.rotation.y -= carState.dir * carState.speed * dt * 2.5);
    if(Math.abs(carGroup.position.x) > 50){
      carState.active = false;
      carGroup.visible = false;
      carState.timer = rand(8, 22);
    }
  }

  /* --- 雨 --- */
  if(rain.visible){
    const speed = 32 + state.precip*26;
    const n = Math.floor(RAIN_N * (0.3 + state.precip*0.7));
    rainGeo.setDrawRange(0, n);
    const arr = rainGeo.attributes.position.array;
    for(let i=0;i<n;i++){
      arr[i*3+1] -= speed*dt; arr[i*3] -= dt*3;
      if(arr[i*3+1] < 0){ arr[i*3+1] = rand(32,42); arr[i*3] = rand(-38,38); arr[i*3+2] = rand(-32,30); }
    }
    rainGeo.attributes.position.needsUpdate = true;
  }
  /* --- 雪 --- */
  if(snow.visible){
    const n = Math.floor(SNOW_N * (0.3 + state.precip*0.7));
    snowGeo.setDrawRange(0, n);
    const arr = snowGeo.attributes.position.array;
    for(let i=0;i<n;i++){
      arr[i*3+1] -= (2.1 + state.precip*2)*dt;
      arr[i*3] += Math.sin(et*1.4 + i)*dt*0.9;
      if(arr[i*3+1] < 0){ arr[i*3+1] = rand(28,38); arr[i*3] = rand(-38,38); arr[i*3+2] = rand(-32,30); }
    }
    snowGeo.attributes.position.needsUpdate = true;
  }

  groundMat.color.lerp(groundTarget, dt*0.8);

  /* --- 环境音 --- */
  if(AC && state.sound){
    rainGainNode.gain.value = state.weather==='rain' ? 0.06 + state.precip*0.22 : 0;
    windGainNode.gain.value = state.weather==='snow' ? 0.05 + state.precip*0.1
                            : state.weather==='cloud' ? 0.025 : 0.012;
  }

  /* --- 相机 --- */
  if(camTween){
    camTween.t += dt * 1.4;
    const k = Math.min(1, camTween.t);
    const e = 1 - Math.pow(1-k, 3);
    camera.position.lerpVectors(camTween.fromP, camTween.toP, e);
    controls.target.lerpVectors(camTween.fromT, camTween.toT, e);
    if(k >= 1) camTween = null;
  }

  controls.update();
  if(composer) composer.render(); else renderer.render(scene, camera);
}

addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  if(composer) composer.setSize(innerWidth, innerHeight);
  setFXAARes();
});

/* ================= 启动 ================= */
document.querySelector('.wbtn[data-w="clear"]').classList.add('active');
applyWeather();
updateTimeUI();
animate();

setTimeout(() => {
  const l = document.getElementById('loading');
  l.style.opacity = '0';
  setTimeout(() => l.remove(), 950);
}, 600);

})();
</script>
