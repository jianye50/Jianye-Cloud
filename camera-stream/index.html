<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>相机投屏</title>
<script src="https://cdn.jsdelivr.net/npm/mqtt@5.10.1/dist/mqtt.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.3/build/qrcode.min.js"></script>
<script>
  // jsdelivr 被浏览器跟踪防护拦截时的兜底：换 unpkg 重新加载
  window.addEventListener('DOMContentLoaded', () => {
    if (typeof QRCode === 'undefined') {
      var s = document.createElement('script');
      s.src = 'https://unpkg.com/qrcode@1.5.3/build/qrcode.min.js';
      document.head.appendChild(s);
    }
  });
</script>
<style>
  :root {
    --bg: #f5f5f7;
    --surface: rgba(255, 255, 255, 0.72);
    --border: rgba(0, 0, 0, 0.06);
    --text: #1d1d1f;
    --text-secondary: #86868b;
    --blue: #0071e3;
    --blue-press: #0060c9;
    --green: #34c759;
    --orange: #ff9f0a;
    --radius-lg: 22px;
    --radius-md: 14px;
    --shadow: 0 8px 32px rgba(0, 0, 0, 0.08);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text",
                 "PingFang SC", "Helvetica Neue", "Microsoft YaHei", sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: max(24px, env(safe-area-inset-top)) 20px 40px;
    -webkit-font-smoothing: antialiased;
  }
  .nav-icon {
    width: 56px; height: 56px; border-radius: 16px;
    background: linear-gradient(180deg, #3a8ffe, #0071e3);
    display: flex; align-items: center; justify-content: center;
    margin-bottom: 16px; box-shadow: 0 6px 18px rgba(0, 113, 227, 0.28);
  }
  .nav-icon svg { width: 30px; height: 30px; }
  h1 { font-size: 26px; font-weight: 700; letter-spacing: -0.02em; }
  .sub {
    color: var(--text-secondary); font-size: 14px; margin-top: 6px;
    text-align: center; max-width: 340px; line-height: 1.5;
  }
  .card {
    background: var(--surface);
    backdrop-filter: blur(24px) saturate(1.6);
    -webkit-backdrop-filter: blur(24px) saturate(1.6);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    box-shadow: var(--shadow);
    padding: 28px 24px;
    width: 100%;
    max-width: 400px;
    margin-top: 24px;
    text-align: center;
  }
  .qr-frame {
    display: inline-block;
    background: #fff;
    padding: 14px;
    border-radius: var(--radius-md);
    box-shadow: 0 2px 12px rgba(0, 0, 0, 0.06);
    margin: 18px 0 12px;
  }
  .url {
    font-size: 12px; color: var(--text-secondary);
    word-break: break-all; margin-bottom: 4px;
    font-family: "SF Mono", ui-monospace, Menlo, monospace;
  }
  .btn {
    appearance: none; border: none; cursor: pointer;
    font-family: inherit; font-size: 16px; font-weight: 600;
    color: #fff; background: var(--blue);
    border-radius: 980px;
    padding: 13px 28px;
    margin: 14px 6px 0;
    transition: transform 0.15s ease, background 0.15s ease;
  }
  .btn:active { transform: scale(0.97); background: var(--blue-press); }
  .btn:disabled { background: #d2d2d7; cursor: default; transform: none; }
  .btn.secondary {
    color: var(--blue); background: rgba(0, 113, 227, 0.1);
    font-size: 14px; padding: 10px 20px;
  }
  .btn.secondary:active { background: rgba(0, 113, 227, 0.18); }
  .btn.stop { background: #ff3b30; }
  .btn.stop:active { background: #d92e24; }
  .status {
    display: inline-flex; align-items: center; gap: 7px;
    font-size: 13px; color: var(--text-secondary); margin-top: 18px;
  }
  .status .dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--orange);
    animation: pulse 1.4s ease-in-out infinite;
  }
  .status.ok .dot { background: var(--green); animation: none; }
  .status.error .dot { background: #ff3b30; animation: none; }
  @keyframes pulse {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.4; transform: scale(0.8); }
  }
  #remoteVideo {
    width: 100%; max-width: 760px;
    aspect-ratio: 16 / 9; object-fit: contain;
    border-radius: var(--radius-lg);
    background: #000;
    display: block;
    margin: 24px auto 0;
    box-shadow: var(--shadow);
  }
  #localVideo {
    width: 96px; aspect-ratio: 3 / 4; object-fit: cover;
    border-radius: var(--radius-md);
    position: fixed; right: 16px; bottom: max(16px, env(safe-area-inset-bottom));
    border: 2px solid rgba(255, 255, 255, 0.6);
    box-shadow: var(--shadow);
  }
  .tips {
    max-width: 400px; width: 100%;
    margin-top: 20px;
    font-size: 12px; color: var(--text-secondary);
    line-height: 1.9; text-align: left;
  }
  .tips b { color: var(--text); font-weight: 600; }
  .hidden { display: none !important; }
  .divider { height: 1px; background: var(--border); margin: 18px 0; }
  .steps { text-align: left; margin: 4px 0 8px; }
  .step { display: flex; align-items: flex-start; gap: 12px; padding: 8px 0; }
  .step .num {
    flex: none; width: 22px; height: 22px; border-radius: 50%;
    background: var(--blue); color: #fff;
    font-size: 12px; font-weight: 700;
    display: flex; align-items: center; justify-content: center;
    margin-top: 1px;
  }
  .step p { font-size: 14px; color: var(--text); line-height: 1.5; }
  .step p span { color: var(--text-secondary); }
</style>
</head>
<body>

  <div class="nav-icon">
    <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <rect x="2.5" y="6.5" width="19" height="13" rx="3"/>
      <circle cx="12" cy="13" r="3.5"/>
      <path d="M8 6.5l1.2-2h5.6L16 6.5"/>
    </svg>
  </div>
  <h1>相机投屏</h1>
  <p class="sub">用手机摄像头，实时画面直达电脑屏幕</p>

  <!-- 主机端（电脑） -->
  <div id="hostView" class="card">
    <div class="steps">
      <div class="step"><div class="num">1</div><p>用手机浏览器扫描二维码 <span>（请勿在微信内打开）</span></p></div>
      <div class="step"><div class="num">2</div><p>手机上点击「开始传输」并允许相机权限</p></div>
      <div class="step"><div class="num">3</div><p>电脑上即可看到实时画面</p></div>
    </div>
    <div class="divider"></div>
    <div id="qr" class="qr-frame"></div>
    <div class="url" id="urlText"></div>
    <button class="btn secondary" id="regenBtn">刷新连接</button>
    <div class="status" id="hostStatus"><span class="dot"></span><span id="hostStatusText">正在准备…</span></div>
  </div>

  <video id="remoteVideo" class="hidden" autoplay playsinline></video>

  <!-- 访客端（手机） -->
  <div id="guestView" class="card hidden">
    <p style="font-size:17px;font-weight:600;">扫码成功 🎉</p>
    <p class="sub" style="margin-top:8px;">点击下方按钮，将这台手机的摄像头画面实时传输到电脑</p>
    <button class="btn" id="startBtn">开始传输</button>
    <button class="btn stop hidden" id="stopBtn">停止传输</button>
    <div class="status" id="guestStatus"><span class="dot"></span><span id="guestStatusText"></span></div>
  </div>

  <video id="localVideo" class="hidden" autoplay playsinline muted></video>

  <div class="tips" id="tips">
    <b>说明</b><br>
    · 需通过 HTTPS 访问（Cloudflare Pages 默认满足）<br>
    · 手机与电脑无需在同一网络，采用 P2P 直连加密传输<br>
    · 画面不经过任何第三方存储，断开即结束
  </div>

<script>
/* ================= 配置 ================= */
const MQTT_URL = 'wss://broker.emqx.io:8084/mqtt';
const ICE_SERVERS = [
  { urls: ['stun:stun.l.google.com:19302', 'stun:stun.miwifi.com:3478'] }
];

const params = new URLSearchParams(location.search);
const guestRoom = params.get('id');

function setStatus(statusEl, textEl, text, type) {
  textEl.textContent = text;
  statusEl.classList.remove('ok', 'error');
  if (type) statusEl.classList.add(type);
}

function randomRoom() {
  const chars = 'abcdefghjkmnpqrstuvwxyz23456789';
  let s = '';
  for (let i = 0; i < 8; i++) s += chars[Math.floor(Math.random() * chars.length)];
  return s;
}

/* ================= 主机端（电脑） ================= */
function showHostView() {
  const statusEl = document.getElementById('hostStatus');
  const textEl = document.getElementById('hostStatusText');
  const qrBox = document.getElementById('qr');
  let client = null, pc = null, room = null;

  function cleanup() {
    if (pc) { pc.close(); pc = null; }
    if (client) { try { client.end(true); } catch (e) {} client = null; }
  }

  function drawQR(text) {
    qrBox.innerHTML = '';
    function fallbackToApi(reason) {
      console.warn('QR 本地生成失败，改用图片接口：', reason);
      const img = document.createElement('img');
      img.width = 220; img.height = 220;
      img.alt = '二维码';
      img.src = 'https://api.qrserver.com/v1/create-qr-code/?size=220x220&margin=0&data=' + encodeURIComponent(text);
      img.onerror = () => {
        qrBox.innerHTML = '<div style="font-size:12px;color:#86868b;padding:20px 0;">二维码生成失败，请检查网络后点击「刷新连接」</div>';
      };
      qrBox.appendChild(img);
    }
    try {
      if (typeof QRCode === 'undefined' || !QRCode.toCanvas) {
        fallbackToApi('QRCode 库未加载');
        return;
      }
      QRCode.toCanvas(text, { width: 220, margin: 0, color: { dark: '#1d1d1f', light: '#ffffff' } }, (err, canvas) => {
        if (err || !canvas) { fallbackToApi(err); return; }
        qrBox.innerHTML = '';
        qrBox.appendChild(canvas);
      });
    } catch (e) {
      fallbackToApi(e);
    }
  }

  function init() {
    cleanup();
    setStatus(statusEl, textEl, '正在准备连接…');
    room = randomRoom();
    const url = location.origin + location.pathname + '?id=' + room;
    document.getElementById('urlText').textContent = url;
    drawQR(url);

    client = mqtt.connect(MQTT_URL, { clientId: 'host-' + randomRoom() });
    client.on('connect', () => {
      setStatus(statusEl, textEl, '等待手机连接…');
      client.subscribe('camcast/' + room + '/offer');
    });
    client.on('error', () => {
      setStatus(statusEl, textEl, '信令服务器连接失败，请点击「刷新连接」重试', 'error');
    });
    client.on('message', async (topic, payload) => {
      if (!payload.toString().startsWith('{')) return;
      const msg = JSON.parse(payload.toString());
      if (topic.endsWith('/offer') && msg.sdp) {
        setStatus(statusEl, textEl, '手机已连接，正在建立视频通道…');
        await handleOffer(msg.sdp);
      }
    });
  }

  async function handleOffer(offerSdp) {
    pc = new RTCPeerConnection({ iceServers: ICE_SERVERS });
    pc.ontrack = e => {
      const v = document.getElementById('remoteVideo');
      v.srcObject = e.streams[0];
      v.classList.remove('hidden');
      document.getElementById('tips').classList.add('hidden');
      setStatus(statusEl, textEl, '已连接 · 正在实时传输', 'ok');
    };
    pc.onconnectionstatechange = () => {
      if (pc.connectionState === 'disconnected' || pc.connectionState === 'failed') {
        document.getElementById('remoteVideo').classList.add('hidden');
        document.getElementById('tips').classList.remove('hidden');
        setStatus(statusEl, textEl, '连接已断开，手机端可重新点击「开始传输」', 'error');
      }
    };
    await pc.setRemoteDescription({ type: 'offer', sdp: offerSdp });
    const answer = await pc.createAnswer();
    await pc.setLocalDescription(answer);
    // 等本端 ICE 收集完再一次性发送，避免多消息时序问题
    await new Promise(resolve => {
      if (pc.iceGatheringState === 'complete') return resolve();
      const t = setTimeout(resolve, 2000); // 兜底超时
      pc.onicegatheringstatechange = () => {
        if (pc.iceGatheringState === 'complete') { clearTimeout(t); resolve(); }
      };
    });
    client.publish('camcast/' + room + '/answer', JSON.stringify({ sdp: pc.localDescription.sdp }));
  }

  document.getElementById('regenBtn').onclick = init;
  init();
}

/* ================= 访客端（手机） ================= */
function showGuestView(room) {
  const statusEl = document.getElementById('guestStatus');
  const textEl = document.getElementById('guestStatusText');
  const localVideo = document.getElementById('localVideo');
  const startBtn = document.getElementById('startBtn');
  const stopBtn = document.getElementById('stopBtn');
  let client = null, pc = null, stream = null;

  function cleanup() {
    if (pc) { pc.close(); pc = null; }
    if (client) { try { client.end(true); } catch (e) {} client = null; }
  }

  stopBtn.onclick = () => {
    if (stream) stream.getTracks().forEach(t => t.stop());
    cleanup();
    localVideo.classList.add('hidden');
    startBtn.classList.remove('hidden');
    stopBtn.classList.add('hidden');
    setStatus(statusEl, textEl, '已停止传输');
  };

  startBtn.onclick = async () => {
    try {
      cleanup();
      setStatus(statusEl, textEl, '正在打开摄像头…');
      stream = await navigator.mediaDevices.getUserMedia({
        video: { facingMode: 'environment', width: { ideal: 1280 } },
        audio: false
      });
      localVideo.srcObject = stream;
      localVideo.classList.remove('hidden');

      setStatus(statusEl, textEl, '正在连接电脑…');
      pc = new RTCPeerConnection({ iceServers: ICE_SERVERS });
      stream.getTracks().forEach(track => pc.addTrack(track, stream));

      client = mqtt.connect(MQTT_URL, { clientId: 'guest-' + randomRoom() });
      client.on('connect', () => {
        client.subscribe('camcast/' + room + '/answer');
        sendOffer();
      });
      client.on('error', () => setStatus(statusEl, textEl, '信令服务器连接失败，请重试', 'error'));
      client.on('message', async (topic, payload) => {
        if (!payload.toString().startsWith('{')) return;
        const msg = JSON.parse(payload.toString());
        if (topic.endsWith('/answer') && msg.sdp && pc && pc.signalingState !== 'stable') {
          await pc.setRemoteDescription({ type: 'answer', sdp: msg.sdp });
          setStatus(statusEl, textEl, '正在实时传输画面', 'ok');
        }
      });

      async function sendOffer() {
        const offer = await pc.createOffer();
        await pc.setLocalDescription(offer);
        await new Promise(resolve => {
          if (pc.iceGatheringState === 'complete') return resolve();
          const t = setTimeout(resolve, 2000);
          pc.onicegatheringstatechange = () => {
            if (pc.iceGatheringState === 'complete') { clearTimeout(t); resolve(); }
          };
        });
        client.publish('camcast/' + room + '/offer', JSON.stringify({ sdp: pc.localDescription.sdp }));
      }
    } catch (e) {
      setStatus(statusEl, textEl, '无法访问摄像头：' + e.message, 'error');
    }
  };
}

if (guestRoom) {
  showGuestView(guestRoom);
} else {
  showHostView();
}
</script>
</body>
</html>
