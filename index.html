<head>
<meta charset="UTF-8">

<!-- 站点图标：站点根目录的 icon.ico -->
<link rel="icon" href="icon.ico" sizes="any">
<link rel="apple-touch-icon" href="icon.ico">
<!-- 移动端地址栏配色（站点固定深色） -->
<meta name="theme-color" content="#0b0d12">
<!-- 分享卡片预览 -->
<meta property="og:type" content="website">
<meta property="og:site_name" content="鉴业の小站">
<meta property="og:title" content="鉴业の小站">

<meta name="twitter:card" content="summary_large_image">
<!-- 首屏大图所在的图床，提前建连 -->
<link rel="preconnect" href="https://images.unsplash.com" crossorigin>
<!-- 语言：首次访问先按系统语言定好（中文→中文，其它语言→英文），
     免得英文用户先看到一闪而过的中文标题 / 语言标记。手动切换过的以本地保存为准。 -->
<script>
(function(){
  var s=null; try{ s=localStorage.getItem("jy-lang"); }catch(e){}
  if(s!=="zh"&&s!=="en"){
    var list=[], i;
    try{ list=(navigator.languages&&navigator.languages.length)?navigator.languages:[navigator.language||""]; }
    catch(e){ list=[""]; }
    s="en";                                   /* 默认英文：非中文一律英文 */
    for(i=0;i<list.length;i++){
      var l=String(list[i]||"").replace(/_/g,"-").toLowerCase();
      if(l.indexOf("zh")===0){ s="zh"; break; }   /* zh / zh-CN / zh-TW / zh-HK… 都算中文 */
      if(l.indexOf("en")===0){ s="en"; break; }
    }
  }
  window.__JY_LANG=s;
  document.documentElement.lang=(s==="zh")?"zh-CN":"en";
  if(s!=="zh") document.title="Jianye's Corner";
})();
</script>
<style>
/* ===================== 主题变量 =====================
   站点固定深色（<html data-theme="dark">），不再有浅色皮肤，
   所以这里只保留深色一套变量。 */
:root{
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text",
         "PingFang SC","HarmonyOS Sans SC","Microsoft YaHei","Segoe UI",sans-serif;
  --maxw:1080px;
  --radius:20px;
  --accent:#4d8dff;
  --accent-soft:rgba(77,141,255,.14);
  --bg:#0b0d12;
  --bg-2:#10131a;
  --text-1:#f4f5f7;
  --text-2:rgba(244,245,247,.68);
  --text-3:rgba(244,245,247,.42);
  --card:#151923;
  --card-border:rgba(255,255,255,.08);
  --chip:rgba(255,255,255,.08);
  --shadow:0 10px 34px rgba(0,0,0,.45);
  --shadow-lg:0 24px 60px rgba(0,0,0,.55);
  --hero-fallback:linear-gradient(160deg,#10141d 0%,#1d2637 55%,#3a2e22 100%);
  --img-placeholder:linear-gradient(135deg,#232c3e,#39455e);
  color-scheme:dark;
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  font-family:var(--font);
  background:var(--bg);
  color:var(--text-1);
  min-height:100vh;
  -webkit-font-smoothing:antialiased;
  overflow-x:hidden;
}
button{font-family:inherit;color:inherit;border:none;background:none;cursor:pointer}
a{color:inherit;text-decoration:none}
img{display:block;max-width:100%}
::selection{background:var(--accent);color:#fff}

/* ===================== 悬浮胶囊导航（Apple 液态玻璃） ===================== */
.nav{
  position:fixed;top:14px;left:50%;transform:translateX(-50%);
  z-index:100;
  display:flex;align-items:center;gap:2px;
  height:48px;padding:0 10px 0 18px;
  border-radius:999px;
  white-space:nowrap;
  max-width:calc(100vw - 24px);
  isolation:isolate;
  /* 液态玻璃基体：高透 + 折射感模糊 + 提亮 */
  background:linear-gradient(
    120deg,
    rgba(255,255,255,.16) 0%,
    rgba(255,255,255,.07) 38%,
    rgba(255,255,255,.12) 62%,
    rgba(255,255,255,.05) 100%);
  backdrop-filter:blur(22px) saturate(200%) brightness(1.12);
  -webkit-backdrop-filter:blur(22px) saturate(200%) brightness(1.12);
  border:none;
  /* 液态玻璃棱边：外圈微光 + 顶部受光高光 + 底部收光 + 落影 */
  box-shadow:
    inset 0 0 0 1px rgba(255,255,255,.22),
    inset 0 1.5px .5px -1px rgba(255,255,255,.65),
    inset 0 -1px .5px -1px rgba(255,255,255,.28),
    inset 0 12px 18px -12px rgba(255,255,255,.30),
    0 2px 6px rgba(6,10,25,.10),
    0 14px 38px rgba(6,10,25,.28);
  transition:box-shadow .35s ease,transform .35s ease;
}
/* 斜向流光切面：一层扫过玻璃面的柔和高光 */
.nav::before{
  content:"";position:absolute;inset:0;border-radius:inherit;
  pointer-events:none;z-index:0;
  background:linear-gradient(
    105deg,
    rgba(255,255,255,.30) 0%,
    rgba(255,255,255,.06) 22%,
    transparent 46%,
    transparent 68%,
    rgba(255,255,255,.10) 100%);
  mix-blend-mode:screen;
  opacity:.8;
}
/* 玻璃厚度感：底部内侧一道暗折射 */
.nav::after{
  content:"";position:absolute;inset:0;border-radius:inherit;
  pointer-events:none;z-index:0;
  box-shadow:inset 0 -10px 14px -12px rgba(0,0,0,.35);
}
.nav>*{position:relative;z-index:1}
.nav:hover{
  box-shadow:
    inset 0 0 0 1px rgba(255,255,255,.30),
    inset 0 1.5px .5px -1px rgba(255,255,255,.8),
    inset 0 -1px .5px -1px rgba(255,255,255,.34),
    inset 0 12px 18px -12px rgba(255,255,255,.38),
    0 2px 8px rgba(6,10,25,.12),
    0 20px 48px rgba(6,10,25,.34);
}
.nav-brand{
  display:flex;align-items:center;gap:8px;
  font-weight:700;font-size:15px;margin-right:14px;
}
.nav-brand .dot{
  width:8px;height:8px;border-radius:50%;
  background:var(--accent);
  box-shadow:0 0 0 4px var(--accent-soft);
}
.nav-link{
  padding:7px 13px;border-radius:999px;
  font-size:14px;color:var(--text-2);
  transition:color .2s,background .2s;
}
.nav-link:hover{color:var(--text-1);background:var(--chip)}
.nav-link.active{color:var(--accent);font-weight:600}
.nav-sep{width:1px;height:20px;background:rgba(255,255,255,.22);margin:0 8px;box-shadow:1px 0 0 rgba(0,0,0,.10)}
.nav-icon{
  width:34px;height:34px;border-radius:50%;
  display:grid;place-items:center;
  color:var(--text-2);font-size:14px;
  transition:color .2s,background .2s,transform .3s;
}
.nav-icon:hover{color:var(--text-1);background:var(--chip)}
.nav-icon:active{transform:scale(.9)}
.nav-icon svg{width:17px;height:17px;fill:currentColor}
@media (max-width:640px){
  .nav{gap:0;padding:0 8px}
  .nav-brand{display:none}   /* 手机端站名不显示，占位也一并去掉，内容才能左右居中 */
  .nav-link{padding:7px 9px;font-size:13px}
}
/* ===================== 视图容器与动画 ===================== */
#app{min-height:100vh}
.view{animation:fadeUp .55s cubic-bezier(.2,.7,.2,1) both}
@keyframes fadeUp{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.wrap{max-width:var(--maxw);margin:0 auto;padding:0 24px}
@media (max-width:640px){.wrap{padding:0 18px}}

/* ===================== 首页 Hero ===================== */
.hero{
  position:relative;min-height:100vh;
  display:flex;align-items:center;
  background:var(--hero-fallback);
  overflow:hidden;
}
.hero-img{
  position:absolute;inset:0;width:100%;height:100%;
  object-fit:cover;
  animation:heroIn 1.6s cubic-bezier(.2,.7,.2,1) both;
}
@keyframes heroIn{from{transform:scale(1.08);opacity:.4}to{transform:none;opacity:1}}
.hero::after{
  content:"";position:absolute;inset:0;
  background:linear-gradient(100deg,rgba(8,12,24,.62) 0%,rgba(8,12,24,.34) 46%,rgba(8,12,24,.14) 100%),
             linear-gradient(to top,rgba(8,12,24,.42),transparent 36%);
}
.hero-inner{position:relative;z-index:2;animation:fadeUp .9s .15s cubic-bezier(.2,.7,.2,1) both}
.hero-badge{
  display:inline-flex;align-items:center;gap:8px;
  padding:7px 15px;border-radius:999px;
  /* 液态玻璃材质（同导航栏）：高透渐变 + 折射模糊 + 棱边高光 */
  background:linear-gradient(
    120deg,
    rgba(255,255,255,.16) 0%,
    rgba(255,255,255,.07) 38%,
    rgba(255,255,255,.12) 62%,
    rgba(255,255,255,.05) 100%);
  backdrop-filter:blur(22px) saturate(200%) brightness(1.12);
  -webkit-backdrop-filter:blur(22px) saturate(200%) brightness(1.12);
  border:none;
  box-shadow:
    inset 0 0 0 1px rgba(255,255,255,.22),
    inset 0 1.5px .5px -1px rgba(255,255,255,.65),
    inset 0 -1px .5px -1px rgba(255,255,255,.28),
    inset 0 12px 18px -12px rgba(255,255,255,.30),
    0 2px 6px rgba(6,10,25,.10),
    0 14px 38px rgba(6,10,25,.28);
  color:rgba(255,255,255,.92);
  font-size:12.5px;letter-spacing:.14em;font-weight:600;
}
.hero-badge .pulse{
  width:7px;height:7px;border-radius:50%;
  background:#35d07f;
  box-shadow:0 0 0 0 rgba(53,208,127,.5);
  animation:pulse 2.2s infinite;
}
@keyframes pulse{
  0%{box-shadow:0 0 0 0 rgba(53,208,127,.5)}
  70%{box-shadow:0 0 0 9px rgba(53,208,127,0)}
  100%{box-shadow:0 0 0 0 rgba(53,208,127,0)}
}
.hero h1{
  margin:26px 0 18px;
  font-size:clamp(44px,7.5vw,84px);
  font-weight:800;letter-spacing:-.02em;color:#fff;
  text-shadow:0 4px 30px rgba(0,0,0,.25);
}
.hero p{
  font-size:clamp(16px,2vw,19px);line-height:1.7;
  color:rgba(255,255,255,.86);max-width:480px;
  text-shadow:0 2px 14px rgba(0,0,0,.3);
}
.hero-actions{display:flex;gap:14px;margin-top:38px;flex-wrap:wrap}
.btn{
  display:inline-flex;align-items:center;gap:8px;
  padding:13px 26px;border-radius:12px;
  font-size:15px;font-weight:600;
  transition:transform .2s,box-shadow .2s,background .2s;
}
.btn:hover{transform:translateY(-2px)}
.btn:active{transform:scale(.97)}
/* Gemini 同款彩虹光晕按钮：深色底 + 流动彩虹描边 + 彩虹外发光（形状不变） */
.btn-primary{
  position:relative;z-index:0;
  color:#fff;
  border:1.5px solid transparent;
  background:
    linear-gradient(#0b0f1a,#0b0f1a) padding-box,
    linear-gradient(115deg,#4d8dff,#b44dff,#ff5fa2,#ff8a3d,#ffd23f,#4d8dff) border-box;
  background-size:100% 100%,300% 100%;
  animation:rb-border 6s linear infinite;
}
@keyframes rb-border{
  from{background-position:0% 50%,0% 50%}
  to{background-position:0% 50%,300% 50%}
}
.btn-primary::before{
  content:"";position:absolute;inset:-3px;z-index:-1;
  border-radius:inherit;
  background:linear-gradient(115deg,#4d8dff,#b44dff,#ff5fa2,#ff8a3d,#ffd23f,#4d8dff);
  background-size:300% 100%;
  filter:blur(16px);opacity:.55;
  animation:rb-glow 6s linear infinite;
  transition:opacity .25s,filter .25s;
}
@keyframes rb-glow{
  from{background-position:0% 50%}
  to{background-position:300% 50%}
}
.btn-primary:hover{box-shadow:none}
.btn-primary:hover::before{opacity:.85;filter:blur(20px)}
.btn-ghost{
  background:rgba(255,255,255,.14);
  border:1px solid rgba(255,255,255,.24);
  color:#fff;backdrop-filter:blur(8px);
}
.btn-ghost:hover{background:rgba(255,255,255,.22)}
/* 向下浏览提示：同一位置、同一点击区，按设备类型换形态
   · 电脑（有鼠标）→ 鼠标滚轮图形
   · 触屏（手机/平板）→ 向下滑动箭头（触屏用户没有滚轮，但同样需要知道可以往下翻） */
.scroll-hint{
  position:absolute;left:50%;bottom:34px;transform:translateX(-50%);
  z-index:5;cursor:pointer;display:none;place-items:center;
  color:#fff;text-align:center;
  /* 提示整体加一点投影，压过首屏的明暗渐变，任何背景上都清晰 */
  filter:drop-shadow(0 2px 8px rgba(0,0,0,.5));
}
.sh-mouse{
  display:none;position:relative;
  width:26px;height:42px;
  border:2px solid rgba(255,255,255,.95);
  border-radius:999px;
  /* 玻璃质感填充：不透明白色衬底，深浅背景上都看得清 */
  background:rgba(255,255,255,.14);
  box-shadow:
    inset 0 0 0 1px rgba(255,255,255,.18),
    inset 0 8px 12px -6px rgba(255,255,255,.35);
}
.sh-mouse::before{
  content:"";position:absolute;left:50%;top:8px;
  width:4px;height:9px;margin-left:-2px;border-radius:99px;
  background:#fff;
  box-shadow:0 0 8px rgba(255,255,255,.9);
  animation:wheel 1.8s ease-in-out infinite;
}
.sh-arrow{
  display:none;width:30px;height:30px;
  filter:drop-shadow(0 2px 6px rgba(0,0,0,.4));
  animation:shBob 1.8s ease-in-out infinite;
}
.sh-label{
  display:none;margin-top:2px;font-size:11.5px;letter-spacing:.08em;
  color:#fff;text-shadow:0 2px 8px rgba(0,0,0,.55);
}
/* 电脑：能悬停 + 精确指针 */
@media (hover:hover) and (pointer:fine){
  .scroll-hint{display:grid}
  .sh-mouse{display:block}
}
/* 触屏：无悬停 或 粗指针 */
@media (hover:none),(pointer:coarse){
  .scroll-hint{display:grid}
  .sh-arrow,.sh-label{display:block}
}
@keyframes wheel{
  0%{transform:translateY(0);opacity:1}
  60%{transform:translateY(12px);opacity:0}
  100%{transform:translateY(0);opacity:0}
}
@keyframes shBob{
  0%,100%{transform:translateY(-3px);opacity:.65}
  50%{transform:translateY(5px);opacity:1}
}

/* ===================== 区块标题 ===================== */
.section{padding:64px 0 8px}
.section-label{
  display:flex;align-items:center;gap:14px;
  font-size:12.5px;font-weight:700;letter-spacing:.22em;
  color:var(--text-2);text-transform:uppercase;
  margin-bottom:22px;
}
.section-label::before{
  content:"";width:34px;height:2.5px;border-radius:99px;
  background:var(--accent);
}

/* ===================== 图库：照片墙 ===================== */
.photo-grid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:14px;
  padding:4px 0 10px;
}
@media (max-width:900px){.photo-grid{grid-template-columns:repeat(3,1fr);gap:12px}}
@media (max-width:620px){.photo-grid{grid-template-columns:repeat(2,1fr);gap:10px}}

.ph-tile{
  position:relative;aspect-ratio:1;
  border-radius:16px;overflow:hidden;
  background:var(--img-placeholder);
  border:1px solid var(--card-border);
  box-shadow:var(--shadow);
  cursor:zoom-in;
  transition:transform .35s cubic-bezier(.2,.7,.2,1),box-shadow .35s;
}
.ph-tile:hover{transform:translateY(-4px);box-shadow:var(--shadow-lg)}
.ph-tile:focus-visible{outline:2.5px solid var(--accent);outline-offset:3px}
.ph-tile img{
  width:100%;height:100%;object-fit:cover;
  transition:transform .6s cubic-bezier(.2,.7,.2,1);
}
.ph-tile:hover img{transform:scale(1.06)}
.ph-cap{
  position:absolute;left:10px;right:10px;bottom:9px;
  font-size:11.5px;font-weight:600;color:#fff;
  text-shadow:0 1px 8px rgba(0,0,0,.75);
  opacity:0;transform:translateY(5px);
  transition:opacity .25s,transform .25s;
  pointer-events:none;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.ph-tile:hover .ph-cap{opacity:1;transform:none}
.ph-tile::after{
  content:"";position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(to top,rgba(6,10,22,.5),transparent 46%);
  opacity:0;transition:opacity .25s;
}
.ph-tile:hover::after{opacity:1}
.ph-more{
  position:absolute;inset:0;z-index:2;
  display:grid;place-items:center;
  background:rgba(6,10,22,.52);
  backdrop-filter:blur(3px);
  color:#fff;font-size:20px;font-weight:750;letter-spacing:.02em;
}
.ph-skel{animation:skel 1.5s ease-in-out infinite;border-color:transparent}
@keyframes skel{0%,100%{opacity:.55}50%{opacity:.9}}
.ph-empty{
  grid-column:1/-1;
  padding:52px 24px;text-align:center;
  border:1px dashed var(--card-border);border-radius:var(--radius);
  background:var(--card);
  color:var(--text-2);font-size:14px;line-height:1.95;
}
.ph-empty b{color:var(--text-1);font-weight:700}
.ph-empty code{
  font-family:ui-monospace,"SF Mono",Consolas,monospace;
  font-size:.9em;background:var(--chip);padding:2px 7px;border-radius:6px;
}
.section-more{text-align:center;padding:16px 0 30px}
#aboutProjects{scroll-margin-top:86px}   /* 「查看全部项目」锚点定位时给顶部悬浮导航留出空间 */
.link-more{
  display:inline-flex;align-items:center;gap:8px;
  padding:11px 26px;border-radius:999px;
  border:1px solid var(--card-border);background:var(--card);
  font-size:14px;font-weight:600;color:var(--text-1);
  box-shadow:var(--shadow);transition:transform .2s,box-shadow .2s,color .2s;
}
.link-more:hover{transform:translateY(-2px);box-shadow:var(--shadow-lg);color:var(--accent)}

/* ===================== 灯箱 ===================== */
.lightbox{
  position:fixed;inset:0;z-index:200;display:none;
  background:rgba(3,7,20,.9);
  backdrop-filter:blur(18px) saturate(150%);
  -webkit-backdrop-filter:blur(18px) saturate(150%);
  align-items:center;justify-content:center;
}
.lightbox.open{display:flex;animation:fadeIn .22s ease}
/* 灯箱打开时锁住背景滚动 */
body.lb-lock{overflow:hidden}
.lightbox img{
  position:relative;z-index:1;   /* 图片带 fill 动画会自建层叠上下文，必须显式压到按钮之下 */
  max-width:88vw;max-height:80vh;border-radius:16px;
  box-shadow:0 40px 100px rgba(0,0,0,.6);
  animation:fadeUp .3s cubic-bezier(.2,.7,.2,1) both;
}
.lb-btn{
  position:absolute;z-index:2;width:48px;height:48px;border-radius:50%;
  background:rgba(255,255,255,.1);
  display:grid;place-items:center;color:#fff;
  transition:background .2s,transform .2s;
}
.lb-btn:hover{background:rgba(255,255,255,.22)}
.lb-btn:active{transform:scale(.92)}
.lb-btn svg{width:22px;height:22px}
.lb-prev{left:26px;top:50%;transform:translateY(-50%)}
.lb-next{right:26px;top:50%;transform:translateY(-50%)}
.lb-close{right:22px;top:22px}
.lb-count{
  position:absolute;left:50%;bottom:26px;transform:translateX(-50%);
  z-index:2;
  font-size:13px;color:rgba(255,255,255,.78);
  background:rgba(255,255,255,.1);padding:6px 14px;border-radius:999px;
  max-width:80vw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
@media (max-width:640px){
  .lb-prev{left:8px}.lb-next{right:8px}
  .lb-btn{width:42px;height:42px}
}

/* ===================== 内页标题 ===================== */
.page-head{padding:130px 0 30px}
.page-head h1{
  font-size:clamp(44px,6vw,60px);font-weight:800;
  letter-spacing:-.02em;color:var(--accent);
}
.page-head .sub{margin-top:12px;color:var(--text-2);font-size:15px;line-height:1.7}

/* ===================== 关于页 ===================== */
.about-card{
  background:var(--card);border:1px solid var(--card-border);
  border-radius:var(--radius);box-shadow:var(--shadow);
  padding:44px 42px;margin-bottom:26px;
}
.avatar{
  position:relative;overflow:hidden;
  width:84px;height:84px;border-radius:50%;
  display:grid;place-items:center;
  font-size:32px;font-weight:800;color:#fff;

.skl{background:var(--chip);border-radius:8px}

  border:1px solid var(--card-border);background:var(--bg-2)}
.skl-thumb{width:104px;height:66px;border-radius:10px;flex:none}          /* 与真实封面缩略图同尺寸 */
.skl-mid{flex:1;display:flex;flex-direction:column;gap:9px;min-width:0}
.skl-pill{height:18px;border-radius:999px;width:40%}                      /* 标签条 */
.skl-title{height:16px;border-radius:7px}                                 /* 标题条 */
.skl-desc{height:11px;border-radius:6px}                                  /* 摘要条 */

.skl-year{width:130px;height:15px;margin:10px 0 4px}                      /* 年份条 */

.skl-beam{position:absolute;inset:0;pointer-events:none}
.skl-beam::before{content:"";position:absolute;top:-15%;bottom:-15%;left:0;width:38%;

  transform:translateX(-140%);animation:skl-sweep 1.5s ease-in-out infinite}
@keyframes skl-sweep{to{transform:translateX(420%)}}
/* 数据到达：卡片按顺序错开 60ms 依次浮现（淡入 + 上移 8px 归位） */
.rv{animation:card-in .5s cubic-bezier(.22,.61,.36,1) both}
@keyframes card-in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}

/* 文章页 */
.post-hero{position:relative;height:min(46vh,380px);background:var(--hero-fallback);overflow:hidden}

/* 语言：首次访问跟随操作系统/浏览器语言 —— 中文（zh、zh-CN、zh-TW、zh-HK…）显示中文，
   其它语言一律显示英文；用户在导航栏手动切换过以后，以本地保存的选择为准。 */
function detectLang(){
  try{
    const saved=localStorage.getItem("jy-lang");
    if(saved==="zh"||saved==="en")return saved;
  }catch(e){}
  let list=[];
  try{
    list=(navigator.languages&&navigator.languages.length)?navigator.languages:[navigator.language||""];
  }catch(e){ list=[""]; }
  for(const raw of list){
    const l=String(raw||"").replace(/_/g,"-").toLowerCase();
    if(/^zh\b/.test(l)||l==="zh")return "zh";   /* 各种中文（含繁体、港澳台）都用中文 */
    if(/^en\b/.test(l)||l==="en")return "en";
  }
  return "en";                                   /* 其余语言统一英文 */
}
let lang=(function(){
  try{ const pre=window.__JY_LANG; if(pre==="zh"||pre==="en")return pre; }catch(e){}
  return detectLang();
})();

/* 目录文件清单：优先读服务器的目录列表；静态托管没有目录列表时回退 GitHub API */
async function listDirFiles(dir,regex){
  try{
    /* 直接把相对目录交给 URL 解析：'图片/'、'../图片/' 都能正确落到目录上 */
    const base=new URL(dir,location.href);
    const res=await fetch(base.href);
    if(res.ok){
      const doc=new DOMParser().parseFromString(await res.text(),"text/html");
      const urls=new Set();
      doc.querySelectorAll("a[href]").forEach(a=>{
        let h=a.getAttribute("href");
        if(!h)return;
        h=h.split("#")[0];
        if(!regex.test(h.split("?")[0]))return;
        urls.add(new URL(h,base.href).href);
      });
      if(urls.size)return Array.from(urls);
    }
  }catch(e){}
  return null;
}
async function listFromGitHub(dir){
  try{
    const r=await fetch(`https://api.github.com/repos/${GH_REPO}/contents/${encodeURIComponent(dir)}?ref=${GH_BRANCH}`,
      {headers:{Accept:"application/vnd.github+json"}});
    if(!r.ok)return null;
    const arr=await r.json();
    if(!Array.isArray(arr))return null;
    const files=arr.filter(x=>x.type==="file"&&IMG_RE.test(x.name));
    if(!files.length)return null;
    /* 站点可能部署在域名根路径，也可能在子目录（如 /one/）。
       GitHub API 给的是仓库根目录相对路径，直链拼法要靠探针验证：
       先试页面相对路径，再试域名根路径，都不行就用 GitHub raw 直链。 */
    const bases=[
      new URL(dir,location.href),
      new URL("/"+encodeURIComponent(dir)+"/",location.origin)
    ];
    for(const base of bases){
      let ok=false;
      try{
        const probe=await fetch(new URL(encodeURIComponent(files[0].name),base).href,{method:"HEAD"});
        ok=probe.ok&&(probe.headers.get("content-type")||"").toLowerCase().startsWith("image");
      }catch(e){}
      if(ok)return files.map(x=>new URL(encodeURIComponent(x.name),base).href);
    }
    const raw=files.map(x=>x.download_url).filter(Boolean);
    return raw.length?raw:null;
  }catch(e){ return null; }
}
function nameOf(src){
  return decodeURIComponent(String(src).split("/").pop().split("?")[0]);
}
function sortPhotos(){
  photos.sort((a,b)=>b.name.localeCompare(a.name,"zh-Hans-CN",{numeric:true}));
}
async function loadPhotos(){
  let urls=null;
  for(const dir of PHOTO_DIRS){
    urls=await listDirFiles(dir,IMG_RE);
    if(urls)break;
  }
  if(!urls && location.protocol!=="file:") urls=await listFromGitHub("图片");

  if(urls){
    photos=urls.map(src=>{
      const file=nameOf(src);
      return {src,name:file.replace(/\.[^.]+$/,""),fb:""};
    });
    sortPhotos();
    photosStatus="ready";
  }else if(location.protocol==="file:" && PHOTO_FALLBACK.length){
    /* 直接双击打开：读不到目录，用兜底清单，图片分别试 ../图片/ 与 图片/ */
    photos=PHOTO_FALLBACK.map(file=>({
      src:PHOTO_DIRS[1]+encodeURIComponent(file),
      name:file.replace(/\.[^.]+$/,""),
      fb:file
    }));
    photosStatus="ready";
  }else{
    photos=[]; photosStatus="error";
  }
  paintPhotoGrids();
}

/* 照片 <img>：兜底模式下第一张源失败就换另一个目录再试一次 */
function photoImgTag(p){
  const err=p.fb
    ? `this.dataset.s?(this.style.display='none'):(this.dataset.s=1,this.src=this.dataset.alt)`
    : `this.style.display='none'`;
  return `<img src="${esc(p.src)}" alt="${esc(p.name)}" loading="lazy" decoding="async"
    ${p.fb?`data-alt="${esc(PHOTO_DIRS[0]+encodeURIComponent(p.fb))}"`:""}
    onerror="${err}">`;
}
function photoTilesHtml(limit){
  if(photosStatus==="loading"){
    const n=Math.min(limit||8,8);
    return Array.from({length:n}).map(()=>`<div class="ph-tile ph-skel"></div>`).join("");
  }
  if(!photos.length){
    const msg=photosStatus==="error"?T().gallery.err:T().gallery.empty;
    return `<div class="ph-empty">${msg}</div>`;
  }
  const total=limit>0?Math.min(limit,photos.length):photos.length;
  return photos.slice(0,total).map((p,i)=>{
    const more=(limit>0 && limit<photos.length && i===total-1);
    return `<div class="ph-tile" data-idx="${i}" role="button" tabindex="0" aria-label="${esc(p.name)}">
      ${photoImgTag(p)}
      <span class="ph-cap">${esc(p.name)}</span>
      ${more?`<div class="ph-more">+${photos.length-limit}</div>`:""}
    </div>`;
  }).join("");
}
/* 把页面上所有占位容器填上照片（首页预览用 limit，图库页用全部） */
function paintPhotoGrids(){
  document.querySelectorAll("[data-photo-grid]").forEach(el=>{
    const limit=Number(el.dataset.photoGrid)||0;
    el.innerHTML=photoTilesHtml(limit);
  });
  const sub=$("#gallerySub");
  if(sub)sub.textContent=photos.length?T().gallery.sub(photos.length):"";
}

/* ---------- 灯箱 ---------- */
let lbIndex=0, lbFocus=null;
function setLbImg(p){
  const img=$("#lbImg");
  img.onerror=null;
  img.removeAttribute("data-alt");
  img.src=p.src;
  if(p.fb){
    img.dataset.alt=PHOTO_DIRS[0]+encodeURIComponent(p.fb);
    img.onerror=function(){
      if(img.dataset.s){img.onerror=null;return}
      img.dataset.s="1"; img.src=img.dataset.alt;
    };
  }
}
function openLb(i){
  if(!photos.length)return;
  lbIndex=(i+photos.length)%photos.length;
  showLb();
  lbFocus=document.activeElement;                 /* 关掉灯箱后把焦点还给刚才那张图 */
  $("#lightbox").classList.add("open");
  document.body.classList.add("lb-lock");         /* 锁住背景滚动 */
  try{ $("#lbClose").focus(); }catch(e){}
}
function showLb(){
  const p=photos[lbIndex];
  if(!p)return;
  setLbImg(p);
  $("#lbImg").alt=p.name;
  $("#lbCount").textContent=`${lbIndex+1} / ${photos.length} · ${p.name}`;
}
function closeLb(){
  $("#lightbox").classList.remove("open");
  document.body.classList.remove("lb-lock");
  if(lbFocus&&typeof lbFocus.focus==="function"){ try{ lbFocus.focus(); }catch(e){} }
  lbFocus=null;
}
function stepLb(d){ openLb(lbIndex+d); }

/* =====================================================================
 *  博客：文章就是 blog 文件夹里的内容本身，不需要任何清单文件
 *    · 子文件夹文章：blog/<名字>/index.md ＋ 同一文件夹里的图片
 *    · 单文件文章：  blog/<名字>.md（图片放在 blog 根目录）
 *  文章列表靠「扫描目录」得到，两种来源自动适配：
 *    ① 本地服务器 / 支持目录列表的托管 → 解析目录页里的文件夹与 .md 文件（本地、实时）
 *    ② 静态托管没有目录列表（如 Cloudflare Pages）→ 走 GitHub 仓库目录 ＋ raw 直链
 * ===================================================================== */
let blogCache=null, blogErr=false;
const BLOG_WEB_DIRS=["blog/","../blog/"];   /* 相对本页的路径：本地服务器 / 托管 */
const BLOG_REPO_DIRS=["blog","new/blog"];   /* 仓库里的路径：GitHub 兜底 */
const GH_RAW=`https://raw.githubusercontent.com/${GH_REPO}/${GH_BRANCH}/`;
/* 是否本地打开：本地目录列表实时可用，不走清单与缓存（写完刷新就能看到） */
const IS_LOCAL=location.protocol==="file:"||
  /^(localhost|127\.0\.0\.1|0\.0\.0\.0|\[::1\]|192\.168\.|10\.|172\.(1[6-9]|2\d|3[01])\.)/i.test(location.hostname);
const LS_BLOG="jy-blog-list-v1", LS_BLOG_TTL=10*60*1000;   /* 部署环境的列表缓存：10 分钟内秒开 */
const byDateDesc=(a,b)=>(b.date||"").localeCompare(a.date||"");
function lsRead(){
  try{
    const o=JSON.parse(localStorage.getItem(LS_BLOG)||"null");
    if(o&&Array.isArray(o.posts)&&o.posts.length)return o;
  }catch(e){}
  return null;
}
function lsSave(posts){try{localStorage.setItem(LS_BLOG,JSON.stringify({t:Date.now(),posts}));}catch(e){}}
function samePosts(a,b){return JSON.stringify(a)===JSON.stringify(b);}
/* ⓪ 部署环境优先读静态清单 blog/index.json：一次几 KB 的请求＝整份列表，
      图片与正文全部走本站域名（Cloudflare CDN），不再碰 GitHub API / raw。
      清单由 scripts/gen-blog-index.mjs 自动生成（GitHub Action 或 Pages 构建命令运行），无需手动维护 */
async function manifestPosts(){
  try{
    const r=await fetch("blog/index.json?t="+Date.now(),{cache:"no-store"});
    if(!r.ok)return null;
    const j=await r.json();
    if(!j||!Array.isArray(j.posts))return null;
    return j.posts.filter(p=>p&&p.slug&&p.md).map(p=>({
      slug:String(p.slug),
      mdURL:encodeURI(String(p.md)),
      imgBase:encodeURI(String(p.imgBase||"")),
      title:p.title||p.slug,desc:p.desc||"",
      tags:Array.isArray(p.tags)?p.tags:[],
      date:p.date||"",
      minutes:+p.minutes||1,
      cover:p.cover||"",bg:p.bg||p.background||"",
      coverThumb:p.coverThumb?encodeURI(String(p.coverThumb)):"",
      bgThumb:p.bgThumb?encodeURI(String(p.bgThumb)):"",
      imgMap:(p.imgs&&typeof p.imgs==="object")?p.imgs:null
    })).sort(byDateDesc);
  }catch(e){return null;}
}

/* 解析「目录列表」页 → [{name,dir}]；不是目录列表就返回 null */
async function listingItems(base){
  try{
    const r=await fetch(base+"?t="+Date.now(),{cache:"no-store"});
    if(!r.ok)return null;
    if(!(r.headers.get("content-type")||"").toLowerCase().includes("html"))return null;
    const html=await r.text();
    const items=[],seen=new Set();
    new DOMParser().parseFromString(html,"text/html").querySelectorAll("a[href]").forEach(a=>{
      let h=(a.getAttribute("href")||"").split(/[?#]/)[0].replace(/^\.\//,"");
      if(!h||/^[a-z][a-z0-9+.-]*:/i.test(h)||h.startsWith("/")||h.startsWith(".."))return;
      const dir=h.endsWith("/");
      let name=h.replace(/\/+$/,"");
      try{name=decodeURIComponent(name);}catch(e){}
      if(!name||name.includes("/"))return;
      if(!dir&&!/\.md$/i.test(name))return;
      if(seen.has(name))return;seen.add(name);
      items.push({name:name,dir:dir});
    });
    const isListing=items.length>0||/directory listing for|index of\s*\/|<h1>\s*index\b/i.test(html);
    return isListing?items:null;
  }catch(e){return null;}
}
/* 把一篇 Markdown 读成文章对象（mdURL = 正文地址，imgBase = 图片前缀） */
async function grabPost(slug,mdURL,imgBase,found){
  if(!slug||found.has(slug))return;
  let raw;
  try{
    const r=await fetch(mdURL+(mdURL.includes("?")?"&":"?")+"t="+Date.now(),{cache:"no-store"});
    if(!r.ok)return;
    raw=await r.text();
  }catch(e){return;}
  const {meta,body}=parsePost(raw);
  const tags=Array.isArray(meta.tags)?meta.tags
    :(meta.tags?String(meta.tags).split(/[,，]/).map(x=>x.trim()).filter(Boolean):[]);
  found.set(slug,{
    slug,mdURL,imgBase,
    title:meta.title||slug,desc:meta.desc||"",tags,
    date:meta.date||"",
    minutes:+meta.minutes||Math.max(1,Math.round(body.replace(/\s/g,"").length/450)),
    cover:meta.cover||"",bg:meta.background||""
  });
}
/* ① 扫本地 / 托管的目录列表（多篇并行抓取） */
async function scanWebDir(absBase,found){
  const items=await listingItems(absBase);
  if(!items)return false;
  await Promise.all(items.map(it=>{
    const seg=encodeURIComponent(it.name);
    return grabPost(it.dir?it.name:it.name.replace(/\.md$/i,""),
      absBase+seg+(it.dir?"/index.md":""),
      absBase+(it.dir?seg+"/":""),found);
  }));
  return true;
}
/* ② 静态托管没有目录列表时，按仓库目录扫（GitHub API ＋ raw 直链，多篇并行） */
async function scanGitHubDir(repoDir,found){
  let arr;
  try{
    const r=await fetch(`https://api.github.com/repos/${GH_REPO}/contents/${repoDir}?ref=${GH_BRANCH}`,
      {headers:{Accept:"application/vnd.github+json"}});
    if(!r.ok)return false;
    arr=await r.json();
  }catch(e){return false;}
  if(!Array.isArray(arr))return false;
  await Promise.all(arr.map(it=>{
    const seg=encodeURIComponent(it.name);
    if(it.type==="dir")
      return grabPost(it.name,`${GH_RAW}${repoDir}/${seg}/index.md`,`${GH_RAW}${repoDir}/${seg}/`,found);
    if(it.type==="file"&&/\.md$/i.test(it.name))
      return grabPost(it.name.replace(/\.md$/i,""),`${GH_RAW}${repoDir}/${seg}`,`${GH_RAW}${repoDir}/`,found);
    return Promise.resolve();
  }));
  return true;
}
/* 扫描链路：本地/托管目录列表 → GitHub 兜底 */
async function fetchBlogData(){
  const found=new Map(),seen=new Set();let ok=false;
  for(const base of BLOG_WEB_DIRS){
    let abs;
    try{abs=new URL(base,location.href).href;}catch(e){continue;}
    if(seen.has(abs))continue;          /* 站点就在根目录时，两个基址是同一个地址 */
    seen.add(abs);
    try{ if(await scanWebDir(abs,found))ok=true; }catch(e){}
  }
  if(!found.size){
    for(const dir of BLOG_REPO_DIRS){
      try{ if(await scanGitHubDir(dir,found))ok=true; }catch(e){}
      if(found.size)break;
    }
  }
  return {posts:Array.from(found.values()).sort(byDateDesc),ok};
}
async function loadBlog(){
  if(blogCache)return blogCache;
  /* 部署环境：优先读静态清单（一次请求、走 CDN，最快） */
  if(!IS_LOCAL){
    const m=await manifestPosts();
    if(m&&m.length){blogCache=m;blogErr=false;lsSave(m);return blogCache;}
  }
  /* 本地：目录列表实时可用，直接扫，保证「写完刷新就能看到」 */
  if(IS_LOCAL){
    const r=await fetchBlogData();
    blogCache=r.posts;blogErr=!r.ok&&!r.posts.length;
    return blogCache;
  }
  /* 部署但没有清单：先吃 10 分钟内的本地缓存秒开，同时后台静默刷新 */
  const ls=lsRead();
  if(ls&&Date.now()-ls.t<LS_BLOG_TTL){
    blogCache=ls.posts;blogErr=false;
    refreshBlogInBackground();
    return blogCache;
  }
  const r=await fetchBlogData();
  if(r.posts.length){blogCache=r.posts;blogErr=false;lsSave(r.posts);}
  else if(ls){blogCache=ls.posts;blogErr=false;}   /* 网络抽风也有旧列表兜底 */
  else{blogCache=[];blogErr=true;}
  return blogCache;
}
/* 后台静默刷新：拿到新列表后就地更新（不重滚页面、不丢搜索词） */
let blogBgBusy=false;
async function refreshBlogInBackground(){
  if(blogBgBusy)return;blogBgBusy=true;
  try{
    const r=await fetchBlogData();
    if(r.posts.length&&!samePosts(r.posts,blogCache)){
      blogCache=r.posts;
      if(!IS_LOCAL)lsSave(r.posts);
      window.dispatchEvent(new CustomEvent("bloglist"));
    }
  }catch(e){}
  blogBgBusy=false;
}

/* 解析 front matter（--- 包围的元信息）与正文 */
function parsePost(raw){
  const meta={};let body=raw;
  const m=raw.match(/^---\r?\n([\s\S]*?)\r?\n---\r?\n?([\s\S]*)$/);
  if(m){
    m[1].split(/\r?\n/).forEach(line=>{
      const kv=line.match(/^([A-Za-z][\w-]*):\s*(.*)$/);
      if(!kv)return;
      let v=kv[2].trim();
      if(/^\[.*\]$/.test(v)){
        try{v=JSON.parse(v);}
        catch(e){v=v.slice(1,-1).split(",").map(s=>s.trim().replace(/^["']|["']$/g,"")).filter(Boolean);}
      }else v=v.replace(/^["']|["']$/g,"");
      meta[kv[1].toLowerCase()]=v;
    });
    body=m[2];
  }
  return {meta,body};
}
/* 极简 Markdown 渲染：标题/引用/代码块/列表/图片/链接/加粗/斜体/行内码/分隔线 */
function mdToHTML(md,imgBase,imgMap){
  /* 正文图片缩略图映射：文件名 → 构建时压缩的 WebP 版本 */
  const imgHit=src=>{
    if(!imgMap)return null;
    if(imgMap[src])return imgMap[src];
    try{ return imgMap[decodeURIComponent(src)]||null; }catch(e){ return null; }
  };
  const inline=s=>{
    s=esc(s);
    /* 图片/链接路径允许空格与一层括号（Windows 截图等文件名常带空格/括号） */
    s=s.replace(/!\[([^\]]*)\]\(((?:[^()]|\([^()]*\))+)\)/g,(m,alt,src)=>{
      src=src.trim();
      let u;
      if(/^(https?:|data:|\/)/.test(src))u=src;
      else{
        const hit=imgHit(src);
        u=hit?encodeURI(hit):imgBase+src;
      }
      return `<img src="${u}" alt="${alt}" loading="lazy" decoding="async">`;
    });
    s=s.replace(/\[([^\]]+)\]\(((?:[^()]|\([^()]*\))+)\)/g,(m,txt,href)=>
      `<a href="${href.trim()}" target="_blank" rel="noopener">${txt}</a>`);
    s=s.replace(/\*\*([^*]+)\*\*/g,"<strong>$1</strong>")
       .replace(/\*([^*]+)\*/g,"<em>$1</em>")
       .replace(/`([^`]+)`/g,"<code>$1</code>");
    return s;
  };
  const lines=md.split(/\r?\n/),out=[];let i=0;
  const BLOCK=/^(#{1,4})\s+|^```|^\s*>|^\s*[-*+]\s+|^\s*\d+[.)]\s+|^\s*(---+|\*\*\*+)\s*$|^\|[lcr]\s/;
  const ALIGN={l:"left",c:"center",r:"right"};
  while(i<lines.length){
    const L=lines[i];
    if(/^```/.test(L)){
      const buf=[];i++;
      while(i<lines.length&&!/^```/.test(lines[i])){buf.push(lines[i]);i++;}
      i++;
      out.push(`<pre><code>${esc(buf.join("\n"))}</code></pre>`);continue;
    }
    /* 对齐段落：|l 文字 / |c 文字 / |r 文字（连续几行算一段） */
    const am=L.match(/^\|([lcr])\s+(.*)/);
    if(am){
      const buf=[am[2]];i++;
      while(i<lines.length&&!/^\s*$/.test(lines[i])&&!BLOCK.test(lines[i])){buf.push(lines[i]);i++;}
      out.push(`<p style="text-align:${ALIGN[am[1]]}">${inline(buf.join(" "))}</p>`);
      continue;
    }
    const h=L.match(/^(#{1,4})\s+(.*)/);
    if(h){const lv=h[1].length+1;out.push(`<h${lv}>${inline(h[2])}</h${lv}>`);i++;continue;}
    if(/^\s*(---+|\*\*\*+)\s*$/.test(L)){out.push("<hr>");i++;continue;}
    if(/^\s*>\s?/.test(L)){
      const buf=[];
      while(i<lines.length&&/^\s*>\s?/.test(lines[i])){buf.push(lines[i].replace(/^\s*>\s?/,""));i++;}
      out.push(`<blockquote>${inline(buf.join(" "))}</blockquote>`);continue;
    }
    if(/^\s*[-*+]\s+/.test(L)){
      const buf=[];
      while(i<lines.length&&/^\s*[-*+]\s+/.test(lines[i])){buf.push(lines[i].replace(/^\s*[-*+]\s+/,""));i++;}
      out.push(`<ul>${buf.map(x=>`<li>${inline(x)}</li>`).join("")}</ul>`);continue;
    }
    if(/^\s*\d+[.)]\s+/.test(L)){
      const buf=[];
      while(i<lines.length&&/^\s*\d+[.)]\s+/.test(lines[i])){buf.push(lines[i].replace(/^\s*\d+[.)]\s+/,""));i++;}
      out.push(`<ol>${buf.map(x=>`<li>${inline(x)}</li>`).join("")}</ol>`);continue;
    }
    if(/^\s*$/.test(L)){i++;continue;}
    const buf=[];
    while(i<lines.length&&!/^\s*$/.test(lines[i])&&!BLOCK.test(lines[i])){buf.push(lines[i]);i++;}
    out.push(`<p>${inline(buf.join(" "))}</p>`);
  }
  return out.join("");
}

/* 转义后高亮：命中片段包 <mark>，不会引入 HTML 注入 */
function hiText(str,q){

async function renderPost(slug){
  const t=T();
  app.innerHTML=`<section class="view">

  let raw="";

    raw=await r.text();

  const {meta,body}=parsePost(raw);
  const title=meta.title||post.title||t.blog.untitled;
  const desc=meta.desc||post.desc||"";
  const tags=meta.tags||post.tags||[];

  const bg=meta.background||post.bg||"";
  /* 文章页头图优先用构建时压缩的 1600px WebP 版（bgThumb 是站点相对路径，不要再拼前缀） */
  const bgThumb=(post.bgThumb||meta.bgThumb||"");
  const bgImg=bgThumb?esc(bgThumb):(bg?esc(postSrc(post,bg)):"");
  app.innerHTML=`
  <section class="view">
    <div class="post-hero">${bgImg?`<img class="post-bg" src="${bgImg}" alt="" decoding="async" onerror="this.remove()">`:""}</div>
    <div class="wrap">
      <a class="post-back" href="#/blog"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg>${esc(t.blog.back)}</a>
      <header class="post-head">
        ${tags.length?`<div class="post-tags">${tags.map(x=>`<span class="tag">${esc(x)}</span>`).join("")}</div>`:""}

/* ---------- 路由 ---------- */
let pendingScroll=null;   /* 带锚点的路由：渲染后要缓缓滑到的板块 id */
/* 缓速滑动：比浏览器原生 smooth 更从容（约 1 秒），用户滚轮/触摸可随时打断 */
function glideTo(y,dur){
  if(window.matchMedia&&matchMedia("(prefers-reduced-motion: reduce)").matches){window.scrollTo(0,y);return;}
  const startY=window.scrollY,d=y-startY,t0=performance.now();
  const ease=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;   /* easeInOutCubic：起停都柔 */
  let stop=false;
  const cancel=()=>{stop=true};
  window.addEventListener("wheel",cancel,{once:true,passive:true});
  window.addEventListener("touchstart",cancel,{once:true,passive:true});
  const root=document.documentElement,prev=root.style.scrollBehavior;
  root.style.scrollBehavior="auto";                    /* 逐帧设值，不能让 CSS smooth 插手 */
  let last=startY;                                     /* 单调钳制：杜绝任何帧间的 1px 回抖 */
  (function step(now){
    if(stop){root.style.scrollBehavior=prev;return;}
    const p=Math.min(1,Math.max(0,(now-t0)/dur));
    const v=startY+d*ease(p);
    last=d>=0?Math.max(last,v):Math.min(last,v);
    window.scrollTo(0,last);
    if(p<1)requestAnimationFrame(step);
    else root.style.scrollBehavior=prev;
  })(t0);
}
function route(){
  const hash=location.hash.replace(/^#\/?/,"");
  const parts=hash.split("/").filter(Boolean);
  let active="home";
  if(parts[0]==="gallery"){active="gallery";renderGallery()}
  else if(parts[0]==="blog"){
    active="blog";
    if(parts[1])renderPost(decodeURIComponent(parts.slice(1).join("/")));
    else renderBlog();
  }
  else if(parts[0]==="about"){
    active="about";renderAbout();
    /* #/about/projects → 渲染后平滑滚到项目板块 */
    if(parts[1]==="projects")pendingScroll="aboutProjects";
  }
  else if(parts[0]==="projects"){location.replace("#/about/projects");return}  /* 旧链接兜底：项目已并入关于页 */
  else renderHome();
  document.querySelectorAll(".nav-link").forEach(el=>
    el.classList.toggle("active",el.dataset.nav===active));
  /* 切页回到顶部：html 上挂着 scroll-behavior:smooth，
     这里先临时关掉再滚，免得每次切页都慢慢「滑」上去 */
  const root=document.documentElement,
        prevSmooth=root.style.scrollBehavior;
  root.style.scrollBehavior="auto";
  /* 带锚点的路由（如 #/about/projects）：先正常展示「关于」页顶部，
     然后页面再缓缓下滑到项目板块 */
  const anchor=pendingScroll?document.getElementById(pendingScroll):null;
  pendingScroll=null;
  if(anchor){
    const y=anchor.getBoundingClientRect().top+window.scrollY-86;
    window.scrollTo(0,0);
    root.style.scrollBehavior=prevSmooth;
    requestAnimationFrame(()=>glideTo(y,950));
  }else{
    window.scrollTo(0,0);
    root.style.scrollBehavior=prevSmooth;
  }
}
window.addEventListener("hashchange",route);

  const sc=e.target.closest("[data-scroll-to]");
  if(sc){
    const target=document.getElementById(sc.dataset.scrollTo);
    if(target)target.scrollIntoView({behavior:"smooth",block:"start"});
    return;
  }
  const tile=e.target.closest(".ph-tile");
  if(!tile||tile.dataset.idx===undefined||tile.classList.contains("ph-skel"))return;
  /* 带「+N」角标的瓷砖 → 跳转图库页，而不是开灯箱 */
  if(tile.querySelector(".ph-more")){location.hash="#/gallery";return;}
  openLb(Number(tile.dataset.idx));
});
document.addEventListener("keydown",e=>{
  if($("#lightbox").classList.contains("open")){
    if(e.key==="Escape")closeLb();
    else if(e.key==="ArrowLeft")stepLb(-1);
    else if(e.key==="ArrowRight")stepLb(1);
    return;
  }
  const tile=document.activeElement;
  if(tile&&tile.classList&&tile.classList.contains("ph-tile")&&(e.key==="Enter"||e.key===" ")){
    e.preventDefault();
    if(tile.querySelector(".ph-more")){location.hash="#/gallery";return;}
    openLb(Number(tile.dataset.idx));
  }
});
