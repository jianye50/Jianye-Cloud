<!-- 站点图标：站点根目录的 icon.ico（本页在子目录里也能取到） -->
<link rel="icon" href="../icon.ico" sizes="any">
<link rel="apple-touch-icon" href="../icon.ico">
<!-- 移动端地址栏配色（站点固定深色） -->
<meta name="theme-color" content="#0b0d12">
<!-- 分享卡片预览 -->
<meta property="og:type" content="website">
<meta property="og:site_name" content="鉴业の小站">

<meta name="twitter:card" content="summary_large_image">
<!-- 首屏大图所在的图床，提前建连 -->
<link rel="preconnect" href="https://images.unsplash.com" crossorigin>
<!-- 语言：首次访问先按系统语言定好（中文→中文，其它语言→英文），
     免得英文用户先看到一闪而过的中文标题 / 语言标记。手动切换过的以本地保存为准。 -->
<script>
(function(){
  var s=null; try{ s=localStorage.getItem("jy-lang"); }catch(e){}
  if(s!=="zh"&&s!=="en"){
    var list=[], i;
    try{ list=(navigator.languages&&navigator.languages.length)?navigator.languages:[navigator.language||""]; }
    catch(e){ list=[""]; }
    s="en";                                   /* 默认英文：非中文一律英文 */
    for(i=0;i<list.length;i++){
      var l=String(list[i]||"").replace(/_/g,"-").toLowerCase();
      if(l.indexOf("zh")===0){ s="zh"; break; }   /* zh / zh-CN / zh-TW / zh-HK… 都算中文 */
      if(l.indexOf("en")===0){ s="en"; break; }
    }
  }
  window.__JY_LANG=s;
  document.documentElement.lang=(s==="zh")?"zh-CN":"en";
  if(s!=="zh") document.title="Jianye's Corner";
})();
</script>
<style>
/* ===================== 主题变量 =====================
   站点固定深色（<html data-theme="dark">），不再有浅色皮肤，
   所以这里只保留深色一套变量。 */
:root{
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text",
         "PingFang SC","HarmonyOS Sans SC","Microsoft YaHei","Segoe UI",sans-serif;
  --maxw:1080px;
  --radius:20px;
  --accent:#4d8dff;
  --accent-soft:rgba(77,141,255,.14);
  --bg:#0b0d12;
  --bg-2:#10131a;
  --text-1:#f4f5f7;
  --text-2:rgba(244,245,247,.68);
  --text-3:rgba(244,245,247,.42);
  --card:#151923;
  --card-border:rgba(255,255,255,.08);
  --chip:rgba(255,255,255,.08);
  --shadow:0 10px 34px rgba(0,0,0,.45);
  --shadow-lg:0 24px 60px rgba(0,0,0,.55);
  --hero-fallback:linear-gradient(160deg,#10141d 0%,#1d2637 55%,#3a2e22 100%);
  --img-placeholder:linear-gradient(135deg,#232c3e,#39455e);
  color-scheme:dark;
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  font-family:var(--font);
  background:var(--bg);
  color:var(--text-1);
  min-height:100vh;
  -webkit-font-smoothing:antialiased;
  overflow-x:hidden;
}
button{font-family:inherit;color:inherit;border:none;background:none;cursor:pointer}
a{color:inherit;text-decoration:none}
img{display:block;max-width:100%}
::selection{background:var(--accent);color:#fff}

/* ===================== 悬浮胶囊导航（Apple 液态玻璃） ===================== */
.nav{
  position:fixed;top:14px;left:50%;transform:translateX(-50%);
  z-index:100;
  display:flex;align-items:center;gap:2px;
  height:48px;padding:0 10px 0 18px;
  border-radius:999px;
  white-space:nowrap;
  max-width:calc(100vw - 24px);
  isolation:isolate;
  /* 液态玻璃基体：高透 + 折射感模糊 + 提亮 */
  background:linear-gradient(
    120deg,
    rgba(255,255,255,.16) 0%,
    rgba(255,255,255,.07) 38%,
    rgba(255,255,255,.12) 62%,
    rgba(255,255,255,.05) 100%);
  backdrop-filter:blur(22px) saturate(200%) brightness(1.12);
  -webkit-backdrop-filter:blur(22px) saturate(200%) brightness(1.12);
  border:none;
  /* 液态玻璃棱边：外圈微光 + 顶部受光高光 + 底部收光 + 落影 */
  box-shadow:
    inset 0 0 0 1px rgba(255,255,255,.22),
    inset 0 1.5px .5px -1px rgba(255,255,255,.65),
    inset 0 -1px .5px -1px rgba(255,255,255,.28),
    inset 0 12px 18px -12px rgba(255,255,255,.30),
    0 2px 6px rgba(6,10,25,.10),
    0 14px 38px rgba(6,10,25,.28);
  transition:box-shadow .35s ease,transform .35s ease;
}
/* 斜向流光切面：一层扫过玻璃面的柔和高光 */
.nav::before{
  content:"";position:absolute;inset:0;border-radius:inherit;
  pointer-events:none;z-index:0;
  background:linear-gradient(
    105deg,
    rgba(255,255,255,.30) 0%,
    rgba(255,255,255,.06) 22%,
    transparent 46%,
    transparent 68%,
    rgba(255,255,255,.10) 100%);
  mix-blend-mode:screen;
  opacity:.8;
}
/* 玻璃厚度感：底部内侧一道暗折射 */
.nav::after{
  content:"";position:absolute;inset:0;border-radius:inherit;
  pointer-events:none;z-index:0;
  box-shadow:inset 0 -10px 14px -12px rgba(0,0,0,.35);
}
.nav>*{position:relative;z-index:1}
.nav:hover{
  box-shadow:
    inset 0 0 0 1px rgba(255,255,255,.30),
    inset 0 1.5px .5px -1px rgba(255,255,255,.8),
    inset 0 -1px .5px -1px rgba(255,255,255,.34),
    inset 0 12px 18px -12px rgba(255,255,255,.38),
    0 2px 8px rgba(6,10,25,.12),
    0 20px 48px rgba(6,10,25,.34);
}
.nav-brand{
  display:flex;align-items:center;gap:8px;
  font-weight:700;font-size:15px;margin-right:14px;
}
.nav-brand .dot{
  width:8px;height:8px;border-radius:50%;
  background:var(--accent);
  box-shadow:0 0 0 4px var(--accent-soft);
}
.nav-link{
  padding:7px 13px;border-radius:999px;
  font-size:14px;color:var(--text-2);
  transition:color .2s,background .2s;
}
.nav-link:hover{color:var(--text-1);background:var(--chip)}
.nav-link.active{color:var(--accent);font-weight:600}
.nav-sep{width:1px;height:20px;background:rgba(255,255,255,.22);margin:0 8px;box-shadow:1px 0 0 rgba(0,0,0,.10)}
.nav-icon{
  width:34px;height:34px;border-radius:50%;
  display:grid;place-items:center;
  color:var(--text-2);font-size:14px;
  transition:color .2s,background .2s,transform .3s;
}
.nav-icon:hover{color:var(--text-1);background:var(--chip)}
.nav-icon:active{transform:scale(.9)}
.nav-icon svg{width:17px;height:17px;fill:currentColor}
@media (max-width:640px){
  .nav{gap:0;padding:0 8px}
  .nav-brand{display:none}   /* 手机端站名不显示，占位也一并去掉，内容才能左右居中 */
  .nav-link{padding:7px 9px;font-size:13px}
}
/* ===================== 视图容器与动画 ===================== */
#app{min-height:100vh}
.view{animation:fadeUp .55s cubic-bezier(.2,.7,.2,1) both}
@keyframes fadeUp{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.wrap{max-width:var(--maxw);margin:0 auto;padding:0 24px}
@media (max-width:640px){.wrap{padding:0 18px}}

/* ===================== 首页 Hero ===================== */
.hero{
  position:relative;min-height:100vh;
  display:flex;align-items:center;
  background:var(--hero-fallback);
  overflow:hidden;
}
.hero-img{
  position:absolute;inset:0;width:100%;height:100%;
  object-fit:cover;
  animation:heroIn 1.6s cubic-bezier(.2,.7,.2,1) both;
}
@keyframes heroIn{from{transform:scale(1.08);opacity:.4}to{transform:none;opacity:1}}
.hero::after{
  content:"";position:absolute;inset:0;
  background:linear-gradient(100deg,rgba(8,12,24,.62) 0%,rgba(8,12,24,.34) 46%,rgba(8,12,24,.14) 100%),
             linear-gradient(to top,rgba(8,12,24,.42),transparent 36%);
}
.hero-inner{position:relative;z-index:2;animation:fadeUp .9s .15s cubic-bezier(.2,.7,.2,1) both}
.hero-badge{
  display:inline-flex;align-items:center;gap:8px;
  padding:7px 15px;border-radius:999px;
  /* 液态玻璃材质（同导航栏）：高透渐变 + 折射模糊 + 棱边高光 */
  background:linear-gradient(
    120deg,
    rgba(255,255,255,.16) 0%,
    rgba(255,255,255,.07) 38%,
    rgba(255,255,255,.12) 62%,
    rgba(255,255,255,.05) 100%);
  backdrop-filter:blur(22px) saturate(200%) brightness(1.12);
  -webkit-backdrop-filter:blur(22px) saturate(200%) brightness(1.12);
  border:none;
  box-shadow:
    inset 0 0 0 1px rgba(255,255,255,.22),
    inset 0 1.5px .5px -1px rgba(255,255,255,.65),
    inset 0 -1px .5px -1px rgba(255,255,255,.28),
    inset 0 12px 18px -12px rgba(255,255,255,.30),
    0 2px 6px rgba(6,10,25,.10),
    0 14px 38px rgba(6,10,25,.28);
  color:rgba(255,255,255,.92);
  font-size:12.5px;letter-spacing:.14em;font-weight:600;
}
.hero-badge .pulse{
  width:7px;height:7px;border-radius:50%;
  background:#35d07f;
  box-shadow:0 0 0 0 rgba(53,208,127,.5);
  animation:pulse 2.2s infinite;
}
@keyframes pulse{
  0%{box-shadow:0 0 0 0 rgba(53,208,127,.5)}
  70%{box-shadow:0 0 0 9px rgba(53,208,127,0)}
  100%{box-shadow:0 0 0 0 rgba(53,208,127,0)}
}
.hero h1{
  margin:26px 0 18px;
  font-size:clamp(44px,7.5vw,84px);
  font-weight:800;letter-spacing:-.02em;color:#fff;
  text-shadow:0 4px 30px rgba(0,0,0,.25);
}
.hero p{
  font-size:clamp(16px,2vw,19px);line-height:1.7;
  color:rgba(255,255,255,.86);max-width:480px;
  text-shadow:0 2px 14px rgba(0,0,0,.3);
}
.hero-actions{display:flex;gap:14px;margin-top:38px;flex-wrap:wrap}
.btn{
  display:inline-flex;align-items:center;gap:8px;
  padding:13px 26px;border-radius:12px;
  font-size:15px;font-weight:600;
  transition:transform .2s,box-shadow .2s,background .2s;
}
.btn:hover{transform:translateY(-2px)}
.btn:active{transform:scale(.97)}
.btn-primary{
  background:var(--accent);color:#fff;
  box-shadow:0 10px 26px rgba(77,141,255,.4);
}
.btn-primary:hover{box-shadow:0 14px 32px rgba(77,141,255,.55)}
.btn-ghost{
  background:rgba(255,255,255,.14);
  border:1px solid rgba(255,255,255,.24);
  color:#fff;backdrop-filter:blur(8px);
}
.btn-ghost:hover{background:rgba(255,255,255,.22)}
/* 向下浏览提示：同一位置、同一点击区，按设备类型换形态
   · 电脑（有鼠标）→ 鼠标滚轮图形
   · 触屏（手机/平板）→ 向下滑动箭头（触屏用户没有滚轮，但同样需要知道可以往下翻） */
.scroll-hint{
  position:absolute;left:50%;bottom:34px;transform:translateX(-50%);
  z-index:5;cursor:pointer;display:none;place-items:center;
  color:#fff;text-align:center;
  /* 提示整体加一点投影，压过首屏的明暗渐变，任何背景上都清晰 */
  filter:drop-shadow(0 2px 8px rgba(0,0,0,.5));
}
.sh-mouse{
  display:none;position:relative;
  width:26px;height:42px;
  border:2px solid rgba(255,255,255,.95);
  border-radius:999px;
  /* 玻璃质感填充：不透明白色衬底，深浅背景上都看得清 */
  background:rgba(255,255,255,.14);
  box-shadow:
    inset 0 0 0 1px rgba(255,255,255,.18),
    inset 0 8px 12px -6px rgba(255,255,255,.35);
}
.sh-mouse::before{
  content:"";position:absolute;left:50%;top:8px;
  width:4px;height:9px;margin-left:-2px;border-radius:99px;
  background:#fff;
  box-shadow:0 0 8px rgba(255,255,255,.9);
  animation:wheel 1.8s ease-in-out infinite;
}
.sh-arrow{
  display:none;width:30px;height:30px;
  filter:drop-shadow(0 2px 6px rgba(0,0,0,.4));
  animation:shBob 1.8s ease-in-out infinite;
}
.sh-label{
  display:none;margin-top:2px;font-size:11.5px;letter-spacing:.08em;
  color:#fff;text-shadow:0 2px 8px rgba(0,0,0,.55);
}
/* 电脑：能悬停 + 精确指针 */
@media (hover:hover) and (pointer:fine){
  .scroll-hint{display:grid}
  .sh-mouse{display:block}
}
/* 触屏：无悬停 或 粗指针 */
@media (hover:none),(pointer:coarse){
  .scroll-hint{display:grid}
  .sh-arrow,.sh-label{display:block}
}
@keyframes wheel{
  0%{transform:translateY(0);opacity:1}
  60%{transform:translateY(12px);opacity:0}
  100%{transform:translateY(0);opacity:0}
}
@keyframes shBob{
  0%,100%{transform:translateY(-3px);opacity:.65}
  50%{transform:translateY(5px);opacity:1}
}

/* ===================== 区块标题 ===================== */
.section{padding:64px 0 8px}
.section-label{
  display:flex;align-items:center;gap:14px;
  font-size:12.5px;font-weight:700;letter-spacing:.22em;
  color:var(--text-2);text-transform:uppercase;
  margin-bottom:22px;
}
.section-label::before{
  content:"";width:34px;height:2.5px;border-radius:99px;
  background:var(--accent);
}

/* ===================== 图库：照片墙 ===================== */
.photo-grid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:14px;
  padding:4px 0 10px;
}
@media (max-width:900px){.photo-grid{grid-template-columns:repeat(3,1fr);gap:12px}}
@media (max-width:620px){.photo-grid{grid-template-columns:repeat(2,1fr);gap:10px}}

.ph-tile{
  position:relative;aspect-ratio:1;
  border-radius:16px;overflow:hidden;
  background:var(--img-placeholder);
  border:1px solid var(--card-border);
  box-shadow:var(--shadow);
  cursor:zoom-in;
  transition:transform .35s cubic-bezier(.2,.7,.2,1),box-shadow .35s;
}
.ph-tile:hover{transform:translateY(-4px);box-shadow:var(--shadow-lg)}
.ph-tile:focus-visible{outline:2.5px solid var(--accent);outline-offset:3px}
.ph-tile img{
  width:100%;height:100%;object-fit:cover;
  transition:transform .6s cubic-bezier(.2,.7,.2,1);
}
.ph-tile:hover img{transform:scale(1.06)}
.ph-cap{
  position:absolute;left:10px;right:10px;bottom:9px;
  font-size:11.5px;font-weight:600;color:#fff;
  text-shadow:0 1px 8px rgba(0,0,0,.75);
  opacity:0;transform:translateY(5px);
  transition:opacity .25s,transform .25s;
  pointer-events:none;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.ph-tile:hover .ph-cap{opacity:1;transform:none}
.ph-tile::after{
  content:"";position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(to top,rgba(6,10,22,.5),transparent 46%);
  opacity:0;transition:opacity .25s;
}
.ph-tile:hover::after{opacity:1}
.ph-more{
  position:absolute;inset:0;z-index:2;
  display:grid;place-items:center;
  background:rgba(6,10,22,.52);
  backdrop-filter:blur(3px);
  color:#fff;font-size:20px;font-weight:750;letter-spacing:.02em;
}
.ph-skel{animation:skel 1.5s ease-in-out infinite;border-color:transparent}
@keyframes skel{0%,100%{opacity:.55}50%{opacity:.9}}
.ph-empty{
  grid-column:1/-1;
  padding:52px 24px;text-align:center;
  border:1px dashed var(--card-border);border-radius:var(--radius);
  background:var(--card);
  color:var(--text-2);font-size:14px;line-height:1.95;
}
.ph-empty b{color:var(--text-1);font-weight:700}
.ph-empty code{
  font-family:ui-monospace,"SF Mono",Consolas,monospace;
  font-size:.9em;background:var(--chip);padding:2px 7px;border-radius:6px;
}
.section-more{text-align:center;padding:16px 0 30px}
.link-more{
  display:inline-flex;align-items:center;gap:8px;
  padding:11px 26px;border-radius:999px;
  border:1px solid var(--card-border);background:var(--card);
  font-size:14px;font-weight:600;color:var(--text-1);
  box-shadow:var(--shadow);transition:transform .2s,box-shadow .2s,color .2s;
}
.link-more:hover{transform:translateY(-2px);box-shadow:var(--shadow-lg);color:var(--accent)}

/* ===================== 灯箱 ===================== */
.lightbox{
  position:fixed;inset:0;z-index:200;display:none;
  background:rgba(3,7,20,.9);
  backdrop-filter:blur(18px) saturate(150%);
  -webkit-backdrop-filter:blur(18px) saturate(150%);
  align-items:center;justify-content:center;
}
.lightbox.open{display:flex;animation:fadeIn .22s ease}
/* 灯箱打开时锁住背景滚动 */
body.lb-lock{overflow:hidden}
.lightbox img{
  position:relative;z-index:1;   /* 图片带 fill 动画会自建层叠上下文，必须显式压到按钮之下 */
  max-width:88vw;max-height:80vh;border-radius:16px;
  box-shadow:0 40px 100px rgba(0,0,0,.6);
  animation:fadeUp .3s cubic-bezier(.2,.7,.2,1) both;
}
.lb-btn{
  position:absolute;z-index:2;width:48px;height:48px;border-radius:50%;
  background:rgba(255,255,255,.1);
  display:grid;place-items:center;color:#fff;
  transition:background .2s,transform .2s;
}
.lb-btn:hover{background:rgba(255,255,255,.22)}
.lb-btn:active{transform:scale(.92)}
.lb-btn svg{width:22px;height:22px}
.lb-prev{left:26px;top:50%;transform:translateY(-50%)}
.lb-next{right:26px;top:50%;transform:translateY(-50%)}
.lb-close{right:22px;top:22px}
.lb-count{
  position:absolute;left:50%;bottom:26px;transform:translateX(-50%);
  z-index:2;
  font-size:13px;color:rgba(255,255,255,.78);
  background:rgba(255,255,255,.1);padding:6px 14px;border-radius:999px;
  max-width:80vw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
@media (max-width:640px){
  .lb-prev{left:8px}.lb-next{right:8px}
  .lb-btn{width:42px;height:42px}
}

/* ===================== 内页标题 ===================== */
.page-head{padding:130px 0 30px}
.page-head h1{
  font-size:clamp(44px,6vw,60px);font-weight:800;
  letter-spacing:-.02em;color:var(--accent);
}
.page-head .sub{margin-top:12px;color:var(--text-2);font-size:15px;line-height:1.7}

/* ===================== 关于页 ===================== */
.about-card{
  background:var(--card);border:1px solid var(--card-border);
  border-radius:var(--radius);box-shadow:var(--shadow);
  padding:44px 42px;margin-bottom:26px;
}
.avatar{
  position:relative;overflow:hidden;
  width:84px;height:84px;border-radius:50%;
  display:grid;place-items:center;
  font-size:32px;font-weight:800;color:#fff;
  background:linear-gradient(135deg,var(--accent),#7a3bff);
  box-shadow:0 12px 30px rgba(77,141,255,.35);
  margin-bottom:22px;
}
.avatar img{
  position:absolute;inset:0;width:100%;height:100%;
  object-fit:cover;display:block;
}
.about-card .tagline{font-size:14.5px;color:var(--text-3);margin:-8px 0 16px;letter-spacing:.02em}
.chips{display:flex;flex-wrap:wrap;gap:9px;margin:18px 0 6px}
.chips span{
  font-size:13px;color:var(--text-2);
  border:1px solid var(--card-border);border-radius:999px;
  padding:5px 13px;background:var(--bg-2);
}
.socials{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-top:14px}
.socials a{
  display:flex;align-items:center;gap:8px;
  padding:11px 14px;border-radius:12px;
  border:1px solid var(--card-border);background:var(--bg-2);
  font-size:13.5px;color:var(--text-2);font-weight:600;
  transition:transform .2s,box-shadow .2s,color .2s;

/* ---------- 全局状态 ---------- */
/* 语言：首次访问跟随操作系统/浏览器语言 —— 中文（zh、zh-CN、zh-TW、zh-HK…）显示中文，
   其它语言一律显示英文；用户在导航栏手动切换过以后，以本地保存的选择为准。 */
function detectLang(){
  try{
    const saved=localStorage.getItem("jy-lang");
    if(saved==="zh"||saved==="en")return saved;
  }catch(e){}
  let list=[];
  try{
    list=(navigator.languages&&navigator.languages.length)?navigator.languages:[navigator.language||""];
  }catch(e){ list=[""]; }
  for(const raw of list){
    const l=String(raw||"").replace(/_/g,"-").toLowerCase();
    if(/^zh\b/.test(l)||l==="zh")return "zh";   /* 各种中文（含繁体、港澳台）都用中文 */
    if(/^en\b/.test(l)||l==="en")return "en";
  }
  return "en";                                   /* 其余语言统一英文 */
}
let lang=(function(){
  try{ const pre=window.__JY_LANG; if(pre==="zh"||pre==="en")return pre; }catch(e){}
  return detectLang();
})();
/* 站点固定深色：<html data-theme="dark"> 直接写在标签上，

const app=$("#app");
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

/* =====================================================================
 *  图库：扫描目录 → 渲染照片墙 → 灯箱
 * ===================================================================== */

/* 目录文件清单：优先读服务器的目录列表；静态托管没有目录列表时回退 GitHub API */
async function listDirFiles(dir,regex){
  try{
    /* 直接把相对目录交给 URL 解析：'图片/'、'../图片/' 都能正确落到目录上 */
    const base=new URL(dir,location.href);
    const res=await fetch(base.href);
    if(res.ok){
      const doc=new DOMParser().parseFromString(await res.text(),"text/html");
      const urls=new Set();
      doc.querySelectorAll("a[href]").forEach(a=>{
        let h=a.getAttribute("href");
        if(!h)return;
        h=h.split("#")[0];
        if(!regex.test(h.split("?")[0]))return;
        urls.add(new URL(h,base.href).href);
      });
      if(urls.size)return Array.from(urls);
    }
  }catch(e){}
  return null;
}
async function listFromGitHub(dir){
  try{
    const r=await fetch(`https://api.github.com/repos/${GH_REPO}/contents/${encodeURIComponent(dir)}?ref=${GH_BRANCH}`,
      {headers:{Accept:"application/vnd.github+json"}});
    if(!r.ok)return null;
    const arr=await r.json();
    if(!Array.isArray(arr))return null;
    const files=arr.filter(x=>x.type==="file"&&IMG_RE.test(x.name));
    if(!files.length)return null;
    /* 站点可能部署在域名根路径，也可能在子目录（如 /one/）。
       GitHub API 给的是仓库根目录相对路径，直链拼法要靠探针验证：
       先试页面相对路径，再试域名根路径，都不行就用 GitHub raw 直链。 */
    const bases=[
      new URL(dir,location.href),
      new URL("/"+encodeURIComponent(dir)+"/",location.origin)
    ];
    for(const base of bases){
      let ok=false;
      try{
        const probe=await fetch(new URL(encodeURIComponent(files[0].name),base).href,{method:"HEAD"});
        ok=probe.ok&&(probe.headers.get("content-type")||"").toLowerCase().startsWith("image");
      }catch(e){}
      if(ok)return files.map(x=>new URL(encodeURIComponent(x.name),base).href);
    }
    const raw=files.map(x=>x.download_url).filter(Boolean);
    return raw.length?raw:null;
  }catch(e){ return null; }
}
function nameOf(src){
  return decodeURIComponent(String(src).split("/").pop().split("?")[0]);
}
function sortPhotos(){
  photos.sort((a,b)=>b.name.localeCompare(a.name,"zh-Hans-CN",{numeric:true}));
}
async function loadPhotos(){
  let urls=null;
  for(const dir of PHOTO_DIRS){
    urls=await listDirFiles(dir,IMG_RE);
    if(urls)break;
  }
  if(!urls && location.protocol!=="file:") urls=await listFromGitHub("图片");

  if(urls){
    photos=urls.map(src=>{
      const file=nameOf(src);
      return {src,name:file.replace(/\.[^.]+$/,""),fb:""};
    });
    sortPhotos();
    photosStatus="ready";
  }else if(location.protocol==="file:" && PHOTO_FALLBACK.length){
    /* 直接双击打开：读不到目录，用兜底清单，图片分别试 ../图片/ 与 图片/ */
    photos=PHOTO_FALLBACK.map(file=>({
      src:PHOTO_DIRS[1]+encodeURIComponent(file),
      name:file.replace(/\.[^.]+$/,""),
      fb:file
    }));
    photosStatus="ready";
  }else{
    photos=[]; photosStatus="error";
  }
  paintPhotoGrids();
}

/* 照片 <img>：兜底模式下第一张源失败就换另一个目录再试一次 */
function photoImgTag(p){
  const err=p.fb
    ? `this.dataset.s?(this.style.display='none'):(this.dataset.s=1,this.src=this.dataset.alt)`
    : `this.style.display='none'`;
  return `<img src="${esc(p.src)}" alt="${esc(p.name)}" loading="lazy" decoding="async"
    ${p.fb?`data-alt="${esc(PHOTO_DIRS[0]+encodeURIComponent(p.fb))}"`:""}
    onerror="${err}">`;
}
function photoTilesHtml(limit){
  if(photosStatus==="loading"){
    const n=Math.min(limit||8,8);
    return Array.from({length:n}).map(()=>`<div class="ph-tile ph-skel"></div>`).join("");
  }
  if(!photos.length){
    const msg=photosStatus==="error"?T().gallery.err:T().gallery.empty;
    return `<div class="ph-empty">${msg}</div>`;
  }
  const total=limit>0?Math.min(limit,photos.length):photos.length;
  return photos.slice(0,total).map((p,i)=>{
    const more=(limit>0 && limit<photos.length && i===total-1);
    return `<div class="ph-tile" data-idx="${i}" role="button" tabindex="0" aria-label="${esc(p.name)}">
      ${photoImgTag(p)}
      <span class="ph-cap">${esc(p.name)}</span>
      ${more?`<div class="ph-more">+${photos.length-limit}</div>`:""}
    </div>`;
  }).join("");
}
/* 把页面上所有占位容器填上照片（首页预览用 limit，图库页用全部） */
function paintPhotoGrids(){
  document.querySelectorAll("[data-photo-grid]").forEach(el=>{
    const limit=Number(el.dataset.photoGrid)||0;
    el.innerHTML=photoTilesHtml(limit);
  });
  const sub=$("#gallerySub");
  if(sub)sub.textContent=photos.length?T().gallery.sub(photos.length):"";
}

/* ---------- 灯箱 ---------- */
let lbIndex=0, lbFocus=null;
function setLbImg(p){
  const img=$("#lbImg");
  img.onerror=null;
  img.removeAttribute("data-alt");
  img.src=p.src;
  if(p.fb){
    img.dataset.alt=PHOTO_DIRS[0]+encodeURIComponent(p.fb);
    img.onerror=function(){
      if(img.dataset.s){img.onerror=null;return}
      img.dataset.s="1"; img.src=img.dataset.alt;
    };
  }
}
function openLb(i){
  if(!photos.length)return;
  lbIndex=(i+photos.length)%photos.length;
  showLb();
  lbFocus=document.activeElement;                 /* 关掉灯箱后把焦点还给刚才那张图 */
  $("#lightbox").classList.add("open");
  document.body.classList.add("lb-lock");         /* 锁住背景滚动 */
  try{ $("#lbClose").focus(); }catch(e){}
}
function showLb(){
  const p=photos[lbIndex];
  if(!p)return;
  setLbImg(p);
  $("#lbImg").alt=p.name;
  $("#lbCount").textContent=`${lbIndex+1} / ${photos.length} · ${p.name}`;
}
function closeLb(){
  $("#lightbox").classList.remove("open");
  document.body.classList.remove("lb-lock");

/* ---------- 路由 ---------- */
function route(){
  const hash=location.hash.replace(/^#\/?/,"");
  const parts=hash.split("/").filter(Boolean);
  let active="home";
  if(parts[0]==="gallery"){active="gallery";renderGallery()}
  else if(parts[0]==="projects"){active="projects";renderProjects()}
  else if(parts[0]==="about"){active="about";renderAbout()}
  else renderHome();
  document.querySelectorAll(".nav-link").forEach(el=>
    el.classList.toggle("active",el.dataset.nav===active));
  /* 切页回到顶部：html 上挂着 scroll-behavior:smooth，
     这里先临时关掉再滚，免得每次切页都慢慢「滑」上去 */
  const root=document.documentElement,
        prevSmooth=root.style.scrollBehavior;
  root.style.scrollBehavior="auto";
  window.scrollTo(0,0);
  root.style.scrollBehavior=prevSmooth;
}
window.addEventListener("hashchange",route);

/* ---------- 交互绑定 ---------- */
$("#langBtn").addEventListener("click",()=>setLang(lang==="zh"?"en":"zh"));
$("#lbClose").addEventListener("click",closeLb);
$("#lbPrev").addEventListener("click",e=>{e.stopPropagation();stepLb(-1)});
$("#lbNext").addEventListener("click",e=>{e.stopPropagation();stepLb(1)});
$("#lightbox").addEventListener("click",e=>{if(e.target.id==="lightbox")closeLb()});
document.addEventListener("click",e=>{
  /* 首屏那个滚动提示：点一下平滑滚到图库预览 */
  const sc=e.target.closest("[data-scroll-to]");
  if(sc){
    const target=document.getElementById(sc.dataset.scrollTo);
    if(target)target.scrollIntoView({behavior:"smooth",block:"start"});
    return;
  }
  const tile=e.target.closest(".ph-tile");
  if(!tile||tile.dataset.idx===undefined||tile.classList.contains("ph-skel"))return;
  /* 带「+N」角标的瓷砖 → 跳转图库页，而不是开灯箱 */
  if(tile.querySelector(".ph-more")){location.hash="#/gallery";return;}
  openLb(Number(tile.dataset.idx));
});
document.addEventListener("keydown",e=>{
  if($("#lightbox").classList.contains("open")){
    if(e.key==="Escape")closeLb();
    else if(e.key==="ArrowLeft")stepLb(-1);
    else if(e.key==="ArrowRight")stepLb(1);
    return;
  }
  const tile=document.activeElement;
  if(tile&&tile.classList&&tile.classList.contains("ph-tile")&&(e.key==="Enter"||e.key===" ")){
    e.preventDefault();
    if(tile.querySelector(".ph-more")){location.hash="#/gallery";return;}
    openLb(Number(tile.dataset.idx));
  }
});

/* ---------- 启动 ---------- */
setLang(lang);     /* 统一走 setLang：品牌名、导航文案、语言按钮、云空间入口提示都按语言铺一遍 */

  /* 歌单数据（内置快照 / 云端，格式同为 {name,src,updated,count,songs:["歌名|歌手"]}）装进内存 */
  function applyKg(d,cloud){
    if(!d||!Array.isArray(d.songs)||!d.songs.length)return false;
    const prev=new Map(kgPool.map(t=>[t.id,t]));
    kgMeta={name:d.name||L().myKg,src:d.src||L().kgSrc,

      const a=(i<0?"":String(line).slice(i+1)).trim();
      const o=prev.get("kg:"+t+"|"+a);   /* 沿用上次解析好的网易云信息，刷新后不必重新搜 */
      return {online:true,kg:true,id:"kg:"+t+"|"+a,name:t,artist:a,

  /* 内置快照：kugou-playlist.js（和 index.html 同目录或上一级都试一下） */
  function loadSnap(){
    return new Promise(res=>{

      const finish=v=>{ if(done)return; done=true; res(v); };
      setTimeout(()=>finish(!!window.KUGOU_PLAYLIST),3000);   /* 兜底：脚本卡住也不阻塞「上次播放」的恢复 */
      if(window.KUGOU_PLAYLIST&&applyKg(window.KUGOU_PLAYLIST,false))return finish(true);
      let i=0;
      const next=()=>{
        if(i>=SNAP_FILES.length)return finish(false);
        const s=document.createElement("script");
        s.src=SNAP_FILES[i++];
        s.onload=()=>{ if(window.KUGOU_PLAYLIST&&applyKg(window.KUGOU_PLAYLIST,false)){ finish(true); } else next(); };
        s.onerror=next;
        document.head.appendChild(s);
      };
      next();
    });
  }

      applyKg(d,true);

  async function listDir(dir){
    try{
      const base=new URL(dir,location.href);
      const res=await fetch(base.href);
      if(res.ok){
        const doc=new DOMParser().parseFromString(await res.text(),"text/html");
        const urls=new Set();
        doc.querySelectorAll("a[href]").forEach(a=>{
          let h=a.getAttribute("href")||"";
          h=h.split("#")[0];
          if(!AUDIO_RE.test(h.split("?")[0]))return;
          urls.add(new URL(h,base.href).href);
        });
        if(urls.size)return Array.from(urls);
      }
    }catch(e){}
    return null;
  }
  async function listGH(){
    try{
      const r=await fetch("https://api.github.com/repos/"+GH_REPO+"/contents/"+encodeURIComponent("音乐")+"?ref="+GH_BRANCH,
        {headers:{Accept:"application/vnd.github+json"}});
      if(!r.ok)return null;
      const arr=await r.json();
      if(!Array.isArray(arr))return null;
      const raw=arr.filter(x=>x.type==="file"&&AUDIO_RE.test(x.name)).map(x=>x.download_url).filter(Boolean);
      return raw.length?raw:null;
    }catch(e){ return null; }
  }
  async function scanLocal(){
    let urls=null;
    for(const d of MUSIC_DIRS){ urls=await listDir(d); if(urls)break; }
    if(!urls&&location.protocol!=="file:")urls=await listGH();
    localPool=(urls||[]).map(src=>{
      const f=decodeURIComponent(src.split("/").pop().split("?")[0]);
      return {online:false,id:"lf:"+src,name:f.replace(/\.[^.]+$/,""),artist:L().localArtist,src:src};
    }).sort((a,b)=>a.name.localeCompare(b.name,"zh-Hans-CN",{numeric:true}));
    if(tab==="local")renderList();
  }

  /* =====================================================================
   *  ③ 在线搜歌：GD 音乐台「网易云」源（限流 + 会话缓存）
   * ===================================================================== */
  const gdCache=new Map();
  let gdChain=Promise.resolve(), gdLastAt=0;
  function gdFetch(qs){
    const run=async()=>{
      const wait=160-(Date.now()-gdLastAt);
      if(wait>0)await new Promise(r=>setTimeout(r,wait));
      gdLastAt=Date.now();
      const res=await fetch(GD_API+"?"+qs);
      if(!res.ok)throw new Error(L().httpErr+res.status);
      const j=await res.json();
      if(j&&j.detail)throw new Error(j.detail);
      return j;
    };
    gdChain=gdChain.then(run,run);
    return gdChain;
  }
  async function gdSearch(kw,page){
    const key="q|"+kw+"|"+(page||1);
    if(gdCache.has(key))return gdCache.get(key);
    const j=await gdFetch("types=search&source="+GD_SRC+"&name="+encodeURIComponent(kw)+"&count=20&pages="+(page||1));
    const list=Array.isArray(j)?j:[];
    gdCache.set(key,list);
    return list;
  }
  async function gdUrl(id,br){
    const j=await gdFetch("types=url&source="+GD_SRC+"&id="+encodeURIComponent(id)+"&br="+(br||320));
    return (j&&j.url)||"";
  }
  function normOnline(x){
    return {online:true,kg:false,id:"nc:"+x.id,ncId:String(x.id),
            name:x.name||L().unknown,
            artist:Array.isArray(x.artist)?x.artist.join(" / "):(x.artist||""),
            album:x.album||"",src:"",srcAt:0,failAt:0};
  }
  /* 歌名清洗：去掉括号附注（Live / 伴奏 / 翻自…）和多余空白，提高搜索命中率 */
  function cleanName(s){
    return String(s||"")
      .replace(/[【\[（(「].*?[】\]）)」]/g," ")
      .replace(/\s*(feat|ft)\..*$/i," ")
      .replace(/\s+/g," ").trim();
  }
  /* 酷狗歌单只有「歌名 + 歌手」，播放前先解析出对应的网易云曲目。
     找不到不要轻易放弃：依次换「歌名+歌手 → 纯歌名 → 清洗后歌名+歌手 → 清洗后歌名」，
     每次之间稍作停顿（接口有节奏限制，太快反而容易失败）；
     结果里优先挑歌名对得上的那一条，避免拿错同名的歌。 */
  async function kgResolve(t){
    if(!t)return false;
    if(t.ncId)return true;
    if(t.failAt&&Date.now()-t.failAt<10*60*1000)return false;   /* 失败后 10 分钟内不重试 */
    const cn=cleanName(t.name);
    const ar=(t.artist||"").trim();
    const keys=[...new Set([
      (t.name+" "+ar).trim(),
      t.name,
      (cn+" "+ar).trim(),
      cn
    ].map(x=>String(x).trim()).filter(Boolean))];
    try{
      let list=null;
      for(let k=0;k<keys.length;k++){
        list=await gdSearch(keys[k],1);
        if(list&&list.length){
          const hit=list.find(x=>cleanName(x.name)===cn)
              ||list.find(x=>{ const n=cleanName(x.name); return n&&(n.includes(cn)||cn.includes(n)); });
          const o=normOnline(hit||list[0]);
          t.ncId=o.ncId; t.album=o.album||t.album||"";
          if(!t.artist)t.artist=o.artist;
          t.failAt=0;
          return true;
        }
        if(k<keys.length-1)await new Promise(r=>setTimeout(r,500));  /* 缓一下再换关键词 */
      }
      t.failAt=Date.now();
      return false;
    }catch(e){ t.failAt=Date.now(); return false; }
  }

  /* =====================================================================
   *  列表渲染（含歌单内筛选）
   * ===================================================================== */
  /* 筛选：空白分隔的多个关键词需全部命中（歌名或歌手，忽略大小写） */
  function matchFilter(t,kw){
    const s=((t.name||"")+" "+(t.artist||"")).toLowerCase();
    return kw.split(/\s+/).filter(Boolean).every(w=>s.indexOf(w)>=0);
  }
  /* 当前分类实际要显示的歌曲：酷狗 / 本地按筛选词过滤；在线搜歌用搜索结果 */
  function visiblePool(k){
    const p=poolOf(k);
    if(k==="search"||k!==tab||!filterKw)return p;
    const kw=filterKw.toLowerCase();
    return p.filter(t=>matchFilter(t,kw));
  }
  function setFilter(kw){
    filterKw=String(kw==null?"":kw).trim();
    shown=LIMIT_STEP;
    renderList();
  }
  /* 筛选状态行：关键词 + 命中数，可一键清除 */
  function paintFilterTip(total,hit){
    if(!filterTipEl)return;
    const on=(tab!=="search")&&!!filterKw;
    filterTipEl.classList.toggle("on",on);
    if(!on)return;
    filterTipEl.querySelector("span").textContent=L().filterTip(filterKw,hit);
    filterClearBtn.textContent=L().clearFilter;
  }
  /* 搜索栏三个分类都显示：歌单分类是「筛选」，在线搜歌是「网络搜索」 */
  function paintSearchUI(){
    const isSearch=tab==="search";
    searchInp.placeholder=isSearch?L().searchPh:L().filterPh;
    const lbl=isSearch?L().search:L().filterAria;
    searchGo.title=lbl; searchGo.setAttribute("aria-label",lbl);
    searchInp.setAttribute("aria-label",lbl);
  }
  function renderList(){
    if(!wrap.classList.contains("open"))return;
    const full=poolOf(tab);            /* 该分类的完整歌单 */
    const pool=visiblePool(tab);       /* 应用筛选后实际显示的歌 */
    paintFilterTip(full.length,pool.length);
    if(tab==="search"&&!full.length){
      listEl.innerHTML='<div class="mp-empty">'+L().emptySearch+'</div>';
      return;
    }
    if(!full.length){
      listEl.innerHTML='<div class="mp-empty">'+(tab==="kg"?L().emptyKg:L().emptyLocal)+'</div>';
      return;
    }
    if(!pool.length){                  /* 歌单里有歌，只是筛不出来 */
      listEl.innerHTML='<div class="mp-empty">'+L().filterEmpty(filterKw)+'</div>';
      return;
    }
    const list=(tab==="kg")?pool.slice(0,shown):pool;
    const now=curTrack();
    /* 当前这首（比如上次播放的那首）不在这个列表里时，置顶显示一行，方便点回来。
       筛选状态下不置顶，免得干扰筛选结果。 */
    let pinned="";
    if(now&&!filterKw&&!list.some(x=>x.id===now.id)){
      pinned='<div class="mp-row on" data-now="1" title="'+L().nowTitle+'">'
        +'<span class="mp-row-n">'+esc2(now.name)+"</span>"
        +(now.artist?'<span class="mp-row-a">'+esc2(now.artist)+"</span>":"")
        +"</div>";
    }
    listEl.innerHTML=pinned+list.map((t,i)=>
      '<div class="mp-row'+(now&&now.id===t.id?" on":"")+'" data-i="'+i+'">'
      +'<span class="mp-row-n">'+esc2(t.name)+"</span>"
      +(t.artist?'<span class="mp-row-a">'+esc2(t.artist)+"</span>":"")
      +"</div>"
    ).join("")+(tab==="kg"&&pool.length>shown
      ? '<button class="mp-more" id="mpMore">'+L().more(pool.length-shown)+'</button>':"");
    const more=el("mpMore");
    if(more)more.onclick=()=>{ shown+=LIMIT_STEP; renderList(); };
  }

  /* =====================================================================
   *  播放核心（意图驱动 + 代次防竞态）
   *  ---------------------------------------------------------------
   *  · 每次加载拿一个自增代次 gen，await 之后若代次已变，说明用户已经
   *    切了别的歌/别的操作，旧请求立刻放弃，绝不碰 audio（防止「点暂停
   *    之后旧的加载流程又把歌放起来」这类竞态）。
   *  · 是否出声只由 wantPlay 决定；用户点暂停会把 wantPlay 置 false，
   *    正在进行的加载完成后也不会再自动播放。
   * ===================================================================== */
  async function loadAndPlay(i,opts){
    if(i<0||i>=q.length)return;
    const opt=opts||{};
    const want=opt.play!==false;        /* 默认：加载好就开始播 */
    const g=++gen;                      /* 作废之前所有未完成的加载 */
    cur=i;
    const t=q[i]; if(!t)return;
    rememberPlayed(t.id);              /* 记进「最近放过」，随机模式下别马上又挑到它 */
    wantPlay=want;
    loadingId=t.id;
    /* 需要解析的歌：解析状态直接显示在副标题（歌手那一行），不用弹窗 */
    subHold=false; clearTimeout(subTid);
    if(want)subEl.textContent=(t.online&&(!t.ncId||!t.src))?L().resolving:(t.artist||"");
    else paintSub();                   /* 只是进页面时的静默预加载 → 别抢副标题，照常显示歌手 */
    renderList();

    const fail=async(msg)=>{
      if(g!==gen)return;                /* 已被新请求取代 */
      loadingId="";
      if(!wantPlay){ paintSub(); return; }   /* 用户已经暂停（或本来就没想放），别再自动跳下一首 */
      failCount++;
      if(failCount>=4){                 /* 连续失败就停手，别连环刷接口 */
        failCount=0; wantPlay=false; setPlayUI(false);
        subFlash(L().allFail,3200);
        return;
      }
      subFlash(msg,2400);
      await new Promise(r=>setTimeout(r,1200));   /* 跳下一首前缓一缓，别连珠炮似的刷接口 */
      if(g!==gen||!wantPlay)return;
      await loadAndPlay((cur+1)%q.length,{play:true});
    };
    /* 酷狗 / 在线歌曲没有现成地址，先解析网易云 id 再取 320k 音源 */
    if(t.online&&!t.ncId){
      const ok=await kgResolve(t);
      if(g!==gen)return;
      if(!ok)return fail(L().notFound(t.name));
    }
    if(t.online&&(!t.src||!t.srcAt||Date.now()-t.srcAt>URL_TTL)){
      let u="";
      try{ u=await gdUrl(t.ncId,320); }catch(e){}
      if(g!==gen)return;
      if(!u){                            /* 取不到别急着放弃：歇 1 秒换个码率再试一次 */
        await new Promise(r=>setTimeout(r,1000));
        if(g!==gen||!wantPlay)return;
        try{ u=await gdUrl(t.ncId,192); }catch(e){}
        if(g!==gen)return;
      }
      if(!u)return fail(L().noSrc(t.name));
      t.src=u; t.srcAt=Date.now();
    }
    if(!t.src)return fail(L().noSrc(t.name));

    failCount=0; errCount=0;
    /* 换了别的歌 → 丢掉残留的「恢复到第几秒」（避免下次再听这首被莫名跳转） */
    if(resume.id&&resume.id!==t.id){ resume.pos=null; resume.id=""; }
    /* 换歌了 → 本会话「可信位置」重新开始（恢复同一首时沿用它的续播点） */
    if(loadedId!==t.id)lastPos=(resume.id===t.id&&resume.pos)?resume.pos:0;
    loadedId=t.id;
    /* 给 audio.src 赋值会让浏览器给正在播放的元素派发一次 pause，
       那是内部换源行为，用 swapping 标记避免被误当成「用户暂停」 */
    if(audio.src!==t.src){
      swapping=true; audio.src=t.src;
      setTimeout(()=>{ swapping=false; },0);
    }
    paintNow(t);
    if(wantPlay)playAudio(opt.silent===true); else setPlayUI(false);
    loadingId="";                     /* 走到这里才算这轮加载结束 */
  }
  /* 按分类整体起播：队列 = 该分类当前列表的快照 */
  /* 按分类起播：list 可选，传入时以它作为队列（用于「筛选结果里播」） */
  function playPool(k,i,list){
    const p=(list&&list.length)?list:poolOf(k);
    if(!p.length){ flash(L().emptyList); return; }
    q=p.slice(); kind=k; cur=Math.max(0,Math.min(i||0,p.length-1));
    loadAndPlay(cur,{play:true});
  }
  /* ---------------- 随机播放：挑一首「别的歌」 ----------------
     要点：不论是点「下一首」还是自动续播，随机模式下都不按列表顺序走；
     并且避开当前这首 + 最近刚放过的几首，避免短时间内来回重复。
     最近记录按「曲目 id」存，所以中途换了歌单/筛选也不会串。 */
  function rememberPlayed(id){
    if(!id)return;
    const k=recentIds.indexOf(id);
    if(k>=0)recentIds.splice(k,1);
    recentIds.push(id);
    if(recentIds.length>60)recentIds.shift();
  }
  function shufflePick(){
    if(q.length<=1)return cur<0?0:cur;
    const ct=curTrack();
    const banned=new Set(ct?[ct.id]:[]);
    /* 最多避开到「只剩一首可挑」为止：再往前避就没人了 */
    const horizon=Math.min(recentIds.length,q.length-1);
    for(let i=0;i<horizon;i++)banned.add(recentIds[recentIds.length-1-i]);
    let cand=[];
    for(let i=0;i<q.length;i++){ if(q[i]&&!banned.has(q[i].id))cand.push(i); }
    if(!cand.length){ for(let i=0;i<q.length;i++){ if(i!==cur)cand.push(i); } }   /* 全都避开了 → 只排除当前这首 */
    if(!cand.length)cand=[Math.max(0,cur)];
    return cand[(Math.random()*cand.length)|0];
  }
  function step(d,fromEnded){
    if(!q.length)return;
    if(fromEnded&&!wantPlay)return;         /* 已经暂停了就别再自动续播 */
    if(mode===1&&fromEnded){ audio.currentTime=0; playAudio(); return; }
    /* 随机播放：点「下一首」和自动续播一样，都随机挑一首「别的歌」 */
    if(mode===2&&q.length>1)return loadAndPlay(shufflePick(),{play:true});
    return loadAndPlay((cur+d+q.length)%q.length,{play:true});
  }
  /* 核心交互：播放 / 暂停。只看 wantPlay，不看 audio.paused（避免竞态误判） */
  function toggle(){
    if(!q.length||cur<0){
      const p=visiblePool(tab);      /* 有筛选就用筛选结果起播 */
      if(p.length)playPool(tab,0,p); else flash(L().emptyList);
      return;
    }
    const t=curTrack();
    /* 正在出声，或正在解析/取地址 → 一律视为「用户要暂停」 */
    if(wantPlay||(loadingId===t.id&&!audio.paused)){ stopAudio(); return; }
    if(loadingId===t.id){                        /* 正在加载这首：等它完成，不再重复起一条加载链 */
      wantPlay=true; setPlayUI(true);
      subFlash(L().loading,1500);
      return;
    }
    wantPlay=true; setPlayUI(true);
    if(loadedId!==t.id||!audio.src){ loadAndPlay(cur,{play:true}); return; }
    /* 进页面时静默预加载拿到的签名地址会过期 → 过期了就重新取一次，别拿旧地址硬放 */
    if(t.online&&t.srcAt&&Date.now()-t.srcAt>URL_TTL){ t.src=""; t.srcAt=0; loadAndPlay(cur,{play:true}); return; }
    playAudio();
  }

  /* ---------------- 界面同步 ---------------- */
  function paintNow(t){
    if(!t)return;
    nameEl.textContent=t.name;
    paintSub();
    if("mediaSession" in navigator){
      try{ navigator.mediaSession.metadata=new MediaMetadata({title:t.name,artist:t.artist||"",album:L().brand}); }catch(e){}
    }
  }
  function paintSub(){
    if(subHold)return;                 /* 正在显示「解析中…」之类的提示，别覆盖 */
    const t=curTrack();
    if(!t){ subEl.textContent=L().pillSub; return; }   /* 还没有歌 → 显示「正在读取歌单…」 */
    subEl.textContent=t.artist||"";
  }
  /* 把「听到第几秒 / 总时长」画到进度环、时间、滑杆上（ct、dur 单位都是秒） */
  function setProgress(ct,dur){
    const p=(isFinite(dur)&&dur>0)?(ct/dur*100):0;
    ringEl.style.strokeDashoffset=String(RING_C*(1-p/100));
    if(seeking)return;
    timeEl.textContent=fmt(ct)+" / "+fmt(dur);
    if(isFinite(dur)&&dur>0)seekEl.value=String(Math.round(p*10));   /* 滑杆量程 0~1000 */
  }
  function earlyPaint(){
    let st=null;
    try{ st=JSON.parse(localStorage.getItem(KEY)||"null"); }catch(e){}
    if(!st||!st.track||!st.track.name)return false;
    nameEl.textContent=st.track.name;
    subEl.textContent=st.track.artist||"";
    /* 顺手按上次记录的进度先把环画上（音源还没挂，先用记录里的时长估着），
       等音源就绪再用真实数据校正 —— 一进页面就能看到上次听到哪儿 */
    const pos=(typeof st.pos==="number"&&st.pos>0)?st.pos:0;
    const dur=(typeof st.dur==="number"&&st.dur>0)?st.dur:0;
    if(pos>0&&dur>0)setProgress(pos,dur);
    return true;
  }

  /* ---------------- 播放状态记忆 ----------------
     记住：分类、队列、当前曲目（歌名 / 歌手 / 网易云 id / 本地地址）、
     播放到第几秒、循环模式、音量、离开时是否正在播放。
     在线曲目的音源是带时间戳的签名链接会过期，所以只记 id，下次播放时重取。 */
  let lastPos=0;      /* 本会话「可信」的播放位置：只有 audio 真的装着当前这首时才更新 */
  function readSaved(){
    try{ return JSON.parse(localStorage.getItem(KEY)||"null"); }catch(e){ return null; }
  }
  /* audio 是否真的装载着当前这首、并且已经有了可用的时间轴 */
  function elReady(t){
    if(!t||loadedId!==t.id||!audio.src)return false;
    return audio.readyState>0||(isFinite(audio.duration)&&audio.duration>0);
  }
  function save(){
    try{
      const base={mode:mode,vol:audio.volume,at:Date.now()};
      const old=readSaved();
      if(!q.length||cur<0||cur>=q.length){
        /* 队列还没恢复出来（刚打开就被刷新 / 切走标签）→ 保住上次那条记录，别清空 */
        if(old&&old.track&&old.track.name){
          base.kind=old.kind||""; base.cur=old.cur||0;
          base.pos=(typeof old.pos==="number"&&old.pos>0)?old.pos:0;
          base.dur=(typeof old.dur==="number"&&old.dur>0)?old.dur:0;
          base.playing=!!old.playing;
          base.track=old.track;
          if(Array.isArray(old.ids))base.ids=old.ids;
          if(old.kw)base.kw=old.kw;
        }else{
          base.kind="";
        }
        localStorage.setItem(KEY,JSON.stringify(base));
        localStorage.setItem(KEY+"-vol",String(audio.volume));
        return;
      }
      const t=q[cur];
      base.kind=kind;
      base.cur=cur;
      /* 进度：只有 audio 确实装着「当前这首」且已就绪时，currentTime 才可信。
         刷新后恢复出来的在线曲目是还没挂音源的（currentTime 恒为 0），
         若直接落盘就会把记住的进度抹成 0 —— 刷几次进度就没了。 */
      const ready=elReady(t);
      let pos=ready?Math.round(audio.currentTime||0):Math.round(lastPos||0);
      if(resume.pos!=null&&resume.id===t.id)pos=Math.max(pos,resume.pos);   /* 还没跳到恢复点，别抹掉 */
      if(!ready&&pos<=0&&old&&old.track&&old.track.id===t.id&&old.pos>0)pos=old.pos;   /* 保住旧记忆 */
      lastPos=pos;
      base.pos=pos;
      /* 时长也记下来：下次一进页面还没取到音源时，也能先把进度环按记录画出来 */
      base.dur=(isFinite(audio.duration)&&audio.duration>0)?Math.round(audio.duration)
              :((old&&typeof old.dur==="number")?old.dur:0);
      base.playing=!audio.paused;                 /* 离开时正在放 → 下次打开尽力接着放 */
      base.track={id:t.id,name:t.name,artist:t.artist||"",ncId:t.ncId||"",src:t.online?"":(t.src||"")};
      if(kind==="search")base.kw=lastKw;         /* 搜索队列留个关键词，下次能把结果捞回来 */
      else base.ids=q.map(x=>x.id).slice(0,400);
      localStorage.setItem(KEY,JSON.stringify(base));
      localStorage.setItem(KEY+"-vol",String(audio.volume));
    }catch(e){}
  }
  /* 保存下来的曲目信息 → 可播放的曲目对象（本地文件自带地址，在线曲目待解析） */
  function rebuildTrack(o){
    if(!o||!o.name)return null;
    if(/^lf:/.test(o.id||""))
      return {online:false,id:o.id,name:o.name,artist:o.artist||L().localArtist,src:o.src||""};
    return {online:true,kg:/^kg:/.test(o.id||""),id:o.id,name:o.name,artist:o.artist||"",
            album:"",ncId:o.ncId||"",src:"",srcAt:0,failAt:0};
  }
  function restoreState(){
    if(restored)return;
    let st=null;
    try{ st=JSON.parse(localStorage.getItem(KEY)||"null"); }catch(e){}
    if(!st||typeof st!=="object"){ restored=true; renderList(); return; }
    if(typeof st.mode==="number"&&st.mode>=0&&st.mode<=2)mode=st.mode;
    modeBtn.innerHTML=MODE_ICON[mode]; modeBtn.title=L().modeTitle+MODE_TIPS()[mode];
    if(typeof st.vol==="number"&&st.vol>0&&st.vol<=1){ audio.volume=st.vol; volEl.value=String(Math.round(st.vol*100)); }
    if(!st.track||!st.track.name){ restored=true; renderList(); paintSub(); return; }
    /* 对应的列表还没读好（本地要扫目录、酷狗要读快照）就先挂起，读好了再恢复 */
    if(st.kind==="kg"&&!kgDone)return;
    if(st.kind==="local"&&!scanDone)return;

    const t0=rebuildTrack(st.track);
    const list=[];
    if(st.kind==="search"){
      list.push(t0);                     /* 搜索结果不持久化，先把这一首放回来，随后再捞结果 */
    }else{
      const pool=poolOf(st.kind);
      if(Array.isArray(st.ids)&&st.ids.length){
        const map=new Map(pool.map(x=>[x.id,x]));
        st.ids.forEach(id=>{ const x=map.get(id); if(x)list.push(x); });
      }
      if(list.findIndex(x=>x.id===t0.id)<0){
        /* 云端歌单新增/删除了歌曲也没关系：无论如何保证「上次那首」在队列里 */
        list.splice(Math.min(Math.max(st.cur||0,0),list.length),0,t0);
      }
    }
    q=list; kind=st.kind;
    cur=Math.max(0,list.findIndex(x=>x.id===t0.id));
    const t=q[cur];
    tab=(st.kind==="search")?"search":st.kind;
    shown=Math.max(LIMIT_STEP,cur+1);    /* 展开歌单时能直接看到当前这首 */
    setTabUI();
    panelTitle.textContent=L().pillName;   /* 标题固定为「鉴业音乐 / Jianye Music」，跟随语言 */
    /* 进度接着上次：等音源挂上（loadedmetadata）再跳到那个位置 */
    resume.pos=(st.pos>3)?st.pos:null;
    resume.id=t.id;
    lastPos=(typeof st.pos==="number"&&st.pos>0)?st.pos:0;   /* 记住「上次听到哪儿」，音源没挂上时也不会被抹掉 */
    /* 先用记录里的时长把进度环画出来，取到音源后再用真实数据校正 */
    if(lastPos>0&&typeof st.dur==="number"&&st.dur>0)setProgress(lastPos,st.dur);
    restored=true;
    nameEl.textContent=t.name;
    paintSub();
    renderList();
    /* 不管上次是不是正在播，都把「上次那首」挂好并跳到上次听到的位置：
       —— 进度环 / 时间立刻显示上次的进度，用户点播放就接着听；
       —— 只有上次离开时确实在播，才再尽力自动接着放（被浏览器拦截就安静地停在暂停态）。
       这次预加载是「静默」的：不抢副标题、不改变用户意图，quietLoad 标记它不是用户操作。 */
    const want=!!st.playing;
    if(t.online){
      quietLoad=true;
      Promise.resolve(loadAndPlay(cur,{play:want,silent:true}))
        .catch(()=>{}).then(()=>{ quietLoad=false; });
    }else if(t.src){
      loadedId=t.id; audio.src=t.src; try{ audio.load(); }catch(e){}
      if(want){ wantPlay=true; setPlayUI(true); playAudio(true); }
      else setPlayUI(false);
    }
    /* 搜索来源：把当时那次搜索的结果重新捞回来，队列就完整了 */
    if(st.kind==="search"&&st.kw)restoreSearch(st.kw,t0);
  }
  async function restoreSearch(kw,t0){
    try{
      const list=await gdSearch(kw,1);
      if(!list||!list.length)return;
      searchPool=list.map(normOnline);
      if(tab!=="search")return;
      if(wantPlay&&loadedId&&loadedId!==t0.id)return;   /* 用户已经切歌/在播别的了就别动 */
      let i=searchPool.findIndex(x=>x.id===t0.id);
      if(i<0)i=0;
      q=searchPool.slice(); cur=i; kind="search";
      const t=q[cur];
      if(!t.ncId&&t0.ncId)t.ncId=t0.ncId;
      if(loadedId===t0.id||!loadedId)nameEl.textContent=t.name;
      renderList();
    }catch(e){}
  }

  /* =====================================================================
   *  交互绑定
   * ===================================================================== */
  function setTabUI(){
    tabsEl.querySelectorAll(".mp-tab").forEach(b=>b.classList.toggle("on",b.dataset.tab===tab));
    searchBar.style.display="flex";   /* 三个分类都显示：歌单内筛选 / 在线搜歌 */
    paintSearchUI();
  }
  /* 面板宽度 = 导航栏宽度。导航栏是「内容自适应 + 居中」，宽度随语言 / 屏幕变化，
     所以展开前与窗口尺寸变化时都实测一次，写进 CSS 变量 --mp-w。 */
  function syncPanelWidth(){
    try{
      const doc=document;
      if(!doc||typeof doc.querySelector!=="function")return;
      const nav=doc.querySelector(".nav");
      if(!nav||typeof nav.getBoundingClientRect!=="function")return;
      const w=nav.getBoundingClientRect().width;
      if(!w||!isFinite(w))return;
      const vw=(doc.documentElement&&doc.documentElement.clientWidth)||0;
      const max=vw>0?vw-24:0;
      const v=max>0?Math.min(w,max):w;
      wrap.style.setProperty("--mp-w",Math.round(v)+"px");
    }catch(e){}
  }
  try{ window.addEventListener("resize",syncPanelWidth); }catch(e){}
  try{ window.addEventListener("load",syncPanelWidth); }catch(e){}

  function setPanel(open){
    wrap.classList.toggle("open",open);
    musicBtn.setAttribute("aria-expanded",open?"true":"false");   /* 无障碍：读屏知道面板开着还是关着 */
    if(open){
      syncPanelWidth();                            /* 先对齐导航栏宽度，再展开 */
      if(toastEl)toastEl.classList.remove("on");   /* 面板和气泡在同一块地方，先收起来 */
      renderList();
    }
  }
  /* 点导航栏的音乐入口：开 / 关切换 —— 点一下展开，再点一下收起。
     （点面板外的空白处、按 Esc 也都能收起。） */
  musicBtn.addEventListener("click",()=>setPanel(!wrap.classList.contains("open")));
  /* 点面板外面 → 收起面板（按 Esc 也行）。
     注意这里监听的是「按下」而不是「点击」：
     点击面板内的歌会触发 renderList() 重建列表，等事件冒泡到 document 时，
     被点的那一行已经脱离 DOM，wrap.contains(e.target) 会误判成「点了外部」而把面板关掉。
     按下瞬间 DOM 还没被任何处理器改动，判定一定准确。 */
  const outsideEvt=(typeof window!=="undefined"&&"PointerEvent" in window)?"pointerdown":"mousedown";
  document.addEventListener(outsideEvt,e=>{
    if(!wrap.classList.contains("open"))return;
    if(wrap.contains(e.target)||musicBtn.contains(e.target))return;
    setPanel(false);
  },true);
  document.addEventListener("keydown",e=>{
    if(e.key==="Escape"&&wrap.classList.contains("open"))setPanel(false);
  });
  ppBtn.addEventListener("click",toggle);
  nextBtn.addEventListener("click",()=>step(1));
  modeBtn.addEventListener("click",()=>{
    mode=(mode+1)%3;
    modeBtn.innerHTML=MODE_ICON[mode];
    modeBtn.title=L().modeTitle+MODE_TIPS()[mode];
    flash(L().modeTitle+MODE_TIPS()[mode]);
    save();
  });
  syncBtn.addEventListener("click",()=>refreshCloud(true));
  tabsEl.addEventListener("click",e=>{
    const b=e.target.closest(".mp-tab"); if(!b)return;
    if(b.dataset.tab===tab)return;        /* 点同一个分类：保留当前筛选词 */
    tab=b.dataset.tab; shown=LIMIT_STEP;
    filterKw=""; searchInp.value="";      /* 换分类清空筛选，免得误以为歌单少了歌 */
    setTabUI(); renderList();
  });
  listEl.addEventListener("click",e=>{
    const r=e.target.closest(".mp-row");
    if(!r)return;
    if(r.dataset.now){ loadAndPlay(cur,true); return; }   /* 置顶的「正在播放 / 上次播放」 */
    playPool(tab,Number(r.dataset.i),visiblePool(tab));   /* 队列 = 当前看到的那一列 */
  });
  function doSearch(){
    const kw=searchInp.value.trim();
    if(!kw)return;
    lastKw=kw;
    listEl.innerHTML='<div class="mp-empty">'+L().searching+'</div>';
    gdSearch(kw,1).then(list=>{
      searchPool=list.map(normOnline);
      if(!searchPool.length)flash(L().noResult(kw));
      renderList();
    }).catch(err=>{
      searchPool=[]; flash(L().searchFail((err&&err.message)||L().netErr));
      listEl.innerHTML='<div class="mp-empty">'+L().searchFailed+'</div>';
    });
  }
  searchGo.addEventListener("click",()=>{ if(tab==="search")doSearch(); else setFilter(searchInp.value); });
  /* 歌单分类里打字就即时筛选，不用回车 */
  searchInp.addEventListener("input",()=>{ if(tab!=="search")setFilter(searchInp.value); });
  searchInp.addEventListener("keydown",e=>{
    if(e.key!=="Enter")return;
    e.preventDefault();
    if(tab==="search")doSearch(); else setFilter(searchInp.value);
  });
  if(filterClearBtn)filterClearBtn.addEventListener("click",()=>{ searchInp.value=""; setFilter(""); });

  /* 进度 / 音量 */
  seekEl.addEventListener("input",()=>{ seeking=true; });
  seekEl.addEventListener("change",()=>{
    if(isFinite(audio.duration)&&audio.duration>0)
      audio.currentTime=Number(seekEl.value)/1000*audio.duration;
    resume.pos=null; resume.id="";        /* 用户手动定位过 → 作废「续播位置」记忆 */
    seeking=false; save();
  });
  volEl.addEventListener("input",()=>{
    audio.volume=Math.min(Math.max(Number(volEl.value)/100,0),1);
    try{ localStorage.setItem(KEY+"-vol",String(audio.volume)); }catch(e){}
  });

  /* 音频事件：UI 跟着真实状态走，播放意图只在明确的用户/系统动作里改变 */
  audio.addEventListener("play",()=>{
    errCount=0; wantPlay=true; swapping=false;
    setPlayUI(true);
    paintSub(); save();
  });
  audio.addEventListener("pause",()=>{
    /* 换源 / 解析过程中浏览器也会派发 pause，那是内部行为，别覆盖用户意图 */
    if(swapping||loadingId)return;
    /* 一首歌自然播完时，浏览器会先把 ended/paused 置真、派发 pause，再派发 ended。
       这一记 pause 不是用户操作 —— 别清掉播放意图，否则随后的 ended 会以为用户已经暂停，
       于是不再自动播下一首。 */
    if(audio.ended)return;
    wantPlay=false;
    setPlayUI(false);
    save();
  });
  audio.addEventListener("ended",()=>{
    /* ended 为真 = 确实播到了结尾（不是用户暂停后残留的事件）→ 恢复播放意图，继续播下一首。
       这样无论浏览器把 pause 派发在 ended 之前还是之后，自动续播都成立。 */
    if(audio.ended)wantPlay=true;
    step(1,true);
  });
  audio.addEventListener("loadedmetadata",()=>{
    /* 恢复上次的播放进度：只有音源还是上次那首歌时才跳 */
    if(resume.pos!=null&&loadedId===resume.id){
      try{ audio.currentTime=resume.pos; }catch(e){}
      /* 只有确实跳过去了才作废这条「续播位置」；没跳成（音源不支持拖动等）就留着，
         下次再试，且落盘时会把这条进度保住，不会被抹成 0 */
      if(Math.abs((audio.currentTime||0)-resume.pos)<2){ lastPos=resume.pos; resume.pos=null; save(); }
    }
    /* 立刻把进度环/时间刷成上次听到的位置（没跳成时按「想跳到的位置」显示，别显示成 0） */
    const shown=(resume.pos!=null&&loadedId===resume.id)?resume.pos:audio.currentTime;
    setProgress(shown,audio.duration);
  });
  audio.addEventListener("timeupdate",()=>{
    const ct=curTrack();
    if(ct&&loadedId===ct.id)lastPos=audio.currentTime||0;   /* 只有确实在放这首时才更新可信位置 */
    setProgress(audio.currentTime,audio.duration);
    if(Date.now()-(audio._s||0)>5000){ audio._s=Date.now(); save(); }   /* 每 5 秒落一次盘 */
  });
  audio.addEventListener("error",()=>{
    if(!q.length||!audio.src||!loadedId)return;
    if(!wantPlay){ setPlayUI(false); return; }   /* 已暂停时出错 → 不要自动跳下一首并播起来 */
    /* 在线音源的签名地址会过期：先当作「地址失效」重取一次（最多两次），别急着跳下一首 */
    const t=curTrack();
    if(t&&t.online&&t.srcAt&&Date.now()-t.srcAt>URL_TTL&&errCount<2){
      errCount++; t.src=""; t.srcAt=0;
      loadAndPlay(cur,{play:true});
      return;
    }
    errCount++;
    if(errCount>=3){
      errCount=0; wantPlay=false; setPlayUI(false);
      subFlash(L().repeatedFail,3200);
      return;
    }
    subFlash(L().playFail,2000);
    const g=gen;
    setTimeout(()=>{ if(gen===g&&wantPlay)step(1,true); },900);
  });
  window.addEventListener("pagehide",save);
  try{
    document.addEventListener("visibilitychange",()=>{ if(document.visibilityState==="hidden")save(); });
  }catch(e){}

  /* 系统媒体键（锁屏 / 蓝牙耳机） */
  if("mediaSession" in navigator){
    try{
      navigator.mediaSession.setActionHandler("play",()=>{
        wantPlay=true; setPlayUI(true);
        if(loadedId&&audio.src&&!loadingId)playAudio();
        else if(q.length)loadAndPlay(Math.max(cur,0),{play:true});
      });
      navigator.mediaSession.setActionHandler("pause",stopAudio);
      navigator.mediaSession.setActionHandler("previoustrack",()=>step(-1));
      navigator.mediaSession.setActionHandler("nexttrack",()=>step(1));
    }catch(e){}
  }

  /* =====================================================================
   *  启动：本地扫描与歌单同步并行 → 恢复上次进度
   * ===================================================================== */
  /* ---------------- 语言切换：把播放器上的文案整体刷新一遍 ---------------- */
  function mpApplyLang(){
    const t=L();
    const DEF_NAMES=["鉴业音乐","Jianye Music",""];
    if(DEF_NAMES.indexOf((nameEl.textContent||"").trim())>=0)nameEl.textContent=t.pillName;
    musicBtn.title=t.navMusic||t.pillName; musicBtn.setAttribute("aria-label",t.navMusic||t.pillName);
    ppBtn.title=t.playPause; ppBtn.setAttribute("aria-label",t.playPause);
    nextBtn.title=t.next; nextBtn.setAttribute("aria-label",t.next);
    syncBtn.title=t.sync; syncBtn.setAttribute("aria-label",t.sync);
    modeBtn.title=t.modeTitle+MODE_TIPS()[mode]; modeBtn.setAttribute("aria-label",t.mode);
    paintSearchUI();
    seekEl.setAttribute("aria-label",t.seekAria);
    volEl.setAttribute("aria-label",t.volAria);
    tabsEl.querySelectorAll(".mp-tab").forEach(b=>{ const k=b.dataset.tab; if(t.tabs[k])b.textContent=t.tabs[k]; });
    panelTitle.textContent=t.pillName;   /* 标题固定为「鉴业音乐 / Jianye Music」，跟随语言 */
    if(!curTrack())subEl.textContent=t.pillSub;
    paintMeta(); paintSub(); renderList();
    syncPanelWidth();   /* 中英文切换后导航栏宽度会变，面板跟着重新对齐 */
  }
  /* 站点右上角 EN / 中 切换时同步：优先接管 setLang，另用 <html lang> 监听兜底 */
  try{
    if(typeof setLang==="function"){
      const _setLang=setLang;
      setLang=function(v){ _setLang(v); try{ mpApplyLang(); }catch(e){} };
    }
  }catch(e){}
  try{
    new MutationObserver(()=>{ try{ mpApplyLang(); }catch(e){} })
      .observe(document.documentElement,{attributes:true,attributeFilter:["lang"]});
  }catch(e){}

  var scanDone=false, kgDone=false;
  const CLOUD_WAIT=2000;   /* 云端歌单最多等 2 秒，超时就先用内置快照顶上 */
  (async function boot(){
    setTabUI();              /* 初始分类高亮 + 搜索栏（三个分类都显示） */
    mpApplyLang();           /* 按当前语言把面板文案铺一遍 */
    earlyPaint();            /* 先把上次播放的那首显示出来，歌单慢慢读 */
    /* 本地音乐扫描与「酷狗歌单」同时开工 */
    const localP=scanLocal().then(()=>{ scanDone=true; });
    /* 歌单优先问云端 /api/kg：内容最新，而且通了就不必再下载 107KB 的内置快照。
       云端不通（离线 / 没部署 Functions）或 2 秒没回来 → 退回内置快照兜底。
       两个来源谁后到谁生效：快照先到、云端后到 → 云端覆盖快照（内容更新）；
       云端先到则根本不会加载快照。 */
    let tid=null;
    const timeout=new Promise(r=>{ tid=setTimeout(()=>r("timeout"),CLOUD_WAIT); });
    const first=await Promise.race([refreshCloud(false).then(()=>cloudState),timeout]);
    clearTimeout(tid);
    if(first!=="ok")await loadSnap();
    kgDone=true;
    await localP;
    if(!kgPool.length&&!kgMeta)paintMeta();
    restoreState();
    if(tab==="kg")renderList();
    paintSub();
  })();
})();
</script>

</body>
</html>
