/* 设为下一首播放 / 加入播放列表 */
function playNext(t){
  if(!t){ toast('先挑一首歌'); return; }
  if(cur<0){
    const item=Object.assign({},t,{__next:true});
    queue=queue.length?queue:[];
    queue.splice(0,0,item);
    cur=0; loadAndPlay(0,true);
    toast('即将播放：'+esc(t.name));
    return;
  }
  /* 插到当前曲目后面，并打标记：随机播放时也保证它先播 */
  const item=Object.assign({},t,{__next:true});
  queue.splice(cur+1,0,item);
  queueRev++;
  renderQueue(true);
  toast(mode==='shuffle'?'已设为下一首（随机播放也先播它）：'+esc(t.name):'已设为下一首：'+esc(t.name));
}
function addToQueue(t){
  if(!t){ toast('先挑一首歌'); return; }
  if(cur<0&&!queue.length){
    queue=[t]; cur=0; loadAndPlay(0,true);
    toast('开始播放：'+esc(t.name));
    return;
  }
  queue.push(t);
  queueRev++;
  renderQueue();
  toast('已加入播放列表：'+esc(t.name));
}
function refreshViewHearts(){
  if(currentView==='liked'&&likedTracks.length){ renderLiked(); return; }
  /* 只更新可见行里的爱心，不整页重绘 */
  $$('.tr').forEach(row=>{
    const trList=listForDisplay(row.dataset.list);
    const tr=trList&&trList[+row.dataset.i];
    if(!tr) return;
    const liked=isLiked(tr);
    const b=row.querySelector('.tr-like');
    if(b){ b.classList.toggle('on',liked); b.innerHTML=liked?I.heartFill:I.heart; }
  });
}

/* =========================================================
   事件
   ========================================================= */
document.addEventListener('click',e=>{
  const themeBtn=e.target.closest('[data-theme-set]');
  if(themeBtn){
    themePref=themeBtn.dataset.themeSet;
    store.set('theme',themePref);
    applyTheme();
    return;
  }

  const navBtn=e.target.closest('[data-nav]');
  if(navBtn){
    const n=navBtn.dataset.nav;
    location.hash = n.indexOf('pl:')===0 ? '#/playlist/'+n.slice(3) : '#/'+n;
    document.body.classList.remove('sb-open');
    return;
  }

  const el=e.target.closest('[data-act]');
  if(!el) return;
  const act=el.dataset.act;

  switch(act){
    case 'toggle': togglePlay(); break;
    case 'next': next(false); break;
    case 'prev': prev(); break;
    case 'mode': {
      mode=MODE_KEYS[(MODE_KEYS.indexOf(mode)+1)%MODE_KEYS.length];
      store.set('mode',mode); store.set('shuffle',mode==='shuffle'); store.set('repeat',mode==='repeat');
      toast('播放模式：'+MODE_LABEL[mode]); syncUI(); break;
    }
    case 'download': downloadCurrent(); break;
    case 'speed': openSpeedMenu(el); break;
    case 'mute':
      if(audio.volume>0){ lastVol=audio.volume; setVolume(0); } else setVolume(lastVol||0.8);
      break;
    case 'like': toggleLike(currentTrack()); break;
    case 'like-row': {
      const list=listForDisplay(el.dataset.list);
      const t=list[+el.dataset.i];
      if(t){ toggleLike(t); refreshViewHearts(); }
      break;
    }
    case 'tr-menu': {
      const list=listForDisplay(el.dataset.list);
      const t=list[+el.dataset.i];
      if(!t) break;
      const r=el.getBoundingClientRect();
      const liked=isLiked(t);
      openCtx(r.left,r.bottom+6,[
        {label:'立即播放',icon:I.play,fn:()=>{
          queue=list.slice(); loadAndPlay(+el.dataset.i,true);
        }},
        {label:'设为下一首播放',icon:I.playNextIco,fn:()=>playNext(t)},
        {label:'加入播放列表',icon:I.plus,fn:()=>addToQueue(t)},
        {label:liked?'取消喜欢':'喜欢',icon:liked?I.heartFill:I.heart,fn:()=>{
          toggleLike(t); refreshViewHearts();
        }}
      ]);
      break;
    }
    case 'pl-more': plShow+=250; updatePlTracks(); break;
    case 'q-del': {
      const i=+el.dataset.i;
      if(!(i>=0&&i<queue.length)) break;
      const wasCur=i===cur;
      queue.splice(i,1);
      queueRev++;
      if(i<cur){ cur--; }
      else if(wasCur){
        if(queue.length&&cur<queue.length){ loadAndPlay(cur,!audio.paused); }
        else if(queue.length){ cur=queue.length-1; loadAndPlay(cur,false); }
        else { clearNowPlaying(); }
      }
      renderQueue(true); syncUI();
      toast('已从队列移除');
      break;
    }
    case 'q-more-up': qUp+=200; renderQueue(true); break;
    case 'q-more-down': qDown+=200; renderQueue(true); break;
    case 'q-clear':
      clearNowPlaying();
      renderQueue();
      toast('播放队列已清空');
      break;
    case 'liked-export': {
      const list=store.get('liked',[]);
      if(!list.length){ toast('还没有喜欢的歌，先收藏几首'); break; }
      const data={app:'鉴业音乐',type:'liked',version:1,
        exported:new Date().toISOString(),count:list.length,tracks:list};
      const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
      const a=document.createElement('a');
      const d=new Date(), pad=n=>String(n).padStart(2,'0');
      a.href=URL.createObjectURL(blob);
      a.download='我喜欢的音乐-'+d.getFullYear()+pad(d.getMonth()+1)+pad(d.getDate())+'.json';
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(()=>URL.revokeObjectURL(a.href),60000);
      toast('已导出 '+list.length+' 首（JSON 文件）');
      break;
    }
    case 'liked-import': $('#likedFile').click(); break;
    case 'row': {
      const list=listForDisplay(el.dataset.list);
      const i=+el.dataset.i;
      if(i<0||i>=list.length) break;
      if(isCurrent(list[i])&&audio.src){ togglePlay(); break; }
      /* 歌单页：没在过滤时把整个歌单放进队列（酷狗 3000+ 首也没问题） */
      let qlist=list;
      if(el.dataset.list.indexOf('pl:')===0&&currentView==='playlist'&&el.dataset.list==='pl:'+plCurId&&!plQ.trim()){
        const p=PLAYLISTS.find(x=>x.id===plCurId);
        if(p) qlist=p.tracks;
      }
      queue=qlist.slice();
      loadAndPlay(i,true);
      break;
    }
    case 'jump':
      jumpTo(+el.dataset.i);
      if(el.closest('.npx-queue')) switchNpxTab('lyrics');
      break;
    case 'npx-tab': switchNpxTab(el.dataset.tab); break;
    case 'play-pl': {
      const p=PLAYLISTS.find(x=>x.id===el.dataset.id);
      if(!p) break;
      queue=p.tracks.slice(); mode='order'; store.set('mode','order'); loadAndPlay(0,true); break;
    }
    case 'shuffle-pl': {
      const p=PLAYLISTS.find(x=>x.id===el.dataset.id);
      if(!p) break;
      mode='shuffle'; store.set('mode','shuffle');
      const arr=p.tracks.slice();
      for(let i=arr.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [arr[i],arr[j]]=[arr[j],arr[i]]; }
      queue=arr; loadAndPlay(0,true); break;
    }
    case 'play-list': {
      const list=listFor(el.dataset.list);
      if(!list.length){ toast('这个列表还是空的'); break; }
      queue=list.slice(); loadAndPlay(0,true); break;
    }
    case 'save-pl': {
      const id=el.dataset.id;
      const list=store.get('saved',[]);
      const idx=list.indexOf(id);
      if(idx>=0) list.splice(idx,1); else list.push(id);
      store.set('saved',list);
      $$('[data-act="save-pl"][data-id="'+id+'"]').forEach(b=>{
        const on=list.includes(id);
        b.classList.toggle('on',on);
        b.innerHTML=on?I.heartFill+(b.classList.contains('card-save')?'':'已收藏'):I.heart+(b.classList.contains('card-save')?'':'收藏歌单');
      });
      toast(idx>=0?'已取消收藏':'已收藏歌单');
      break;
    }
    case 'open-pl': location.hash='#/playlist/'+el.dataset.id; break;
    case 'sync-pl': syncKg(); break;
    case 'go-search':
      location.hash='#/search';
      setTimeout(()=>{ const i=$('#searchMain'); if(i) i.focus(); },260);
      break;
    case 'go': location.hash='#/'+el.dataset.to; break;
    case 'hint':
      searchQ=el.dataset.q; syncSideSearch();
      if(currentView==='search'){ renderSearch(); }
      else location.hash='#/search';
      break;
    case 'expand': openFull(); break;
    case 'collapse': closeFull(); break;
    case 'lyric': {
      const ms=+el.dataset.t;
      if(isFinite(ms)){ audio.currentTime=ms/1000; updateProgress(); updateLyric(true); }
      break;
    }
    case 'seek': break;
  }
});

/* 进度条拖拽 */
$$('.pbar').forEach(el=>{
  const apply=ev=>{
    if(!audio.duration) return;
    const r=el.getBoundingClientRect();
    const x=Math.min(1,Math.max(0,(ev.clientX-r.left)/r.width));
    audio.currentTime=x*audio.duration;
    updateProgress();
  };
  el.addEventListener('pointerdown',ev=>{
    if(!audio.src) return;
    ev.preventDefault();
    el.classList.add('drag');
    apply(ev);
    try{ el.setPointerCapture(ev.pointerId); }catch(e){}
    const move=e2=>apply(e2);
    const up=e2=>{
      el.classList.remove('drag');
      el.removeEventListener('pointermove',move);
      el.removeEventListener('pointerup',up);
      el.removeEventListener('pointercancel',up);
      try{ el.releasePointerCapture(e2.pointerId); }catch(e){}
    };
    el.addEventListener('pointermove',move);
    el.addEventListener('pointerup',up);
    el.addEventListener('pointercancel',up);
  });
});

  audio.volume=vol;
  $$('[data-b="vol"]').forEach(inp=>{

  });
  $$('[data-b="volIcon"]').forEach(b=>{ b.innerHTML=vol>0?I.volOn:I.volOff; });
  if(save!==false) store.set('vol',vol);
}

/* 我喜欢的音乐 · 导入 */
$('#likedFile').addEventListener('change',e=>{
  const f=e.target.files&&e.target.files[0];
  e.target.value='';
  if(!f) return;
  const rd=new FileReader();
  rd.onload=()=>{
    try{
      const j=JSON.parse(rd.result);
      const arr=Array.isArray(j)?j:(j&&Array.isArray(j.tracks)?j.tracks:null);
      if(!arr) throw new Error('format');
      const cur=store.get('liked',[]);
      const seen=new Set(cur.map(x=>trackKey({name:x.name,artist:x.artist})));
      let added=0;
      arr.forEach(it=>{
        if(!it||!it.name) return;
        const s={kind:it.kind,id:it.id,name:String(it.name),artist:it.artist||'未知艺人',
          album:it.album||'',ncId:it.ncId||'',picId:it.picId||'',cover:it.cover||'',src:'',tone:it.tone||null};
        const k=trackKey(s);
        if(seen.has(k)) return;
        const t=snapToTrack(s);
        if(!t) return;
        seen.add(k); cur.push(snap(t)); added++;
      });
      store.set('liked',cur);
      updateCounts();
      if(currentView==='liked') renderLiked();
      syncUI();
      toast(added?('导入完成，新增 '+added+' 首'):('没有新增（'+arr.length+' 首可能都已经在了）'));
    }catch(err){
      toast('导入失败：不是有效的收藏文件（需要 JSON）');
    }
  };
  rd.readAsText(f,'utf-8');
});

/* 键盘 */
document.addEventListener('keydown',e=>{
  const tag=(e.target.tagName||'').toLowerCase();
  if(tag==='input'||tag==='textarea'||e.target.isContentEditable){
    if(e.key==='Escape') e.target.blur();
    return;
  }
  switch(e.key){
    case ' ': e.preventDefault(); togglePlay(); break;
    case 'ArrowRight': e.preventDefault(); if(audio.duration) audio.currentTime=Math.min(audio.duration,audio.currentTime+5); break;
    case 'ArrowLeft': e.preventDefault(); if(audio.duration) audio.currentTime=Math.max(0,audio.currentTime-5); break;
    case 'ArrowUp': e.preventDefault(); setVolume(audio.volume+0.05); break;
    case 'ArrowDown': e.preventDefault(); setVolume(audio.volume-0.05); break;
    case 'Escape': closeFull(); closeCtx(); document.body.classList.remove('sb-open','np-open'); break;
    case '/':
      e.preventDefault();
      location.hash='#/search';
      setTimeout(()=>{ const i=$('#searchMain'); if(i) i.focus(); },200);
      break;
  }
  if((e.key==='n'||e.key==='N')) next(false);
  if((e.key==='p'||e.key==='P')) prev();
});

/* Media Session */
if('mediaSession' in navigator){
  try{
    navigator.mediaSession.setActionHandler('play',()=>togglePlay());
    navigator.mediaSession.setActionHandler('pause',()=>togglePlay());
    navigator.mediaSession.setActionHandler('previoustrack',()=>prev());
    navigator.mediaSession.setActionHandler('nexttrack',()=>next(false));
    navigator.mediaSession.setActionHandler('seekbackward',()=>{ audio.currentTime=Math.max(0,audio.currentTime-10); });
    navigator.mediaSession.setActionHandler('seekforward',()=>{ audio.currentTime=Math.min(audio.duration||0,audio.currentTime+10); });
  }catch(e){}
}

  $$('.nav-i').forEach(b=>b.classList.toggle('on',b.dataset.nav===key));
  $$('#sidePls .pl-i').forEach(b=>b.classList.toggle('on',b.dataset.nav===key));
}
function updateCounts(){
  $('#likedCount').textContent=store.get('liked',[]).length||'';
}

function route(){
  const raw=location.hash.replace(/^#\/?/,'');
  const parts=raw.split('/');
  const page=parts[0]||'listen';
  closeDrawers();
  if(page==='playlist'&&parts[1]){ renderPlaylist(parts[1]); setNav('pl:'+parts[1]); }
  else if(page==='search'){ renderSearch(); setNav('search'); }
  else if(page==='recent'){ renderRecent(); setNav('recent'); }
  else if(page==='liked'){ renderLiked(); setNav('liked'); }
  else { renderHome(); setNav('listen'); }
  scroller.scrollTop=0;
  topbar.classList.toggle('scrolled',false);
  $('#sbVeil').classList.remove('on');
}
window.addEventListener('hashchange',route);

function renderSidebarPlaylists(){
  $('#sidePls').innerHTML=PLAYLISTS.map(p=>
    `<button class="pl-i" data-nav="pl:${p.id}">
      <span class="mini-art" style="background:linear-gradient(150deg,${p.pal[0]},${p.pal[2]})"></span>
      <span>${esc(p.title)}</span>
    </button>`).join('');
}

function init(){
  applyTheme();
  renderSidebarPlaylists();
  $$('.np-scroll').forEach(el=>el.setAttribute('data-lscroll',''));
  $$('.npx-lyrics').forEach(el=>el.setAttribute('data-lscroll',''));

  setVolume(vol,false);
  applySpeed(speed);

  /* 恢复上次的播放队列与曲目（不自动播放） */
  const st=store.get('state',null);
  if(st){
    const list=Array.isArray(st.queue)?st.queue.map(snapToTrack).filter(Boolean):[];
    const t=st.track?snapToTrack(st.track):null;
    if(list.length){
      queue=list;
      cur=(st.cur>=0&&st.cur<queue.length)?st.cur:0;
      /* 以记录中的当前曲目为准定位 */
      if(t){ const k=queue.findIndex(x=>x.id&&t.id?x.id===t.id:trackKey(x)===trackKey(t)); if(k>=0) cur=k; }
      restoreTime=st.time||0;
      const ct=currentTrack();
      if(ct&&ct.kind==='online'&&ct.picId) ensureCover(ct);
      syncUI();
    } else if(t){
      queue=[t]; cur=0; restoreTime=st.time||0;
      if(t.kind==='online'&&t.picId) ensureCover(t);
      syncUI();
    }
  }

  updateCounts();
  route();
  renderLyrics();
  syncUI();
  startKgAutoSync();
  setInterval(()=>{ if(!audio.paused) saveStateSoon(); },10000);
}

init();
</script>
</body>
</html>
