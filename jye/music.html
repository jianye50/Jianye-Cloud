<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0b0b0d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="鉴业音乐">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>鉴业音乐</title>
<link rel="icon" type="image/x-icon" href="icon.ico">
<link rel="shortcut icon" type="image/x-icon" href="icon.ico">
<link rel="apple-touch-icon" href="icon.ico">
<script>
/* 独立页面：不读取主站任何设置，主题只跟随本页自己的偏好 */
(function(){
  var t='auto';
  try{ t=localStorage.getItem('jym-theme')||'auto'; }catch(e){}
  var dark = t==='dark' || (t!=='light' && !window.matchMedia('(prefers-color-scheme: light)').matches);
  document.documentElement.dataset.theme = dark?'dark':'light';
  document.querySelector('meta[name="theme-color"]').setAttribute('content', dark?'#0b0b0d':'#fbfbfd');
})();
</script>
<style>
/* =========================================================
   鉴业音乐 · 独立版
   设计语言：Apple Music（SF 字体、玻璃材质、大圆角、留白）
   本页不读取、也不写入主站的 localStorage，完全是独立的一份
   ========================================================= */
:root{
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text",
          "Helvetica Neue", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
  --accent:#fa2d48;
  --accent-2:#ff5b6e;
  --accent-soft:rgba(250,45,72,.14);
  --sidebar-w:254px;
  --np-w:344px;
  --ease:cubic-bezier(.32,.72,0,1);
  --hair:.5px;
  --r-card:14px;
}
html[data-theme="dark"]{
  --bg:#08080a;
  --bg-2:#101013;
  --sidebar:rgba(20,20,23,.72);
  --panel:rgba(24,24,28,.66);
  --surface:rgba(255,255,255,.055);
  --surface-2:rgba(255,255,255,.09);
  --surface-3:rgba(255,255,255,.14);
  --text:#f5f5f7;
  --text-2:rgba(235,235,245,.62);
  --text-3:rgba(235,235,245,.36);
  --line:rgba(255,255,255,.085);
  --line-strong:rgba(255,255,255,.16);
  --shadow:0 24px 60px rgba(0,0,0,.55);
  --shadow-sm:0 8px 24px rgba(0,0,0,.4);
  --scrim:rgba(0,0,0,.55);
  --mono:#fff;
  color-scheme:dark;
}
html[data-theme="light"]{
  --bg:#f7f7f9;
  --bg-2:#fff;
  --sidebar:rgba(244,244,247,.78);
  --panel:rgba(255,255,255,.72);
  --surface:rgba(0,0,0,.045);
  --surface-2:rgba(0,0,0,.075);
  --surface-3:rgba(0,0,0,.12);
  --text:#1d1d1f;
  --text-2:rgba(60,60,67,.62);
  --text-3:rgba(60,60,67,.38);
  --line:rgba(0,0,0,.075);
  --line-strong:rgba(0,0,0,.14);
  --shadow:0 24px 60px rgba(0,0,0,.14);
  --shadow-sm:0 8px 24px rgba(0,0,0,.1);
  --scrim:rgba(0,0,0,.28);
  --mono:#fff;
  color-scheme:light;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{
  font-family:var(--font);
  background:var(--bg);
  color:var(--text);
  -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
  overflow:hidden;
  letter-spacing:-.01em;
}
button{font-family:inherit;color:inherit;background:none;border:none;cursor:pointer;letter-spacing:inherit}
input{font-family:inherit}
img{display:block;max-width:100%}
::selection{background:rgba(250,45,72,.3)}
a{color:inherit;text-decoration:none}
svg{display:block}
.hide{display:none !important}

/* ---------- 环境光背景：随当前播放的封面变色 ---------- */
.ambient{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none;background:var(--bg);transition:background .6s}
.ambient i{position:absolute;display:block;border-radius:50%;filter:blur(60px);opacity:.5;
  transition:background 1.4s var(--ease),opacity 1.2s}
.ambient .a1{width:78vw;height:78vw;left:-22vw;top:-32vw;background:radial-gradient(circle,var(--t1,#2a1250) 0%,transparent 68%)}
.ambient .a2{width:64vw;height:64vw;right:-16vw;top:8vh;background:radial-gradient(circle,var(--t2,#4a1f6b) 0%,transparent 70%);opacity:.42}
.ambient .a3{width:70vw;height:70vw;left:18vw;bottom:-38vw;background:radial-gradient(circle,var(--t3,#ff5b6e) 0%,transparent 70%);opacity:.24}
html[data-theme="light"] .ambient i{opacity:.3}
html[data-theme="light"] .ambient .a2{opacity:.24}
html[data-theme="light"] .ambient .a3{opacity:.16}

/* ---------- 应用外壳 ---------- */
.app{position:fixed;inset:0;z-index:1;display:grid;
  grid-template-columns:var(--sidebar-w) minmax(0,1fr) var(--np-w)}

/* ---------- 侧边栏 ---------- */
.sidebar{
  display:flex;flex-direction:column;min-height:0;gap:6px;
  padding:14px 12px 10px;
  background:var(--sidebar);
  backdrop-filter:blur(18px) saturate(160%);
  -webkit-backdrop-filter:blur(18px) saturate(160%);
  border-right:var(--hair) solid var(--line);
}
.brand{display:flex;align-items:center;gap:11px;padding:4px 8px 10px}
.brand-ic{width:38px;height:38px;border-radius:11px;flex:none;overflow:hidden;
  background:linear-gradient(155deg,#ff5b6e,#e3122f 78%);
  box-shadow:0 6px 16px rgba(227,18,47,.34),inset 0 1px 0 rgba(255,255,255,.34)}
.brand-ic img{width:100%;height:100%;object-fit:cover;display:block}
.brand b{display:block;font-size:15px;font-weight:680;letter-spacing:-.02em}
.brand span{display:block;font-size:11px;color:var(--text-3);margin-top:1px;letter-spacing:0}

.searchbox{position:relative;display:flex;align-items:center;margin:2px 4px 10px}
.searchbox svg{position:absolute;left:9px;width:14px;height:14px;color:var(--text-3);pointer-events:none}
.searchbox input{
  width:100%;height:32px;border-radius:9px;border:var(--hair) solid transparent;
  background:var(--surface);padding:0 10px 0 29px;font-size:13px;color:var(--text);
  outline:none;transition:.2s;-webkit-appearance:none
}
.searchbox input::placeholder{color:var(--text-3)}
.searchbox input:focus{background:var(--surface-2);border-color:var(--line-strong)}

.nav{flex:1;min-height:0;overflow-y:auto;padding:0 2px 8px;scrollbar-width:thin}
.nav::-webkit-scrollbar{width:6px}
.nav::-webkit-scrollbar-thumb{background:var(--surface-3);border-radius:3px}
.nav-t{font-size:11px;font-weight:600;color:var(--text-3);letter-spacing:.04em;
  padding:14px 10px 6px;text-transform:uppercase}
.nav-i{display:flex;align-items:center;gap:9px;width:100%;height:32px;padding:0 10px;
  border-radius:8px;font-size:13.5px;font-weight:500;color:var(--text);transition:background .16s;text-align:left}
.nav-i svg{width:16px;height:16px;flex:none;color:var(--accent);opacity:.92}
.nav-i:hover{background:var(--surface)}
.nav-i.on{background:var(--surface-2);font-weight:600}
.nav-i .cnt{margin-left:auto;font-size:11px;color:var(--text-3);font-variant-numeric:tabular-nums}
.pl-i{display:flex;align-items:center;gap:9px;width:100%;height:34px;padding:0 8px;border-radius:8px;
  font-size:13px;color:var(--text-2);transition:background .16s,color .16s;text-align:left}
.pl-i:hover{background:var(--surface);color:var(--text)}
.pl-i.on{background:var(--surface-2);color:var(--text);font-weight:600}
.pl-i .mini-art{width:22px;height:22px;border-radius:5px;flex:none;overflow:hidden;position:relative}
.pl-i span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.side-foot{padding:8px 10px 4px;border-top:var(--hair) solid var(--line);margin-top:4px}
.theme-seg{display:flex;gap:2px;padding:2px;border-radius:9px;background:var(--surface);margin-bottom:8px}
.theme-seg button{flex:1;height:26px;border-radius:7px;display:grid;place-items:center;color:var(--text-3);transition:.18s}
.theme-seg button svg{width:14px;height:14px}
.theme-seg button:hover{color:var(--text-2)}
.theme-seg button.on{background:var(--surface-3);color:var(--text);box-shadow:0 1px 2px rgba(0,0,0,.18)}
.side-foot p{font-size:10.5px;color:var(--text-3);line-height:1.6;letter-spacing:0}

/* ---------- 主区域 ---------- */
.main{min-width:0;min-height:0;display:flex;flex-direction:column;position:relative}
.topbar{
  flex:none;height:58px;display:flex;align-items:center;gap:10px;padding:0 22px;
  background:linear-gradient(to bottom,var(--bg) 20%,transparent);
  position:relative;z-index:20;
}
html[data-theme="light"] .topbar{background:linear-gradient(to bottom,rgba(247,247,249,.94) 30%,transparent)}
.topbar.scrolled{background:var(--panel);backdrop-filter:blur(16px) saturate(160%);-webkit-backdrop-filter:blur(16px) saturate(160%);
  border-bottom:var(--hair) solid var(--line)}
.tb-title{font-size:13.5px;font-weight:650;letter-spacing:-.01em;opacity:0;transition:opacity .25s;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:40vw}
.topbar.scrolled .tb-title{opacity:1}
.tb-tools{margin-left:auto;display:flex;align-items:center;gap:6px}
.icon-btn{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;color:var(--text-2);
  transition:.18s;flex:none}
.icon-btn svg{width:17px;height:17px}
.icon-btn:hover{background:var(--surface-2);color:var(--text)}
.icon-btn:active{transform:scale(.92)}
.icon-btn.on{color:var(--accent)}
.search-mini{display:none}

.scroller{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;padding:2px 26px 44px;scroll-behavior:smooth}
.scroller::-webkit-scrollbar{width:11px}
.scroller::-webkit-scrollbar-thumb{background:var(--surface-3);border-radius:6px;border:3px solid transparent;background-clip:content-box}
.scroller::-webkit-scrollbar-thumb:hover{background:var(--line-strong);background-clip:content-box;border:3px solid transparent}

/* ---------- 首页 ---------- */
.greet{padding:14px 2px 22px}
.greet h1{font-size:34px;line-height:1.14;font-weight:720;letter-spacing:-.035em}
.greet p{font-size:13.5px;color:var(--text-2);margin-top:7px}

.hero{position:relative;border-radius:22px;overflow:hidden;isolation:isolate;
  display:flex;align-items:flex-end;justify-content:space-between;gap:26px;
  padding:30px 34px;min-height:286px;
  border:var(--hair) solid rgba(255,255,255,.16);
  box-shadow:var(--shadow-sm);color:#fff}
.hero-bg{position:absolute;inset:0;z-index:-2;background:var(--hero-bg)}
.hero-bg::after{content:"";position:absolute;inset:0;
  background:
    radial-gradient(120% 130% at 88% 6%,rgba(255,255,255,.24),transparent 58%),
    linear-gradient(100deg,rgba(0,0,0,.48) 8%,rgba(0,0,0,.12) 62%,transparent);
  mix-blend-mode:normal}
.hero-bg::before{content:"";position:absolute;inset:0;z-index:1;opacity:.5;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='140' height='140'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3'/><feColorMatrix type='saturate' values='0'/></filter><rect width='140' height='140' filter='url(%23n)' opacity='.14'/></svg>")}
.hero-tx{position:relative;z-index:1;max-width:min(560px,58%)}
.eyebrow{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:700;
  letter-spacing:.12em;text-transform:uppercase;color:rgba(255,255,255,.78)}
.eyebrow::before{content:"";width:14px;height:1.5px;background:currentColor;border-radius:2px}
.hero-tx h1{font-size:clamp(30px,3.6vw,46px);line-height:1.04;font-weight:760;letter-spacing:-.04em;
  margin:12px 0 10px;text-shadow:0 2px 24px rgba(0,0,0,.22)}
.hero-tx p{font-size:13.5px;line-height:1.6;color:rgba(255,255,255,.76);max-width:44ch}
.hero-btns{display:flex;align-items:center;gap:10px;margin-top:20px}
.btn{display:inline-flex;align-items:center;gap:7px;height:36px;padding:0 18px;border-radius:999px;
  font-size:13.5px;font-weight:600;transition:.2s var(--ease);white-space:nowrap;flex:none}
.btn svg{width:14px;height:14px}
.btn.primary{background:var(--accent);color:#fff;box-shadow:0 6px 18px rgba(250,45,72,.34)}
.btn.primary:hover{background:#ff3f5a;transform:translateY(-1px);box-shadow:0 9px 24px rgba(250,45,72,.42)}
.btn.primary:active{transform:scale(.97)}
.btn.ghost{background:rgba(255,255,255,.16);color:#fff;backdrop-filter:blur(12px);
  border:var(--hair) solid rgba(255,255,255,.24)}
.btn.ghost:hover{background:rgba(255,255,255,.26)}
.btn.ghost.dark{background:var(--surface-2);color:var(--text);border-color:var(--line)}
.btn.ghost.dark:hover{background:var(--surface-3)}
.art-svg{position:absolute;inset:0;width:100%;height:100%;display:block}
.mono{position:absolute;inset:0;display:grid;place-items:center;color:rgba(255,255,255,.95)}
.mono span{font-size:15px;font-weight:600;line-height:1;letter-spacing:0}
.np-art .mono span{font-size:38px}
.npx-art .mono span{font-size:50px}
.mini-art .mono span{font-size:16px}
.pl-art{position:relative}
.mini-art{position:relative}
.hero-art{position:relative;z-index:1;flex:none;width:196px;height:196px;border-radius:16px;overflow:hidden;
  box-shadow:0 22px 46px rgba(0,0,0,.42),0 0 0 .5px rgba(255,255,255,.18);
  transform:rotate(-2.2deg) translateY(-2px);transition:transform .5s var(--ease),box-shadow .5s}
.hero:hover .hero-art{transform:rotate(-1deg) translateY(-6px) scale(1.015);box-shadow:0 30px 60px rgba(0,0,0,.5)}

.sec{margin-top:38px}
.sec-hd{display:flex;align-items:baseline;justify-content:space-between;gap:16px;margin-bottom:15px}
.sec-hd h2{font-size:21px;font-weight:720;letter-spacing:-.03em;line-height:1.2}
.sec-hd p{font-size:12.5px;color:var(--text-3);margin-top:3px}
.sec-hd .more{font-size:12.5px;font-weight:600;color:var(--accent);display:inline-flex;align-items:center;gap:3px;flex:none}
.sec-hd .more svg{width:12px;height:12px}
.sec-hd .more:hover{opacity:.75}

.card-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:26px 20px}
.card{position:relative;min-width:0;cursor:pointer;padding-bottom:2px}
.card-art{position:relative;border-radius:var(--r-card);overflow:hidden;aspect-ratio:1;
  box-shadow:0 4px 14px rgba(0,0,0,.16);
  transition:transform .42s var(--ease),box-shadow .42s var(--ease)}
.card:hover .card-art{transform:translateY(-4px);box-shadow:0 18px 36px rgba(0,0,0,.28)}
.card-play{position:absolute;right:9px;bottom:9px;width:34px;height:34px;border-radius:50%;
  display:grid;place-items:center;background:rgba(255,255,255,.92);color:#111;
  box-shadow:0 4px 14px rgba(0,0,0,.28);opacity:0;transform:translateY(7px) scale(.88);
  transition:.28s var(--ease);backdrop-filter:blur(8px)}
.card-play svg{width:15px;height:15px;margin-left:1px}
.card:hover .card-play{opacity:1;transform:none}
.card-play:hover{background:#fff;transform:scale(1.06)}
.card-tx{padding:10px 2px 0;min-width:0}
.card-tx b{display:block;font-size:13.5px;font-weight:600;letter-spacing:-.015em;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card-tx span{display:block;font-size:11.5px;color:var(--text-3);margin-top:3px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card-save{position:absolute;left:9px;top:9px;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;
  background:rgba(0,0,0,.34);color:#fff;backdrop-filter:blur(10px);opacity:0;transition:.24s}
.card-save svg{width:13px;height:13px}
.card-save.on{opacity:1;color:#ff5b6e}
.card:hover .card-save{opacity:1}

/* ---------- 曲目列表 ---------- */
.tracks{border-radius:var(--r-card);background:var(--panel);border:var(--hair) solid var(--line);overflow:hidden;
  backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px)}
.tr{display:grid;grid-template-columns:26px 42px minmax(0,1.7fr) minmax(0,1.05fr) 52px 62px;
  align-items:center;gap:12px;height:58px;padding:0 14px;border-bottom:var(--hair) solid var(--line);
  transition:background .16s;cursor:pointer}
.tr:last-child{border-bottom:none}
.tr:hover{background:var(--surface)}
.tr.on{background:var(--accent-soft)}
.tr-n{font-size:12.5px;color:var(--text-3);font-variant-numeric:tabular-nums;text-align:center}
.tr-n .bars{display:none;gap:2px;align-items:flex-end;justify-content:center;height:13px}
.tr.on .tr-n{color:var(--accent)}
.tr.on .tr-n .num{display:none}
.tr.on .tr-n .bars{display:flex}
.bars i{width:2px;background:var(--accent);border-radius:1px;animation:bar 1s infinite ease-in-out}
.bars i:nth-child(1){height:5px;animation-delay:0s}
.bars i:nth-child(2){height:12px;animation-delay:.22s}
.bars i:nth-child(3){height:8px;animation-delay:.44s}
@keyframes bar{0%,100%{transform:scaleY(.45)}50%{transform:scaleY(1)}}
.tr-art{width:42px;height:42px;border-radius:7px;overflow:hidden;position:relative;flex:none;background:var(--surface-2)}
.tr-art img{width:100%;height:100%;object-fit:cover}
.tr-tx{min-width:0}
.tr-tx b{display:block;font-size:13.5px;font-weight:520;letter-spacing:-.01em;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tr.on .tr-tx b{color:var(--accent);font-weight:600}
.tr-tx i{display:block;font-style:normal;font-size:11.5px;color:var(--text-3);margin-top:2px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tr-album{font-size:12px;color:var(--text-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tr-time{font-size:12px;color:var(--text-3);text-align:right;font-variant-numeric:tabular-nums}
.tr-like{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;color:var(--text-3);opacity:0;transition:.18s}
.tr-like svg{width:14px;height:14px}
.tr:hover .tr-like{opacity:1}
.tr-like:hover{color:var(--text);background:var(--surface-2)}
.tr-like.on{opacity:1;color:var(--accent)}
.tr-more{display:flex;align-items:center;justify-content:flex-end}

/* 广场卡片：推荐歌单大图横排 */
.row-cards{display:grid;grid-auto-flow:column;grid-auto-columns:168px;gap:18px;
  overflow-x:auto;padding:2px 2px 8px;scroll-snap-type:x proximity;scrollbar-width:none}
.row-cards::-webkit-scrollbar{display:none}
.row-cards .card{scroll-snap-align:start}

/* ---------- 歌单页 ---------- */
.pl-hero{position:relative;display:flex;align-items:flex-end;gap:26px;padding:26px 4px 30px;flex-wrap:wrap}
.pl-art{width:190px;height:190px;border-radius:16px;overflow:hidden;flex:none;
  box-shadow:0 24px 50px rgba(0,0,0,.38),0 0 0 .5px rgba(255,255,255,.14)}
.pl-tx{min-width:0;padding-bottom:4px}
.pl-tx .kicker{font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--accent)}
.pl-tx h1{font-size:clamp(28px,3.4vw,42px);line-height:1.08;font-weight:740;letter-spacing:-.04em;margin:9px 0 10px}
.pl-tx p{font-size:13px;line-height:1.65;color:var(--text-2);max-width:52ch}
.pl-meta{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--text-3);margin-top:12px;flex-wrap:wrap}
.pl-meta .dot{width:3px;height:3px;border-radius:50%;background:currentColor;opacity:.6}
.pl-actions{display:flex;align-items:center;gap:10px;margin-top:18px;flex-wrap:wrap}
.pl-save{display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 14px;border-radius:999px;
  font-size:13px;font-weight:600;color:var(--text-2);background:var(--surface);transition:.18s}
.pl-save svg{width:14px;height:14px}
.pl-save:hover{background:var(--surface-2);color:var(--text)}
.pl-save.on{color:var(--accent);background:var(--accent-soft)}
.pl-sync{display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 14px;border-radius:999px;
  font-size:13px;font-weight:600;color:var(--text-2);background:var(--surface);transition:.18s}
.pl-sync svg{width:14px;height:14px}
.pl-sync:hover{background:var(--surface-2);color:var(--text)}
.pl-sync[disabled]{cursor:default;opacity:.72}
.pl-sync.busy svg{animation:spin .9s linear infinite}
.pl-src{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--text-3);margin-top:10px;flex-wrap:wrap}
.pl-src svg{width:14px;height:14px;flex:none}
.pl-src b{font-weight:600;color:var(--text-2)}
.pl-src .dot{width:3px;height:3px;border-radius:50%;background:currentColor;opacity:.6}

/* ---------- 搜索 ---------- */
.search-head{padding:14px 0 4px}
.search-head h1{font-size:30px;font-weight:730;letter-spacing:-.035em}
.search-big{display:flex;align-items:center;gap:9px;margin-top:18px;height:44px;padding:0 15px;
  border-radius:12px;background:var(--surface);border:var(--hair) solid transparent;transition:.2s}
.search-big:focus-within{background:var(--surface-2);border-color:var(--line-strong)}
.search-big svg{width:17px;height:17px;color:var(--text-3);flex:none}
.search-big input{flex:1;min-width:0;background:none;border:none;outline:none;font-size:15px;color:var(--text)}
.search-big input::placeholder{color:var(--text-3)}
.hints{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.hint{height:30px;padding:0 13px;border-radius:999px;background:var(--surface);font-size:12.5px;
  color:var(--text-2);transition:.18s}
.hint:hover{background:var(--surface-2);color:var(--text)}
.empty{padding:66px 10px;text-align:center;color:var(--text-3)}
.empty svg{width:38px;height:38px;margin:0 auto 14px;opacity:.5}
.empty b{display:block;font-size:15px;font-weight:600;color:var(--text-2);margin-bottom:6px}
.empty p{font-size:12.5px;line-height:1.7}
.loading{display:flex;align-items:center;justify-content:center;gap:10px;padding:52px;color:var(--text-3);font-size:13px}
.spin{width:16px;height:16px;border-radius:50%;border:2px solid var(--surface-3);border-top-color:var(--accent);
  animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* ---------- 右侧正在播放 ---------- */
.nowpanel{
  display:flex;flex-direction:column;min-height:0;gap:12px;padding:14px 18px 14px;
  background:var(--panel);backdrop-filter:blur(18px) saturate(160%);-webkit-backdrop-filter:blur(18px) saturate(160%);
  border-left:var(--hair) solid var(--line);
}
.np-top{display:flex;align-items:center;justify-content:space-between;flex:none;height:24px}
.np-label{font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--text-3)}
.np-top .icon-btn{width:26px;height:26px}
.np-top .icon-btn svg{width:14px;height:14px}
.np-art{position:relative;width:100%;max-width:min(100%,36vh);margin:0 auto;aspect-ratio:1;border-radius:16px;overflow:hidden;flex:none;
  background:var(--surface);box-shadow:0 20px 44px rgba(0,0,0,.4),0 0 0 .5px rgba(255,255,255,.1);
  cursor:pointer;transition:transform .5s var(--ease),box-shadow .5s}
.np-art:hover{transform:translateY(-2px) scale(1.008)}
.np-art img{width:100%;height:100%;object-fit:cover}
.np-art .ph{width:100%;height:100%;display:grid;place-items:center;color:rgba(255,255,255,.9)}
.np-art .ph svg{width:34px;height:34px;opacity:.9}
.np-meta{flex:none;padding:2px 2px 0;min-width:0}
.np-title{font-size:16px;font-weight:660;letter-spacing:-.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.np-sub{font-size:12.5px;color:var(--text-2);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.np-progress{flex:none;padding:0 2px}
.pbar{position:relative;height:16px;display:flex;align-items:center;cursor:pointer;touch-action:none}
.pbar .track{position:absolute;left:0;right:0;height:4px;border-radius:2px;background:var(--surface-3);overflow:hidden}
.pbar .fill{display:block;height:100%;width:0;border-radius:2px;background:var(--text);opacity:.85}
.pbar .knob{position:absolute;left:0;top:50%;width:10px;height:10px;border-radius:50%;background:var(--text);
  transform:translate(-50%,-50%) scale(0);transition:transform .18s;box-shadow:0 1px 4px rgba(0,0,0,.4)}
.pbar:hover .knob,.pbar.drag .knob{transform:translate(-50%,-50%) scale(1)}
.times{display:flex;justify-content:space-between;font-size:10.5px;color:var(--text-3);
  font-variant-numeric:tabular-nums;margin-top:4px;letter-spacing:0}
.np-controls{display:flex;align-items:center;justify-content:center;gap:12px;flex:none;padding:2px 0}
.np-controls .c-btn{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;color:var(--text);
  transition:.18s;flex:none}
.np-controls .c-btn svg{width:18px;height:18px}
.np-controls .c-btn:hover{background:var(--surface-2)}
.np-controls .c-btn:active{transform:scale(.9)}
.np-controls .c-btn.small{width:30px;height:30px;color:var(--text-3)}
.np-controls .c-btn.small svg{width:15px;height:15px}
.np-controls .c-btn.on{color:var(--accent)}
.c-btn.off{opacity:.35}
.c-btn.spd{font-size:10.5px;font-weight:700;letter-spacing:-.03em;font-variant-numeric:tabular-nums;
  color:var(--text-3)}
.npx-controls .c-btn.spd{font-size:12px;color:rgba(255,255,255,.72)}
.c-btn.spd.on{color:var(--accent)}
.npx-controls .c-btn.spd.on{color:var(--accent-2)}
/* 多了一个倍速键，侧栏播放条收紧间距，避免挤出容器 */
.np-controls{gap:8px}
.np-controls .c-btn.small{width:28px;height:28px}
.np-controls .c-btn.small svg{width:14px;height:14px}
.play-lg{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;flex:none;
  background:var(--text);color:var(--bg);transition:.2s var(--ease);box-shadow:0 6px 18px rgba(0,0,0,.28)}
.play-lg svg{width:19px;height:19px}
.play-lg:hover{transform:scale(1.06)}
.play-lg:active{transform:scale(.95)}
.np-extra{display:flex;align-items:center;gap:8px;flex:none;padding:0 2px;height:26px}
.np-extra .icon-btn{width:26px;height:26px;flex:none}
.np-extra .icon-btn svg{width:14px;height:14px}
.range{-webkit-appearance:none;appearance:none;background:none;height:16px;flex:1;min-width:0;cursor:pointer;margin:0}
.range::-webkit-slider-runnable-track{height:4px;border-radius:2px;
  background:linear-gradient(to right,var(--text) var(--p,80%),var(--surface-3) var(--p,80%))}
.range::-webkit-slider-thumb{-webkit-appearance:none;width:11px;height:11px;border-radius:50%;background:var(--text);
  margin-top:-3.5px;box-shadow:0 1px 3px rgba(0,0,0,.35)}
.range::-moz-range-track{height:4px;border-radius:2px;background:var(--surface-3)}
.range::-moz-range-progress{height:4px;border-radius:2px;background:var(--text)}
.range::-moz-range-thumb{width:11px;height:11px;border:none;border-radius:50%;background:var(--text)}
.np-tabs{display:flex;align-items:center;gap:16px;flex:none;padding:2px 2px 0;border-top:var(--hair) solid var(--line);margin-top:2px}
.np-tabs button{font-size:12.5px;font-weight:600;color:var(--text-3);height:34px;position:relative;transition:.18s}
.np-tabs button:hover{color:var(--text-2)}
.np-tabs button.on{color:var(--text)}
.np-tabs button.on::after{content:"";position:absolute;left:0;right:0;bottom:0;height:2px;border-radius:2px;background:var(--accent)}
.np-scroll{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;padding-right:2px;scrollbar-width:thin}
.np-scroll::-webkit-scrollbar{width:6px}
.np-scroll::-webkit-scrollbar-thumb{background:var(--surface-3);border-radius:3px}
.np-scroll .pane{height:100%}

/* 歌词 */
.lyrics{padding:18% 4px 40%;text-align:left}
.lyrics p{font-size:14.5px;line-height:1.55;font-weight:600;color:var(--text-3);margin-bottom:14px;
  transition:color .3s,opacity .3s;cursor:pointer;letter-spacing:-.015em}
.lyrics p:hover{color:var(--text-2)}
.lyrics p.on{color:var(--text);font-size:15.5px;font-weight:660}
.lyrics p.lyr-tr{font-size:12px;font-weight:500;margin-top:-11px;color:var(--text-3);opacity:.6}
.lyrics p.lyr-tr.on{color:var(--text-2);opacity:.9;font-size:12.5px}
.lyrics .note{font-size:12px;color:var(--text-3);line-height:1.7;padding:10px 0}
.lyrics.center{text-align:center;padding:26% 6px 40%}
.lyrics.center p{margin-bottom:18px}

/* 队列 */
.queue{padding:4px 0 14px}
.q-i{display:flex;align-items:center;gap:10px;padding:7px 4px;border-radius:8px;cursor:pointer;transition:.16s}
.q-i:hover{background:var(--surface)}
.q-i.on{background:var(--surface-2)}
.q-i .q-art{width:34px;height:34px;border-radius:6px;overflow:hidden;flex:none;position:relative}
.q-i .q-tx{min-width:0;flex:1}
.q-i b{display:block;font-size:12.5px;font-weight:520;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.q-i.on b{color:var(--accent)}
.q-i span{display:block;font-size:11px;color:var(--text-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
.q-i .q-nx{display:inline-block;margin-top:3px;padding:0 6px;border-radius:999px;font-style:normal;
  font-size:9.5px;line-height:15px;letter-spacing:.04em;font-weight:600;
  color:var(--accent-2);background:var(--accent-soft);border:var(--hair) solid rgba(250,45,72,.34)}
.q-empty{font-size:12px;color:var(--text-3);padding:18px 4px;line-height:1.7}
.q-hd{display:flex;align-items:center;justify-content:space-between;padding:2px 4px 8px;
  font-size:11px;font-weight:600;letter-spacing:.06em;color:var(--text-3)}
.q-clear{border:0;background:none;color:var(--text-3);font-size:11.5px;cursor:pointer;padding:3px 8px;border-radius:7px}
.q-clear:hover{color:var(--text);background:var(--surface-2)}
.q-more{display:block;width:100%;margin:3px 0;padding:8px;border:0;border-radius:9px;background:none;
  color:var(--text-3);font-size:11.5px;cursor:pointer;transition:.15s;text-align:center}
.q-more:hover{color:var(--text);background:var(--surface-2)}
.q-del{width:24px;height:24px;flex:none;border:0;border-radius:50%;display:grid;place-items:center;
  background:none;color:var(--text-3);cursor:pointer;opacity:0;transition:.15s}
.q-del svg{width:12px;height:12px}
.q-i:hover .q-del,.q-i.on .q-del{opacity:.75}
.q-del:hover{opacity:1 !important;color:#ff5c6c;background:var(--surface-2)}
/* 触屏设备：列表右侧按钮常显（没有 hover），并扩大点击热区 */
@media (hover:none){
  .tr-like,.tr-act{opacity:1}
  .q-del{opacity:.6}
  .tr-like,.tr-act,.q-del,.card-save{position:relative}
  .tr-like::after,.tr-act::after{content:'';position:absolute;inset:-7px;border-radius:50%}
  .q-del::after,.card-save::after{content:'';position:absolute;inset:-5px;border-radius:50%}
}
/* 歌曲行「更多操作」 */
.tr-act{display:grid}
/* 歌单内搜索 / 显示更多 */
.pl-filter{display:flex;align-items:center;gap:9px;margin:2px 0 14px;padding:0 14px;height:42px;
  border-radius:12px;background:var(--surface);border:var(--hair) solid var(--line)}
.pl-filter svg{width:15px;height:15px;color:var(--text-3);flex:none}
.pl-filter input{flex:1;min-width:0;border:0;background:none;outline:none;color:var(--text);font-size:13.5px}
.pl-more{margin:16px auto 0;display:flex}
.pl-filter-note{font-size:12px;color:var(--text-3);margin-top:14px}
/* 我喜欢的音乐 · 导入导出 */
.liked-tools{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap}
.liked-tools .btn{height:32px;padding:0 14px;font-size:12.5px}
/* 歌曲右键 / 更多操作菜单 */
.ctx-menu{position:fixed;z-index:420;min-width:190px;padding:6px;display:none;border-radius:14px;
  max-height:min(72vh,460px);overflow-y:auto;overscroll-behavior:contain;
  background:var(--panel);border:var(--hair) solid var(--line-strong);
  box-shadow:0 18px 44px rgba(0,0,0,.35);backdrop-filter:blur(16px) saturate(150%)}
.ctx-menu.on{display:block;animation:ctxIn .16s var(--ease)}
@keyframes ctxIn{from{opacity:0;transform:translateY(4px) scale(.98)}to{opacity:1;transform:none}}
.ctx-menu button{display:flex;align-items:center;gap:10px;width:100%;padding:9px 12px;border:0;
  background:none;color:var(--text);font-size:13px;font-weight:500;border-radius:9px;cursor:pointer;text-align:left}
.ctx-menu button:hover{background:var(--surface-2)}
.ctx-menu button svg{width:15px;height:15px;color:var(--text-3);flex:none}
.ctx-menu button.danger{color:#ff5c6c}
.ctx-menu button.danger svg{color:#ff5c6c}

/* ---------- 全屏正在播放 ---------- */
.np-full{position:fixed;inset:0;z-index:300;overflow:hidden;visibility:hidden;
  transform:translateY(100%);transition:transform .55s var(--ease),visibility .55s}
.np-full.on{visibility:visible;transform:none}
.npx-bg{position:absolute;inset:0;background:linear-gradient(160deg,var(--t1,#2a1250),var(--t2,#4a1f6b) 55%,#08080a 100%)}
.npx-bg img{position:absolute;inset:-18%;width:136%;height:136%;object-fit:cover;
  filter:blur(64px) saturate(1.5);opacity:.7;transform:scale(1.05)}
.npx-bg::after{content:"";position:absolute;inset:0;
  background:linear-gradient(to bottom,rgba(0,0,0,.34),rgba(0,0,0,.5));backdrop-filter:blur(2px)}
.npx{position:relative;z-index:1;height:100%;display:grid;
  grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:clamp(24px,5vw,80px);
  padding:26px clamp(24px,5vw,64px) 30px;align-items:center;color:#fff}
.npx-col{display:flex;flex-direction:column;min-width:0;max-width:520px;width:100%;justify-self:center}
.npx-hd{display:flex;align-items:center;justify-content:space-between;flex:none;height:34px;margin-bottom:clamp(8px,2vh,26px)}
.npx-hd span{font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:rgba(255,255,255,.62)}
.npx-hd .icon-btn{color:rgba(255,255,255,.8)}
.npx-hd .icon-btn:hover{background:rgba(255,255,255,.14);color:#fff}
.npx-art{position:relative;width:min(100%,340px);aspect-ratio:1;border-radius:18px;overflow:hidden;
  align-self:center;margin:0 auto clamp(16px,3.4vh,32px);
  box-shadow:0 32px 70px rgba(0,0,0,.5),0 0 0 .5px rgba(255,255,255,.16);flex:none;background:rgba(255,255,255,.08)}
.npx-art img{width:100%;height:100%;object-fit:cover}
.npx-art .ph{width:100%;height:100%;display:grid;place-items:center;color:rgba(255,255,255,.75)}
.npx-art .ph svg{width:46px;height:46px}
.npx-meta{padding:0 2px;flex:none}
.npx-meta h2{font-size:clamp(20px,2.4vw,26px);font-weight:700;letter-spacing:-.03em;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.npx-meta p{font-size:13.5px;color:rgba(255,255,255,.62);margin-top:4px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.npx-progress{margin:clamp(12px,2.4vh,22px) 0 0;flex:none}
.npx-progress .pbar .track{background:rgba(255,255,255,.24)}
.npx-progress .pbar .fill{background:#fff;opacity:1}
.npx-progress .pbar .knob{background:#fff}
.npx-progress .times{color:rgba(255,255,255,.56)}
.npx-controls{display:flex;align-items:center;justify-content:center;gap:clamp(12px,2.4vw,26px);
  margin-top:clamp(10px,2vh,20px);flex:none}
.npx-controls .c-btn{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;color:#fff;transition:.18s}
.npx-controls .c-btn svg{width:23px;height:23px}
.npx-controls .c-btn:hover{background:rgba(255,255,255,.14)}
.npx-controls .c-btn:active{transform:scale(.92)}
.npx-controls .c-btn.small{width:38px;height:38px;color:rgba(255,255,255,.72)}
.npx-controls .c-btn.small svg{width:18px;height:18px}
.npx-controls .c-btn.on{color:#fff}
.npx-controls .c-btn.small.on{color:var(--accent-2)}
.npx-controls .play-lg{width:66px;height:66px;background:#fff;color:#111;box-shadow:0 10px 30px rgba(0,0,0,.35)}
.npx-controls .play-lg svg{width:26px;height:26px}
.npx-extra{display:flex;align-items:center;gap:10px;margin-top:clamp(8px,1.6vh,16px);flex:none}
.npx-extra .icon-btn{color:rgba(255,255,255,.7)}
.npx-extra .icon-btn:hover{background:rgba(255,255,255,.14);color:#fff}
.npx-extra .range{--text:#fff}
.npx-extra .range::-webkit-slider-runnable-track{background:linear-gradient(to right,#fff var(--p,80%),rgba(255,255,255,.26) var(--p,80%))}
.npx-lyr-col{display:flex;flex-direction:column;min-width:0;min-height:0;height:100%;
  max-width:560px;width:100%;justify-self:center}
.npx-tabs{display:flex;gap:4px;flex:none;margin-bottom:8px;padding:3px;width:max-content;align-self:center;
  background:rgba(255,255,255,.09);border-radius:999px}
.npx-tab{border:0;background:none;color:rgba(255,255,255,.6);font-size:12px;font-weight:600;
  padding:5px 16px;border-radius:999px;cursor:pointer;transition:.18s}
.npx-tab:hover{color:#fff}
.npx-tab.on{background:rgba(255,255,255,.26);color:#fff}
.npx-lyrics{min-height:0;flex:1 1 0;overflow-y:auto;padding:8px 6px;scrollbar-width:none}
.npx-queue{min-height:0;flex:1 1 0;overflow-y:auto;scrollbar-width:none;padding:4px 2px 26%}
.npx-lyrics[hidden],.npx-queue[hidden]{display:none !important}
.npx-lyrics::-webkit-scrollbar,.npx-queue::-webkit-scrollbar{display:none}
.npx-queue .q-i{padding:9px 6px}
.npx-queue .q-i .q-art{width:42px;height:42px;border-radius:8px}
.npx-queue .q-i b{font-size:14px}
.npx-queue .q-i span{font-size:12px}
/* 全屏播放页背景永远是深色，队列文字与悬停全部固定白色系，不随主题切换 */
.npx-queue .q-i span{color:rgba(255,255,255,.55)}
.npx-queue .q-i:hover{background:rgba(255,255,255,.12)}
.npx-queue .q-i.on{background:rgba(255,255,255,.16)}
.npx-queue .q-i.on b{color:var(--accent-2,#ff77b0)}
.npx-queue .q-more{color:rgba(255,255,255,.5)}
.npx-queue .q-more:hover{color:#fff;background:rgba(255,255,255,.12)}
.npx-queue .q-del{color:rgba(255,255,255,.55)}
.npx-queue .q-del:hover{color:#ff5c6c;background:rgba(255,255,255,.14)}
.npx-queue .q-hd{color:rgba(255,255,255,.6)}
.npx-queue .q-clear{color:rgba(255,255,255,.55)}
.npx-queue .q-clear:hover{color:#fff;background:rgba(255,255,255,.12)}
.npx-queue .q-empty{color:rgba(255,255,255,.5)}
.npx-lyrics::-webkit-scrollbar{display:none}
.npx-lyrics .lyrics{padding:30% 0}
.npx-lyrics .lyrics p{color:rgba(255,255,255,.42);font-size:clamp(15px,1.5vw,19px);font-weight:600}
.npx-lyrics .lyrics p.on{color:#fff;font-size:clamp(16.5px,1.7vw,21px)}
.npx-lyrics .lyrics p.lyr-tr{color:rgba(255,255,255,.4);opacity:.8}
.npx-lyrics .lyrics p.lyr-tr.on{color:rgba(255,255,255,.66)}
.npx-lyrics .lyrics .note{color:rgba(255,255,255,.45)}
.npx-close-m{display:none}

/* ---------- 手机底部迷你播放条 ---------- */
.mini{display:none;position:fixed;z-index:80;left:10px;right:10px;
  bottom:calc(10px + env(safe-area-inset-bottom,0px));height:56px;border-radius:16px;
  align-items:center;gap:10px;padding:0 10px 0 8px;cursor:pointer;
  background:var(--panel);backdrop-filter:blur(16px) saturate(160%);-webkit-backdrop-filter:blur(16px) saturate(160%);
  border:var(--hair) solid var(--line-strong);box-shadow:0 14px 34px rgba(0,0,0,.34)}
/* 侧栏抽屉打开时，迷你播放条让位（被遮罩盖住），侧栏始终在最上层 */
body.sb-open .mini{z-index:0}
.mini-art{width:40px;height:40px;border-radius:9px;overflow:hidden;flex:none;background:var(--surface-2)}
.mini-art img{width:100%;height:100%;object-fit:cover}
.mini-tx{flex:1;min-width:0}
.mini-tx b{display:block;font-size:12.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mini-tx span{display:block;font-size:10.5px;color:var(--text-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
.mini .icon-btn{width:34px;height:34px}
.mini .icon-btn svg{width:18px;height:18px}

/* ---------- Toast ---------- */
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%) translateY(16px);
  z-index:400;display:flex;align-items:center;gap:8px;max-width:82vw;
  padding:11px 18px;border-radius:999px;font-size:13px;font-weight:500;
  background:rgba(28,28,32,.92);color:#fff;border:var(--hair) solid rgba(255,255,255,.14);
  box-shadow:0 18px 44px rgba(0,0,0,.4);backdrop-filter:blur(20px);
  opacity:0;pointer-events:none;transition:.34s var(--ease)}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.toast svg{width:15px;height:15px;color:#30d158;flex:none}
html[data-theme="light"] .toast{background:rgba(255,255,255,.94);color:#1d1d1f;border-color:rgba(0,0,0,.08)}

/* ---------- 抽屉遮罩 ---------- */
.veil{position:fixed;inset:0;z-index:55;background:var(--scrim);opacity:0;visibility:hidden;transition:.3s;
  backdrop-filter:blur(2px)}
body.np-open .veil{opacity:0;visibility:hidden}

/* ---------- 响应式 ---------- */
@media (min-width:980px){
  #btnMenu{display:none}
}
@media (max-width:1279px){
  .app{grid-template-columns:var(--sidebar-w) minmax(0,1fr)}
  /* 窄屏不再使用右侧面板：歌词/队列在全屏播放页的选项卡里 */
  .nowpanel{display:none}
  /* 平板（980-1279）没有右侧面板，显示底部播放条；往右挪避开常驻侧栏 */
  .mini{display:flex;left:calc(var(--sidebar-w) + 14px)}
  .scroller{padding-bottom:96px}
}
@media (max-width:979px){
  .app{grid-template-columns:minmax(0,1fr)}
  .sidebar{position:fixed;top:0;bottom:0;left:0;width:286px;z-index:90;
    transform:translateX(-102%);transition:transform .48s var(--ease);box-shadow:24px 0 70px rgba(0,0,0,.34)}
  body.sb-open .sidebar{transform:none}
  .sb-veil{position:fixed;inset:0;z-index:85;background:var(--scrim);opacity:0;visibility:hidden;transition:.3s}
  body.sb-open .sb-veil{opacity:1;visibility:visible}
  .search-mini{display:grid}
  .scroller{padding:0 18px 108px}
  .topbar{padding:0 14px;height:54px}
  .greet h1{font-size:28px}
  .hero{padding:24px 22px;min-height:0;flex-direction:column-reverse;align-items:flex-start;gap:18px}
  .hero-tx{max-width:100%}
  .hero-art{width:150px;height:150px;transform:none}
  .hero:hover .hero-art{transform:none}
  .mini{display:flex;left:10px}
  .np-full{padding:0}
  /* 手机全屏：歌词在上、控制区钉在底部，方便操作 */
  .npx{display:flex;flex-direction:column;align-items:stretch;
    padding:calc(10px + env(safe-area-inset-top,0px)) 22px calc(40px + env(safe-area-inset-bottom,0px))}
  .npx-col{display:contents}
  .npx-hd{order:0;flex:none;margin-bottom:2px}
  .npx-lyr-col{order:1;display:flex;flex-direction:column;flex:1 1 0;min-height:0;height:auto;
    max-width:none;align-self:stretch;margin:4px 0 6px}
  .npx-lyrics{flex:1 1 0;min-height:0;display:block}
  .npx-lyrics .lyrics{padding:2% 0 16%}
  .npx-art{display:none}
  .npx-meta{order:2;flex:none}
  .npx-progress{order:3;flex:none;margin-top:10px}
  .npx-controls{order:4;flex:none;margin-top:10px;gap:11px}
  .npx-controls .play-lg{width:60px;height:60px}
  .npx-extra{display:none}
  .npx-close-m{display:grid}
  .tr{grid-template-columns:22px 40px minmax(0,1fr) 44px 56px;gap:10px;height:56px;padding:0 10px}
  .tr-album{display:none}
  .tr-art{width:40px;height:40px}
  .card-grid{grid-template-columns:repeat(auto-fill,minmax(132px,1fr));gap:20px 14px}
  .sec-hd h2{font-size:19px}
  .pl-hero{gap:18px}
  .pl-art{width:132px;height:132px}
  .pl-tx h1{font-size:26px}
  .sec{margin-top:30px}
}
@media (min-width:980px){
  .sb-veil{display:none}
}
@media (max-height:720px){
  .np-art{max-width:230px;align-self:center}
  .np-tabs{display:none}
  .lyrics{padding:10% 4px 30%}
}
@media (prefers-reduced-motion:reduce){
  *{animation-duration:.01ms !important;transition-duration:.01ms !important}
}

  get(k,d){ try{ const v=localStorage.getItem('jym-'+k); return v==null?d:JSON.parse(v); }catch(e){ return d; } },
  set(k,v){ try{ localStorage.setItem('jym-'+k,JSON.stringify(v)); }catch(e){} }

/* 「跟随系统」按钮图标按当前设备显示：电脑→显示器、平板→平板、手机→手机 */
function deviceKind(){
  const ua=navigator.userAgent||'';
  if(/iPad|Tablet|PlayBook|Silk/i.test(ua)) return 'tablet';
  if(/Android/i.test(ua)&&!/Mobile/i.test(ua)) return 'tablet';          /* 安卓平板 */
  if(/Mobi|iPhone|iPod|Windows Phone|IEMobile/i.test(ua)) return 'phone';
  /* UA 看不出来时按输入方式判断：主指针是手指且不能悬停 → 触屏设备，
     再按短边尺寸区分平板/手机；这样 iPadOS 仿桌面 UA 和浏览器设备模拟都能认对 */
  try{
    const coarse=matchMedia('(pointer: coarse)').matches;
    const noHover=matchMedia('(hover: none)').matches;
    if(coarse||noHover){
      return Math.min(screen.width,screen.height)>=600?'tablet':'phone';
    }
  }catch(e){}
  if(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1) return 'tablet'; /* iPadOS 仿桌面 UA */
  return 'desktop';
}

/* ---------- 酷狗歌单（之前的歌单快照 + 云端同步） ----------
   数据来自 kugou-playlist.js（酷狗「我喜欢的音乐」快照）；
   部署到站点上时会再尝试 /api/kg 拉最新，失败就用快照兜底。
   只有「歌名 + 歌手」，播放时走 stub 解析链路自动匹配网易云。 */
function kgBuild(d,prevList){
  if(!d||!Array.isArray(d.songs)||!d.songs.length) return null;
  const prev=new Map((prevList||[]).map(t=>[t.id,t]));
  return d.songs.map(line=>{
    const i=line.indexOf('|');
    const name=(i<0?line:line.slice(0,i)).trim();
    const artist=(i<0?'':line.slice(i+1)).trim();
    if(!name) return null;
    const t=mkStub(name,artist||'未知艺人',null);
    t.id='kg:'+name+'|'+artist;
    const o=prev.get(t.id);
    if(o){
      t.album=o.album||''; t.cover=o.cover||''; t.picId=o.picId||'';
      if(o.ncId){ t.kind='online'; t.ncId=o.ncId; t.srcAt=o.srcAt||0; }
    }
    return t;
  }).filter(Boolean);
}

    return {name:kgCache.name,songs:kgCache.songs};

  return window.KUGOU_PLAYLIST||null;
}

  const d=new Date(kgMeta.syncedAt), p2=n=>String(n).padStart(2,'0');

/* 比对云端与本地，得到新增/减少的数量（只用于提示） */
function kgDiff(d){
  const p=PLAYLISTS.find(x=>x.id==='kg');
  if(!p||!d) return null;
  const fresh=kgBuild(d,p.tracks);
  if(!fresh||!fresh.length) return null;
  const before=new Set(p.tracks.map(t=>t.id));
  const after=new Set(fresh.map(t=>t.id));
  return {
    fresh,
    added:fresh.reduce((n,t)=>n+(before.has(t.id)?0:1),0),
    removed:p.tracks.reduce((n,t)=>n+(after.has(t.id)?0:1),0)
  };
}
const kgRow=t=>t.artist&&t.artist!=='未知艺人'?t.name+'|'+t.artist:t.name;
/* 一律以云端为准：直接覆盖本地歌单，只保留已经解析好的封面与音源 */
function applyKg(d){
  const p=PLAYLISTS.find(x=>x.id==='kg');
  const diff=kgDiff(d);
  if(!p||!diff) return null;
  p.tracks=diff.fresh;
  if(d.name) p.title=d.name;
  kgMeta.cloud=true; kgMeta.at=d.at||Date.now(); kgMeta.syncedAt=Date.now();
  store.set('kg',{at:kgMeta.at,syncedAt:kgMeta.syncedAt,name:p.title,songs:diff.fresh.map(kgRow)});
  renderSidebarPlaylists();
  if(currentView==='playlist'&&plCurId==='kg'){
    const changed=diff.added||diff.removed;
    const ae=document.activeElement;
    if(!changed){
      /* 内容没变：只刷新「已同步 时间」，不重绘列表 */
      const t=$('.pl-src span'); if(t) t.textContent=kgSyncLabel();
    }else if(ae&&ae.id==='plFilter'){
      /* 正在歌单里搜歌：只换列表，不重建输入框，免得打断输入法 */
      updatePlTracks();
    }else{
      const y=scroller?scroller.scrollTop:0;
      renderPlaylist('kg',true);
      if(scroller) scroller.scrollTop=y;
    }
  }
  return {total:diff.fresh.length,added:diff.added,removed:diff.removed};
}
/* silent=true 用于后台自动同步：不占按钮、失败不打扰 */
let kgSyncing=false, kgLastPull=0;
async function pullKg(silent,force){
  if(kgSyncing) return null;
  if(!KG) return null;
  if(location.protocol!=='http:'&&location.protocol!=='https:'){
    if(!silent) toast('本地打开没法联网同步，部署到线上才能自动更新');
    return null;
  }
  const now=Date.now();
  if(silent&&now-kgLastPull<120e3) return null;   /* 自动同步两分钟内不重复拉 */
  kgSyncing=true; kgLastPull=now;
  const btn=silent?null:$('#plSync'), tx=silent?null:$('#plSyncTx');
  if(btn){ btn.classList.add('busy'); btn.disabled=true; }
  if(tx) tx.textContent='同步中…';
  try{
    const url=force?('/api/kg?refresh=1&_='+now):('/api/kg?_='+now);
    const r=await fetch(url,{cache:'no-store'});
    const d=await r.json().catch(()=>null);
    if(!r.ok||!d||d.ok===false) throw new Error((d&&d.error)||('HTTP '+r.status));
    const info=applyKg(d);
    if(!info) throw new Error('歌单数据不对');
    if(!silent){
      const bits=['已与云端同步 · 共 '+info.total+' 首'];
      if(info.added) bits.push('新增 '+info.added);
      if(info.removed) bits.push('移除 '+info.removed);
      toast(bits.join(' · '));
    }else if(info.added||info.removed){
      toast('歌单已自动更新 · 新增 '+info.added+' · 移除 '+info.removed);
    }
    return info;
  }catch(e){
    if(!silent) toast('同步失败：'+esc((e&&e.message)||'网络异常'));
    return null;
  }finally{
    kgSyncing=false;
    const b=$('#plSync'); if(b){ b.classList.remove('busy'); b.disabled=false; }
    const t2=$('#plSyncTx'); if(t2) t2.textContent='同步更新';
  }
}
/* 手动点按钮：强制绕过云端缓存，拿酷狗实时歌单 */
function syncKg(){ return pullKg(false,true); }
/* 自动同步：打开页面拉一次，之后每 10 分钟和切回页面时各对一次；
   距上次同步超过 10 分钟就强制绕过云端缓存，保证刚在酷狗加的歌能马上出现 */
function kgStale(){ return !kgMeta.syncedAt||Date.now()-kgMeta.syncedAt>600e3; }
function startKgAutoSync(){
  const tick=()=>{ if(!document.hidden) pullKg(true,kgStale()); };
  tick();
  document.addEventListener('visibilitychange',tick);
  setInterval(tick,600e3);
}

         `radial-gradient(110% 100% at 92% 14%, ${b} 0%, rgba(0,0,0,0) 66%),`+

/* 由歌名/歌手推一个稳定的配色（用于环境光与封面占位） */
function hashOf(s){ let h=0; for(let i=0;i<s.length;i++) h=(h*31+s.charCodeAt(i))%360; return h; }
function paletteFor(t){
  if(t&&t.tone) return t.tone;
  const h=hashOf((t?t.name:'')+'|'+(t?t.artist:''));
  return [`hsl(${h} 44% 19%)`,`hsl(${(h+40)%360} 48% 30%)`,`hsl(${(h+78)%360} 62% 54%)`];
}
function monoBg(t){
  const p=paletteFor(t);
  return `background:linear-gradient(150deg,${p[0]},${p[1]} 55%,${p[2]})`;
}
function monogram(t){
  const ch=String(t&&t.name?t.name:'♪').trim().charAt(0)||'♪';
  return `<div class="mono" style="${monoBg(t)}"><span>${esc(ch)}</span></div>`;
}
const thumbInner=t=> t.cover?`<img src="${esc(t.cover)}" alt="" loading="lazy">`:monogram(t);

/* =========================================================
   在线接口（GD 音乐台 / 网易云）
   接口有频率限制：串行 + 最小间隔 + 会话内缓存
   ========================================================= */
const API_BASE='https://music-api.gdstudio.xyz/api.php';
const API_SRC='netease';
const apiCache=new Map();
let apiChain=Promise.resolve(), apiLast=0;
function apiCall(params){
  const key=JSON.stringify(params);
  if(apiCache.has(key)) return apiCache.get(key);
  const run=async()=>{
    const gap=200-(Date.now()-apiLast);
    if(gap>0) await new Promise(r=>setTimeout(r,gap));
    apiLast=Date.now();
    const res=await fetch(API_BASE+'?'+new URLSearchParams(params).toString(),{cache:'no-store'});
    if(!res.ok) throw new Error('HTTP '+res.status);
    const j=await res.json();
    if(j&&j.detail) throw new Error(String(j.detail));
    return j;
  };
  const p=apiChain.then(run,run);
  apiChain=p.catch(()=>{});
  const out=p.then(j=>{ apiCache.set(key,j); return j; });
  return out;
}
async function searchApi(kw,count){
  const j=await apiCall({types:'search',source:API_SRC,name:kw,count:count||20,pages:1});
  return Array.isArray(j)?j:[];
}
async function getAudioUrl(id){
  const j=await apiCall({types:'url',source:API_SRC,id:String(id),br:320});
  return (j&&j.url)||'';
}
async function getPicUrl(picId){
  if(!picId) return '';
  const j=await apiCall({types:'pic',source:API_SRC,id:String(picId),size:500});
  return (j&&j.url)||'';
}
async function getLyric(id){
  const j=await apiCall({types:'lyric',source:API_SRC,id:String(id)});
  return {lrc:(j&&j.lyric)||'',tr:(j&&j.tlyric)||''};
}
function fromHit(h){
  return {
    kind:'online', id:'nc:'+h.id, ncId:String(h.id),
    name:h.name||'未知曲目',
    artist:Array.isArray(h.artist)?h.artist.join(' / '):(h.artist||'未知艺人'),
    album:h.album||'', picId:h.pic_id?String(h.pic_id):'',
    cover:'', src:'', srcAt:0, dur:0, tone:null
  };
}
/* 归一化：去掉空格与标点，但保留括号里的版本信息（"晴天(深情版)" ≠ "晴天"） */
const normStr=s=>String(s||'').toLowerCase()
  .replace(/[（(\[【]/g,'')
  .replace(/[）)\]】]/g,'')
  .replace(/[\s\-_—·・,，.。!！?？'"“”‘’|/\\]/g,'');
const VERSION_RE=/(live|伴奏|remix|dj|翻唱|cover|翻自|改编|钢琴|纯音乐|instrumental|深情版|降调|升调|加速|慢速|片段|铃声|片段)/i;
/* 常见歌手的别名（网易云上有些歌手写作英文名/繁体） */
const ARTIST_ALIAS={
  '周杰伦':['jay','周杰倫'],'陈奕迅':['eason','陳奕迅'],'王菲':['faye','faye wong'],
  '莫文蔚':['karen mok'],'孙燕姿':['stefanie','孫燕姿'],'Beyond':['beyond'],
  '杨千嬅':['楊千嬅','miriam'],'卢冠廷':['lowell lo','盧冠廷'],'陈慧娴':['陳慧嫻','priscilla'],
  '李克勤':['hacken lee'],'谢安琪':['謝安琪','kay tse'],'许巍':['許巍'],'朴树':['pu shu','樸樹'],
  '刺猬':['刺蝟','hedgehog'],'新裤子':['new pants'],'赵雷':['zhao lei'],'宋冬野':['song dongye'],
  '陈粒':['chen li'],'陈鸿宇':['chen hongyu'],'鹿先森乐队':['鹿先森'],'马頔':['ma di'],
  '买辣椒也用券':['买辣椒','feng qin'],'八三夭':['831'],'米津玄師':['米津玄师','kenshi','yonezu'],
  'YOASOBI':['yoasobi'],'RADWIMPS':['radwimps'],'ヨルシカ':['yorushika'],'King Gnu':['king gnu'],
  'DAOKO':['daoko'],'坂本龍一':['坂本龙一','ryuichi','sakamoto'],'久石让':['久石譲','hisaishi','joe hisaishi'],
  'Pianoboy':['pianoboy','高至豪'],'Yiruma':['이루마'],'Yann Tiersen':['tiersen'],
  'Ludovico Einaudi':['einaudi'],'The Weeknd':['weeknd'],'Ed Sheeran':['sheeran'],
  'Dua Lipa':['dua lipa'],'Harry Styles':['harry styles'],'Miley Cyrus':['miley'],
  'Justin Bieber':['bieber'],'The Kid LAROI':['laroi'],'Post Malone':['post malone'],
  'Avicii':['avicii','tim berg'],'Alan Walker':['alan walker'],'Daft Punk':['daft punk'],
  'David Guetta':['guetta'],'M83':['m83'],'The Chainsmokers':['chainsmokers']
};
const ALIAS_LIST=Object.entries(ARTIST_ALIAS).map(([k,v])=>[normStr(k),v]);
function artistMatch(ha,ta){
  if(!ta) return true;
  if(ha.includes(ta)) return true;
  for(const [k,vals] of ALIAS_LIST){
    if(ta===k||ta.includes(k)||k.includes(ta)){
      if(ha.includes(k)||vals.some(v=>ha.includes(v))) return true;
    }
  }
  const parts=ta.split(/[\/、,&]/).map(x=>x.trim()).filter(Boolean);
  return parts.some(x=>x&&ha.includes(x));
}
function scoreHit(hit,name,artist){
  const hn=normStr(hit.name), tn=normStr(name);
  let s;
  if(hn===tn) s=100;
  else if(hn.startsWith(tn)) s=62;
  else if(tn.startsWith(hn)) s=58;
  else if(hn.includes(tn)) s=38;
  else return -1;
  if(s<100 && VERSION_RE.test(hit.name||'') && !VERSION_RE.test(name)) s-=30;
  const ha=String(Array.isArray(hit.artist)?hit.artist.join(' '):(hit.artist||'')).toLowerCase();
  const ta=String(artist||'').toLowerCase();
  if(ta){ s += artistMatch(ha,ta)?60:-6; }
  return s;
}
function pickBest(hits,name,artist){
  let best=null,bs=34;
  hits.forEach(h=>{ const s=scoreHit(h,name,artist); if(s>bs){ bs=s; best=h; } });
  return best;
}
/* 把「歌名 + 歌手」的占位曲目解析成真正的在线曲目（保留原 id，列表高亮不会乱） */
function resolveStub(t){
  if(t.kind!=='stub') return Promise.resolve(true);
  if(t._rp) return t._rp;
  t._rp=(async()=>{
    try{
      /* 先用「歌名 + 歌手」搜（相关性更好），不行再只用歌名 */
      let hits=[];
      try{ hits=await searchApi((t.name+' '+t.artist).trim(),20); }catch(e){ hits=[]; }
      let best=pickBest(hits,t.name,t.artist);
      if(!best){
        try{ hits=await searchApi(t.name,20); }catch(e){ hits=[]; }
        best=pickBest(hits,t.name,t.artist);
      }
      if(!best) return false;
      const o=fromHit(best);
      o.id=t.id; o.tone=t.tone;
      Object.assign(t,o);
      return true;
    }catch(e){
      return false;
    }finally{
      t._rp=null;
    }
  })();
  return t._rp;
}
async function ensurePlayable(t){
  if(!t) return false;
  if(t.kind==='local') return !!t.src;
  if(t.kind==='stub'){
    const ok=await resolveStub(t);
    if(!ok) return false;
  }
  if(t.kind!=='online') return false;
  const fresh=t.src&&t.srcAt&&(Date.now()-t.srcAt<4*60*1000);
  if(!fresh){
    try{
      const u=await getAudioUrl(t.ncId);
      if(!u) return false;
      t.src=u; t.srcAt=Date.now();
    }catch(e){ return false; }
  }
  return true;
}
let coverQueue=Promise.resolve();
function ensureCover(t){
  if(!t||t.cover||!t.picId) return;
  if(t._covBusy) return;
  t._covBusy=true;
  coverQueue=coverQueue.then(async()=>{
    try{
      const u=await getPicUrl(t.picId);
      if(!u) return;
      t.cover=u;
      if(currentTrack()===t){ renderArt(); updateMediaSession(t); }
      $$('[data-cov="'+t.id+'"]').forEach(el=>{ el.innerHTML='<img src="'+esc(u)+'" alt="" loading="lazy">'; });
    }catch(e){}finally{ t._covBusy=false; }
  });
}

/* 播放模式：order 顺序播放 / shuffle 随机播放 / repeat 单曲循环 */
const MODE_KEYS=['order','shuffle','repeat'];
const MODE_LABEL={order:'顺序播放',shuffle:'随机播放',repeat:'单曲循环'};
let mode=(()=>{
  const m=store.get('mode','');
  if(MODE_KEYS.indexOf(m)>=0) return m;
  if(store.get('repeat',false)) return 'repeat';
  if(store.get('shuffle',false)) return 'shuffle';
  return 'order';
})();
const modeIcon=()=>I[mode==='repeat'?'repeatOne':mode]||I.order;

/* 播放速度 + 定时关闭 */
const SPEEDS=[0.5,0.75,1,1.25,1.5,1.75,2];
let speed=Math.min(2,Math.max(0.5,Number(store.get('speed',1))||1));
let sleepAt=0, sleepTimer=null;
const fmtSpeed=s=>String(Math.round(s*100)/100)+'×';
function applySpeed(s){
  speed=Math.min(2,Math.max(0.5,Number(s)||1));
  audio.playbackRate=speed;
  try{ audio.preservesPitch=true; audio.webkitPreservesPitch=true; }catch(e){}
  store.set('speed',speed);
  $$('[data-b="spdBtn"]').forEach(b=>{
    b.textContent=fmtSpeed(speed);
    b.classList.toggle('on',speed!==1);
    b.title='播放速度 '+fmtSpeed(speed)+(sleepAt?' · 定时关闭中':'');
  });
}
function setSleep(min){
  clearTimeout(sleepTimer); sleepTimer=null;
  if(!min){
    sleepAt=0; applySpeed(speed);
    toast('定时关闭已取消'); return;
  }
  sleepAt=Date.now()+min*60000;
  sleepTimer=setTimeout(()=>{
    audio.pause(); sleepAt=0; applySpeed(speed);
    toast('定时关闭：已暂停播放');
  },min*60000);
  applySpeed(speed);
  toast('将在 '+min+' 分钟后暂停播放');
}
function openSpeedMenu(anchor){
  const r=anchor.getBoundingClientRect();
  const items=SPEEDS.map(s=>({
    label:(Math.abs(s-speed)<0.001?'✓ ':'')+fmtSpeed(s)+(s===1?'（原速）':''),
    fn:()=>applySpeed(s)
  }));
  items.push({label:'定时关闭 15 分钟',icon:I.clock,fn:()=>setSleep(15)});
  items.push({label:'定时关闭 30 分钟',icon:I.clock,fn:()=>setSleep(30)});
  items.push({label:'定时关闭 60 分钟',icon:I.clock,fn:()=>setSleep(60)});
  if(sleepAt) items.push({label:'取消定时关闭',danger:true,fn:()=>setSleep(0)});
  openCtx(r.left,r.top,items);
}
let lyrics=[], lyricIdx=-1, lyricNote='', lyricToken=0;
let failStreak=0, loadToken=0, restoreTime=null;
const currentTrack=()=> (cur>=0&&cur<queue.length)?queue[cur]:null;

let toneKeyCache='';
function setTone(t){
  /* 同一首歌不重复写 CSS 变量，避免触发整屏背景重绘 */
  const key=t?(t.id||t.name||'')+(t.tone?JSON.stringify(t.tone):''):'';
  if(key===toneKeyCache) return;
  toneKeyCache=key;
  const p=paletteFor(t);
  const s=document.documentElement.style;
  s.setProperty('--t1',p[0]); s.setProperty('--t2',p[1]); s.setProperty('--t3',p[2]);
}

let artKeyCache='';
function renderArt(){
  const t=currentTrack();
  const key=t?[t.id,t.cover,t.name].join('|'):'';
  /* 视图重绘后元素是空的，即使 key 没变也要重新填充 */
  const empty=$$('[data-b="art"]').some(el=>!el.firstChild);
  if(key===artKeyCache&&!empty) return;
  artKeyCache=key;
  $$('[data-b="art"]').forEach(el=>{
    if(t&&t.cover) el.innerHTML=`<img src="${esc(t.cover)}" alt="">`;
    else if(t) el.innerHTML=monogram(t);
    else el.innerHTML=`<div class="ph">${I.note}</div>`;
  });
  const bgEl=$('[data-b="bg"]');
  if(bgEl){
    if(t&&t.cover) bgEl.innerHTML=`<img src="${esc(t.cover)}" alt="">`;
    else bgEl.innerHTML='';
  }
}

function syncUI(){
  const t=currentTrack();
  const playing=!!audio.src && !audio.paused;
  const title=t?t.name:'还没有播放';
  const sub=t?(t.artist||'未知艺人')+(t.album?' · '+t.album:''):'从推荐歌单里挑一首吧';
  $$('[data-b="title"]').forEach(e=>e.textContent=title);
  $$('[data-b="sub"]').forEach(e=>e.textContent=sub);
  $$('[data-b="playIcon"]').forEach(e=>e.innerHTML=playing?I.pause:I.play);
  $$('[data-b="likeBtn"]').forEach(b=>{
    const on=isLiked(t);
    b.classList.toggle('on',on);
    b.innerHTML=on?I.heartFill:I.heart;
    b.style.color=on?'var(--accent)':'';
  });
  $$('[data-b="modeBtn"]').forEach(b=>{
    b.innerHTML=modeIcon();
    b.classList.toggle('on',mode!=='order');
    b.title='播放模式：'+MODE_LABEL[mode]+'（点击切换）';
    b.setAttribute('aria-label','播放模式：'+MODE_LABEL[mode]);
  });
  $$('[data-b="dlBtn"]').forEach(b=>{
    const can=!!t;
    b.classList.toggle('off',!can);
    b.title=can?'下载《'+t.name+'》':'先放一首歌再下载';
  });
  setTone(t);
  renderArt();
  markRows();
  renderQueue();
  updateProgress();
  document.body.classList.toggle('is-playing',playing);
  saveStateSoon();
}

function markRows(){
  const t=currentTrack();
  $$('.tr').forEach(el=>el.classList.toggle('on', !!t && el.dataset.key===t.id));
}

/* 停止播放并清空当前曲目 / 歌词，回到「还没有播放」状态 */
function clearNowPlaying(){
  queue=[]; cur=-1; queueRev++;
  audio.pause(); audio.removeAttribute('src'); audio.load();
  lyrics=[]; lyricIdx=-1; lyricNote='还没有播放'; renderLyrics();
  syncUI();
}

/* 队列较长时只渲染「当前曲目附近」的一段，避免几千首全量建 DOM 导致卡顿 */
function renderQueue(force){
  const boxes=$$('[data-b="queue"]');
  if(!boxes.length) return;
  const sig=queueRev+'|'+cur+'|'+queue.length+'|'+qUp+'|'+qDown;
  if(!force && sig===queueSig) return;
  queueSig=sig;
  if(!queue.length){
    boxes.forEach(b=>{ b.innerHTML='<div class="q-empty">队列还是空的。从推荐歌单里点一首，或者在歌名右侧的 ⋯ 里选「加入播放列表」。</div>'; });
    return;
  }
  let from=Math.max(0,cur-qUp), to=Math.min(queue.length,cur+qDown+1);
  if(to-from<Math.min(queue.length,200)){ // 保证至少显示一段
    to=Math.min(queue.length,from+200); from=Math.max(0,to-200);
  }
  let html='<div class="q-hd"><span>播放队列 · '+queue.length+' 首</span><button class="q-clear" data-act="q-clear">清空队列</button></div>';
  if(from>0) html+='<button class="q-more" data-act="q-more-up">↑ 上面还有 '+(from)+' 首</button>';
  html+=queue.slice(from,to).map((t,k)=>{
    const i=from+k;
    return `<div class="q-i${i===cur?' on':''}" data-act="jump" data-i="${i}">
      <span class="q-art" data-cov="${esc(t.id)}">${thumbInner(t)}</span>
      <span class="q-tx"><b>${esc(t.name)}</b><span>${esc(t.artist||'未知艺人')}</span>${t.__next&&i!==cur?'<i class="q-nx">下一首</i>':''}</span>
      <button class="q-del" data-act="q-del" data-i="${i}" aria-label="从队列移除" title="从队列移除">${I.x}</button>
    </div>`;
  }).join('');
  if(to<queue.length) html+='<button class="q-more" data-act="q-more-down">↓ 下面还有 '+(queue.length-to)+' 首</button>';
  boxes.forEach(b=>{ b.innerHTML=html; });
}

function updateProgress(){
  const d=audio.duration||0, c=audio.currentTime||0;
  const p=d?Math.min(100,c/d*100):0;
  $$('[data-b="fill"]').forEach(e=>e.style.width=p+'%');
  $$('[data-b="knob"]').forEach(e=>e.style.left=p+'%');
  $$('[data-b="tcur"]').forEach(e=>e.textContent=fmt(c));
  $$('[data-b="tdur"]').forEach(e=>e.textContent=d?fmt(d):'0:00');
}

let progRaf=0;
audio.addEventListener('timeupdate',()=>{
  if(progRaf) return;
  progRaf=requestAnimationFrame(()=>{ progRaf=0; updateProgress(); updateLyric(); });
});
audio.addEventListener('play',syncUI);
audio.addEventListener('pause',()=>{ syncUI(); saveStateSoon(); });
audio.addEventListener('loadedmetadata',()=>{
  if(restoreTime!=null&&isFinite(audio.duration)){
    try{ audio.currentTime=Math.min(restoreTime,Math.max(0,audio.duration-1)); }catch(e){}
    restoreTime=null;
  }
  updateProgress();
});
audio.addEventListener('ended',()=>{
  /* 单曲循环时，若有「设为下一首」的曲目，也先把它放完 */
  if(mode==='repeat'&&nextUpIndex()<0){ try{ audio.currentTime=0; audio.play(); }catch(e){} return; }
  next(true);
});
audio.addEventListener('error',()=>{
  if(!audio.src) return;
  failStreak++;
  if(failStreak>3){ toast('连续几首都播不了，稍后再试'); failStreak=0; return; }
  toast('这首音频加载失败，跳到下一首');
  next(true);
});

/* 播放一首（内部会先解析地址） */
async function loadAndPlay(i,autoplay=true){
  if(i<0||i>=queue.length) return;
  const token=++loadToken;
  cur=i; queueRev++;
  const t=queue[i];
  if(t.__next) t.__next=false;   // 「下一首」标记用完即清
  lyrics=[]; lyricIdx=-1; lyricNote=''; renderLyrics();
  syncUI();
  const ok=await ensurePlayable(t);
  if(token!==loadToken) return;
  if(!ok){
    failStreak++;
    toast('《'+esc(t.name)+'》暂时找不到音源，自动跳过');
    if(failStreak>=3){ failStreak=0; toast('连着几首都找不到，换个歌单试试'); return; }
    return next(true);
  }
  failStreak=0;
  audio.src=t.src;
  audio.dataset.tid=t.id;
  if(autoplay){
    audio.play().catch(()=>toast('浏览器拦下了自动播放，点一下播放键'));
  }
  syncUI();
  loadLyrics(t);
  ensureCover(t);
  pushRecent(t);
  saveStateSoon();
  updateMediaSession(t);
}

function togglePlay(){
  if(!queue.length){ queue=PLAYLISTS[0].tracks.slice(); loadAndPlay(0,true); return; }
  if(cur<0) cur=0;
  const t=queue[cur];
  if(!audio.src||audio.dataset.tid!==t.id){ loadAndPlay(cur,true); return; }
  if(audio.paused) audio.play().catch(()=>toast('播放失败，再点一次'));
  else audio.pause();
}
/* 「设为下一首播放」的曲目：无论顺序 / 随机 / 单曲循环，都排在真正的下一首 */
function nextUpIndex(){
  for(let i=cur+1;i<queue.length;i++) if(queue[i]&&queue[i].__next) return i;
  for(let i=0;i<cur;i++) if(queue[i]&&queue[i].__next) return i;   // 兜底：被循环绕到前面的
  return -1;
}
function next(auto){
  if(!queue.length) return;
  const nx=nextUpIndex();
  if(nx>=0) return loadAndPlay(nx,true);
  if(mode==='shuffle'&&queue.length>1){
    let n=cur;
    while(n===cur) n=Math.floor(Math.random()*queue.length);
    return loadAndPlay(n,true);
  }
  const n=(cur+1)%queue.length;
  if(auto&&n===0&&queue.length===1) return;
  loadAndPlay(n,true);
}
function prev(){
  if(!queue.length) return;
  if(audio.currentTime>3){ audio.currentTime=0; return; }
  loadAndPlay((cur-1+queue.length)%queue.length,true);
}
function jumpTo(i){ if(i>=0&&i<queue.length) loadAndPlay(i,true); }

/* ---------- 下载当前歌曲 ---------- */
async function downloadCurrent(){
  const t=currentTrack();
  if(!t){ toast('先挑一首歌再下载'); return; }
  const name=((t.artist?t.artist+' - ':'')+t.name).replace(/[\\/:*?"<>|]/g,'_').trim()||'music';
  const filename=name+'.mp3';
  const save=href=>{
    const a=document.createElement('a');
    a.href=href; a.download=filename; a.rel='noopener';
    document.body.appendChild(a); a.click(); a.remove();
  };
  /* 本地文件：blob 地址直接存 */
  if(t.kind==='local'&&t.src){ save(t.src); toast('已开始下载：'+esc(t.name)); return; }
  toast('正在准备《'+esc(t.name)+'》…');
  let href='';
  try{
    const ok=await ensurePlayable(t);
    if(!ok||!t.src) throw new Error('no-src');
    href=t.src;
    /* 先试着抓成 blob，这样浏览器才会按歌名存盘（否则只会打开音频） */
    try{
      const res=await fetch(t.src,{mode:'cors',referrerPolicy:'no-referrer'});
      if(!res.ok) throw new Error('HTTP '+res.status);
      const blobUrl=URL.createObjectURL(await res.blob());
      save(blobUrl);
      setTimeout(()=>URL.revokeObjectURL(blobUrl),120000);
      toast('已开始下载：'+esc(t.name));
      return;
    }catch(e){}
    window.open(href,'_blank','noopener');
    toast('已打开音源，右键「另存为」即可保存');
  }catch(e){
    toast('这首歌暂时下不下来，换一首试试');
  }
}

/* ---------- 最近播放 / 喜欢 ---------- */
const trackKey=t=>t?normStr(t.name)+'|'+normStr(t.artist):'';
function snap(t){
  return {kind:t.kind==='local'?'local':'online', id:t.id, name:t.name, artist:t.artist,
    album:t.album||'', ncId:t.ncId||'', picId:t.picId||'', cover:t.cover||'',
    src:t.kind==='local'?t.src:'', tone:t.tone||null};
}
function snapToTrack(s){
  if(!s) return null;
  if(s.kind==='local'){
    return {kind:'local',id:s.id||('lf:'+s.name),name:s.name,artist:s.artist||'本地文件',album:s.album||'本地文件',
      src:s.src||'',cover:s.cover||'',dur:0,tone:s.tone||null};
  }
  if(!s.ncId){
    return {kind:'stub',id:s.id||('st'+(++UID)),name:s.name,artist:s.artist,album:s.album||'',
      cover:s.cover||'',src:'',srcAt:0,dur:0,tone:s.tone||null};
  }
  return {kind:'online',id:s.id||('nc:'+s.ncId),ncId:String(s.ncId),name:s.name,artist:s.artist||'未知艺人',
    album:s.album||'',picId:s.picId||'',cover:s.cover||'',src:'',srcAt:0,dur:0,tone:s.tone||null};
}
function pushRecent(t){
  if(!t) return;
  /* 本地文件的地址是临时的 blob URL，刷新后就失效了，不写进最近播放 */
  if(t.kind==='local') return;
  const list=store.get('recent',[]).filter(x=>trackKey({name:x.name,artist:x.artist})!==trackKey(t));
  list.unshift(snap(t));
  store.set('recent',list.slice(0,24));
}
function isLiked(t){
  if(!t) return false;
  return store.get('liked',[]).some(x=>trackKey({name:x.name,artist:x.artist})===trackKey(t));
}
function toggleLike(t){
  if(!t){ toast('先放一首歌再收藏'); return; }
  const k=trackKey(t);
  const list=store.get('liked',[]);
  const idx=list.findIndex(x=>trackKey({name:x.name,artist:x.artist})===k);
  if(idx>=0){ list.splice(idx,1); toast('已从「我喜欢的音乐」移除'); }
  else { list.unshift(snap(t)); toast('已加入「我喜欢的音乐」'); }
  store.set('liked',list);
  updateCounts();
  if(currentView==='liked'&&idx>=0) renderLiked();
  syncUI();
}

let saveTimer=null;
function saveStateSoon(){
  clearTimeout(saveTimer);
  saveTimer=setTimeout(saveState,700);
}
function saveState(){
  const t=currentTrack();
  const Q=queueSnapshot();
  store.set('state',{track:t?snap(t):null, time:t?(audio.currentTime||0):0,
    cur:Q.idx, queue:Q.list});
}
/* 队列可能很长（大歌单几千首），只保存当前曲目附近的一段，避免撑爆 localStorage */
function queueSnapshot(){
  const MAX=400;
  if(queue.length<=MAX) return {list:queue.map(snap), idx:cur};
  const start=Math.max(0,Math.min(Math.max(cur-40,0),queue.length-MAX));
  return {list:queue.slice(start,start+MAX).map(snap), idx:Math.max(0,cur-start)};
}
function updateMediaSession(t){
  if(!('mediaSession' in navigator)) return;
  try{
    navigator.mediaSession.metadata=new MediaMetadata({
      title:t.name, artist:t.artist||'', album:t.album||'',
      artwork: t.cover?[{src:t.cover,sizes:'500x500',type:'image/jpeg'}]:[]
    });
  }catch(e){}
}

/* =========================================================
   歌词
   ========================================================= */
function parseLrc(txt){
  const out=[];
  if(!txt) return out;
  String(txt).split(/\r?\n/).forEach(line=>{
    const m=line.match(/^\[(\d{1,3}):(\d{1,2})(?:[.:](\d{1,3}))?\](.*)$/);
    if(!m) return;
    const ms=(+m[1])*60000+(+m[2])*1000+(m[3]?+String(m[3]).padEnd(3,'0').slice(0,3):0);
    const s=m[4].trim();
    if(s) out.push({t:ms,s,tr:''});
  });
  return out.sort((a,b)=>a.t-b.t);
}
function mergeLrc(main,tr){
  const list=parseLrc(main), tl=parseLrc(tr);
  if(list.length&&tl.length){
    list.forEach(o=>{
      let best=null,bd=1e9;
      tl.forEach(x=>{ const d=Math.abs(x.t-o.t); if(d<bd){ bd=d; best=x; } });
      if(best&&bd<=420) o.tr=best.s;
    });
  }
  return list;
}
function renderLyrics(){
  const has=lyrics.length>0;
  const html=has
    ? lyrics.map((o,i)=>`<p data-li="${i}" data-act="lyric" data-t="${o.t}" class="${i===lyricIdx?'on':''}">${esc(o.s)}</p>`
        +(o.tr?`<p class="lyr-tr ${i===lyricIdx?'on':''}" data-act="lyric" data-t="${o.t}">${esc(o.tr)}</p>`:'')).join('')
    : `<div class="note">${esc(lyricNote||'暂无歌词')}</div>`;
  $$('[data-b="lyrics"]').forEach(box=>{ box.innerHTML=html; });
  if(has&&lyricIdx>=0) scrollLyric(true);
}
function lyricBoxes(){ return $$('[data-b="lyrics"]'); }
/* 全屏播放页：歌词 / 播放队列 选项卡 */
function switchNpxTab(tab){
  $$('.npx-tab').forEach(b=>b.classList.toggle('on',b.dataset.tab===tab));
  const lyr=document.querySelector('.npx-lyr-col .npx-lyrics');
  const q=document.querySelector('.npx-lyr-col .npx-queue');
  if(lyr) lyr.hidden=tab!=='lyrics';
  if(q){ q.hidden=tab!=='queue'; if(tab==='queue') renderQueue(); }
  if(tab==='lyrics') scrollLyric(true);
}
function scrollLyric(force){
  if(lyricIdx<0) return;
  lyricBoxes().forEach(box=>{
    const el=box.querySelector('p[data-li="'+lyricIdx+'"]');
    if(!el) return;
    const sc=box.closest('[data-lscroll]');
    if(!sc) return;
    const r1=sc.getBoundingClientRect(), r2=el.getBoundingClientRect();
    const target=sc.scrollTop+(r2.top-r1.top)-sc.clientHeight/2+r2.height/2;
    if(force) sc.scrollTop=target;
    else sc.scrollTo({top:target,behavior:'smooth'});
  });
}
function updateLyric(force){
  if(!lyrics.length) return;
  const ms=(audio.currentTime||0)*1000+120;
  let i=-1;
  for(let k=0;k<lyrics.length;k++){ if(lyrics[k].t<=ms) i=k; else break; }
  if(i===lyricIdx&&!force) return;
  lyricIdx=i;
  lyricBoxes().forEach(box=>{
    box.querySelectorAll('p.on').forEach(p=>p.classList.remove('on'));
    const el=box.querySelector('p[data-li="'+i+'"]');
    if(el) el.classList.add('on');
    const tr=box.querySelector('p.lyr-tr[data-li="'+i+'"]');
    if(tr) tr.classList.add('on');
  });
  scrollLyric(false);
  scheduleHighlight();
}
async function loadLyrics(t){
  const token=++lyricToken;
  lyricIdx=-1;
  if(t.kind!=='online'){
    lyrics=[]; lyricNote='本地文件没有歌词信息'; renderLyrics(); return;
  }
  lyrics=[]; lyricNote='正在载入歌词…'; renderLyrics();
  try{
    const o=await getLyric(t.ncId);
    if(token!==lyricToken||currentTrack()!==t) return;
    const list=mergeLrc(o.lrc,o.tr);
    lyrics=list;
    lyricNote=list.length?'':'这首歌还没有歌词';
    lyricIdx=-1;
    renderLyrics();
    updateLyric(true);
  }catch(e){
    if(token!==lyricToken||currentTrack()!==t) return;
    lyrics=[]; lyricNote='歌词加载失败，稍后再试'; renderLyrics();
  }
}
function scheduleHighlight(){
  $$('.tr').forEach(el=>{
    const on=currentTrack()&&el.dataset.key===currentTrack().id;
    el.classList.toggle('on',!!on);
  });
}

}

/* 只刷新歌单列表区域，不动顶部搜索框（打字时不丢焦点、不打断输入法） */
function updatePlTracks(){
  const p=PLAYLISTS.find(x=>x.id===plCurId);
  const box=$('#plTracks'), extra=$('#plExtra');
  if(!p||!box||!extra) return;
  const filtering=!!plQ.trim();
  let inner='', ex='';
  if(filtering){
    const q=plQ.trim().toLowerCase();
    const list=p.tracks.filter(t=>plMatches(t,q)).slice(0,400);
    inner=list.length?tracksHTML(list,'pl:'+p.id):emptyHTML('没有匹配的歌','换个关键词试试。',I.note);
    ex=`<p class="pl-filter-note">匹配到 ${list.length} 首${list.length>=400?'（只显示前 400 首，可再输入更精确的关键词）':''}</p>`;
  }else{
    const show=p.tracks.slice(0,plShow);
    inner=show.length?tracksHTML(show,'pl:'+p.id):emptyHTML('这个歌单还是空的','去别处逛逛吧。',I.note);
    if(p.tracks.length>plShow) ex=`<button class="btn ghost dark pl-more" data-act="pl-more">显示更多（已显示 ${show.length} / ${p.tracks.length} 首）</button>`;
  }
  box.innerHTML=inner;
  extra.innerHTML=ex;
}

/* ---------- 搜索 ---------- */
function renderSearch(){
  currentView='search';
  view.innerHTML=`
  <div class="search-head"><h1>搜索</h1></div>
  <div class="search-big">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m16.5 16.5 4 4"/></svg>
    <input id="searchMain" type="search" placeholder="歌曲、歌手、专辑" autocomplete="off" spellcheck="false" value="${esc(searchQ)}">
  </div>
  <div class="hints">${HINTS.map(h=>`<button class="hint" data-act="hint" data-q="${esc(h)}">${esc(h)}</button>`).join('')}</div>
  <div id="searchResults">${searchQ?'':emptyHTML('想听什么？','输入歌名或歌手，曲库来自网易云音乐。',I.note)}</div>`;

  const inp=$('#searchMain');
  inp.addEventListener('input',()=>{
    searchQ=inp.value;
    syncSideSearch();
    clearTimeout(searchTimer);
    searchTimer=setTimeout(()=>{
      if(searchQ.trim()) doSearch(searchQ.trim());
      else { const r=$('#searchResults'); if(r) r.innerHTML=emptyHTML('想听什么？','输入歌名或歌手，曲库来自网易云音乐。',I.note); }
    },380);
  });
  applyTopbarTitle('搜索');
  if(searchQ.trim()) doSearch(searchQ.trim());
}

async function doSearch(q){
  const box=$('#searchResults');
  if(!box) return;
  const token=++searchToken;
  box.innerHTML=`<div class="loading"><span class="spin"></span>正在搜索「${esc(q)}」</div>`;
  try{
    const hits=await searchApi(q,20);
    if(token!==searchToken) return;
    searchTracks=hits.map(fromHit);
    const el=$('#searchResults');
    if(!el) return;
    if(!searchTracks.length){
      el.innerHTML=emptyHTML('没有找到结果','换个关键词试试，或者只输入歌名。',I.note);
      return;
    }
    el.innerHTML=`<section class="sec" style="margin-top:26px">
      <div class="sec-hd"><div><h2>歌曲</h2><p>${searchTracks.length} 个结果</p></div>
        <button class="more" data-act="play-list" data-list="search">全部播放${I.chev}</button></div>
      <div class="tracks">${tracksHTML(searchTracks,'search')}</div></section>`;
  }catch(e){
    if(token!==searchToken) return;
    const el=$('#searchResults');
    if(el) el.innerHTML=emptyHTML('搜索没有成功','接口可能刚好在限流，等半分钟再试一次。',I.note);
  }
}
function syncSideSearch(){
  const s=$('#searchInput');
  if(s&&s.value!==searchQ) s.value=searchQ;
}
