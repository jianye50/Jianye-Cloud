<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>鉴业の小站</title>
<meta name="description" content="鉴业の小站 —— 造物、记录，与喜欢的光影。">
<style>
/* ===================== 主题变量 ===================== */
:root{
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text",
         "PingFang SC","HarmonyOS Sans SC","Microsoft YaHei","Segoe UI",sans-serif;
  --maxw:1080px;
  --nav-h:64px;
  --accent:#1a6cff;
  --accent-2:#0a4fd6;
  --accent-soft:rgba(26,108,255,.10);
  --accent-fg:#fff;
  --radius:20px;
}
html[data-theme="light"]{
  --bg:#f6f7fb;
  --bg-2:#eef1f7;
  --text-1:#16181d;
  --text-2:rgba(22,24,29,.66);
  --text-3:rgba(22,24,29,.42);
  --card:#ffffff;
  --card-border:rgba(0,0,0,.06);
  --nav-bg:rgba(252,252,254,.72);
  --nav-border:rgba(0,0,0,.07);
  --chip:rgba(0,0,0,.055);
  --shadow:0 10px 34px rgba(23,32,63,.09);
  --shadow-lg:0 24px 60px rgba(23,32,63,.14);
  --hero-fallback:linear-gradient(160deg,#2c3e5d 0%,#6b7fa6 45%,#d9a06b 100%);
  --quote-bg:rgba(26,108,255,.07);
  --img-placeholder:linear-gradient(135deg,#c8d4e6,#8fa3c4);
  color-scheme:light;
}
html[data-theme="dark"]{
  --bg:#0b0d12;
  --bg-2:#10131a;
  --text-1:#f4f5f7;
  --text-2:rgba(244,245,247,.68);
  --text-3:rgba(244,245,247,.42);
  --card:#151923;
  --card-border:rgba(255,255,255,.08);
  --nav-bg:rgba(13,16,23,.72);
  --nav-border:rgba(255,255,255,.09);
  --chip:rgba(255,255,255,.08);
  --shadow:0 10px 34px rgba(0,0,0,.45);
  --shadow-lg:0 24px 60px rgba(0,0,0,.55);
  --hero-fallback:linear-gradient(160deg,#10141d 0%,#1d2637 55%,#3a2e22 100%);
  --quote-bg:rgba(77,141,255,.10);
  --img-placeholder:linear-gradient(135deg,#232c3e,#39455e);
  --accent:#4d8dff;
  --accent-2:#6ea4ff;
  --accent-soft:rgba(77,141,255,.14);
  color-scheme:dark;
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  font-family:var(--font);
  background:var(--bg);
  color:var(--text-1);
  min-height:100vh;
  -webkit-font-smoothing:antialiased;
  overflow-x:hidden;
  transition:background .35s ease,color .35s ease;
}
button{font-family:inherit;color:inherit;border:none;background:none;cursor:pointer}
a{color:inherit;text-decoration:none}
img{display:block;max-width:100%}
::selection{background:var(--accent);color:#fff}

/* ===================== 悬浮胶囊导航（Apple 液态玻璃） ===================== */
.nav{
  position:fixed;top:14px;left:50%;transform:translateX(-50%);
  z-index:100;
  display:flex;align-items:center;gap:2px;
  height:48px;padding:0 10px 0 18px;
  border-radius:999px;
  white-space:nowrap;
  max-width:calc(100vw - 24px);
  isolation:isolate;
  /* 液态玻璃基体：高透 + 折射感模糊 + 提亮 */
  background:linear-gradient(
    120deg,
    rgba(255,255,255,.16) 0%,
    rgba(255,255,255,.07) 38%,
    rgba(255,255,255,.12) 62%,
    rgba(255,255,255,.05) 100%);
  backdrop-filter:blur(22px) saturate(200%) brightness(1.12);
  -webkit-backdrop-filter:blur(22px) saturate(200%) brightness(1.12);
  border:none;
  /* 液态玻璃棱边：外圈微光 + 顶部受光高光 + 底部收光 + 落影 */
  box-shadow:
    inset 0 0 0 1px rgba(255,255,255,.22),
    inset 0 1.5px .5px -1px rgba(255,255,255,.65),
    inset 0 -1px .5px -1px rgba(255,255,255,.28),
    inset 0 12px 18px -12px rgba(255,255,255,.30),
    0 2px 6px rgba(6,10,25,.10),
    0 14px 38px rgba(6,10,25,.28);
  transition:box-shadow .35s ease,transform .35s ease;
}
/* 斜向流光切面：一层扫过玻璃面的柔和高光 */
.nav::before{
  content:"";position:absolute;inset:0;border-radius:inherit;
  pointer-events:none;z-index:0;
  background:linear-gradient(
    105deg,
    rgba(255,255,255,.30) 0%,
    rgba(255,255,255,.06) 22%,
    transparent 46%,
    transparent 68%,
    rgba(255,255,255,.10) 100%);
  mix-blend-mode:screen;
  opacity:.8;
}
/* 玻璃厚度感：底部内侧一道暗折射 */
.nav::after{
  content:"";position:absolute;inset:0;border-radius:inherit;
  pointer-events:none;z-index:0;
  box-shadow:inset 0 -10px 14px -12px rgba(0,0,0,.35);
}
.nav>*{position:relative;z-index:1}
html[data-theme="light"] .nav{
  background:linear-gradient(
    120deg,
    rgba(255,255,255,.42) 0%,
    rgba(255,255,255,.18) 38%,
    rgba(255,255,255,.34) 62%,
    rgba(255,255,255,.14) 100%);
  backdrop-filter:blur(22px) saturate(180%) brightness(1.04);
  -webkit-backdrop-filter:blur(22px) saturate(180%) brightness(1.04);
  box-shadow:
    inset 0 0 0 1px rgba(255,255,255,.45),
    inset 0 1.5px .5px -1px rgba(255,255,255,.9),
    inset 0 -1px .5px -1px rgba(255,255,255,.5),
    inset 0 12px 18px -12px rgba(255,255,255,.55),
    0 2px 6px rgba(23,32,63,.08),
    0 14px 38px rgba(23,32,63,.16);
}
.nav:hover{
  box-shadow:
    inset 0 0 0 1px rgba(255,255,255,.30),
    inset 0 1.5px .5px -1px rgba(255,255,255,.8),
    inset 0 -1px .5px -1px rgba(255,255,255,.34),
    inset 0 12px 18px -12px rgba(255,255,255,.38),
    0 2px 8px rgba(6,10,25,.12),
    0 20px 48px rgba(6,10,25,.34);
}
.nav-brand{
  display:flex;align-items:center;gap:8px;
  font-weight:700;font-size:15px;margin-right:14px;
}
.nav-brand .dot{
  width:8px;height:8px;border-radius:50%;
  background:var(--accent);
  box-shadow:0 0 0 4px var(--accent-soft);
}
.nav-link{
  padding:7px 13px;border-radius:999px;
  font-size:14px;color:var(--text-2);
  transition:color .2s,background .2s;
}
.nav-link:hover{color:var(--text-1);background:var(--chip)}
.nav-link.active{color:var(--accent);font-weight:600}
.nav-sep{width:1px;height:20px;background:rgba(255,255,255,.22);margin:0 8px;box-shadow:1px 0 0 rgba(0,0,0,.10)}
html[data-theme="light"] .nav-sep{background:rgba(20,30,60,.16);box-shadow:1px 0 0 rgba(255,255,255,.35)}
.nav-icon{
  width:34px;height:34px;border-radius:50%;
  display:grid;place-items:center;
  color:var(--text-2);font-size:14px;
  transition:color .2s,background .2s,transform .3s;
}
.nav-icon:hover{color:var(--text-1);background:var(--chip)}
.nav-icon:active{transform:scale(.9)}
.nav-icon svg{width:17px;height:17px;fill:currentColor}
@media (max-width:640px){
  .nav{gap:0;padding:0 8px 0 14px}
  .nav-brand span{display:none}
  .nav-link{padding:7px 9px;font-size:13px}
}

/* ===================== 视图容器与动画 ===================== */
#app{min-height:100vh}
.view{animation:fadeUp .55s cubic-bezier(.2,.7,.2,1) both}
@keyframes fadeUp{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.wrap{max-width:var(--maxw);margin:0 auto;padding:0 24px}
@media (max-width:640px){.wrap{padding:0 18px}}

/* ===================== 首页 Hero ===================== */
.hero{
  position:relative;min-height:100vh;
  display:flex;align-items:center;
  background:var(--hero-fallback);
  overflow:hidden;
}
.hero-img{
  position:absolute;inset:0;width:100%;height:100%;
  object-fit:cover;
  animation:heroIn 1.6s cubic-bezier(.2,.7,.2,1) both;
}
@keyframes heroIn{from{transform:scale(1.08);opacity:.4}to{transform:none;opacity:1}}
.hero::after{
  content:"";position:absolute;inset:0;
  background:linear-gradient(100deg,rgba(8,12,24,.62) 0%,rgba(8,12,24,.34) 46%,rgba(8,12,24,.14) 100%),
             linear-gradient(to top,rgba(8,12,24,.42),transparent 36%);
}
.hero-inner{position:relative;z-index:2;animation:fadeUp .9s .15s cubic-bezier(.2,.7,.2,1) both}
.hero-badge{
  display:inline-flex;align-items:center;gap:8px;
  padding:7px 15px;border-radius:999px;
  background:rgba(10,14,26,.5);
  border:1px solid rgba(255,255,255,.16);
  backdrop-filter:blur(8px);
  color:rgba(255,255,255,.9);
  font-size:12.5px;letter-spacing:.14em;font-weight:600;
}
.hero-badge .pulse{
  width:7px;height:7px;border-radius:50%;
  background:#35d07f;
  box-shadow:0 0 0 0 rgba(53,208,127,.5);
  animation:pulse 2.2s infinite;
}
@keyframes pulse{
  0%{box-shadow:0 0 0 0 rgba(53,208,127,.5)}
  70%{box-shadow:0 0 0 9px rgba(53,208,127,0)}
  100%{box-shadow:0 0 0 0 rgba(53,208,127,0)}
}
.hero h1{
  margin:26px 0 18px;
  font-size:clamp(44px,7.5vw,84px);
  font-weight:800;letter-spacing:-.02em;color:#fff;
  text-shadow:0 4px 30px rgba(0,0,0,.25);
}
.hero p{
  font-size:clamp(16px,2vw,19px);line-height:1.7;
  color:rgba(255,255,255,.86);max-width:480px;
  text-shadow:0 2px 14px rgba(0,0,0,.3);
}
.hero-actions{display:flex;gap:14px;margin-top:38px;flex-wrap:wrap}
.btn{
  display:inline-flex;align-items:center;gap:8px;
  padding:13px 26px;border-radius:12px;
  font-size:15px;font-weight:600;
  transition:transform .2s,box-shadow .2s,background .2s;
}
.btn:hover{transform:translateY(-2px)}
.btn:active{transform:scale(.97)}
.btn-primary{
  background:var(--accent);color:#fff;
  box-shadow:0 10px 26px rgba(26,108,255,.4);
}
.btn-primary:hover{box-shadow:0 14px 32px rgba(26,108,255,.5)}
.btn-ghost{
  background:rgba(255,255,255,.14);
  border:1px solid rgba(255,255,255,.24);
  color:#fff;backdrop-filter:blur(8px);
}
.btn-ghost:hover{background:rgba(255,255,255,.22)}
.mouse{
  position:absolute;left:50%;bottom:34px;transform:translateX(-50%);
  width:26px;height:42px;border:2px solid rgba(255,255,255,.55);
  border-radius:999px;z-index:2;
}
.mouse::before{
  content:"";position:absolute;left:50%;top:8px;
  width:4px;height:8px;margin-left:-2px;border-radius:99px;
  background:rgba(255,255,255,.8);
  animation:wheel 1.8s ease-in-out infinite;
}
@keyframes wheel{
  0%{transform:translateY(0);opacity:1}
  60%{transform:translateY(12px);opacity:0}
  100%{transform:translateY(0);opacity:0}
}

/* ===================== 区块标题 ===================== */
.section{padding:64px 0 8px}
.section-label{
  display:flex;align-items:center;gap:14px;
  font-size:12.5px;font-weight:700;letter-spacing:.22em;
  color:var(--text-2);text-transform:uppercase;
  margin-bottom:22px;
}
.section-label::before{
  content:"";width:34px;height:2.5px;border-radius:99px;
  background:var(--accent);
}

/* ===================== 图库：照片墙 ===================== */
.photo-grid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:14px;
  padding:4px 0 10px;
}
@media (max-width:900px){.photo-grid{grid-template-columns:repeat(3,1fr);gap:12px}}
@media (max-width:620px){.photo-grid{grid-template-columns:repeat(2,1fr);gap:10px}}

.ph-tile{
  position:relative;aspect-ratio:1;
  border-radius:16px;overflow:hidden;
  background:var(--img-placeholder);
  border:1px solid var(--card-border);
  box-shadow:var(--shadow);
  cursor:zoom-in;
  transition:transform .35s cubic-bezier(.2,.7,.2,1),box-shadow .35s;
}
.ph-tile:hover{transform:translateY(-4px);box-shadow:var(--shadow-lg)}
.ph-tile:focus-visible{outline:2.5px solid var(--accent);outline-offset:3px}
.ph-tile img{
  width:100%;height:100%;object-fit:cover;
  transition:transform .6s cubic-bezier(.2,.7,.2,1);
}
.ph-tile:hover img{transform:scale(1.06)}
.ph-cap{
  position:absolute;left:10px;right:10px;bottom:9px;
  font-size:11.5px;font-weight:600;color:#fff;
  text-shadow:0 1px 8px rgba(0,0,0,.75);
  opacity:0;transform:translateY(5px);
  transition:opacity .25s,transform .25s;
  pointer-events:none;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.ph-tile:hover .ph-cap{opacity:1;transform:none}
.ph-tile::after{
  content:"";position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(to top,rgba(6,10,22,.5),transparent 46%);
  opacity:0;transition:opacity .25s;
}
.ph-tile:hover::after{opacity:1}
.ph-more{
  position:absolute;inset:0;z-index:2;
  display:grid;place-items:center;
  background:rgba(6,10,22,.52);
  backdrop-filter:blur(3px);
  color:#fff;font-size:20px;font-weight:750;letter-spacing:.02em;
}
.ph-skel{animation:skel 1.5s ease-in-out infinite;border-color:transparent}
@keyframes skel{0%,100%{opacity:.55}50%{opacity:.9}}
.ph-empty{
  grid-column:1/-1;
  padding:52px 24px;text-align:center;
  border:1px dashed var(--card-border);border-radius:var(--radius);
  background:var(--card);
  color:var(--text-2);font-size:14px;line-height:1.95;
}
.ph-empty b{color:var(--text-1);font-weight:700}
.ph-empty code{
  font-family:ui-monospace,"SF Mono",Consolas,monospace;
  font-size:.9em;background:var(--chip);padding:2px 7px;border-radius:6px;
}
.section-more{text-align:center;padding:16px 0 30px}
.link-more{
  display:inline-flex;align-items:center;gap:8px;
  padding:11px 26px;border-radius:999px;
  border:1px solid var(--card-border);background:var(--card);
  font-size:14px;font-weight:600;color:var(--text-1);
  box-shadow:var(--shadow);transition:transform .2s,box-shadow .2s,color .2s;
}
.link-more:hover{transform:translateY(-2px);box-shadow:var(--shadow-lg);color:var(--accent)}

/* ===================== 灯箱 ===================== */
.lightbox{
  position:fixed;inset:0;z-index:200;display:none;
  background:rgba(3,7,20,.9);
  backdrop-filter:blur(18px) saturate(150%);
  -webkit-backdrop-filter:blur(18px) saturate(150%);
  align-items:center;justify-content:center;
}
.lightbox.open{display:flex;animation:fadeIn .22s ease}
.lightbox img{
  max-width:88vw;max-height:80vh;border-radius:16px;
  box-shadow:0 40px 100px rgba(0,0,0,.6);
  animation:fadeUp .3s cubic-bezier(.2,.7,.2,1) both;
}
.lb-btn{
  position:absolute;width:48px;height:48px;border-radius:50%;
  background:rgba(255,255,255,.1);
  display:grid;place-items:center;color:#fff;
  transition:background .2s,transform .2s;
}
.lb-btn:hover{background:rgba(255,255,255,.22)}
.lb-btn:active{transform:scale(.92)}
.lb-btn svg{width:22px;height:22px}
.lb-prev{left:26px;top:50%;transform:translateY(-50%)}
.lb-next{right:26px;top:50%;transform:translateY(-50%)}
.lb-close{right:22px;top:22px}
.lb-count{
  position:absolute;left:50%;bottom:26px;transform:translateX(-50%);
  font-size:13px;color:rgba(255,255,255,.78);
  background:rgba(255,255,255,.1);padding:6px 14px;border-radius:999px;
  max-width:80vw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
@media (max-width:640px){
  .lb-prev{left:8px}.lb-next{right:8px}
  .lb-btn{width:42px;height:42px}
}

/* ===================== 内页标题 ===================== */
.page-head{padding:130px 0 30px}
.page-head h1{
  font-size:clamp(44px,6vw,60px);font-weight:800;
  letter-spacing:-.02em;color:var(--accent);
}
.page-head .sub{margin-top:12px;color:var(--text-2);font-size:15px;line-height:1.7}

/* ===================== 关于页 ===================== */
.about-card{
  background:var(--card);border:1px solid var(--card-border);
  border-radius:var(--radius);box-shadow:var(--shadow);
  padding:44px 42px;margin-bottom:26px;
}
.avatar{
  position:relative;overflow:hidden;
  width:84px;height:84px;border-radius:50%;
  display:grid;place-items:center;
  font-size:32px;font-weight:800;color:#fff;
  background:linear-gradient(135deg,var(--accent),#7a3bff);
  box-shadow:0 12px 30px rgba(26,108,255,.35);
  margin-bottom:22px;
}
.avatar img{
  position:absolute;inset:0;width:100%;height:100%;
  object-fit:cover;display:block;
}
.about-card .tagline{font-size:14.5px;color:var(--text-3);margin:-8px 0 16px;letter-spacing:.02em}
.chips{display:flex;flex-wrap:wrap;gap:9px;margin:18px 0 6px}
.chips span{
  font-size:13px;color:var(--text-2);
  border:1px solid var(--card-border);border-radius:999px;
  padding:5px 13px;background:var(--bg-2);
}
.socials{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-top:14px}
.socials a{
  display:flex;align-items:center;gap:8px;
  padding:11px 14px;border-radius:12px;
  border:1px solid var(--card-border);background:var(--bg-2);
  font-size:13.5px;color:var(--text-2);font-weight:600;
  transition:transform .2s,box-shadow .2s,color .2s;
}
.socials a:hover{transform:translateY(-2px);box-shadow:var(--shadow);color:var(--text-1)}
.socials a .dot{width:8px;height:8px;border-radius:50%;flex:none}
.mail-line{margin-top:18px}
.about-card h2{font-size:26px;font-weight:780;margin-bottom:14px;letter-spacing:-.01em}
.about-card p{color:var(--text-2);line-height:1.9;font-size:15.5px;margin-bottom:12px}
.proj-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:18px;margin-top:26px}
.proj{
  display:block;padding:22px;border-radius:16px;
  border:1px solid var(--card-border);background:var(--bg-2);
  transition:transform .25s,box-shadow .25s;
}
.proj:hover{transform:translateY(-3px);box-shadow:var(--shadow)}
.proj .ic{
  width:42px;height:42px;border-radius:12px;margin-bottom:14px;
  display:grid;place-items:center;font-size:19px;color:#fff;
}
.proj h4{font-size:15.5px;font-weight:700;margin-bottom:6px}
.proj p{font-size:13px;color:var(--text-2);line-height:1.65;margin:0}
.read-more{
  display:inline-flex;align-items:center;gap:6px;
  color:var(--accent);font-weight:650;font-size:14px;
}

/* ===================== 左下角迷你音乐播放器 ===================== */
.mus-pill{
  position:fixed;left:18px;bottom:18px;z-index:150;
  display:flex;align-items:center;gap:10px;
  background:var(--card);border:1px solid var(--card-border);
  border-radius:999px;padding:8px 14px 8px 8px;
  box-shadow:var(--shadow);cursor:pointer;max-width:min(300px,calc(100vw - 36px));
  transition:transform .2s,box-shadow .2s;
}
.mus-pill:hover{transform:translateY(-2px);box-shadow:var(--shadow-lg,var(--shadow))}
.mus-disc{
  width:36px;height:36px;border-radius:50%;flex:none;position:relative;overflow:hidden;
  display:grid;place-items:center;color:#fff;font-size:15px;
  background:linear-gradient(135deg,var(--accent),#7a3bff);
}
.mus-disc img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.mus-disc .note{position:relative;z-index:1}
.mus-disc.spin .note{animation:spin 5s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.mus-pill .tx{flex:1;min-width:0}
.mus-pill .tx b{display:block;font-size:13px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mus-pill .tx small{display:block;font-size:11px;color:var(--text-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mus-pill .pp{
  width:32px;height:32px;border-radius:50%;border:none;flex:none;
  display:grid;place-items:center;background:var(--accent);color:#fff;cursor:pointer;
}
.mus-pill .pp svg{width:14px;height:14px}
.mus-panel{
  position:fixed;left:18px;bottom:74px;z-index:150;
  width:342px;max-width:calc(100vw - 36px);
  background:var(--card);border:1px solid var(--card-border);
  border-radius:var(--radius);box-shadow:var(--shadow-lg,var(--shadow));
  display:none;flex-direction:column;overflow:hidden;
}
.mus-panel.open{display:flex;animation:fadeUp .25s ease both}
.mus-head{padding:16px 16px 0}

/* 目录文件清单：优先读服务器的目录列表；静态托管没有目录列表时回退 GitHub API */
async function listDirFiles(dir,regex){
  try{
    /* 直接把相对目录交给 URL 解析：'图片/'、'../图片/' 都能正确落到目录上 */
    const base=new URL(dir,location.href);
    const res=await fetch(base.href);
    if(res.ok){
      const doc=new DOMParser().parseFromString(await res.text(),"text/html");
      const urls=new Set();
      doc.querySelectorAll("a[href]").forEach(a=>{
        let h=a.getAttribute("href");
        if(!h)return;
        h=h.split("#")[0];
        if(!regex.test(h.split("?")[0]))return;
        urls.add(new URL(h,base.href).href);
      });
      if(urls.size)return Array.from(urls);
    }
  }catch(e){}
  return null;
}
async function listFromGitHub(dir,re=IMG_RE,ct="image"){
  try{
    const r=await fetch(`https://api.github.com/repos/${GH_REPO}/contents/${encodeURIComponent(dir)}?ref=${GH_BRANCH}`,
      {headers:{Accept:"application/vnd.github+json"}});
    if(!r.ok)return null;
    const arr=await r.json();
    if(!Array.isArray(arr))return null;
    const files=arr.filter(x=>x.type==="file"&&re.test(x.name));
    if(!files.length)return null;
    /* 站点可能部署在域名根路径，也可能在子目录（如 /one/）。
       GitHub API 给的是仓库根目录相对路径，直链拼法要靠探针验证：
       先试页面相对路径，再试域名根路径，都不行就用 GitHub raw 直链。 */
    const bases=[
      new URL(dir,location.href),
      new URL("/"+encodeURIComponent(dir)+"/",location.origin)
    ];
    for(const base of bases){
      let ok=false;
      try{
        const probe=await fetch(new URL(encodeURIComponent(files[0].name),base).href,{method:"HEAD"});
        ok=probe.ok&&(probe.headers.get("content-type")||"").toLowerCase().startsWith(ct);
      }catch(e){}
      if(ok)return files.map(x=>new URL(encodeURIComponent(x.name),base).href);
    }
    const raw=files.map(x=>x.download_url).filter(Boolean);
    return raw.length?raw:null;
  }catch(e){ return null; }
}

  if(!urls && location.protocol!=="file:") urls=await listFromGitHub("图片");

  if(urls){
    photos=urls.map(src=>{
      const file=nameOf(src);
      return {src,name:file.replace(/\.[^.]+$/,""),fb:""};
    });
    sortPhotos();
    photosStatus="ready";
  }else if(location.protocol==="file:" && PHOTO_FALLBACK.length){
    /* 直接双击打开：读不到目录，用兜底清单，图片分别试 ../图片/ 与 图片/ */
    photos=PHOTO_FALLBACK.map(file=>({
      src:PHOTO_DIRS[1]+encodeURIComponent(file),
      name:file.replace(/\.[^.]+$/,""),
      fb:file
    }));
    photosStatus="ready";
  }else{
    photos=[]; photosStatus="error";
  }
  paintPhotoGrids();
}

/* 照片 <img>：兜底模式下第一张源失败就换另一个目录再试一次 */
function photoImgTag(p){
  const err=p.fb
    ? `this.dataset.s?(this.style.display='none'):(this.dataset.s=1,this.src=this.dataset.alt)`
    : `this.style.display='none'`;
  return `<img src="${esc(p.src)}" alt="${esc(p.name)}" loading="lazy"
    ${p.fb?`data-alt="${esc(PHOTO_DIRS[0]+encodeURIComponent(p.fb))}"`:""}
    onerror="${err}">`;
}
function photoTilesHtml(limit){
  if(photosStatus==="loading"){
    const n=Math.min(limit||8,8);
    return Array.from({length:n}).map(()=>`<div class="ph-tile ph-skel"></div>`).join("");
  }
  if(!photos.length){
    const msg=photosStatus==="error"?T().gallery.err:T().gallery.empty;
    return `<div class="ph-empty">${msg}</div>`;
  }
  const total=limit>0?Math.min(limit,photos.length):photos.length;
  return photos.slice(0,total).map((p,i)=>{
    const more=(limit>0 && limit<photos.length && i===total-1);
    return `<div class="ph-tile" data-idx="${i}" role="button" tabindex="0" aria-label="${esc(p.name)}">
      ${photoImgTag(p)}
      <span class="ph-cap">${esc(p.name)}</span>
      ${more?`<div class="ph-more">+${photos.length-limit}</div>`:""}
    </div>`;
  }).join("");
}
/* 把页面上所有占位容器填上照片（首页预览用 limit，图库页用全部） */

/* =====================================================================
 *  迷你音乐播放器（左下角）：酷狗歌单 / 本地「音乐」文件夹 / 在线搜歌
 *  在线音源：GD 音乐台（music-api.gdstudio.xyz）· 网易云源
 * ===================================================================== */
const MUS_DIR="音乐/",AUDIO_RE=/\.(mp3|m4a|flac|wav|ogg|opus|aac|wma)$/i;
const GD_API="https://music-api.gdstudio.xyz/api.php",GD_SRC="netease";
const gdCache=new Map();let gdChain=Promise.resolve(),gdLastAt=0;
function gdFetch(qs){
  const run=async()=>{
    const wait=160-(Date.now()-gdLastAt);
    if(wait>0)await new Promise(r=>setTimeout(r,wait));
    gdLastAt=Date.now();
    const res=await fetch(GD_API+"?"+qs);
    if(!res.ok)throw new Error("HTTP "+res.status);
    const j=await res.json();
    if(j&&j.detail)throw new Error(j.detail);
    return j;
  };
  gdChain=gdChain.then(run,run);
  return gdChain;
}
async function gdSearch(kw,page){
  const key="q|"+kw+"|"+(page||1);
  if(gdCache.has(key))return gdCache.get(key);
  const j=await gdFetch("types=search&source="+GD_SRC+"&name="+encodeURIComponent(kw)+"&count=20&pages="+(page||1));
  const list=Array.isArray(j)?j:[];
  gdCache.set(key,list);
  return list;
}
async function gdUrl(id,br){
  const j=await gdFetch("types=url&source="+GD_SRC+"&id="+encodeURIComponent(id)+"&br="+(br||320));
  return (j&&j.url)||"";
}
async function gdPic(picId){
  const key="p|"+picId;
  if(gdCache.has(key))return gdCache.get(key);
  const j=await gdFetch("types=pic&source="+GD_SRC+"&id="+encodeURIComponent(picId)+"&size=200");
  const url=(j&&j.url)||"";
  gdCache.set(key,url);
  return url;
}
function normOnline(x){
  return {online:true,id:"nc:"+x.id,ncId:String(x.id),
    name:x.name||"(未知曲目)",
    artist:Array.isArray(x.artist)?x.artist.join(" / "):(x.artist||""),
    album:x.album||"",picId:x.pic_id||"",cover:"",src:""};
}
function normLocal(src){
  const file=decodeURIComponent(src.split("/").pop().split("?")[0]);
  return {online:false,id:"lf:"+src,name:file.replace(/\.[^.]+$/,""),
    artist:"「音乐」文件夹",album:"",src:src,cover:""};
}
/* 酷狗歌单快照（kugou-playlist.js 提供 window.KUGOU_PLAYLIST） */
let kgMeta=null,kgSongs=[],kgQ="",kgLimit=80;
function loadKg(){
  const d=window.KUGOU_PLAYLIST;
  if(!d||!Array.isArray(d.songs))return;
  kgMeta={name:d.name||"我的酷狗歌单",src:d.src||"酷狗音乐",count:d.count||d.songs.length,updated:d.updated||""};
  kgSongs=d.songs.map(line=>{
    const i=String(line).lastIndexOf("|");
    return {online:true,kg:true,id:"kg:"+line,

/* 「歌名|歌手」→ 网易云曲目（搜一次，结果写回队列对象） */
async function kgResolve(t){
  if(!t)return false;
  if(t.ncId)return true;
  if(t.kgFail&&Date.now()-t.kgFail<10*60*1000)return false;
  try{
    const hit=await gdSearch((t.name+" "+(t.artist||"")).trim(),1);
    if(!hit||!hit.length)throw new Error("no match");
    const o=normOnline(hit[0]);
    t.ncId=o.ncId;t.picId=o.picId;t.album=o.album||"";
    if(!t.artist)t.artist=o.artist;
    t.kgFail=0;
    return true;
  }catch(e){ t.kgFail=Date.now(); return false; }
}

const curTrack=()=>(mCur>=0&&mCur<mQueue.length)?mQueue[mCur]:null;
const SVG_PLAY='<svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5.5v13a1 1 0 0 0 1.5.87l11-6.5a1 1 0 0 0 0-1.74l-11-6.5A1 1 0 0 0 8 5.5z"/></svg>';

/* ---------- 状态记忆（本地存储） ---------- */
function saveMusState(){
  try{localStorage.setItem("jy-music",JSON.stringify({k:mQueueKind,i:mCur,t:mAudio.currentTime||0,m:mMode}));}catch(e){}
}
function restoreMusState(){
  try{
    const s=JSON.parse(localStorage.getItem("jy-music")||"null");
    if(!s)return;
    if(Number.isInteger(s.m)&&s.m>=0&&s.m<=2)mMode=s.m;
    if(typeof s.k==="string"&&s.k){
      const pool=s.k==="local"?musSongs:s.k==="kg"?kgSongs:null;
      if(pool&&pool.length&&s.i>=0&&s.i<pool.length){
        mQueue=pool.slice();mCur=s.i;mQueueKind=s.k;
        mSeekPending=isFinite(s.t)?s.t:-1;
      }
    }
  }catch(e){}
}
/* ---------- 播放核心 ---------- */
async function loadAndPlay(i,autoplay){
  if(i<0||i>=mQueue.length)return;
  mCur=i;
  const t=mQueue[i];
  if(!t)return;
  syncMusUI();
  const fail=msg=>{
    mFail++;
    if(mFail>=4){mFail=0;syncMusUI();return;}
    skip(1);
  };
  const URL_TTL=5*60*1000;
  if(t.online&&!t.ncId){
    const ok=await kgResolve(t);
    if(!ok){fail();return;}
  }
  if(t.online&&(!t.src||!t.srcAt||Date.now()-t.srcAt>URL_TTL)){
    try{
      const url=await gdUrl(t.ncId,320);
      if(!url)throw new Error("empty");
      t.src=url;t.srcAt=Date.now();
    }catch(e){fail();return;}
  }
  if(!t.src){fail();return;}
  mFail=0;
  if(t.online&&t.picId&&!t.cover){
    gdPic(t.picId).then(u=>{if(u){t.cover=u;syncMusUI();}}).catch(()=>{});
  }
  mLoadedId=t.id;
  mAudio.src=t.src;
  if(autoplay!==false){
    mAudio.play().then(()=>{ if(mSeekPending>=0&&isFinite(mSeekPending)){mAudio.currentTime=mSeekPending;mSeekPending=-1;} })
      .catch(()=>{ const sub=$("#musSub"); if(sub)sub.textContent=T().mus.blocked; });
  }
  saveMusState();
  syncMusUI();
}
function skip(step){
  if(!mQueue.length)return;
  if(mMode===2&&mQueue.length>1){
    let n;do{n=(Math.random()*mQueue.length)|0}while(n===mCur);
    return loadAndPlay(n,true);
  }
  return loadAndPlay((mCur+step+mQueue.length)%mQueue.length,true);
}
function togglePlay(){
  if(!mQueue.length||mCur<0){
    const pool=musTab==="local"?musSongs:kgSongs;
    if(pool.length){mQueue=pool.slice();mQueueKind=musTab==="local"?"local":"kg";loadAndPlay(0,true);}
    return;
  }
  const t=curTrack();
  if(t&&mLoadedId!==t.id){loadAndPlay(mCur,true);return;}
  if(mAudio.paused)mAudio.play().catch(()=>{});else mAudio.pause();
  syncMusUI();
}
function playListAt(kind,idx){
  const pool=kind==="local"?musSongs:kind==="kg"?kgSongs:onlineRes;
  if(!pool.length)return;
  mQueue=pool.slice();mQueueKind=kind;
  loadAndPlay(idx,true);
}

}

  $("#mNext").onclick=()=>skip(1);
  $("#mPP2").onclick=togglePlay;
  $("#mVol").oninput=e=>{mAudio.volume=e.target.value/100;};
  $("#mSeek").oninput=e=>{
    if(isFinite(mAudio.duration)&&mAudio.duration>0)mAudio.currentTime=e.target.value/1000*mAudio.duration;
  };
  document.querySelectorAll("#musPanel [data-mtab]").forEach(b=>b.onclick=()=>{musTab=b.dataset.mtab;kgLimit=80;renderMusTab();syncMusUI();});
}
function syncTabLabels(){
  const M=T().mus;
  const tabs={kg:`${M.tabs.kg}<em>${kgSongs.length||""}</em>`,local:`${M.tabs.local}<em>${musSongs.length||""}</em>`,find:M.tabs.find};
  document.querySelectorAll("#musPanel [data-mtab]").forEach(b=>b.innerHTML=tabs[b.dataset.mtab]||"");
}
function renderMusTab(){
  const body=$("#mList");if(!body)return;
  const M=T().mus;
  if(musTab==="kg"){
    if(!kgMeta){body.innerHTML=`<div class="mus-empty">${M.kgEmpty}</div>`;return;}
    const q=kgQ.trim().toLowerCase();
    const view=q?kgSongs.filter(s=>(s.name+" "+s.artist).toLowerCase().includes(q)):kgSongs;
    const shown=view.slice(0,kgLimit);
    body.innerHTML=`
      <div class="mus-search"><input id="mKgQ" placeholder="${M.searchPh}" value="${esc(kgQ)}" autocomplete="off"><button id="mKgGo">${M.go}</button></div>
      ${shown.length?shown.map((s,i)=>rowHtml(s,i,"kg")).join(""):`<div class="mus-empty">${M.findNone}</div>`}
      ${view.length>kgLimit?`<button class="mus-more" id="mKgMore">${M.more.replace("{n}",view.length-kgLimit)}</button>`:""}`;
    const inp=$("#mKgQ");
    inp.oninput=e=>{kgQ=e.target.value;kgLimit=80;
      const pos=e.target.selectionStart;renderMusTab();
      const ni=$("#mKgQ");if(ni){ni.focus();ni.setSelectionRange(pos,pos);}};
    inp.onkeydown=e=>{if(e.key==="Enter"){e.preventDefault();}};
    $("#mKgGo").onclick=()=>renderMusTab();
    const more=$("#mKgMore");if(more)more.onclick=()=>{kgLimit+=80;renderMusTab();};
  }else if(musTab==="local"){
    if(musStatus==="loading"){body.innerHTML=`<div class="mus-empty">${M.localLoading}</div>`;}
    else if(musStatus==="error"){body.innerHTML=`<div class="mus-empty">${M.localErr}</div>`;}
    else if(!musSongs.length){body.innerHTML=`<div class="mus-empty">${M.localEmpty}</div>`;}
    else body.innerHTML=musSongs.map((s,i)=>rowHtml(s,i,"local")).join("");
  }else{
    body.innerHTML=`
      <div class="mus-search"><input id="mFq" placeholder="${M.findPh}" autocomplete="off"><button id="mFgo">${M.go}</button></div>
      <div id="mFres"><div class="mus-empty">${M.findIdle}</div></div>`;
    const inp=$("#mFq");
    const go=async()=>{
      const kw=inp.value.trim();
      if(!kw)return;
      $("#mFres").innerHTML=`<div class="mus-empty">${M.localLoading}</div>`;
      try{
        const list=await gdSearch(kw,1);
        onlineRes=list.map(normOnline);
        $("#mFres").innerHTML=onlineRes.length
          ?onlineRes.map((s,i)=>rowHtml(s,i,"find")).join("")
          :`<div class="mus-empty">${M.findNone}</div>`;
      }catch(e){$("#mFres").innerHTML=`<div class="mus-empty">${M.findErr}</div>`;}
    };
    inp.onkeydown=e=>{if(e.key==="Enter"){e.preventDefault();go();}};
    $("#mFgo").onclick=go;
  }
}
function rowHtml(s,i,kind){
  const cur=curTrack();
  const on=cur&&cur.id===s.id&&mQueueKind===kind;
  return `<button class="mus-row${on?" on":""}" data-mplay="${kind}:${i}">
    <span class="num">${i+1}</span>
    <span class="nm"><b>${esc(s.name)}</b><small>${esc(s.artist||T().mus.artist)}</small></span>
  </button>`;
}
function syncMusUI(){
  if(!$("#mNow")){syncPill();return;}   // 面板还没构建过，只刷新药丸
  const t=curTrack();
  $("#mNow").textContent=t?t.name:"—";
  $("#mArtist").textContent=t?(t.artist||T().mus.artist):"";
  const paused=mAudio.paused;
  $("#mPP2").innerHTML=paused?SVG_PLAY:SVG_PAUSE;
  $("#musPP").innerHTML=paused?SVG_PLAY:SVG_PAUSE;
  $("#mMode").classList.toggle("on",mMode>0);
  syncTabLabels();
  document.querySelectorAll("#musPanel .mus-row").forEach(r=>{
    const[k,i]=r.dataset.mplay.split(":");
    const pool=k==="local"?musSongs:k==="kg"?kgSongs:onlineRes;
    const s=pool&&pool[+i];
    r.classList.toggle("on",!!(t&&s&&t.id===s.id));
  });
  syncPill();
}
/* ---------- 事件 ---------- */
$("#musPill").addEventListener("click",e=>{
  if(e.target.closest("#musPP")){togglePlay();return;}
  mOpen=!mOpen;
  const p=$("#musPanel");
  p.classList.toggle("open",mOpen);
  if(mOpen){if(!p.innerHTML)buildMusPanel();renderMusTab();syncMusUI();}
});
$("#musAudio").addEventListener("play",syncMusUI);
$("#musAudio").addEventListener("pause",syncMusUI);
$("#musAudio").addEventListener("loadedmetadata",()=>{
  const t=curTrack();
  if(t&&mSeekPending>=0&&isFinite(mAudio.duration)){mAudio.currentTime=Math.min(mSeekPending,mAudio.duration-1);mSeekPending=-1;}
});
$("#musAudio").addEventListener("timeupdate",()=>{
  const panel=$("#musPanel");
  if(mOpen&&isFinite(mAudio.duration)&&mAudio.duration>0){
    const sk=$("#mSeek");
    if(sk&&document.activeElement!==sk)sk.value=Math.round(mAudio.currentTime/mAudio.duration*1000);
  }
  const now=Date.now();
  if(now-mSaveAt>5000){mSaveAt=now;saveMusState();}
});
$("#musAudio").addEventListener("ended",()=>{
  if(mMode===1){mAudio.currentTime=0;mAudio.play().catch(()=>{});}
  else skip(1);
  saveMusState();
});
document.addEventListener("click",e=>{
  const row=e.target.closest("[data-mplay]");
  if(row){
    const[k,i]=row.dataset.mplay.split(":");
    playListAt(k,+i);
  }
});

/* ---------- 启动 ---------- */
setTheme(theme);
document.documentElement.lang=lang==="zh"?"zh-CN":"en";
document.title=T().brand;
$("#navBrand").textContent=T().brand;
$("#langBtn").textContent=lang==="zh"?"EN":"中";
["home","gallery","projects","about"].forEach(k=>{
  const el=document.querySelector(`[data-nav="${k}"]`);
  if(el)el.textContent=T().nav[k];
});
route();
loadPhotos();
loadKg();
buildMusPanel();
syncMusUI();
loadMusLocal();
</script>
</body>
</html>
