<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>鉴业の小站</title>
<meta name="description" content="鉴业の小站 —— 造物、记录，与喜欢的光影。">
<style>
/* ===================== 主题变量 ===================== */
:root{
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text",
         "PingFang SC","HarmonyOS Sans SC","Microsoft YaHei","Segoe UI",sans-serif;
  --maxw:1080px;
  --nav-h:64px;
  --accent:#1a6cff;
  --accent-2:#0a4fd6;
  --accent-soft:rgba(26,108,255,.10);
  --accent-fg:#fff;
  --radius:20px;
}
html[data-theme="light"]{
  --bg:#f6f7fb;
  --bg-2:#eef1f7;
  --text-1:#16181d;
  --text-2:rgba(22,24,29,.66);
  --text-3:rgba(22,24,29,.42);
  --card:#ffffff;
  --card-border:rgba(0,0,0,.06);
  --nav-bg:rgba(252,252,254,.72);
  --nav-border:rgba(0,0,0,.07);
  --chip:rgba(0,0,0,.055);
  --shadow:0 10px 34px rgba(23,32,63,.09);
  --shadow-lg:0 24px 60px rgba(23,32,63,.14);
  --hero-fallback:linear-gradient(160deg,#2c3e5d 0%,#6b7fa6 45%,#d9a06b 100%);
  --quote-bg:rgba(26,108,255,.07);
  --img-placeholder:linear-gradient(135deg,#c8d4e6,#8fa3c4);
  color-scheme:light;
}
html[data-theme="dark"]{
  --bg:#0b0d12;
  --bg-2:#10131a;
  --text-1:#f4f5f7;
  --text-2:rgba(244,245,247,.68);
  --text-3:rgba(244,245,247,.42);
  --card:#151923;
  --card-border:rgba(255,255,255,.08);
  --nav-bg:rgba(13,16,23,.72);
  --nav-border:rgba(255,255,255,.09);
  --chip:rgba(255,255,255,.08);
  --shadow:0 10px 34px rgba(0,0,0,.45);
  --shadow-lg:0 24px 60px rgba(0,0,0,.55);
  --hero-fallback:linear-gradient(160deg,#10141d 0%,#1d2637 55%,#3a2e22 100%);
  --quote-bg:rgba(77,141,255,.10);
  --img-placeholder:linear-gradient(135deg,#232c3e,#39455e);
  --accent:#4d8dff;
  --accent-2:#6ea4ff;
  --accent-soft:rgba(77,141,255,.14);
  color-scheme:dark;
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  font-family:var(--font);
  background:var(--bg);
  color:var(--text-1);
  min-height:100vh;
  -webkit-font-smoothing:antialiased;
  overflow-x:hidden;
  transition:background .35s ease,color .35s ease;
}
button{font-family:inherit;color:inherit;border:none;background:none;cursor:pointer}
a{color:inherit;text-decoration:none}
img{display:block;max-width:100%}
::selection{background:var(--accent);color:#fff}

/* ===================== 悬浮胶囊导航（Apple 液态玻璃） ===================== */
.nav{
  position:fixed;top:14px;left:50%;transform:translateX(-50%);
  z-index:100;
  display:flex;align-items:center;gap:2px;
  height:48px;padding:0 10px 0 18px;
  border-radius:999px;
  white-space:nowrap;
  max-width:calc(100vw - 24px);
  isolation:isolate;
  /* 液态玻璃基体：高透 + 折射感模糊 + 提亮 */
  background:linear-gradient(
    120deg,
    rgba(255,255,255,.16) 0%,
    rgba(255,255,255,.07) 38%,
    rgba(255,255,255,.12) 62%,
    rgba(255,255,255,.05) 100%);
  backdrop-filter:blur(22px) saturate(200%) brightness(1.12);
  -webkit-backdrop-filter:blur(22px) saturate(200%) brightness(1.12);
  border:none;
  /* 液态玻璃棱边：外圈微光 + 顶部受光高光 + 底部收光 + 落影 */
  box-shadow:
    inset 0 0 0 1px rgba(255,255,255,.22),
    inset 0 1.5px .5px -1px rgba(255,255,255,.65),
    inset 0 -1px .5px -1px rgba(255,255,255,.28),
    inset 0 12px 18px -12px rgba(255,255,255,.30),
    0 2px 6px rgba(6,10,25,.10),
    0 14px 38px rgba(6,10,25,.28);
  transition:box-shadow .35s ease,transform .35s ease;
}
/* 斜向流光切面：一层扫过玻璃面的柔和高光 */
.nav::before{
  content:"";position:absolute;inset:0;border-radius:inherit;
  pointer-events:none;z-index:0;
  background:linear-gradient(
    105deg,
    rgba(255,255,255,.30) 0%,
    rgba(255,255,255,.06) 22%,
    transparent 46%,
    transparent 68%,
    rgba(255,255,255,.10) 100%);
  mix-blend-mode:screen;
  opacity:.8;
}
/* 玻璃厚度感：底部内侧一道暗折射 */
.nav::after{
  content:"";position:absolute;inset:0;border-radius:inherit;
  pointer-events:none;z-index:0;
  box-shadow:inset 0 -10px 14px -12px rgba(0,0,0,.35);
}
.nav>*{position:relative;z-index:1}
html[data-theme="light"] .nav{
  background:linear-gradient(
    120deg,
    rgba(255,255,255,.42) 0%,
    rgba(255,255,255,.18) 38%,
    rgba(255,255,255,.34) 62%,
    rgba(255,255,255,.14) 100%);
  backdrop-filter:blur(22px) saturate(180%) brightness(1.04);
  -webkit-backdrop-filter:blur(22px) saturate(180%) brightness(1.04);
  box-shadow:
    inset 0 0 0 1px rgba(255,255,255,.45),
    inset 0 1.5px .5px -1px rgba(255,255,255,.9),
    inset 0 -1px .5px -1px rgba(255,255,255,.5),
    inset 0 12px 18px -12px rgba(255,255,255,.55),
    0 2px 6px rgba(23,32,63,.08),
    0 14px 38px rgba(23,32,63,.16);
}
.nav:hover{
  box-shadow:
    inset 0 0 0 1px rgba(255,255,255,.30),
    inset 0 1.5px .5px -1px rgba(255,255,255,.8),
    inset 0 -1px .5px -1px rgba(255,255,255,.34),
    inset 0 12px 18px -12px rgba(255,255,255,.38),
    0 2px 8px rgba(6,10,25,.12),
    0 20px 48px rgba(6,10,25,.34);
}
.nav-brand{
  display:flex;align-items:center;gap:8px;
  font-weight:700;font-size:15px;margin-right:14px;
}
.nav-brand .dot{
  width:8px;height:8px;border-radius:50%;
  background:var(--accent);
  box-shadow:0 0 0 4px var(--accent-soft);
}
.nav-link{
  padding:7px 13px;border-radius:999px;
  font-size:14px;color:var(--text-2);
  transition:color .2s,background .2s;
}
.nav-link:hover{color:var(--text-1);background:var(--chip)}
.nav-link.active{color:var(--accent);font-weight:600}
.nav-sep{width:1px;height:20px;background:rgba(255,255,255,.22);margin:0 8px;box-shadow:1px 0 0 rgba(0,0,0,.10)}
html[data-theme="light"] .nav-sep{background:rgba(20,30,60,.16);box-shadow:1px 0 0 rgba(255,255,255,.35)}
.nav-icon{
  width:34px;height:34px;border-radius:50%;
  display:grid;place-items:center;
  color:var(--text-2);font-size:14px;
  transition:color .2s,background .2s,transform .3s;
}
.nav-icon:hover{color:var(--text-1);background:var(--chip)}
.nav-icon:active{transform:scale(.9)}
.nav-icon svg{width:17px;height:17px;fill:currentColor}
@media (max-width:640px){
  .nav{gap:0;padding:0 8px 0 14px}
  .nav-brand span{display:none}
  .nav-link{padding:7px 9px;font-size:13px}
}

/* ===================== 视图容器与动画 ===================== */
#app{min-height:100vh}
.view{animation:fadeUp .55s cubic-bezier(.2,.7,.2,1) both}
@keyframes fadeUp{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.wrap{max-width:var(--maxw);margin:0 auto;padding:0 24px}
@media (max-width:640px){.wrap{padding:0 18px}}

/* ===================== 首页 Hero ===================== */
.hero{
  position:relative;min-height:100vh;
  display:flex;align-items:center;
  background:var(--hero-fallback);
  overflow:hidden;
}
.hero-img{
  position:absolute;inset:0;width:100%;height:100%;
  object-fit:cover;
  animation:heroIn 1.6s cubic-bezier(.2,.7,.2,1) both;
}
@keyframes heroIn{from{transform:scale(1.08);opacity:.4}to{transform:none;opacity:1}}
.hero::after{
  content:"";position:absolute;inset:0;
  background:linear-gradient(100deg,rgba(8,12,24,.62) 0%,rgba(8,12,24,.34) 46%,rgba(8,12,24,.14) 100%),
             linear-gradient(to top,rgba(8,12,24,.42),transparent 36%);
}
.hero-inner{position:relative;z-index:2;animation:fadeUp .9s .15s cubic-bezier(.2,.7,.2,1) both}
.hero-badge{
  display:inline-flex;align-items:center;gap:8px;
  padding:7px 15px;border-radius:999px;
  background:rgba(10,14,26,.5);
  border:1px solid rgba(255,255,255,.16);
  backdrop-filter:blur(8px);
  color:rgba(255,255,255,.9);
  font-size:12.5px;letter-spacing:.14em;font-weight:600;
}
.hero-badge .pulse{
  width:7px;height:7px;border-radius:50%;
  background:#35d07f;
  box-shadow:0 0 0 0 rgba(53,208,127,.5);
  animation:pulse 2.2s infinite;
}
@keyframes pulse{
  0%{box-shadow:0 0 0 0 rgba(53,208,127,.5)}
  70%{box-shadow:0 0 0 9px rgba(53,208,127,0)}
  100%{box-shadow:0 0 0 0 rgba(53,208,127,0)}
}
.hero h1{
  margin:26px 0 18px;
  font-size:clamp(44px,7.5vw,84px);
  font-weight:800;letter-spacing:-.02em;color:#fff;
  text-shadow:0 4px 30px rgba(0,0,0,.25);
}
.hero p{
  font-size:clamp(16px,2vw,19px);line-height:1.7;
  color:rgba(255,255,255,.86);max-width:480px;
  text-shadow:0 2px 14px rgba(0,0,0,.3);
}
.hero-actions{display:flex;gap:14px;margin-top:38px;flex-wrap:wrap}
.btn{
  display:inline-flex;align-items:center;gap:8px;
  padding:13px 26px;border-radius:12px;
  font-size:15px;font-weight:600;
  transition:transform .2s,box-shadow .2s,background .2s;
}
.btn:hover{transform:translateY(-2px)}
.btn:active{transform:scale(.97)}
.btn-primary{
  background:var(--accent);color:#fff;
  box-shadow:0 10px 26px rgba(26,108,255,.4);
}
.btn-primary:hover{box-shadow:0 14px 32px rgba(26,108,255,.5)}
.btn-ghost{
  background:rgba(255,255,255,.14);
  border:1px solid rgba(255,255,255,.24);
  color:#fff;backdrop-filter:blur(8px);
}
.btn-ghost:hover{background:rgba(255,255,255,.22)}
.mouse{
  position:absolute;left:50%;bottom:34px;transform:translateX(-50%);
  width:26px;height:42px;border:2px solid rgba(255,255,255,.55);
  border-radius:999px;z-index:2;
}
.mouse::before{
  content:"";position:absolute;left:50%;top:8px;
  width:4px;height:8px;margin-left:-2px;border-radius:99px;
  background:rgba(255,255,255,.8);
  animation:wheel 1.8s ease-in-out infinite;
}
@keyframes wheel{
  0%{transform:translateY(0);opacity:1}
  60%{transform:translateY(12px);opacity:0}
  100%{transform:translateY(0);opacity:0}
}

/* ===================== 区块标题 ===================== */
.section{padding:64px 0 8px}
.section-label{
  display:flex;align-items:center;gap:14px;
  font-size:12.5px;font-weight:700;letter-spacing:.22em;
  color:var(--text-2);text-transform:uppercase;
  margin-bottom:22px;
}
.section-label::before{
  content:"";width:34px;height:2.5px;border-radius:99px;
  background:var(--accent);
}

/* ===================== 图库：照片墙 ===================== */
.photo-grid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:14px;
  padding:4px 0 10px;
}
@media (max-width:900px){.photo-grid{grid-template-columns:repeat(3,1fr);gap:12px}}
@media (max-width:620px){.photo-grid{grid-template-columns:repeat(2,1fr);gap:10px}}

.ph-tile{
  position:relative;aspect-ratio:1;
  border-radius:16px;overflow:hidden;
  background:var(--img-placeholder);
  border:1px solid var(--card-border);
  box-shadow:var(--shadow);
  cursor:zoom-in;
  transition:transform .35s cubic-bezier(.2,.7,.2,1),box-shadow .35s;
}
.ph-tile:hover{transform:translateY(-4px);box-shadow:var(--shadow-lg)}
.ph-tile:focus-visible{outline:2.5px solid var(--accent);outline-offset:3px}
.ph-tile img{
  width:100%;height:100%;object-fit:cover;
  transition:transform .6s cubic-bezier(.2,.7,.2,1);
}
.ph-tile:hover img{transform:scale(1.06)}
.ph-cap{
  position:absolute;left:10px;right:10px;bottom:9px;
  font-size:11.5px;font-weight:600;color:#fff;
  text-shadow:0 1px 8px rgba(0,0,0,.75);
  opacity:0;transform:translateY(5px);
  transition:opacity .25s,transform .25s;
  pointer-events:none;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.ph-tile:hover .ph-cap{opacity:1;transform:none}
.ph-tile::after{
  content:"";position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(to top,rgba(6,10,22,.5),transparent 46%);
  opacity:0;transition:opacity .25s;
}
.ph-tile:hover::after{opacity:1}
.ph-more{
  position:absolute;inset:0;z-index:2;
  display:grid;place-items:center;
  background:rgba(6,10,22,.52);
  backdrop-filter:blur(3px);
  color:#fff;font-size:20px;font-weight:750;letter-spacing:.02em;
}
.ph-skel{animation:skel 1.5s ease-in-out infinite;border-color:transparent}
@keyframes skel{0%,100%{opacity:.55}50%{opacity:.9}}
.ph-empty{
  grid-column:1/-1;
  padding:52px 24px;text-align:center;
  border:1px dashed var(--card-border);border-radius:var(--radius);
  background:var(--card);
  color:var(--text-2);font-size:14px;line-height:1.95;
}
.ph-empty b{color:var(--text-1);font-weight:700}
.ph-empty code{
  font-family:ui-monospace,"SF Mono",Consolas,monospace;
  font-size:.9em;background:var(--chip);padding:2px 7px;border-radius:6px;
}
.section-more{text-align:center;padding:16px 0 30px}
.link-more{
  display:inline-flex;align-items:center;gap:8px;
  padding:11px 26px;border-radius:999px;
  border:1px solid var(--card-border);background:var(--card);
  font-size:14px;font-weight:600;color:var(--text-1);
  box-shadow:var(--shadow);transition:transform .2s,box-shadow .2s,color .2s;
}
.link-more:hover{transform:translateY(-2px);box-shadow:var(--shadow-lg);color:var(--accent)}

/* ===================== 灯箱 ===================== */
.lightbox{
  position:fixed;inset:0;z-index:200;display:none;
  background:rgba(3,7,20,.9);
  backdrop-filter:blur(18px) saturate(150%);
  -webkit-backdrop-filter:blur(18px) saturate(150%);
  align-items:center;justify-content:center;
}
.lightbox.open{display:flex;animation:fadeIn .22s ease}
.lightbox img{
  max-width:88vw;max-height:80vh;border-radius:16px;
  box-shadow:0 40px 100px rgba(0,0,0,.6);
  animation:fadeUp .3s cubic-bezier(.2,.7,.2,1) both;
}
.lb-btn{
  position:absolute;width:48px;height:48px;border-radius:50%;
  background:rgba(255,255,255,.1);
  display:grid;place-items:center;color:#fff;
  transition:background .2s,transform .2s;
}
.lb-btn:hover{background:rgba(255,255,255,.22)}
.lb-btn:active{transform:scale(.92)}
.lb-btn svg{width:22px;height:22px}
.lb-prev{left:26px;top:50%;transform:translateY(-50%)}
.lb-next{right:26px;top:50%;transform:translateY(-50%)}
.lb-close{right:22px;top:22px}
.lb-count{
  position:absolute;left:50%;bottom:26px;transform:translateX(-50%);
  font-size:13px;color:rgba(255,255,255,.78);
  background:rgba(255,255,255,.1);padding:6px 14px;border-radius:999px;
  max-width:80vw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
@media (max-width:640px){
  .lb-prev{left:8px}.lb-next{right:8px}
  .lb-btn{width:42px;height:42px}
}

/* ===================== 内页标题 ===================== */
.page-head{padding:130px 0 30px}
.page-head h1{
  font-size:clamp(44px,6vw,60px);font-weight:800;
  letter-spacing:-.02em;color:var(--accent);
}
.page-head .sub{margin-top:12px;color:var(--text-2);font-size:15px;line-height:1.7}

/* ===================== 关于页 ===================== */
.about-card{
  background:var(--card);border:1px solid var(--card-border);
  border-radius:var(--radius);box-shadow:var(--shadow);
  padding:44px 42px;margin-bottom:26px;
}
.avatar{
  width:84px;height:84px;border-radius:50%;
  display:grid;place-items:center;
  font-size:32px;font-weight:800;color:#fff;
  background:linear-gradient(135deg,var(--accent),#7a3bff);
  box-shadow:0 12px 30px rgba(26,108,255,.35);
  margin-bottom:22px;
}
.about-card h2{font-size:26px;font-weight:780;margin-bottom:14px;letter-spacing:-.01em}
.about-card p{color:var(--text-2);line-height:1.9;font-size:15.5px;margin-bottom:12px}
.tl{margin-top:30px;border-left:2px solid var(--card-border);padding-left:26px;display:flex;flex-direction:column;gap:24px}
.tl-item{position:relative}
.tl-item::before{
  content:"";position:absolute;left:-33px;top:6px;
  width:12px;height:12px;border-radius:50%;
  background:var(--accent);box-shadow:0 0 0 4px var(--accent-soft);
}
.tl-item .d{font-size:12.5px;font-weight:700;color:var(--accent);letter-spacing:.06em}
.tl-item .t{font-size:16.5px;font-weight:700;margin:4px 0 4px}
.tl-item .p{font-size:14px;color:var(--text-2);line-height:1.75}
.proj-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:18px;margin-top:26px}
.proj{
  display:block;padding:22px;border-radius:16px;
  border:1px solid var(--card-border);background:var(--bg-2);
  transition:transform .25s,box-shadow .25s;
}
.proj:hover{transform:translateY(-3px);box-shadow:var(--shadow)}
.proj .ic{
  width:42px;height:42px;border-radius:12px;margin-bottom:14px;
  display:grid;place-items:center;font-size:19px;color:#fff;
}
.proj h4{font-size:15.5px;font-weight:700;margin-bottom:6px}
.proj p{font-size:13px;color:var(--text-2);line-height:1.65;margin:0}
.read-more{
  display:inline-flex;align-items:center;gap:6px;
  color:var(--accent);font-weight:650;font-size:14px;
}

/* ===================== 页脚 ===================== */
footer{
  border-top:1px solid var(--card-border);
  padding:34px 0 42px;margin-top:30px;
  text-align:center;color:var(--text-3);font-size:13.5px;
}
footer .heart{color:#ff5d7a}

/* ===================== 动效偏好 ===================== */
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
  html{scroll-behavior:auto}
}
</style>
</head>
<body>

<!-- ============ 悬浮胶囊导航 ============ -->
<nav class="nav" id="nav">
  <a class="nav-brand" href="#/">
    <span class="dot"></span><span id="navBrand">鉴业の小站</span>
  </a>
  <a class="nav-link" data-nav="home" href="#/">Home</a>
  <a class="nav-link" data-nav="gallery" href="#/gallery">图库</a>
  <a class="nav-link" data-nav="about" href="#/about">About</a>
  <span class="nav-sep"></span>
  <button class="nav-icon" id="langBtn" title="Switch language">EN</button>
  <button class="nav-icon" id="themeBtn" title="Toggle theme" aria-label="Toggle theme"></button>
  <a class="nav-icon" href="https://github.com/jianye50" target="_blank" rel="noopener" aria-label="GitHub" title="GitHub">

</nav>

<main id="app"></main>

<!-- ============ 灯箱 ============ -->
<div class="lightbox" id="lightbox">
  <button class="lb-btn lb-close" id="lbClose" aria-label="关闭">

/* ---------- 数据：时间线 / 项目 ---------- */

  {t:"Jianye PE",d:"自维护的 PE 系统，装机维护的好帮手。",u:"https://jianye.pages.dev/pe",ic:"🧰",c:"linear-gradient(135deg,#8e7bff,#4a36c4)"},
  {t:"Jianye AI 智能助手",d:"接入大模型的智能对话助手。",u:"https://jianye.pages.dev/ai",ic:"🤖",c:"linear-gradient(135deg,#ff6a8e,#c01e52)"}

/* ---------- 图库：照片来自站点根目录下的「图片」文件夹 ----------
   new/index.html 在子目录里，所以先试同级的 图片/，再试上一级的 ../图片/。
   两种来源：① 本地服务器/静态托管的目录列表；② 直连打开（file://）时用兜底清单。 */
const PHOTO_DIRS=["图片/","../图片/"];
const IMG_RE=/\.(jpe?g|png|gif|webp|bmp|avif|heic|heif)$/i;
const GH_REPO="jianye50/Jianye-Cloud", GH_BRANCH="main";
/* file:// 下读不到目录时用的兜底清单（按文件名倒序，新增照片请用本地服务器打开自动读取） */
const PHOTO_FALLBACK=[
  "1790351352075.jpg","1790351352067.jpg","1790351352057.jpg","1790351352047.jpg",
  "1790351352038.jpg","1790351352027.jpg","1790351352014.jpg","1790351352003.jpg",
  "1790351351987.jpg","1790351351975.jpg","1790351351943.jpg","1790351351908.jpg",
  "1790351351896.jpeg","1790351351878.jpeg"
];
let photos=[];            // [{src,name,fb}]
let photosStatus="loading"; // loading | ready | error

/* ---------- 国际化 ---------- */
const I18N={
  zh:{

    nav:{home:"首页",gallery:"图库",about:"关于"},
    hero:{badge:"个人空间",sub:"造物、记录，<br>与喜欢的光影和想法。",read:"浏览图库",aboutBtn:"关于我"},
    home:{gallery:"图库",more:"查看全部照片"},
    gallery:{
      title:"图库",
      sub:n=>`共 ${n} 张照片 · 点击可放大`,
      tip:"照片放在站点根目录的「图片」文件夹里，增删后刷新页面即可。",
      empty:"「图片」文件夹里还没有照片，把图片放进去后刷新页面试试。",
      err:"暂时读不到「图片」文件夹。<br>用本地服务器打开本页即可自动扫描，例如在站点目录运行 <code>python -m http.server</code>。"
    },
    about:{
      title:"关于",hello:"你好，我是鉴业。",
      bio1:"全栈开发者 & 交互设计爱好者。我喜欢造工具、写代码，把脑子里一闪而过的想法做成可以用的东西。",
      bio2:"这个站点是我的「数字备忘录」——记录技术、手艺，和慢慢沉淀下来的想法。",
      timeline:"时间线",projects:"我的项目",projTip:"点击卡片可访问 →"
    },
    footer:"© 2026 Jianye · 用心血手写"
  },
  en:{
    brand:"Jianye's Corner",
    nav:{home:"Home",gallery:"Gallery",about:"About"},
    hero:{badge:"PERSONAL SPACE",sub:"Making things, keeping notes,<br>and the light I like.",read:"Browse Gallery",aboutBtn:"About Me"},
    home:{gallery:"Gallery",more:"View all photos"},
    gallery:{
      title:"Gallery",
      sub:n=>`${n} photo${n===1?"":"s"} · click to enlarge`,
      tip:"Photos live in the “图片” folder at the site root — add or remove some and refresh.",

      err:"Can't read the “图片” folder right now.<br>Serve the site locally to scan it, e.g. run <code>python -m http.server</code> in the site folder."
    },
    about:{
      title:"About",hello:"Hi, I'm Jianye.",
      bio1:"Full-stack developer & interaction design enthusiast. I love building tools and turning passing ideas into things that actually work.",
      bio2:"This site is my digital memo — notes on technology, craft, and ideas settling slowly over time.",
      timeline:"Timeline",projects:"Projects",projTip:"Click a card to visit →"
    },
    footer:"© 2026 Jianye · Handcrafted"
  }
};
const THEME_ICONS={
  light:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4.4"/><path d="M12 2.5v2.3M12 19.2v2.3M2.5 12h2.3M19.2 12h2.3M4.8 4.8l1.7 1.7M17.5 17.5l1.7 1.7M19.2 4.8l-1.7 1.7M6.5 17.5l-1.7 1.7"/></svg>',
  dark:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.6 14.2A8.6 8.6 0 0 1 9.8 3.4a8.6 8.6 0 1 0 10.8 10.8z"/></svg>'
};

/* ---------- 全局状态 ---------- */
let lang=localStorage.getItem("jy-lang")||"zh";
let theme=localStorage.getItem("jy-theme")||
  (matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light");

const $=s=>document.querySelector(s);
const app=$("#app");
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const T=()=>I18N[lang];

/* ---------- 工具函数 ---------- */
function setTheme(v){
  theme=v;
  document.documentElement.dataset.theme=v;
  localStorage.setItem("jy-theme",v);
  $("#themeBtn").innerHTML=THEME_ICONS[v==="dark"?"light":"dark"];
}
function setLang(v){
  lang=v;
  document.documentElement.lang=v==="zh"?"zh-CN":"en";
  localStorage.setItem("jy-lang",v);
  $("#langBtn").textContent=v==="zh"?"EN":"中";
  $("#navBrand").textContent=T().brand;
  ["home","gallery","about"].forEach(k=>{
    const el=document.querySelector(`[data-nav="${k}"]`);
    if(el)el.textContent=T().nav[k];
  });
  route(); // 重新渲染当前视图
}

/* =====================================================================
 *  图库：扫描目录 → 渲染照片墙 → 灯箱
 * ===================================================================== */

/* 目录文件清单：优先读服务器的目录列表；静态托管没有目录列表时回退 GitHub API */
async function listDirFiles(dir,regex){
  try{
    /* 直接把相对目录交给 URL 解析：'图片/'、'../图片/' 都能正确落到目录上 */
    const base=new URL(dir,location.href);
    const res=await fetch(base.href);
    if(res.ok){
      const doc=new DOMParser().parseFromString(await res.text(),"text/html");
      const urls=new Set();
      doc.querySelectorAll("a[href]").forEach(a=>{
        let h=a.getAttribute("href");
        if(!h)return;
        h=h.split("#")[0];
        if(!regex.test(h.split("?")[0]))return;
        urls.add(new URL(h,base.href).href);
      });
      if(urls.size)return Array.from(urls);
    }
  }catch(e){}
  return null;
}
async function listFromGitHub(dir){
  try{
    const r=await fetch(`https://api.github.com/repos/${GH_REPO}/contents/${encodeURIComponent(dir)}?ref=${GH_BRANCH}`,
      {headers:{Accept:"application/vnd.github+json"}});
    if(!r.ok)return null;
    const arr=await r.json();
    if(!Array.isArray(arr))return null;
    const base=new URL(dir,location.href);
    const urls=arr.filter(x=>x.type==="file"&&IMG_RE.test(x.name))
      .map(x=>new URL(encodeURIComponent(x.name),base).href);
    return urls.length?urls:null;
  }catch(e){ return null; }
}
function nameOf(src){
  return decodeURIComponent(String(src).split("/").pop().split("?")[0]);
}
function sortPhotos(){
  photos.sort((a,b)=>b.name.localeCompare(a.name,"zh-Hans-CN",{numeric:true}));
}
async function loadPhotos(){
  let urls=null;
  for(const dir of PHOTO_DIRS){
    urls=await listDirFiles(dir,IMG_RE);
    if(urls)break;
  }
  if(!urls && location.protocol!=="file:") urls=await listFromGitHub("图片");

  if(urls){
    photos=urls.map(src=>{
      const file=nameOf(src);
      return {src,name:file.replace(/\.[^.]+$/,""),fb:""};
    });
    sortPhotos();
    photosStatus="ready";
  }else if(location.protocol==="file:" && PHOTO_FALLBACK.length){
    /* 直接双击打开：读不到目录，用兜底清单，图片分别试 ../图片/ 与 图片/ */
    photos=PHOTO_FALLBACK.map(file=>({
      src:PHOTO_DIRS[1]+encodeURIComponent(file),
      name:file.replace(/\.[^.]+$/,""),
      fb:file
    }));
    photosStatus="ready";
  }else{
    photos=[]; photosStatus="error";
  }
  paintPhotoGrids();
}

/* 照片 <img>：兜底模式下第一张源失败就换另一个目录再试一次 */
function photoImgTag(p){
  const err=p.fb
    ? `this.dataset.s?(this.style.display='none'):(this.dataset.s=1,this.src=this.dataset.alt)`
    : `this.style.display='none'`;
  return `<img src="${esc(p.src)}" alt="${esc(p.name)}" loading="lazy"
    ${p.fb?`data-alt="${esc(PHOTO_DIRS[0]+encodeURIComponent(p.fb))}"`:""}
    onerror="${err}">`;
}
function photoTilesHtml(limit){
  if(photosStatus==="loading"){
    const n=Math.min(limit||8,8);
    return Array.from({length:n}).map(()=>`<div class="ph-tile ph-skel"></div>`).join("");
  }
  if(!photos.length){
    const msg=photosStatus==="error"?T().gallery.err:T().gallery.empty;
    return `<div class="ph-empty">${msg}</div>`;
  }
  const total=limit>0?Math.min(limit,photos.length):photos.length;
  return photos.slice(0,total).map((p,i)=>{
    const more=(limit>0 && limit<photos.length && i===total-1);
    return `<div class="ph-tile" data-idx="${i}" role="button" tabindex="0" aria-label="${esc(p.name)}">
      ${photoImgTag(p)}
      <span class="ph-cap">${esc(p.name)}</span>
      ${more?`<div class="ph-more">+${photos.length-limit}</div>`:""}
    </div>`;
  }).join("");
}
/* 把页面上所有占位容器填上照片（首页预览用 limit，图库页用全部） */
function paintPhotoGrids(){
  document.querySelectorAll("[data-photo-grid]").forEach(el=>{
    const limit=Number(el.dataset.photoGrid)||0;
    el.innerHTML=photoTilesHtml(limit);
  });
  const sub=$("#gallerySub");
  if(sub)sub.textContent=photos.length?T().gallery.sub(photos.length):"";
}

/* ---------- 灯箱 ---------- */
let lbIndex=0;
function setLbImg(p){
  const img=$("#lbImg");
  img.onerror=null;
  img.removeAttribute("data-alt");
  img.src=p.src;
  if(p.fb){
    img.dataset.alt=PHOTO_DIRS[0]+encodeURIComponent(p.fb);
    img.onerror=function(){
      if(img.dataset.s){img.onerror=null;return}
      img.dataset.s="1"; img.src=img.dataset.alt;
    };
  }
}
function openLb(i){
  if(!photos.length)return;
  lbIndex=(i+photos.length)%photos.length;
  showLb();
  $("#lightbox").classList.add("open");
}
function showLb(){
  const p=photos[lbIndex];
  if(!p)return;
  setLbImg(p);
  $("#lbImg").alt=p.name;
  $("#lbCount").textContent=`${lbIndex+1} / ${photos.length} · ${p.name}`;
}
function closeLb(){ $("#lightbox").classList.remove("open"); }
function stepLb(d){ openLb(lbIndex+d); }

/* ---------- 视图渲染 ---------- */
function renderHome(){
  const t=T();
  app.innerHTML=`
  <section class="view">
    <header class="hero">
      <img class="hero-img" src="https://images.unsplash.com/photo-1506905925346-21bda4d32df4?w=2000&q=80"
           alt="" onerror="this.remove()">
      <div class="wrap hero-inner">
        <span class="hero-badge"><span class="pulse"></span>${esc(t.hero.badge)}</span>
        <h1>${esc(t.brand)}</h1>
        <p>${t.hero.sub}</p>
        <div class="hero-actions">
          <a class="btn btn-primary" href="#/gallery">${esc(t.hero.read)}</a>
          <a class="btn btn-ghost" href="#/about">${esc(t.hero.aboutBtn)}</a>
        </div>
      </div>
      <span class="mouse" onclick="document.getElementById('galleryPreview').scrollIntoView({behavior:'smooth'})"></span>
    </header>

    <div class="wrap">
      <section class="section" id="galleryPreview">
        <div class="section-label">${esc(t.home.gallery)}</div>
        <div class="photo-grid" data-photo-grid="8"></div>
        <div class="section-more">
          <a class="link-more" href="#/gallery">${esc(t.home.more)} →</a>
        </div>
      </section>
    </div>
  </section>`;
  paintPhotoGrids();
}

function renderGallery(){
  const t=T();
  app.innerHTML=`
  <section class="view">
    <div class="wrap">
      <div class="page-head">
        <h1>${esc(t.gallery.title)}</h1>
        <div class="sub" id="gallerySub">${photos.length?esc(t.gallery.sub(photos.length)):""}</div>
      </div>
      <div class="photo-grid" data-photo-grid="0"></div>
      <p style="margin:22px 0 0;color:var(--text-3);font-size:13px">${esc(t.gallery.tip)}</p>
      <div style="height:60px"></div>
    </div>
  </section>`;
  paintPhotoGrids();
}

function renderAbout(){
  const t=T();
  app.innerHTML=`
  <section class="view">
    <div class="wrap">
      <div class="page-head">
        <h1>${esc(t.about.title)}</h1>
      </div>
      <div class="about-card">
        <div class="avatar">J</div>
        <h2>${esc(t.about.hello)}</h2>
        <p>${esc(t.about.bio1)}</p>
        <p>${esc(t.about.bio2)}</p>
        <p><a class="read-more" href="https://github.com/jianye50" target="_blank" rel="noopener">GitHub @jianye50 →</a></p>
        <div class="section-label" style="margin-top:38px">${esc(t.about.timeline)}</div>
        <div class="tl">
          ${TIMELINE.map(i=>`
          <div class="tl-item">
            <div class="d">${esc(i.d)}</div>
            <div class="t">${esc(i.t)}</div>
            <div class="p">${esc(i.p)}</div>
          </div>`).join("")}
        </div>
      </div>
      <div class="about-card">
        <div class="section-label" style="margin-bottom:6px">${esc(t.about.projects)}</div>
        <p style="margin-top:10px;font-size:13.5px;color:var(--text-3)">${esc(t.about.projTip)}</p>
        <div class="proj-grid">
          ${PROJECTS.map(p=>`
          <a class="proj" href="${esc(p.u)}" target="_blank" rel="noopener">
            <div class="ic" style="background:${p.c}">${p.ic}</div>
            <h4>${esc(p.t)}</h4>
            <p>${esc(p.d)}</p>
          </a>`).join("")}
        </div>
      </div>
    </div>
  </section>`;
}

/* ---------- 路由 ---------- */
function route(){
  const hash=location.hash.replace(/^#\/?/,"");
  const parts=hash.split("/").filter(Boolean);
  let active="home";
  if(parts[0]==="gallery"){active="gallery";renderGallery()}
  else if(parts[0]==="about"){active="about";renderAbout()}
  else renderHome();
  document.querySelectorAll(".nav-link").forEach(el=>
    el.classList.toggle("active",el.dataset.nav===active));
  window.scrollTo({top:0,behavior:"instant"in window?"instant":"auto"});
}
window.addEventListener("hashchange",route);

/* ---------- 交互绑定 ---------- */
$("#themeBtn").addEventListener("click",()=>setTheme(theme==="dark"?"light":"dark"));
$("#langBtn").addEventListener("click",()=>setLang(lang==="zh"?"en":"zh"));
$("#lbClose").addEventListener("click",closeLb);
$("#lbPrev").addEventListener("click",e=>{e.stopPropagation();stepLb(-1)});
$("#lbNext").addEventListener("click",e=>{e.stopPropagation();stepLb(1)});
$("#lightbox").addEventListener("click",e=>{if(e.target.id==="lightbox")closeLb()});
document.addEventListener("click",e=>{
  const tile=e.target.closest(".ph-tile");
  if(tile&&tile.dataset.idx!==undefined&&!tile.classList.contains("ph-skel"))
    openLb(Number(tile.dataset.idx));
});
document.addEventListener("keydown",e=>{
  if($("#lightbox").classList.contains("open")){
    if(e.key==="Escape")closeLb();
    else if(e.key==="ArrowLeft")stepLb(-1);
    else if(e.key==="ArrowRight")stepLb(1);
    return;
  }
  const tile=document.activeElement;
  if(tile&&tile.classList&&tile.classList.contains("ph-tile")&&(e.key==="Enter"||e.key===" "))
    e.preventDefault(),openLb(Number(tile.dataset.idx));
});

/* ---------- 启动 ---------- */
setTheme(theme);
document.documentElement.lang=lang==="zh"?"zh-CN":"en";
$("#langBtn").textContent=lang==="zh"?"EN":"中";
["home","gallery","about"].forEach(k=>{
  const el=document.querySelector(`[data-nav="${k}"]`);
  if(el)el.textContent=T().nav[k];
});
route();
loadPhotos();
</script>
